<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ladungssicherung VDI 2700 – Ausbildung</title>
<style>
:root{
  --navy:#16243f;--steel:#2b6cb0;--safety:#f5a623;--safety-d:#d4880f;
  --ink:#1a2330;--muted:#68788f;--line:#e3e8f0;--bg:#edf1f7;--card:#fff;
  --ok:#1a9e6e;--okbg:#e8f7f2;--no:#c0392b;--nobg:#fdecea;
  --shadow:0 4px 22px rgba(22,36,63,.10);--r:14px;
  --lasi:#1a7a4a;--lasi-l:#2ea865;--lasi-d:#0d4a24;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0a1f12,#14422a 55%,#1a5c38);padding:20px}
.lcard{background:#fff;border-radius:22px;box-shadow:0 24px 64px rgba(0,0,0,.28);
  width:100%;max-width:420px;overflow:hidden}
.lcard-top{background:linear-gradient(135deg,#0d2b1a,#1a5c38);padding:36px 32px 28px;text-align:center}
.lcard-top .ico{width:64px;height:64px;border-radius:14px;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.lcard-top .ico svg{width:34px;height:34px;fill:#fff}
.lcard-top h1{color:#fff;font-size:19px;margin-bottom:4px}
.lcard-top p{color:rgba(255,255,255,.55);font-size:13px}
.lcard-body{padding:26px 30px 30px}
.lf{margin-bottom:16px}
.lf label{display:block;font-size:12px;font-weight:700;color:var(--navy);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.lf input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;
  font-size:16px;background:#fafbfc;transition:border-color .15s}
.lf input:focus{outline:none;border-color:var(--lasi)}
.lbtn{width:100%;padding:13px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--lasi),var(--lasi-d));
  color:#fff;font-size:15px;font-weight:700}
.lbtn:hover{opacity:.9}
.lerr{color:#c0392b;font-size:13px;margin-top:9px;text-align:center;min-height:18px}
.lhint{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}

/* APP */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:linear-gradient(90deg,#0d2b1a,#1a5c38);color:#fff;height:56px;
  display:flex;align-items:center;gap:12px;padding:0 16px;
  position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.burger{width:38px;height:38px;border:none;background:rgba(255,255,255,.1);
  border-radius:9px;color:#fff;font-size:20px;display:none;align-items:center;justify-content:center}
.topbar-logo{width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--lasi),var(--lasi-l));
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar-logo svg{width:19px;height:19px;fill:#fff}
.topbar-title{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar-who{font-size:12px;color:rgba(255,255,255,.5)}
.back-home{padding:5px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:600;
  cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.back-home:hover{background:rgba(255,255,255,.2)}
.pbar-wrap{height:3px;background:rgba(255,255,255,.1)}
.pbar{height:100%;background:var(--safety);width:0;transition:width .35s}

.layout{flex:1;display:flex;max-width:1280px;margin:0 auto;width:100%}

/* SIDEBAR */
.sidebar{width:272px;background:var(--card);border-right:1px solid var(--line);
  overflow-y:auto;padding:8px 0;position:sticky;top:59px;
  max-height:calc(100vh - 59px);flex-shrink:0}
.sidebar-item{padding:10px 14px;font-size:13px;cursor:pointer;
  display:flex;align-items:flex-start;gap:10px;border-left:3px solid transparent;transition:background .1s}
.sidebar-item:hover{background:#f0faf4}
.sidebar-item.active{background:#e6f5ec;border-left-color:var(--lasi);font-weight:600;color:#0d2b1a}
.snum{width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.sidebar-item.active .snum{background:var(--lasi);color:#fff}
.stxt{flex:1}.stitle{line-height:1.3}.scnt{font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.scrim{display:none}

/* STAGE */
.stage{flex:1;padding:22px 26px 60px;min-width:0}
.crumb{font-size:11px;color:var(--lasi);font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;margin-bottom:10px}

@keyframes fin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* WELCOME */
.welcome-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  text-align:center;padding:52px 28px 44px;animation:fin .28s ease}
.w-icon{width:82px;height:82px;border-radius:50%;
  background:linear-gradient(135deg,var(--lasi),#0d2b1a);
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.w-icon svg{width:42px;height:42px;fill:#fff}
.welcome-card h2{font-size:26px;color:var(--navy);margin-bottom:10px}
.welcome-card p{color:var(--muted);font-size:15px;max-width:500px;margin:0 auto 22px;line-height:1.6}
.w-stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.wstat{background:#f4f7fc;border:1px solid var(--line);border-radius:12px;padding:12px 20px}
.wn{font-size:22px;font-weight:800;color:var(--lasi)}
.wl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* CHAPTER INTRO */
.chapter-intro{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  text-align:center;padding:48px 28px 44px;animation:fin .28s ease;border-top:5px solid var(--lasi)}
.ci-num{font-size:13px;font-weight:700;color:var(--lasi);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:10px}
.chapter-intro h2{font-size:28px;color:var(--navy);margin-bottom:12px;font-weight:800}
.ci-meta{font-size:14px;color:var(--muted);margin-bottom:4px}

/* SLIDE (Folienbild) */
.slide-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;animation:fin .28s ease}
.slide-img-full{width:100%;display:block;border-radius:var(--r) var(--r) 0 0}
.slide-footer{display:flex;align-items:center;gap:8px;padding:10px 16px;
  border-top:1px solid var(--line);background:#fafbfc;flex-wrap:wrap}
.slide-nr{font-size:11px;color:var(--muted);background:var(--line);
  border-radius:5px;padding:2px 7px;flex-shrink:0}
.wa-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;
  background:#f0fdf4;border:1px solid #bbf7d0;border-radius:20px;
  color:#16a34a;font-size:11.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.wa-btn:hover{background:#dcfce7}
.wa-btn svg{width:13px;height:13px;fill:#16a34a;flex-shrink:0}
.mail-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;
  background:#e8f0fe;border:1px solid #c5d5f5;border-radius:20px;
  color:#1a56db;font-size:11.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.mail-btn:hover{background:#d2e3fc}
.mail-btn svg{width:13px;height:13px;fill:#1a56db;flex-shrink:0}

/* QUIZ */
.quiz-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;animation:fin .28s ease}
.quiz-hd{display:flex;justify-content:space-between;align-items:center;
  padding:14px 20px;border-bottom:1px solid var(--line);background:#f4fbf7}
.quiz-kap{font-size:12px;font-weight:700;color:var(--lasi);text-transform:uppercase;letter-spacing:.5px}
.quiz-prog{font-size:13px;color:var(--muted)}
.quiz-q{font-size:17px;font-weight:600;color:var(--navy);padding:22px 20px 16px;line-height:1.45}
.quiz-opts{padding:0 20px 20px;display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border:2px solid var(--line);
  border-radius:11px;background:#fff;font-size:14.5px;color:var(--ink);transition:all .1s}
.opt:hover:not(:disabled){border-color:var(--lasi);background:#f0faf4}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok)!important;background:var(--okbg)!important;color:var(--ok)!important}
.opt.wrong{border-color:var(--no)!important;background:var(--nobg)!important;color:var(--no)!important}
.quiz-fb{padding:0 20px 16px;font-size:14px;font-weight:600;min-height:24px}
.quiz-fb.ok{color:var(--ok)}.quiz-fb.no{color:var(--no)}
.quiz-result{text-align:center;padding:40px 24px}
.qr-icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;margin:0 auto 16px;font-size:30px;font-weight:800}
.qr-icon.ok{background:var(--okbg);color:var(--ok)}
.qr-icon.no{background:var(--nobg);color:var(--no)}
.qr-score{font-size:30px;font-weight:800;color:var(--navy);margin-bottom:8px}

/* EXAM */
.exam-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  text-align:center;padding:52px 28px 44px;animation:fin .28s ease}
.exam-icon{width:82px;height:82px;border-radius:50%;
  background:linear-gradient(135deg,var(--safety),var(--safety-d));
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.exam-icon svg{width:42px;height:42px;fill:#fff}

/* BUTTONS */
.btn{padding:12px 28px;border:none;border-radius:11px;
  background:linear-gradient(135deg,var(--lasi),var(--lasi-d));
  color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{opacity:.88}
.btn.safety{background:linear-gradient(135deg,var(--safety),var(--safety-d));color:#3a2800}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:10px}
.navbtn{padding:11px 20px;border-radius:11px;border:2px solid var(--lasi);
  background:#fff;color:var(--lasi);font-size:14px;font-weight:700;transition:all .12s}
.navbtn:hover:not(:disabled){background:var(--lasi);color:#fff}
.navbtn.primary{background:var(--lasi);color:#fff}
.navbtn.primary:hover:not(:disabled){background:var(--lasi-d);border-color:var(--lasi-d)}
.navbtn:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line);color:var(--muted)}
.pageno{font-size:13px;color:var(--muted);white-space:nowrap}

@media(max-width:820px){
  .burger{display:flex}
  .sidebar{position:fixed;top:59px;left:0;bottom:0;z-index:30;
    transform:translateX(-100%);transition:transform .25s;max-height:none;
    box-shadow:4px 0 18px rgba(0,0,0,.17)}
  .sidebar.open{transform:translateX(0)}
  .scrim.show{display:block;position:fixed;inset:59px 0 0 0;
    background:rgba(0,0,0,.36);z-index:29}
  .stage{padding:14px 14px 60px}
}

/* ════════ MODUL: Beladen & Lücken sichern ════════ */
.spiel-wrap-outer{--lasi-m:#1a7a4a;--lasi-l-m:#2ea865;--lasi-d-m:#0d4a24;}
.spiel-wrap-outer *{box-sizing:border-box}
.spiel-wrap-outer button{font-family:inherit;cursor:pointer}
.spiel-wrap-outer .hidden{display:none!important}
.spiel-wrap-outer .m-topbar{background:linear-gradient(90deg,#0d2b1a,#1a5c38);color:#fff;height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:10px 10px 0 0}
.spiel-wrap-outer .m-tlogo{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,var(--lasi-m),var(--lasi-l-m));display:flex;align-items:center;justify-content:center}
.spiel-wrap-outer .m-tlogo svg{width:14px;height:14px;fill:#fff}
.spiel-wrap-outer .m-ttitle{font-size:13px;font-weight:700;flex:1}
.spiel-wrap-outer .m-tsub{font-size:10px;color:rgba(255,255,255,.5)}
.spiel-wrap-outer .m-wrap{background:var(--bg);border-radius:0 0 10px 10px;padding:12px}
.spiel-wrap-outer .m-card{background:#fff;border-radius:11px;box-shadow:0 3px 14px rgba(22,36,63,.08);overflow:hidden;margin-bottom:10px}
.spiel-wrap-outer .m-chd{padding:11px 15px 9px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#f4fbf7,#fff)}
.spiel-wrap-outer .m-chd h2{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:1px}
.spiel-wrap-outer .m-chd p{font-size:11px;color:var(--muted)}
.spiel-wrap-outer .m-cbody{padding:13px}
.spiel-wrap-outer .m-btn{padding:7px 16px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--lasi-m),var(--lasi-d-m));color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.spiel-wrap-outer .m-btn:hover{opacity:.88}
.spiel-wrap-outer .m-btn.out{background:#fff;border:1.5px solid var(--lasi-m);color:var(--lasi-m)}
.spiel-wrap-outer .m-btn.sm{padding:5px 10px;font-size:11px}
.spiel-wrap-outer .m-btn.safety{background:linear-gradient(135deg,var(--safety),#d4880f);color:#3a2800}
.spiel-wrap-outer .m-fb{border-radius:9px;padding:10px 12px;margin-top:9px;font-size:12px;line-height:1.6;display:none}
.spiel-wrap-outer .m-fb.ok{background:var(--okbg);border:1.5px solid var(--ok);color:#0d5c3a}
.spiel-wrap-outer .m-fb.no{background:var(--nobg);border:1.5px solid var(--no);color:#7b1a12}
.spiel-wrap-outer .m-fb.warn{background:#fef3c7;border:1.5px solid #d97706;color:#92400e}
.spiel-wrap-outer .m-fb.show{display:block}
.spiel-wrap-outer .m-spcard{background:#f4fbf7;border:1.5px solid var(--line);border-radius:10px;padding:11px;cursor:pointer;transition:all .15s;text-align:center}
.spiel-wrap-outer .m-spcard:hover{border-color:var(--lasi-m);background:#e6f5ec;transform:translateY(-1px)}
.spiel-wrap-outer .m-phase-bar{display:flex;gap:5px;margin-bottom:9px}
.spiel-wrap-outer .m-ps{flex:1;padding:6px 4px;border-radius:7px;border:1.5px solid var(--line);text-align:center;font-size:10px;font-weight:700;color:var(--muted);background:#fff;transition:all .2s}
.spiel-wrap-outer .m-ps.act{border-color:var(--lasi-m);background:var(--lasi-m);color:#fff}
.spiel-wrap-outer .m-ps.done{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.spiel-wrap-outer .m-stats-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.spiel-wrap-outer .m-stat{background:#f4f7fc;border-radius:7px;padding:6px 8px;text-align:center;flex:1;min-width:52px}
.spiel-wrap-outer .m-stat-n{font-size:13px;font-weight:800;color:var(--lasi-m)}
.spiel-wrap-outer .m-stat-l{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.spiel-wrap-outer .m-fill-bar-wrap{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.spiel-wrap-outer .m-fill-bar{height:100%;border-radius:4px;transition:width .4s,background .3s}
.spiel-wrap-outer .m-palette-wrap{display:flex;gap:5px;flex-wrap:wrap;padding:7px;background:#f4fbf7;border-radius:8px;border:1.5px dashed var(--lasi-m);min-height:46px;margin-bottom:8px}
.spiel-wrap-outer .m-pgut{padding:5px 7px;border-radius:6px;border:1.5px solid var(--line);background:#fff;font-size:9px;font-weight:600;cursor:grab;user-select:none;display:flex;flex-direction:column;align-items:center;gap:1px;touch-action:none;min-width:55px;text-align:center}
.spiel-wrap-outer .m-pgut:hover{border-color:var(--lasi-m);background:#f0faf4}
.spiel-wrap-outer .m-pgut.placed{border-color:var(--ok);background:var(--okbg);color:var(--ok);opacity:.5;cursor:default}
.spiel-wrap-outer .m-pgut.dragging{opacity:.3}
@keyframes m-shake{0%,100%{transform:translateX(0)}33%{transform:translateX(-3px)}66%{transform:translateX(3px)}}
.spiel-wrap-outer .m-pgut.no-fit{border-color:var(--no);background:var(--nobg);animation:m-shake .3s}
.spiel-wrap-outer .m-p2wrap{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:start}
@media(max-width:540px){.spiel-wrap-outer .m-p2wrap{grid-template-columns:1fr}}
.spiel-wrap-outer .m-lasi-pal{background:#fff8e1;border:1.5px dashed #d97706;border-radius:9px;padding:8px}
.spiel-wrap-outer .m-lasi-pal-title{font-size:9px;font-weight:700;color:#d97706;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.spiel-wrap-outer .m-lmat{padding:5px 8px;border-radius:6px;border:1.5px solid #f5d76e;background:#fff;font-size:10px;font-weight:600;cursor:grab;user-select:none;display:flex;align-items:center;gap:5px;transition:all .12s;touch-action:none;margin-bottom:5px}
.spiel-wrap-outer .m-lmat:hover{border-color:#d97706;background:#fef9e7}
.spiel-wrap-outer .m-lmat.dragging-lasi{opacity:.3}
.spiel-wrap-outer .m-luecken-info{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.spiel-wrap-outer .m-luecke-card{border-radius:8px;padding:8px 10px;border:1.5px solid var(--no);background:var(--nobg);transition:all .3s}
.spiel-wrap-outer .m-luecke-card.ok{border-color:var(--ok);background:var(--okbg)}
.spiel-wrap-outer .m-luecke-card.nok{border-color:var(--no);background:var(--nobg)}
.spiel-wrap-outer .m-lc-title{font-size:10px;font-weight:700;color:var(--no);margin-bottom:3px}
.spiel-wrap-outer .m-luecke-card.ok .m-lc-title{color:var(--ok)}
.spiel-wrap-outer .m-lc-placed{display:flex;flex-wrap:wrap;gap:3px;min-height:20px;margin-bottom:3px}
.spiel-wrap-outer .m-lc-mat-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;cursor:pointer}
.spiel-wrap-outer .m-lc-mat-tag.ok-tag{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.spiel-wrap-outer .m-lc-mat-tag.no-tag{background:var(--nobg);color:var(--no);border:1px solid var(--no)}
.spiel-wrap-outer .m-lc-mat-tag.neu{background:#f4f7fc;color:var(--navy);border:1px solid var(--line)}
.spiel-wrap-outer .m-lc-fb{font-size:9px;color:var(--muted);line-height:1.4;display:none;margin-top:3px}
.spiel-wrap-outer .m-drop-over{outline:2px dashed #d97706!important;transform:scale(1.01)}
.spiel-wrap-outer .m-auswert-canvas-wrap{margin-bottom:12px;position:relative}
.spiel-wrap-outer .m-auswert-canvas-title{font-size:10px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.spiel-wrap-outer .m-legende{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.spiel-wrap-outer .m-leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.spiel-wrap-outer .m-leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.spiel-wrap-outer .m-ck-list{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.spiel-wrap-outer .m-ck-item{display:flex;gap:7px;padding:7px 10px;border-radius:8px;background:#f4f7fc;align-items:flex-start}
.spiel-wrap-outer .m-ck-item.ok{background:var(--okbg)}
.spiel-wrap-outer .m-ck-item.no{background:var(--nobg)}
.spiel-wrap-outer .m-ck-icon{font-size:14px;flex-shrink:0}
.spiel-wrap-outer .m-ck-txt{flex:1}
.spiel-wrap-outer .m-ck-lbl{font-size:11px;font-weight:700}
.spiel-wrap-outer .m-ck-item.ok .m-ck-lbl{color:var(--ok)}
.spiel-wrap-outer .m-ck-item.no .m-ck-lbl{color:var(--no)}
.spiel-wrap-outer .m-ck-sub{font-size:10px;color:var(--muted);margin-top:1px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lcard">
    <div class="lcard-top">
      <div class="ico">

/* ── STEPS ── */
let STEPS = [];
function buildSteps(){
  STEPS = [{type:'welcome'}];
  KAPITEL.forEach((k,ki)=>{
    STEPS.push({type:'chapter',ki});
    k.folien.forEach((fn,fi)=>STEPS.push({type:'folie',ki,fi,fn}));
    STEPS.push({type:'quiz',ki,qi:0});
  });
  STEPS.push({type:'spiel'});
  STEPS.push({type:'exam'});
}

let cur = 0, quizState = {}, regnr = '';

/* ── LOGIN ── */
function doLogin(){
  const val = document.getElementById('regnr').value.trim();
  const errEl = document.getElementById('lerr');
  errEl.textContent = '';
  if(!val){errEl.textContent='Bitte Registriernummer eingeben.';return;}
  if(!/^\d{4}-\d{3,4}$/.test(val)){errEl.textContent='Ungültig. Format: 2025-001';return;}
  startApp(val);
}

function startApp(nr){
  regnr = nr;
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topbar-who').textContent = nr;
  const backBtn = document.getElementById('backHomeBtn');
  backBtn.href = PORTAL_URL + '?regnr=' + encodeURIComponent(nr);
  buildSidebar();
  goStep(0);
}

/* ── SIDEBAR ── */
function buildSidebar(){
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';
  KAPITEL.forEach((k,ki)=>{
    const chIdx = STEPS.findIndex(s=>s.type==='chapter'&&s.ki===ki);
    const div = document.createElement('div');
    div.className='sidebar-item'+(isInChapter(ki)?' active':'');
    div.id='si-'+ki;
    div.innerHTML=`<div class="snum">${ki+1}</div>
      <div class="stxt"><div class="stitle">${k.title}</div>
      <div class="scnt">${k.folien.length} Folien · ${k.quiz.length} Fragen</div></div>`;
    div.onclick=()=>{goStep(chIdx);closeSidebar();};
    list.appendChild(div);
  });
  const spielIdx = STEPS.findIndex(s=>s.type==='spiel');
  const spielDiv = document.createElement('div');
  spielDiv.className='sidebar-item'+(STEPS[cur]?.type==='spiel'?' active':'');
  spielDiv.id='si-spiel';
  spielDiv.innerHTML=`<div class="snum">🎮</div>
    <div class="stxt"><div class="stitle">Ladespiel</div>
    <div class="scnt">Beladen &amp; Lücken sichern</div></div>`;
  spielDiv.onclick=()=>{goStep(spielIdx);closeSidebar();};
  list.appendChild(spielDiv);

  const examIdx = STEPS.findIndex(s=>s.type==='exam');
  const examDiv = document.createElement('div');
  examDiv.className='sidebar-item'+(STEPS[cur]?.type==='exam'?' active':'');
  examDiv.id='si-exam';
  examDiv.innerHTML=`<div class="snum">📋</div>
    <div class="stxt"><div class="stitle">Abschlussprüfung</div>
    <div class="scnt">Theoretische Prüfung</div></div>`;
  examDiv.onclick=()=>{goStep(examIdx);closeSidebar();};
  list.appendChild(examDiv);
}

function isInChapter(ki){
  const s=STEPS[cur];
  if(!s||s.type==='welcome'||s.type==='exam')return false;
  return s.ki===ki;
}
function updateSidebar(){
  KAPITEL.forEach((_,ki)=>{
    const el=document.getElementById('si-'+ki);
    if(el)el.classList.toggle('active',isInChapter(ki));
  });
  const spielEl=document.getElementById('si-spiel');
  if(spielEl)spielEl.classList.toggle('active',STEPS[cur]?.type==='spiel');
  const examEl=document.getElementById('si-exam');
  if(examEl)examEl.classList.toggle('active',STEPS[cur]?.type==='exam');
}

/* ── PROGRESS ── */
function updatePbar(){
  const pct=STEPS.length>1?(cur/(STEPS.length-1))*100:0;
  document.getElementById('pbar').style.width=pct+'%';
}

/* ── NAVIGATION ── */
function goStep(idx){
  cur=Math.max(0,Math.min(STEPS.length-1,idx));
  render();updateSidebar();updatePbar();
  window.scrollTo(0,0);
}

function renderFoot(showBack=true,showNext=true,nextLabel='Weiter →'){
  const foot=document.getElementById('foot');
  const s=STEPS[cur];
  let pageText='';
  if(s.type==='folie'){
    const k=KAPITEL[s.ki];
    pageText=`Folie ${s.fi+1} / ${k.folien.length}`;
  }
  foot.innerHTML=`
    ${showBack?`<button class="navbtn" onclick="goStep(${cur-1})" ${cur===0?'disabled':''}>← Zurück</button>`:'<div></div>'}
    <span class="pageno">${pageText}</span>
    ${showNext?`<button class="navbtn primary" onclick="goStep(${cur+1})">${nextLabel}</button>`:'<div></div>'}
  `;
}

/* ── RENDER ── */
function render(){
  const s=STEPS[cur];
  const host=document.getElementById('host');
  const crumb=document.getElementById('crumb');
  if(s.type==='welcome'){crumb.textContent='';renderWelcome(host);}
  else if(s.type==='chapter'){crumb.textContent=`Kapitel ${s.ki+1}`;renderChapter(host,s.ki);}
  else if(s.type==='folie'){crumb.textContent=`Kapitel ${s.ki+1} · Folie ${s.fi+1}`;renderFolie(host,s);}
  else if(s.type==='quiz'){crumb.textContent=`Kapitel ${s.ki+1} · Wissenstest`;renderQuiz(host,s.ki);}
  else if(s.type==='spiel'){crumb.textContent='Praxismodul';renderSpiel(host);}
  else if(s.type==='exam'){crumb.textContent='';renderExam(host);}
}

/* ── QUIZ ── */
function renderQuiz(host,ki){
  if(!quizState[ki])quizState[ki]={qi:0,score:0};
  const qs=quizState[ki];
  const k=KAPITEL[ki];
  if(qs.qi>=k.quiz.length){
    const pct=Math.round(qs.score/k.quiz.length*100);
    const pass=pct>=70;
    host.innerHTML=`<div class="quiz-card"><div class="quiz-result">
      <div class="qr-icon ${pass?'ok':'no'}">${pass?'✓':'✗'}</div>
      <div class="qr-score">${qs.score} / ${k.quiz.length} richtig</div>
      <p style="color:var(--muted);margin-bottom:20px">${pass?'Gut gemacht! Weiter zum nächsten Kapitel.':'Bitte das Kapitel wiederholen.'}</p>
      ${pass?`<button class="btn" onclick="goStep(${cur+1})">Weiter →</button>`
             :`<button class="btn" onclick="resetQuiz(${ki})">Wiederholen</button>`}
    </div></div>`;
    document.getElementById('foot').innerHTML='';
    return;
  }
  const q=k.quiz[qs.qi];
  host.innerHTML=`<div class="quiz-card">
    <div class="quiz-hd">
      <span class="quiz-kap">${k.title}</span>
      <span class="quiz-prog">Frage ${qs.qi+1} / ${k.quiz.length}</span>
    </div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts">
      ${q.o.map((o,i)=>`<button class="opt" id="opt-${i}" onclick="answerQuiz(${ki},${i})">${o}</button>`).join('')}
    </div>
    <div class="quiz-fb" id="qfb"></div>
  </div>`;
  document.getElementById('foot').innerHTML='';
}

function answerQuiz(ki,chosen){
  const k=KAPITEL[ki];
  const qs=quizState[ki];
  const q=k.quiz[qs.qi];
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  document.getElementById('opt-'+q.c).classList.add('correct');
  const fb=document.getElementById('qfb');
  if(chosen===q.c){qs.score++;fb.className='quiz-fb ok';fb.textContent='✓ Richtig!';}
  else{document.getElementById('opt-'+chosen).classList.add('wrong');fb.className='quiz-fb no';fb.textContent='✗ Falsch. Richtig: '+q.o[q.c];}
  qs.qi++;
