<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ladungssicherung VDI 2700 – Ausbildung</title>
<style>
:root{
  --navy:#16243f;--navy2:#1f3357;--steel:#2b6cb0;--steel-l:#4a90d9;
  --safety:#f5a623;--safety-d:#d4880f;--ink:#1a2330;--muted:#68788f;
  --line:#e3e8f0;--bg:#edf1f7;--card:#fff;--ok:#1a9e6e;--okbg:#e8f7f2;
  --no:#c0392b;--nobg:#fdecea;--shadow:0 4px 22px rgba(22,36,63,.10);--r:14px;
  --lasi:#1a7a4a;--lasi-l:#2ea865;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0a1f12,#14422a 55%,#1a5c38);padding:20px}
.lcard{background:#fff;border-radius:22px;box-shadow:0 24px 64px rgba(0,0,0,.28);
  width:100%;max-width:420px;overflow:hidden}
.lcard-top{background:linear-gradient(135deg,#0d2b1a,#1a5c38);padding:36px 32px 28px;text-align:center}
.lcard-top .ico{width:64px;height:64px;border-radius:14px;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.lcard-top .ico svg{width:34px;height:34px;fill:#fff}
.lcard-top h1{color:#fff;font-size:19px;margin-bottom:4px}
.lcard-top p{color:rgba(255,255,255,.55);font-size:13px}
.lcard-body{padding:26px 30px 30px}
.lf{margin-bottom:16px}
.lf label{display:block;font-size:12px;font-weight:700;color:var(--navy);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.lf input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;
  font-size:16px;background:#fafbfc;transition:border-color .15s}
.lf input:focus{outline:none;border-color:var(--lasi);background:#fff}
.lbtn{width:100%;padding:13px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--lasi),#14563a);
  color:#fff;font-size:15px;font-weight:700}
.lbtn:hover{opacity:.9}
.lerr{color:#c0392b;font-size:13px;margin-top:9px;text-align:center;min-height:18px}
.lhint{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}
.lbadge{display:inline-block;background:rgba(26,122,74,.15);color:#1a7a4a;
  border:1px solid rgba(26,122,74,.3);border-radius:20px;font-size:11px;font-weight:700;
  padding:3px 10px;margin-bottom:14px}

/* APP */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:linear-gradient(90deg,#0d2b1a,#1a5c38);color:#fff;height:56px;
  display:flex;align-items:center;gap:12px;padding:0 16px;
  position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.burger{width:38px;height:38px;border:none;background:rgba(255,255,255,.1);
  border-radius:9px;color:#fff;font-size:20px;display:none;align-items:center;justify-content:center}
.topbar-logo{width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--lasi),var(--lasi-l));
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar-logo svg{width:19px;height:19px;fill:#fff}
.topbar-title{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar-who{font-size:12px;color:rgba(255,255,255,.5)}
.pbar-wrap{height:3px;background:rgba(255,255,255,.1)}
.pbar{height:100%;background:var(--safety);width:0;transition:width .35s}

.layout{flex:1;display:flex;max-width:1280px;margin:0 auto;width:100%}

/* SIDEBAR */
.sidebar{width:272px;background:var(--card);border-right:1px solid var(--line);
  overflow-y:auto;padding:8px 0;position:sticky;top:59px;
  max-height:calc(100vh - 59px);flex-shrink:0}
.sidebar-item{padding:10px 14px;font-size:13px;cursor:pointer;
  display:flex;align-items:flex-start;gap:10px;border-left:3px solid transparent;transition:background .1s}
.sidebar-item:hover{background:#f0faf4}
.sidebar-item.active{background:#e6f5ec;border-left-color:var(--lasi);font-weight:600;color:#0d2b1a}
.snum{width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px}
.sidebar-item.active .snum{background:var(--lasi);color:#fff}
.stxt{flex:1}.stitle{line-height:1.3}.scnt{font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.scrim{display:none}

/* STAGE */
.stage{flex:1;padding:22px 26px 60px;min-width:0}
.crumb{font-size:11px;color:var(--lasi);font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;margin-bottom:10px}

/* ANIMATIONS */
@keyframes fin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* WELCOME */
.welcome-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  text-align:center;padding:52px 28px 44px;animation:fin .28s ease}
.w-icon{width:82px;height:82px;border-radius:50%;
  background:linear-gradient(135deg,var(--lasi),#0d2b1a);
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.w-icon svg{width:42px;height:42px;fill:#fff}
.welcome-card h2{font-size:26px;color:var(--navy);margin-bottom:10px}
.welcome-card p{color:var(--muted);font-size:15px;max-width:500px;margin:0 auto 22px;line-height:1.6}
.w-stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.wstat{background:#f4f7fc;border:1px solid var(--line);border-radius:12px;padding:12px 20px}
.wn{font-size:22px;font-weight:800;color:var(--lasi)}
.wl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* CHAPTER INTRO */
.chapter-intro{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  text-align:center;padding:48px 28px 44px;animation:fin .28s ease;border-top:5px solid var(--lasi)}
.ci-num{font-size:13px;font-weight:700;color:var(--lasi);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:10px}
.chapter-intro h2{font-size:28px;color:var(--navy);margin-bottom:12px;font-weight:800}
.ci-meta{font-size:14px;color:var(--muted);margin-bottom:4px}

/* SLIDE */
.slide-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;animation:fin .28s ease}
.slide-body{padding:24px 26px}
.slide-title{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:14px;line-height:1.3}
.slide-bullets{list-style:none;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.slide-bullets li{padding:10px 14px 10px 38px;background:#f5f8fc;border-radius:10px;
  position:relative;font-size:15px;line-height:1.5}
.slide-bullets li::before{content:"";position:absolute;left:13px;top:15px;
  width:11px;height:11px;border-radius:3px;background:var(--lasi)}
.slide-warn{background:#fff8e6;border:1px solid #f5d76e;border-radius:10px;
  padding:11px 14px;font-size:14px;color:#7d5a00;margin-top:10px}
.slide-note{background:#f0faf4;border:1px solid #9dd4b8;border-radius:10px;
  padding:11px 14px;font-size:14px;color:#0d4a24;margin-top:10px}
.slide-footer{display:flex;align-items:center;gap:10px;padding:10px 16px;
  border-top:1px solid var(--line);background:#fafbfc;flex-wrap:wrap}
.slide-nr{font-size:11px;color:var(--muted);background:var(--line);
  border-radius:5px;padding:2px 7px;flex-shrink:0}
.slide-title-lbl{font-size:13px;color:var(--navy);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wa-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;
  background:#f0fdf4;border:1px solid #bbf7d0;border-radius:20px;
  color:#16a34a;font-size:11.5px;font-weight:600;text-decoration:none;
  transition:all .15s;white-space:nowrap;flex-shrink:0}
.wa-btn:hover{background:#dcfce7;border-color:#86efac}
.wa-btn svg{width:13px;height:13px;fill:#16a34a;flex-shrink:0}

/* VIDEO */
.video-card{background:linear-gradient(135deg,#0a1f12,#1a5c38);border-radius:var(--r);
  box-shadow:var(--shadow);aspect-ratio:16/9;overflow:hidden;animation:fin .28s ease;max-height:70vh}
.video-inner{height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:24px;text-align:center}
.play-btn{width:84px;height:84px;border-radius:50%;border:3px solid rgba(255,255,255,.7);
  background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;transition:background .2s}
.play-btn:hover{background:rgba(255,255,255,.22)}
.play-btn svg{width:36px;height:36px;fill:#fff;margin-left:6px}
.video-title{color:#fff;font-size:19px;font-weight:700}
.video-hint{color:rgba(255,255,255,.45);font-size:13px}

/* QUIZ */
.quiz-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;animation:fin .28s ease}
.quiz-hd{display:flex;justify-content:space-between;align-items:center;
  padding:14px 20px;border-bottom:1px solid var(--line);background:#f4fbf7}
.quiz-kap{font-size:12px;font-weight:700;color:var(--lasi);text-transform:uppercase;letter-spacing:.5px}
.quiz-prog{font-size:13px;color:var(--muted)}
.quiz-q{font-size:17px;font-weight:600;color:var(--navy);padding:22px 20px 16px;line-height:1.45}
.quiz-opts{padding:0 20px 20px;display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border:2px solid var(--line);
  border-radius:11px;background:#fff;font-size:14.5px;color:var(--ink);transition:all .1s}
.opt:hover:not(:disabled){border-color:var(--lasi);background:#f0faf4}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok)!important;background:var(--okbg)!important;color:var(--ok)!important}
.opt.wrong{border-color:var(--no)!important;background:var(--nobg)!important;color:var(--no)!important}
.quiz-fb{padding:0 20px 16px;font-size:14px;font-weight:600;min-height:24px}
.quiz-fb.ok{color:var(--ok)}.quiz-fb.no{color:var(--no)}
.quiz-result{text-align:center;padding:40px 24px}
.qr-icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;margin:0 auto 16px;font-size:30px;font-weight:800}
.qr-icon.ok{background:var(--okbg);color:var(--ok)}
.qr-icon.no{background:var(--nobg);color:var(--no)}
.qr-score{font-size:30px;font-weight:800;color:var(--navy);margin-bottom:8px}

/* EXAM */
.exam-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  text-align:center;padding:52px 28px 44px;animation:fin .28s ease}
.exam-icon{width:82px;height:82px;border-radius:50%;
  background:linear-gradient(135deg,var(--safety),var(--safety-d));
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.exam-icon svg{width:42px;height:42px;fill:#fff}

/* BUTTONS */
.btn{padding:12px 28px;border:none;border-radius:11px;
  background:linear-gradient(135deg,var(--lasi),#0d2b1a);
  color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{opacity:.88}
.btn.safety{background:linear-gradient(135deg,var(--safety),var(--safety-d));color:#3a2800}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:10px}
.navbtn{padding:11px 20px;border-radius:11px;border:2px solid var(--lasi);
  background:#fff;color:var(--lasi);font-size:14px;font-weight:700;transition:all .12s}
.navbtn:hover:not(:disabled){background:var(--lasi);color:#fff}
.navbtn.primary{background:var(--lasi);color:#fff}
.navbtn.primary:hover:not(:disabled){background:#0d2b1a;border-color:#0d2b1a}
.navbtn:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line);color:var(--muted)}
.pageno{font-size:13px;color:var(--muted);white-space:nowrap}

/* FORMEL-BOX */
.formel{background:#f0faf4;border:2px solid #9dd4b8;border-radius:10px;
  padding:14px 18px;font-size:15px;color:#0d4a24;margin:12px 0;font-family:monospace;line-height:1.8}

/* FOLIEN-BILDER */
.slide-imgs{display:grid;gap:10px;margin-top:14px}
.slide-imgs.one img{width:100%;border-radius:10px;border:1px solid var(--line)}
.slide-imgs.two{grid-template-columns:1fr 1fr}
.slide-imgs.two img,.slide-imgs.three img,.slide-imgs.four img{width:100%;border-radius:8px;border:1px solid var(--line)}
.slide-imgs.three{grid-template-columns:1fr 1fr 1fr}
.slide-imgs.four{grid-template-columns:1fr 1fr}

/* RESPONSIVE */
@media(max-width:820px){
  .burger{display:flex}
  .sidebar{position:fixed;top:59px;left:0;bottom:0;z-index:30;
    transform:translateX(-100%);transition:transform .25s;max-height:none;
    box-shadow:4px 0 18px rgba(0,0,0,.17)}
  .sidebar.open{transform:translateX(0)}
  .scrim.show{display:block;position:fixed;inset:59px 0 0 0;
    background:rgba(0,0,0,.36);z-index:29}
  .stage{padding:14px 14px 60px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lcard">
    <div class="lcard-top">
      <div class="ico">
        <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      </div>
      <h1>Ladungssicherung</h1>
      <p>Ausbildung nach VDI 2700 ff.</p>
    </div>
    <div class="lcard-body">
      <div style="text-align:center;margin-bottom:16px">
        <span class="lbadge">DGUV Grundsatz 308-009 · Stufe 1</span>
      </div>
      <div class="lf">
        <label>Registriernummer</label>
        <input type="text" id="regnr" placeholder="2025-001" autocomplete="off"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="lbtn" onclick="doLogin()">Anmelden →</button>
      <div class="lerr" id="lerr"></div>
      <div class="lhint">Format: 2025-001 – erhalten Sie von Ihrem Ausbilder</div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="topbar">
    <button class="burger" id="burgerBtn" onclick="toggleSidebar()">☰</button>
    <div class="topbar-logo">
      <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4z"/></svg>
    </div>
    <span class="topbar-title" id="app-title">Ladungssicherung VDI 2700</span>
    <div class="topbar-right">
      <span class="topbar-who" id="topbar-who"></span>
    </div>
  </div>
  <div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>
  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div id="sidebarList"></div>
    </div>
    <div class="scrim" id="scrim" onclick="toggleSidebar()"></div>
    <div class="stage" id="stage">
      <div class="crumb" id="crumb"></div>
      <div id="host"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   BILDER BASIS-URL
   ============================================================ */
const IMG = 'https://danieleckmeierausbildung1986.github.io/Ausbildung-Flurf-rderzeuge/bilder/';

/* ============================================================
   FLOW LOGIN – Registriernummer prüfen
   ============================================================ */
const FLOW_URL = 'https://prod-21.germanywestcentral.logic.azure.com:443/workflows/3261e8b0c51a4bdb95c83aaeb42025fe/triggers/manual/paths/invoke?api-version=2016-06-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=MFifSUHdHSNBDN0n4fvHBP6dpyH1MYQKg7I3JnH3R50';

function doLogin(){
  const val = document.getElementById('regnr').value.trim();
  const errEl = document.getElementById('lerr');
  errEl.textContent = '';
  if(!val){ errEl.textContent = 'Bitte Registriernummer eingeben.'; return; }
  if(!/^\d{4}-\d{3,4}$/.test(val)){ errEl.textContent = 'Ungültig. Format: 2025-001'; return; }
  startApp('Teilnehmer', val);
}

function startApp(name, nr){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topbar-who').textContent = nr;
  buildSidebar();
  goStep(0);
}

/* ============================================================
   NAVIGATION STATE
   ============================================================ */
let cur = 0;   // index in STEPS array
let quizState = {};

/* ============================================================
   CONTENT DATA – KAPITEL
   ============================================================ */
const KAPITEL = [
  /* ── 1. Einführung ── */
  {
    title: "Einführung & Qualifizierung",
    folien: [
      { type:'slide', title:'Warum Ladungssicherung?',
        imgs:['image1.jpg','image6.jpg','image7.jpg'],
        bullets:[
          'Schutz für alle Verkehrsteilnehmer – vor allem unbeteiligte Dritte',
          'Vermeidung von Kapital- und Imageschäden für das Unternehmen',
          'Rechtliche Verpflichtung – Verstöße haben strafrechtliche Folgen',
          'Die Verantwortung bleibt bestehen, auch wenn Dritte die Ladung vorbereiten'
        ],
        note:'Schulungspflicht: mindestens alle 3 Jahre nach VDI 2700 Blatt 5.'
      },
      { type:'slide', title:'Qualifizierung nach VDI 2700 Blatt 5',
        bullets:[
          'Der „Leiter der Ladearbeit" muss die Schulungspflicht sicherstellen',
          'Inhalte: physikalische Grundlagen, Eigenschaften der Ladung, Sicherungsmaßnahmen',
          'Schulungsnachweis ist zu dokumentieren',
          'Die Schulung kann durch den „Leiter der Ladearbeit" selbst durchgeführt werden'
        ]
      },
      { type:'slide', title:'Lernhinweise',
        bullets:[
          '⚠ ACHTUNG: Hier besteht eine Gefährdung oder bestimmte Handlungen sind zu vermeiden',
          '📋 PRÜFUNGSFRAGE: So könnte eine Prüfungsfrage lauten',
          'ℹ ZUSATZ-INFORMATION: Weiterführende Hinweise',
          '🔧 PRAXIS-TIPP: Was bei der praktischen Umsetzung im Betrieb zu beachten ist'
        ],
        note:'Unter jeder Folie finden Sie einen WhatsApp-Button für direkte Fragen an den Ausbilder.'
      }
    ],
    quiz:[
      { q:'Wie häufig muss eine Ladungssicherungsschulung nach VDI 2700 Blatt 5 mindestens durchgeführt werden?',
        o:['Jährlich','Alle 2 Jahre','Mindestens alle 3 Jahre','Alle 5 Jahre'], c:2 },
      { q:'Wer ist für die Sicherstellung der Schulungspflicht nach VDI 2700 Blatt 5 verantwortlich?',
        o:['Der Fahrer','Der Leiter der Ladearbeit','Der Betriebsrat','Die Berufsgenossenschaft'], c:1 },
      { q:'Bleibt die eigene Verantwortung für die Ladungssicherung bestehen, wenn Dritte die Ladung vorbereiten?',
        o:['Nein, die Verantwortung geht auf Dritte über','Ja, die Verantwortung bleibt bestehen','Nur bei Auslandsfahrten','Nur bei Transporten über 5 Tonnen'], c:1 }
    ]
  },

  /* ── 2. Unfallgeschehen ── */
  {
    title: "Unfallgeschehen",
    folien: [
      { type:'slide', title:'Häufige Irrtümer zur Ladungssicherung',
        imgs:['image13.jpg','image14.jpg','image15.jpg'],
        bullets:[
          '„Schwere Ladung sichert sich selbst" – falsch! Jede Masse kann rutschen oder kippen',
          '„Die Fahrt geht nur um die nächste Ecke" – die Gefährdung besteht immer',
          '„Stirnwände sind ausreichend" – ungesicherte Ladung kann Wände zerstören',
          '„Vorausschauende Fahrweise reicht aus" – unvorhersehbare Ereignisse sind nicht kontrollierbar',
          '„Jeder Gurt der Plane hält 2 Tonnen" – vernietete Gurte halten oft nur bis 400 kg'
        ],
        warn:'Verlorene Ladung auf der Fahrbahn ist keine Seltenheit – fast täglich!'
      },
      { type:'slide', title:'Gründe für Ladungssicherung',
        imgs:['image16.jpg'],
        bullets:[
          'Fahrer, Beifahrer und andere Verkehrsteilnehmer schützen',
          'Fahrzeug vor Schäden bewahren',
          'Ladung unbeschädigt abliefern',
          'Infrastruktur nicht beschädigen',
          'Rechtliche Konsequenzen und Imageschäden vermeiden',
          'Arbeitsplätze sichern'
        ]

      { q:'Was ist beim Niederzurren nach ein paar Kilometern Fahrt zu tun?',
        o:['Nichts – einmal gespannt reicht','Nachzurren','Gurte lösen','Geschwindigkeit reduzieren'], c:1 }
    ]
  }
];

/* ============================================================
   BUILD STEPS (flat array: welcome → ch-intro → folien → quiz → exam)
   ============================================================ */
let STEPS = [];

function buildSteps(){
  STEPS = [];
  STEPS.push({ type:'welcome' });
  KAPITEL.forEach((kap, ki) => {
    STEPS.push({ type:'chapter', ki });
    kap.folien.forEach((f, fi) => {
      STEPS.push({ type:'folie', ki, fi });
    });
    STEPS.push({ type:'quiz', ki, qi:0 });
  });
  STEPS.push({ type:'exam' });
}

/* ============================================================
   SIDEBAR
   ============================================================ */
function buildSidebar(){
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';
  KAPITEL.forEach((kap, ki) => {
    const chIdx = STEPS.findIndex(s => s.type==='chapter' && s.ki===ki);
    const div = document.createElement('div');
    div.className = 'sidebar-item' + (isInChapter(ki) ? ' active' : '');
    div.id = 'si-' + ki;
    div.innerHTML = `<div class="snum">${ki+1}</div>
      <div class="stxt">
        <div class="stitle">${kap.title}</div>
        <div class="scnt">${kap.folien.length} Folien · ${kap.quiz.length} Fragen</div>
      </div>`;
    div.onclick = () => { goStep(chIdx); closeSidebar(); };
    list.appendChild(div);
  });
  // Exam entry
  const examIdx = STEPS.findIndex(s => s.type==='exam');
  const examDiv = document.createElement('div');
  examDiv.className = 'sidebar-item' + (STEPS[cur]?.type==='exam' ? ' active' : '');
  examDiv.id = 'si-exam';
  examDiv.innerHTML = `<div class="snum">📋</div>
    <div class="stxt"><div class="stitle">Abschlussprüfung</div>
    <div class="scnt">Theoretische Prüfung</div></div>`;
  examDiv.onclick = () => { goStep(examIdx); closeSidebar(); };
  list.appendChild(examDiv);
}

function isInChapter(ki){
  const s = STEPS[cur];
  if(!s) return false;
  if(s.type==='welcome') return false;
  if(s.type==='exam') return false;
  return s.ki === ki;
}

function updateSidebar(){
  KAPITEL.forEach((_, ki) => {
    const el = document.getElementById('si-' + ki);
    if(el) el.classList.toggle('active', isInChapter(ki));
  });
  const examEl = document.getElementById('si-exam');
  if(examEl) examEl.classList.toggle('active', STEPS[cur]?.type==='exam');
}

/* ============================================================
   PROGRESS BAR
   ============================================================ */
function updatePbar(){
  const pct = STEPS.length > 1 ? (cur / (STEPS.length-1)) * 100 : 0;
  document.getElementById('pbar').style.width = pct + '%';
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function goStep(idx){
  cur = Math.max(0, Math.min(STEPS.length-1, idx));
  render();
  updateSidebar();
  updatePbar();
  window.scrollTo(0,0);
}

function renderFoot(showBack=true, showNext=true, nextLabel='Weiter →', nextDisabled=false){
  const foot = document.getElementById('foot');
  const s = STEPS[cur];
  let pageText = '';
  if(s.type==='folie'){
    const kap = KAPITEL[s.ki];
    pageText = `Folie ${s.fi+1} / ${kap.folien.length}`;
  }
  foot.innerHTML = `
    ${showBack ? `<button class="navbtn" onclick="goStep(${cur-1})" ${cur===0?'disabled':''}>← Zurück</button>` : '<div></div>'}
    <span class="pageno">${pageText}</span>
    ${showNext ? `<button class="navbtn primary" onclick="goStep(${cur+1})" ${nextDisabled?'disabled':''}>${nextLabel}</button>` : '<div></div>'}
  `;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const s = STEPS[cur];
  const host = document.getElementById('host');
  const crumb = document.getElementById('crumb');

  if(s.type==='welcome'){
    crumb.textContent='';
    renderWelcome(host);
  } else if(s.type==='chapter'){
    const kap = KAPITEL[s.ki];
    crumb.textContent = `Kapitel ${s.ki+1}`;
    renderChapter(host, kap, s.ki);
  } else if(s.type==='folie'){
    const kap = KAPITEL[s.ki];
    const folie = kap.folien[s.fi];
    crumb.textContent = `Kapitel ${s.ki+1} · Folie ${s.fi+1}`;
    renderFolie(host, folie, s.ki, s.fi);
  } else if(s.type==='quiz'){
    const kap = KAPITEL[s.ki];
    crumb.textContent = `Kapitel ${s.ki+1} · Wissenstest`;
    renderQuiz(host, kap, s.ki);
  } else if(s.type==='exam'){
    crumb.textContent='';
    renderExam(host);
  }
}

/* ──── WELCOME ──── */
function renderWelcome(host){
  const totalFolien = KAPITEL.reduce((a,k)=>a+k.folien.length,0);
  const totalQuiz = KAPITEL.reduce((a,k)=>a+k.quiz.length,0);
  host.innerHTML=`<div class="welcome-card">
    <div class="w-icon"><svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4z"/></svg></div>
    <h2>Willkommen zur Ladungssicherung</h2>
    <p>Offizielle Ausbildung nach DGUV Grundsatz 308-009 auf der Basis der Richtlinie VDI 2700 ff. Bitte arbeiten Sie alle Kapitel der Reihe nach durch.</p>
    <div class="w-stats">
      <div class="wstat"><div class="wn">${KAPITEL.length}</div><div class="wl">Kapitel</div></div>
      <div class="wstat"><div class="wn">${totalFolien}</div><div class="wl">Lernfolien</div></div>
      <div class="wstat"><div class="wn">${totalQuiz}</div><div class="wl">Prüfungsfragen</div></div>
    </div>
    <button class="btn" onclick="goStep(1)">Ausbildung starten →</button>
  </div>`;
  document.getElementById('foot').innerHTML='';
}

/* ──── CHAPTER INTRO ──── */
function renderChapter(host, kap, ki){
  host.innerHTML=`<div class="chapter-intro">
    <div class="ci-num">Kapitel ${ki+1} von ${KAPITEL.length}</div>
    <h2>${kap.title}</h2>
    <p class="ci-meta">${kap.folien.length} Folien · ${kap.quiz.length} Quizfragen</p>
    <p style="color:var(--muted);font-size:14px;max-width:440px;margin:12px auto 24px;line-height:1.6">
      Arbeiten Sie die Folien dieses Kapitels durch und testen Sie anschließend Ihr Wissen.
    </p>
    <button class="btn" onclick="goStep(${cur+1})">Kapitel starten →</button>
  </div>`;
  document.getElementById('foot').innerHTML='';
}

/* ──── FOLIE ──── */
function renderFolie(host, folie, ki, fi){
  const kapTitle = KAPITEL[ki].title;
  const waText = encodeURIComponent(`Hallo, ich habe eine Frage zu:\nKapitel ${ki+1}: ${kapTitle}\nFolie ${fi+1}: ${folie.title}\n\nMeine Frage:`);

  let bulletsHtml = '';
  if(folie.bullets && folie.bullets.length){
    bulletsHtml = `<ul class="slide-bullets">${folie.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
  }
  let warnHtml = folie.warn ? `<div class="slide-warn">⚠ ${folie.warn}</div>` : '';
  let noteHtml = folie.note ? `<div class="slide-note">ℹ ${folie.note}</div>` : '';

  let imgsHtml = '';
  if(folie.imgs && folie.imgs.length){
    const cnt = folie.imgs.length;
    const cls = cnt===1?'one':cnt===2?'two':cnt>=3?'three':'one';
    // Max 3 Bilder anzeigen
    const show = folie.imgs.slice(0, Math.min(cnt, 3));
    imgsHtml = `<div class="slide-imgs ${cls}">${show.map(i=>`<img src="${IMG}${i}" loading="lazy" onerror="this.style.display='none'">`).join('')}</div>`;
  }

  host.innerHTML=`<div class="slide-card">
    <div class="slide-body">
      <div class="slide-title">${folie.title}</div>
      ${imgsHtml}${bulletsHtml}${warnHtml}${noteHtml}
    </div>
    <div class="slide-footer">
      <span class="slide-nr">Folie ${fi+1}</span>
      <span class="slide-title-lbl" style="flex:1">${folie.title}</span>
      <a class="wa-btn" href="https://wa.me/4916096877039?text=${waText}" target="_blank">
        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Frage stellen
      </a>
    </div>
  </div>`;

  // Is this the last folie before quiz?
  const nextStep = STEPS[cur+1];
  const isLastFolie = nextStep && nextStep.type === 'quiz';
  renderFoot(true, true, isLastFolie ? 'Zum Quiz →' : 'Weiter →');
}

/* ──── QUIZ ──── */
function renderQuiz(host, kap, ki){
  if(!quizState[ki]) quizState[ki] = { qi:0, score:0, answered: new Array(kap.quiz.length).fill(null) };
  const qs = quizState[ki];

  if(qs.qi >= kap.quiz.length){
    // Result screen
    const pct = Math.round(qs.score / kap.quiz.length * 100);
    const pass = pct >= 70;
    host.innerHTML=`<div class="quiz-card"><div class="quiz-result">
      <div class="qr-icon ${pass?'ok':'no'}">${pass?'✓':'✗'}</div>
      <div class="qr-score">${qs.score} / ${kap.quiz.length} richtig</div>
      <p style="color:var(--muted);margin-bottom:20px">${pass?'Gut gemacht! Sie können mit dem nächsten Kapitel fortfahren.':'Bitte das Kapitel wiederholen.'}</p>
      ${pass
        ? `<button class="btn" onclick="goStep(${cur+1})">Weiter →</button>`
        : `<button class="btn" onclick="resetQuiz(${ki})">Quiz wiederholen</button>`
      }
    </div></div>`;
    document.getElementById('foot').innerHTML='';
    return;
  }

  const q = kap.quiz[qs.qi];
  const shuffled = q.o.map((o,i)=>({o,i}));
  host.innerHTML=`<div class="quiz-card">
    <div class="quiz-hd">
      <span class="quiz-kap">${kap.title}</span>
      <span class="quiz-prog">Frage ${qs.qi+1} / ${kap.quiz.length}</span>
    </div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts">
      ${shuffled.map(({o,i})=>`<button class="opt" id="opt-${i}" onclick="answerQuiz(${ki},${i})">${o}</button>`).join('')}
    </div>
    <div class="quiz-fb" id="qfb"></div>
  </div>`;
  document.getElementById('foot').innerHTML='';
}

function answerQuiz(ki, chosen){
  const kap = KAPITEL[ki];
  const qs = quizState[ki];
  const q = kap.quiz[qs.qi];
  const correct = q.c;
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  document.getElementById('opt-'+correct).classList.add('correct');
  const fb = document.getElementById('qfb');
  if(chosen===correct){
    qs.score++;
    fb.className='quiz-fb ok';
    fb.textContent='✓ Richtig!';
  } else {
    document.getElementById('opt-'+chosen).classList.add('wrong');
    fb.className='quiz-fb no';
    fb.textContent='✗ Falsch. Richtige Antwort: '+q.o[correct];
  }
  qs.qi++;
  setTimeout(()=>renderQuiz(document.getElementById('host'), kap, ki), 1200);
}

function resetQuiz(ki){
  quizState[ki] = { qi:0, score:0, answered: new Array(KAPITEL[ki].quiz.length).fill(null) };
  // Go back to chapter start
  const chIdx = STEPS.findIndex(s=>s.type==='chapter' && s.ki===ki);
  goStep(chIdx);
}

       target="_blank"
       style="display:inline-flex;align-items:center;gap:10px;padding:12px 24px;background:#25D366;color:#fff;border-radius:11px;font-size:15px;font-weight:700;text-decoration:none">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      WhatsApp – Prüfung anmelden
    </a>
  </div>`;
  document.getElementById('foot').innerHTML='';
}

/* ============================================================
   SIDEBAR TOGGLE
   ============================================================ */
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}

/* ============================================================
   INIT
   ============================================================ */
buildSteps();
buildSidebar();

  if(regnr && /^\d{4}-\d{3,4}$/.test(regnr)){
    startApp('Teilnehmer', regnr);
