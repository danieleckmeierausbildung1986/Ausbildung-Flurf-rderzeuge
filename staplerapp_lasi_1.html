<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ladungssicherung VDI 2700 – Ausbildung</title>
<style>
:root{
  --navy:#16243f;--steel:#2b6cb0;--safety:#f5a623;--safety-d:#d4880f;
  --ink:#1a2330;--muted:#68788f;--line:#e3e8f0;--bg:#edf1f7;--card:#fff;
  --ok:#1a9e6e;--okbg:#e8f7f2;--no:#c0392b;--nobg:#fdecea;
  --shadow:0 4px 22px rgba(22,36,63,.10);--r:14px;
  --lasi:#1a7a4a;--lasi-l:#2ea865;--lasi-d:#0d4a24;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0a1f12,#14422a 55%,#1a5c38);padding:20px}
.lcard{background:#fff;border-radius:22px;box-shadow:0 24px 64px rgba(0,0,0,.28);
  width:100%;max-width:420px;overflow:hidden}
.lcard-top{background:linear-gradient(135deg,#0d2b1a,#1a5c38);padding:36px 32px 28px;text-align:center}
.lcard-top .ico{width:64px;height:64px;border-radius:14px;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.lcard-top .ico svg{width:34px;height:34px;fill:#fff}
.lcard-top h1{color:#fff;font-size:19px;margin-bottom:4px}
.lcard-top p{color:rgba(255,255,255,.55);font-size:13px}
.lcard-body{padding:26px 30px 30px}
.lf{margin-bottom:16px}
.lf label{display:block;font-size:12px;font-weight:700;color:var(--navy);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.lf input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;
  font-size:16px;background:#fafbfc;transition:border-color .15s}
.lf input:focus{outline:none;border-color:var(--lasi)}
.lbtn{width:100%;padding:13px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--lasi),var(--lasi-d));
  color:#fff;font-size:15px;font-weight:700}
.lbtn:hover{opacity:.9}
.lerr{color:#c0392b;font-size:13px;margin-top:9px;text-align:center;min-height:18px}
.lhint{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}

/* APP */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:linear-gradient(90deg,#0d2b1a,#1a5c38);color:#fff;height:56px;
  display:flex;align-items:center;gap:12px;padding:0 16px;
  position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.burger{width:38px;height:38px;border:none;background:rgba(255,255,255,.1);
  border-radius:9px;color:#fff;font-size:20px;display:none;align-items:center;justify-content:center}
.topbar-logo{width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--lasi),var(--lasi-l));
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar-logo svg{width:19px;height:19px;fill:#fff}
.topbar-title{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar-who{font-size:12px;color:rgba(255,255,255,.5)}
.back-home{padding:5px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:600;
  cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.back-home:hover{background:rgba(255,255,255,.2)}
.pbar-wrap{height:3px;background:rgba(255,255,255,.1)}
.pbar{height:100%;background:var(--safety);width:0;transition:width .35s}

.layout{flex:1;display:flex;max-width:1280px;margin:0 auto;width:100%}

/* SIDEBAR */
.sidebar{width:272px;background:var(--card);border-right:1px solid var(--line);
  overflow-y:auto;padding:8px 0;position:sticky;top:59px;
  max-height:calc(100vh - 59px);flex-shrink:0}
.sidebar-item{padding:10px 14px;font-size:13px;cursor:pointer;
  display:flex;align-items:flex-start;gap:10px;border-left:3px solid transparent;transition:background .1s}
.sidebar-item:hover{background:#f0faf4}
.sidebar-item.active{background:#e6f5ec;border-left-color:var(--lasi);font-weight:600;color:#0d2b1a}
.snum{width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.sidebar-item.active .snum{background:var(--lasi);color:#fff}
.stxt{flex:1}.stitle{line-height:1.3}.scnt{font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.scrim{display:none}

/* STAGE */
.stage{flex:1;padding:22px 26px 60px;min-width:0}
.crumb{font-size:11px;color:var(--lasi);font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;margin-bottom:10px}

@keyframes fin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* WELCOME */
.welcome-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  text-align:center;padding:52px 28px 44px;animation:fin .28s ease}
.w-icon{width:82px;height:82px;border-radius:50%;
  background:linear-gradient(135deg,var(--lasi),#0d2b1a);
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.w-icon svg{width:42px;height:42px;fill:#fff}
.welcome-card h2{font-size:26px;color:var(--navy);margin-bottom:10px}
.welcome-card p{color:var(--muted);font-size:15px;max-width:500px;margin:0 auto 22px;line-height:1.6}
.w-stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.wstat{background:#f4f7fc;border:1px solid var(--line);border-radius:12px;padding:12px 20px}
.wn{font-size:22px;font-weight:800;color:var(--lasi)}
.wl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* CHAPTER INTRO */
.chapter-intro{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  text-align:center;padding:48px 28px 44px;animation:fin .28s ease;border-top:5px solid var(--lasi)}
.ci-num{font-size:13px;font-weight:700;color:var(--lasi);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:10px}
.chapter-intro h2{font-size:28px;color:var(--navy);margin-bottom:12px;font-weight:800}
.ci-meta{font-size:14px;color:var(--muted);margin-bottom:4px}

/* SLIDE (Folienbild) */
.slide-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;animation:fin .28s ease}
.slide-img-full{width:100%;display:block;border-radius:var(--r) var(--r) 0 0}
.slide-footer{display:flex;align-items:center;gap:8px;padding:10px 16px;
  border-top:1px solid var(--line);background:#fafbfc;flex-wrap:wrap}
.slide-nr{font-size:11px;color:var(--muted);background:var(--line);
  border-radius:5px;padding:2px 7px;flex-shrink:0}
.wa-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;
  background:#f0fdf4;border:1px solid #bbf7d0;border-radius:20px;
  color:#16a34a;font-size:11.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.wa-btn:hover{background:#dcfce7}
.wa-btn svg{width:13px;height:13px;fill:#16a34a;flex-shrink:0}
.mail-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;
  background:#e8f0fe;border:1px solid #c5d5f5;border-radius:20px;
  color:#1a56db;font-size:11.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.mail-btn:hover{background:#d2e3fc}
.mail-btn svg{width:13px;height:13px;fill:#1a56db;flex-shrink:0}

/* QUIZ */
.quiz-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;animation:fin .28s ease}
.quiz-hd{display:flex;justify-content:space-between;align-items:center;
  padding:14px 20px;border-bottom:1px solid var(--line);background:#f4fbf7}
.quiz-kap{font-size:12px;font-weight:700;color:var(--lasi);text-transform:uppercase;letter-spacing:.5px}
.quiz-prog{font-size:13px;color:var(--muted)}
.quiz-q{font-size:17px;font-weight:600;color:var(--navy);padding:22px 20px 16px;line-height:1.45}
.quiz-opts{padding:0 20px 20px;display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border:2px solid var(--line);
  border-radius:11px;background:#fff;font-size:14.5px;color:var(--ink);transition:all .1s}
.opt:hover:not(:disabled){border-color:var(--lasi);background:#f0faf4}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok)!important;background:var(--okbg)!important;color:var(--ok)!important}
.opt.wrong{border-color:var(--no)!important;background:var(--nobg)!important;color:var(--no)!important}
.quiz-fb{padding:0 20px 16px;font-size:14px;font-weight:600;min-height:24px}
.quiz-fb.ok{color:var(--ok)}.quiz-fb.no{color:var(--no)}
.quiz-result{text-align:center;padding:40px 24px}
.qr-icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;margin:0 auto 16px;font-size:30px;font-weight:800}
.qr-icon.ok{background:var(--okbg);color:var(--ok)}
.qr-icon.no{background:var(--nobg);color:var(--no)}
.qr-score{font-size:30px;font-weight:800;color:var(--navy);margin-bottom:8px}

/* EXAM */
.exam-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  text-align:center;padding:52px 28px 44px;animation:fin .28s ease}
.exam-icon{width:82px;height:82px;border-radius:50%;
  background:linear-gradient(135deg,var(--safety),var(--safety-d));
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.exam-icon svg{width:42px;height:42px;fill:#fff}

/* BUTTONS */
.btn{padding:12px 28px;border:none;border-radius:11px;
  background:linear-gradient(135deg,var(--lasi),var(--lasi-d));
  color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{opacity:.88}
.btn.safety{background:linear-gradient(135deg,var(--safety),var(--safety-d));color:#3a2800}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:10px}
.navbtn{padding:11px 20px;border-radius:11px;border:2px solid var(--lasi);
  background:#fff;color:var(--lasi);font-size:14px;font-weight:700;transition:all .12s}
.navbtn:hover:not(:disabled){background:var(--lasi);color:#fff}
.navbtn.primary{background:var(--lasi);color:#fff}
.navbtn.primary:hover:not(:disabled){background:var(--lasi-d);border-color:var(--lasi-d)}
.navbtn:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line);color:var(--muted)}
.pageno{font-size:13px;color:var(--muted);white-space:nowrap}

@media(max-width:820px){
  .burger{display:flex}
  .sidebar{position:fixed;top:59px;left:0;bottom:0;z-index:30;
    transform:translateX(-100%);transition:transform .25s;max-height:none;
    box-shadow:4px 0 18px rgba(0,0,0,.17)}
  .sidebar.open{transform:translateX(0)}
  .scrim.show{display:block;position:fixed;inset:59px 0 0 0;
    background:rgba(0,0,0,.36);z-index:29}
  .stage{padding:14px 14px 60px}
}

/* ── MODUL: Beladen & Lücken sichern ── */
.m-card{background:#fff;border-radius:11px;box-shadow:0 3px 14px rgba(22,36,63,.08);overflow:hidden;margin-bottom:10px}
.m-chd{padding:11px 15px 9px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,#f4fbf7,#fff)}
.m-chd h2{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:1px}
.m-chd p{font-size:11px;color:var(--muted)}
.m-cbody{padding:13px}
.m-btn{padding:7px 16px;border:none;border-radius:9px;background:linear-gradient(135deg,var(--lasi),var(--lasi-d));color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.m-btn:hover{opacity:.88}
.m-btn.out{background:#fff;border:1.5px solid var(--lasi);color:var(--lasi)}
.m-btn.sm{padding:5px 10px;font-size:11px}
.m-btn.safety{background:linear-gradient(135deg,var(--safety),#d4880f);color:#3a2800}
.m-fb{border-radius:9px;padding:10px 12px;margin-top:9px;font-size:12px;line-height:1.6;display:none}
.m-fb.ok{background:var(--okbg);border:1.5px solid var(--ok);color:#0d5c3a}
.m-fb.no{background:var(--nobg);border:1.5px solid var(--no);color:#7b1a12}
.m-fb.warn{background:#fef3c7;border:1.5px solid #d97706;color:#92400e}
.m-fb.show{display:block}
.spcard{background:#f4fbf7;border:1.5px solid var(--line);border-radius:10px;padding:11px;cursor:pointer;transition:all .15s;text-align:center}
.spcard:hover{border-color:var(--lasi);background:#e6f5ec;transform:translateY(-1px)}
.phase-bar{display:flex;gap:5px;margin-bottom:9px}
.ps{flex:1;padding:6px 4px;border-radius:7px;border:1.5px solid var(--line);text-align:center;font-size:10px;font-weight:700;color:var(--muted);background:#fff;transition:all .2s}
.ps.act{border-color:var(--lasi);background:var(--lasi);color:#fff}
.ps.done{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.stats-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.stat{background:#f4f7fc;border-radius:7px;padding:6px 8px;text-align:center;flex:1;min-width:52px}
.stat-n{font-size:13px;font-weight:800;color:var(--lasi)}
.stat-l{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.fill-bar-wrap{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.fill-bar{height:100%;border-radius:4px;transition:width .4s,background .3s}
.palette-wrap{display:flex;gap:5px;flex-wrap:wrap;padding:7px;background:#f4fbf7;border-radius:8px;border:1.5px dashed var(--lasi);min-height:46px;margin-bottom:8px}
.pgut{padding:5px 7px;border-radius:6px;border:1.5px solid var(--line);background:#fff;font-size:9px;font-weight:600;cursor:grab;user-select:none;display:flex;flex-direction:column;align-items:center;gap:1px;touch-action:none;min-width:55px;text-align:center}
.pgut:hover{border-color:var(--lasi);background:#f0faf4}
.pgut.placed{border-color:var(--ok);background:var(--okbg);color:var(--ok);opacity:.5;cursor:default}
.pgut.dragging{opacity:.3}
@keyframes shake{0%,100%{transform:translateX(0)}33%{transform:translateX(-3px)}66%{transform:translateX(3px)}}
.pgut.no-fit{border-color:var(--no);background:var(--nobg);animation:shake .3s}
.p2wrap{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:start}
@media(max-width:540px){.p2wrap{grid-template-columns:1fr}}
.lasi-pal{background:#fff8e1;border:1.5px dashed #d97706;border-radius:9px;padding:8px}
.lasi-pal-title{font-size:9px;font-weight:700;color:#d97706;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.lmat{padding:5px 8px;border-radius:6px;border:1.5px solid #f5d76e;background:#fff;font-size:10px;font-weight:600;cursor:grab;user-select:none;display:flex;align-items:center;gap:5px;transition:all .12s;touch-action:none;margin-bottom:5px}
.lmat:hover{border-color:#d97706;background:#fef9e7}
.lmat.dragging-lasi{opacity:.3}
.luecken-info{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.luecke-card{border-radius:8px;padding:8px 10px;border:1.5px solid var(--no);background:var(--nobg);transition:all .3s}
.luecke-card.ok{border-color:var(--ok);background:var(--okbg)}
.luecke-card.nok{border-color:var(--no);background:var(--nobg)}
.lc-title{font-size:10px;font-weight:700;color:var(--no);margin-bottom:3px}
.luecke-card.ok .lc-title{color:var(--ok)}
.lc-placed{display:flex;flex-wrap:wrap;gap:3px;min-height:20px;margin-bottom:3px}
.lc-mat-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;cursor:pointer}
.lc-mat-tag.ok-tag{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.lc-mat-tag.no-tag{background:var(--nobg);color:var(--no);border:1px solid var(--no)}
.lc-mat-tag.neu{background:#f4f7fc;color:var(--navy);border:1px solid var(--line)}
.lc-fb{font-size:9px;color:var(--muted);line-height:1.4;display:none;margin-top:3px}
.drop-over{outline:2px dashed #d97706!important;transform:scale(1.01)}
.auswert-canvas-wrap{margin-bottom:12px;position:relative}
.auswert-canvas-title{font-size:10px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.legende{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.ck-list{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.ck-item{display:flex;gap:7px;padding:7px 10px;border-radius:8px;background:#f4f7fc;align-items:flex-start}
.ck-item.ok{background:var(--okbg)}
.ck-item.no{background:var(--nobg)}
.ck-icon{font-size:14px;flex-shrink:0}
.ck-txt{flex:1}
.ck-lbl{font-size:11px;font-weight:700}
.ck-item.ok .ck-lbl{color:var(--ok)}
.ck-item.no .ck-lbl{color:var(--no)}
.ck-sub{font-size:10px;color:var(--muted);margin-top:1px}
</style>
</head>
<body>

<div id="zugangsCheckOverlay" style="display:none;position:fixed;inset:0;background:#0d2b1a;z-index:9999;align-items:center;justify-content:center;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;text-align:center;padding:24px;">
  <div id="zugangsCheckContent">Zugang wird gepr&uuml;ft&hellip;</div>
</div>

<!-- LOGIN -->
<div id="login">
  <div class="lcard">
    <div class="lcard-top">
      <div class="ico">
        <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4z"/></svg>
      </div>
      <h1>Ladungssicherung</h1>
      <p>Ausbildung nach VDI 2700 ff.</p>
    </div>
    <div class="lcard-body">
      <div class="lf">
        <label>Registriernummer</label>
        <input type="text" id="regnr" placeholder="2025-001" autocomplete="off"
          onkeydown="if(event.key==='Enter')document.getElementById('vorname').focus()">
      </div>
      <div class="lf">
        <label>Vorname</label>
        <input type="text" id="vorname" placeholder="Max" autocomplete="off"
          onkeydown="if(event.key==='Enter')document.getElementById('nachname').focus()">
      </div>
      <div class="lf">
        <label>Nachname</label>
        <input type="text" id="nachname" placeholder="Mustermann" autocomplete="off"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="lbtn" onclick="doLogin()">Anmelden →</button>
      <div class="lerr" id="lerr"></div>
      <div class="lhint">Format: 2025-001 – erhalten Sie von Ihrem Ausbilder</div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="topbar">
    <button class="burger" onclick="toggleSidebar()">☰</button>
    <div class="topbar-logo">
      <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4z"/></svg>
    </div>
    <span class="topbar-title">Ladungssicherung VDI 2700</span>
    <div class="topbar-right">
      <span class="topbar-who" id="topbar-who"></span>
      <a class="back-home" id="backHomeBtn" href="#">← Zurück</a>
    </div>
  </div>
  <div class="pbar-wrap"><div class="pbar" id="pbar"></div></div>
  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div id="sidebarList"></div>
    </div>
    <div class="scrim" id="scrim" onclick="toggleSidebar()"></div>
    <div class="stage" id="stage">
      <div class="crumb" id="crumb"></div>
      <div id="host"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>
</div>

let STEPS = [];

  STEPS = [{type:'welcome'}];
  KAPITEL.forEach((k,ki)=>{
    STEPS.push({type:'chapter',ki});
    k.folien.forEach((fn,fi)=>STEPS.push({type:'folie',ki,fi,fn}));
    STEPS.push({type:'quiz',ki,qi:0});
  });
  STEPS.push({type:'modul'});
  STEPS.push({type:'exam'});
}

/* ── LOGIN ── */
function doLogin(){
  const val = document.getElementById('regnr').value.trim();
  const vorname = document.getElementById('vorname').value.trim();
  const nachname = document.getElementById('nachname').value.trim();
  const errEl = document.getElementById('lerr');
  errEl.textContent = '';
  if(!val){errEl.textContent='Bitte Registriernummer eingeben.';return;}
  if(!/^\d{4}-\d{3,4}$/.test(val)){errEl.textContent='Ungültig. Format: 2025-001';return;}
  if(!vorname || !nachname){errEl.textContent='Bitte Vor- und Nachnamen eingeben.';return;}
  startApp(val, vorname, nachname);
}

async function startApp(nr, vorname, nachname){
  regnr = nr;
  const overlay = document.getElementById('zugangsCheckOverlay');
  const content = document.getElementById('zugangsCheckContent');
  overlay.style.display = 'flex';
  const backBtnHtml = '<button onclick="window.location.href=\'' + PORTAL_URL + '?regnr=' + encodeURIComponent(nr) + '\'" style="padding:12px 28px;border:none;border-radius:12px;background:#fff;color:#0d2b1a;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit">&larr; Zur&uuml;ck zur Startseite</button>';
  try {
    const res = await fetch(ZUGANGSPRUEFUNG_URL, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ registrierungsnummer: nr, vorname: vorname, nachname: nachname })
    });
    const data = await res.json();
    if(!(data && data.zugang === true)){
      content.innerHTML = '<div style="max-width:420px"><div style="font-size:40px;margin-bottom:12px">&#x1F512;</div><div style="font-size:18px;font-weight:700;margin-bottom:8px">Zugriff nicht m&ouml;glich</div><div style="font-size:14px;color:rgba(255,255,255,.75);line-height:1.6;margin-bottom:20px">Registriernummer, Vor- oder Nachname stimmen nicht &uuml;berein. Bitte pr&uuml;fen Sie Ihre Eingaben oder wenden Sie sich an Ihren Ausbilder.</div>' + backBtnHtml + '</div>';
      return;
    }
    let fVal = data.pruefung_lasi_freigegeben;
    if(fVal && typeof fVal === 'object') fVal = fVal.Value;
    if(fVal === 'Geschlossen'){
      content.innerHTML = '<div style="max-width:420px"><div style="font-size:40px;margin-bottom:12px">&#x1F512;</div><div style="font-size:18px;font-weight:700;margin-bottom:8px">Schulung abgeschlossen</div><div style="font-size:14px;color:rgba(255,255,255,.75);line-height:1.6;margin-bottom:20px">Sie haben die Pr&uuml;fung zu diesem Kurs bereits bestanden. Der Zugriff auf die Schulungsinhalte ist daher nicht mehr m&ouml;glich.</div>' + backBtnHtml + '</div>';
      return;
    }
  } catch(e){}
  overlay.style.display = 'none';
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topbar-who').textContent = nr;
  const backBtn = document.getElementById('backHomeBtn');
  backBtn.href = PORTAL_URL + '?regnr=' + encodeURIComponent(nr);
  buildSidebar();
  goStep(0);
}

/* ── SIDEBAR ── */
function buildSidebar(){
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';
  KAPITEL.forEach((k,ki)=>{
    const chIdx = STEPS.findIndex(s=>s.type==='chapter'&&s.ki===ki);
    const div = document.createElement('div');
    div.className='sidebar-item'+(isInChapter(ki)?' active':'');
    div.id='si-'+ki;
    div.innerHTML=`<div class="snum">${ki+1}</div>
      <div class="stxt"><div class="stitle">${k.title}</div>
      <div class="scnt">${k.folien.length} Folien · ${k.quiz.length} Fragen</div></div>`;
    div.onclick=()=>{goStep(chIdx);closeSidebar();};
    list.appendChild(div);
  });
  const modulIdx = STEPS.findIndex(s=>s.type==='modul');
  const modulDiv = document.createElement('div');
  modulDiv.className='sidebar-item'+(STEPS[cur]?.type==='modul'?' active':'');
  modulDiv.id='si-modul';
  modulDiv.innerHTML=`<div class="snum">🎮</div>
    <div class="stxt"><div class="stitle">Beladen &amp; Lücken sichern</div>
    <div class="scnt">Interaktives Lade-Modul</div></div>`;
  modulDiv.onclick=()=>{goStep(modulIdx);closeSidebar();};
  list.appendChild(modulDiv);

  const examIdx = STEPS.findIndex(s=>s.type==='exam');
  const examDiv = document.createElement('div');
  examDiv.className='sidebar-item'+(STEPS[cur]?.type==='exam'?' active':'');
  examDiv.id='si-exam';
  examDiv.innerHTML=`<div class="snum">📋</div>
    <div class="stxt"><div class="stitle">Abschlussprüfung</div>
    <div class="scnt">Theoretische Prüfung</div></div>`;
  examDiv.onclick=()=>{goStep(examIdx);closeSidebar();};
  list.appendChild(examDiv);
}

function isInChapter(ki){
  const s=STEPS[cur];
  if(!s||s.type==='welcome'||s.type==='exam'||s.type==='modul')return false;
  return s.ki===ki;
}
function updateSidebar(){
  KAPITEL.forEach((_,ki)=>{
    const el=document.getElementById('si-'+ki);
    if(el)el.classList.toggle('active',isInChapter(ki));
  });
  const examEl=document.getElementById('si-exam');
  if(examEl)examEl.classList.toggle('active',STEPS[cur]?.type==='exam');
  const modulEl=document.getElementById('si-modul');
  if(modulEl)modulEl.classList.toggle('active',STEPS[cur]?.type==='modul');
}

/* ── PROGRESS ── */
function updatePbar(){
  const pct=STEPS.length>1?(cur/(STEPS.length-1))*100:0;
  document.getElementById('pbar').style.width=pct+'%';
}

/* ── NAVIGATION ── */
function goStep(idx){
  cur=Math.max(0,Math.min(STEPS.length-1,idx));
  render();updateSidebar();updatePbar();
  window.scrollTo(0,0);
}

function renderFoot(showBack=true,showNext=true,nextLabel='Weiter →'){
  const foot=document.getElementById('foot');
  const s=STEPS[cur];
  let pageText='';
  if(s.type==='folie'){
    const k=KAPITEL[s.ki];
    pageText=`Folie ${s.fi+1} / ${k.folien.length}`;
  }
  foot.innerHTML=`
    ${showBack?`<button class="navbtn" onclick="goStep(${cur-1})" ${cur===0?'disabled':''}>← Zurück</button>`:'<div></div>'}
    <span class="pageno">${pageText}</span>
    ${showNext?`<button class="navbtn primary" onclick="goStep(${cur+1})">${nextLabel}</button>`:'<div></div>'}
  `;
}

/* ── RENDER ── */
function render(){
  const s=STEPS[cur];
  const host=document.getElementById('host');
  const crumb=document.getElementById('crumb');
  if(s.type==='welcome'){crumb.textContent='';renderWelcome(host);}
  else if(s.type==='chapter'){crumb.textContent=`Kapitel ${s.ki+1}`;renderChapter(host,s.ki);}
  else if(s.type==='folie'){crumb.textContent=`Kapitel ${s.ki+1} · Folie ${s.fi+1}`;renderFolie(host,s);}
  else if(s.type==='quiz'){crumb.textContent=`Kapitel ${s.ki+1} · Wissenstest`;renderQuiz(host,s.ki);}
  else if(s.type==='modul'){crumb.textContent='Praxismodul';renderModul(host);}

/* ── QUIZ ── */
function renderQuiz(host,ki){
  if(!quizState[ki])quizState[ki]={qi:0,score:0};
  const qs=quizState[ki];
  const k=KAPITEL[ki];
  if(qs.qi>=k.quiz.length){
    const pct=Math.round(qs.score/k.quiz.length*100);
    const pass=pct>=70;
    const done=!!kapitelAbgeschlossen[ki];
    host.innerHTML=`<div class="quiz-card"><div class="quiz-result">
      <div class="qr-icon ${pass?'ok':'no'}">${pass?'✓':'✗'}</div>
      <div class="qr-score">${qs.score} / ${k.quiz.length} richtig</div>
      <p style="color:var(--muted);margin-bottom:20px">${pass?'Gut gemacht! Weiter zum nächsten Kapitel.':'Bitte das Kapitel wiederholen.'}</p>
      ${pass?`<button class="btn" id="aBtn" onclick="kapitelAbschliessen(${ki})" ${done?'disabled style="background:var(--ok)"':''}>${done?'✓ Abgeschlossen':'Thema abschließen &amp; speichern'}</button>
             <div class="abschluss-status" id="aStat" style="margin-top:10px;font-size:13px;color:var(--muted)">${done?'Kapitel '+(ki+1)+' gespeichert.':''}</div>
             <button class="btn" style="margin-top:10px;background:var(--muted)" onclick="goStep(${cur+1})" ${done?'':'disabled'} id="weiterBtn">Weiter →</button>`
             :`<button class="btn" onclick="resetQuiz(${ki})">Wiederholen</button>`}
    </div></div>`;
    document.getElementById('foot').innerHTML='';
    return;
  }
  const q=k.quiz[qs.qi];
  host.innerHTML=`<div class="quiz-card">
    <div class="quiz-hd">
      <span class="quiz-kap">${k.title}</span>
      <span class="quiz-prog">Frage ${qs.qi+1} / ${k.quiz.length}</span>
    </div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts">
      ${q.o.map((o,i)=>`<button class="opt" id="opt-${i}" onclick="answerQuiz(${ki},${i})">${o}</button>`).join('')}
    </div>
    <div class="quiz-fb" id="qfb"></div>
  </div>`;
  document.getElementById('foot').innerHTML='';
}

function answerQuiz(ki,chosen){
  const k=KAPITEL[ki];
  const qs=quizState[ki];
  const q=k.quiz[qs.qi];
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  document.getElementById('opt-'+q.c).classList.add('correct');
  const fb=document.getElementById('qfb');
  if(chosen===q.c){qs.score++;fb.className='quiz-fb ok';fb.textContent='✓ Richtig!';}
  else{document.getElementById('opt-'+chosen).classList.add('wrong');fb.className='quiz-fb no';fb.textContent='✗ Falsch. Richtig: '+q.o[q.c];}
  qs.qi++;
  setTimeout(()=>renderQuiz(document.getElementById('host'),ki),1200);
}

function resetQuiz(ki){
  quizState[ki]={qi:0,score:0};
  const chIdx=STEPS.findIndex(s=>s.type==='chapter'&&s.ki===ki);
  goStep(chIdx);
}

function kapitelAbschliessen(ki){
  const btn=document.getElementById('aBtn');
  const stat=document.getElementById('aStat');
  const weiterBtn=document.getElementById('weiterBtn');
  if(!btn||!stat)return;
  const k=KAPITEL[ki];
  const qs=quizState[ki];
  btn.disabled=true;btn.textContent='Wird gespeichert…';
  const payload={
    regnr:regnr,
    kapitel_nr:ki+1,
    kapitel_name:k.title,
    datum_uhrzeit:new Date().toISOString(),
    quiz_richtig:qs.score,
    quiz_gesamt:k.quiz.length,
    quiz_prozent:Math.round(qs.score/k.quiz.length*100),
    bestanden:true,
    lernzeit_sekunden:Math.round((Date.now()-(kapitelStartZeit[ki]||Date.now()))/1000),
    gesamt_kapitel_abgeschlossen:Object.keys(kapitelAbgeschlossen).length+1
  };
  function onOK(){
    kapitelAbgeschlossen[ki]=true;
    btn.textContent='✓ Abgeschlossen';btn.style.background='var(--ok)';
    stat.textContent='Kapitel '+(ki+1)+' gespeichert.';
    if(weiterBtn)weiterBtn.disabled=false;
  }
  fetch(LERNFORTSCHRITT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(onOK)
    .catch(()=>{btn.disabled=false;btn.textContent='Thema abschließen & speichern';stat.textContent='Fehler beim Speichern. Bitte erneut versuchen.';stat.style.color='var(--no)';});
}

function mkGrid(){grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));}
function canPlace(c,r,cw,ch,ex=null){if(c<0||r<0||c+cw>COLS||r+ch>ROWS)return false;for(let rr=r;rr<r+ch;rr++)for(let cc=c;cc<c+cw;cc++)if(grid[rr][cc]&&grid[rr][cc]!==ex)return false;return true;}
function placeGrid(id,c,r,cw,ch){for(let rr=r;rr<r+ch;rr++)for(let cc=c;cc<c+cw;cc++)grid[rr][cc]=id;}
function removeGrid(id){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]===id)grid[r][c]=null;}
function snapPos(px,py,cw,ch,cv,ex=null){const tr=gTR(cv);const cW=tr.w/COLS,cH=tr.h/ROWS;let col=Math.round((px-tr.x)/cW-cw/2),row=Math.round((py-tr.y)/cH-ch/2);col=Math.max(0,Math.min(COLS-cw,col));row=Math.max(0,Math.min(ROWS-ch,row));return{col,row,fits:canPlace(col,row,cw,ch,ex)};}
function gTR(cv){return{x:PAD.l,y:PAD.t,w:cv.width-PAD.l-PAD.r,h:cv.height-PAD.t-PAD.b};}
function fillPct(){let u=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c])u++;return Math.round(u/(ROWS*COLS)*100);}

function erkenneLuecken(){
  const luecken=[];
  let lCol=[];
  for(let c=0;c<COLS;c++){
    const allLeer=Array.from({length:ROWS},(_,r)=>!grid[r][c]).every(Boolean);
    if(allLeer)lCol.push(c);
    else if(lCol.length>0){addLL(luecken,lCol);lCol=[];}
  }
  if(lCol.length>0)addLL(luecken,lCol);
  // Seitenlücken
  let querR=false;
  for(let r=0;r<ROWS;r++){const belegt=Array.from({length:COLS},(_,c)=>!!grid[r][c]);if(belegt.some(Boolean)&&belegt.some(b=>!b))querR=true;}
  if(querR&&!luecken.find(l=>l.typ==='quer_seite'))luecken.push({id:'QL',typ:'quer_seite',cols:null,tit:'Seitliche Lücke',beschr:'Ladung füllt Breite nicht vollständig. Bei Kurvenfahrt 0,5×FG seitlich.',ok:['niederzurren','direktzurren','sperrstange'],falsch:['stauholz','leerpalette','keil','antirutsch']});
  return luecken;
}
function addLL(arr,cols){
  const minC=Math.min(...cols),maxC=Math.max(...cols);
  let typ,tit,beschr,ok,falsch;
  if(minC===0){typ='längs_vorne';tit='Lücke zur Stirnwand';beschr='Lücke vorne. Bei Vollbremsung 0,8×FG nach vorne.';ok=['airbag','stauholz','leerpalette','sperrstange'];falsch=['antirutsch','niederzurren','direktzurren','keil'];}
  else if(maxC===COLS-1){typ='längs_hinten';tit='Lücke zur Rückwand';beschr='Lücke hinten. Bei Beschleunigung 0,5×FG nach hinten.';ok=['airbag','stauholz','leerpalette','sperrstange'];falsch=['antirutsch','keil'];}
  else{typ='längs_mitte';tit='Lücke in der Mitte';beschr='Zwischen Gütergruppen. Ladung kann aufeinander rutschen.';ok=['airbag','stauholz','leerpalette','sperrstange'];falsch=['antirutsch','keil'];}
  if(!arr.find(l=>l.typ===typ))arr.push({id:typ,typ,cols,tit,beschr,ok,falsch});
}

  detLuecken.forEach(l=>{
    const mats=lueckenMat[l.id]||[];
    const div=document.createElement('div');div.className='luecke-card';div.id='lcard-'+l.id;
    div.innerHTML=`<div class="lc-title">${l.tit}</div><div style="font-size:9px;color:var(--muted);margin-bottom:4px;line-height:1.4">${l.beschr}</div><div class="lc-placed" id="lcp-${l.id}">${rMats(l.id,mats)}</div><div class="lc-fb" id="lcfb-${l.id}"></div>`;
    div.addEventListener('mouseenter',()=>{if(lasiDrag)div.classList.add('drop-over');});

  });

function rMats(lid,mats){if(mats.length===0)return'<span style="font-size:9px;color:var(--muted);font-style:italic">← Material ziehen</span>';return mats.map(mid=>{const m=LASI.find(x=>x.id===mid);if(!m)return'';return`<div class="lc-mat-tag neu" onclick="rmMat('${lid}','${mid}')">${m.ic} ${m.n} ✕</div>`;}).join('');}
function rmMat(lid,mid){lueckenMat[lid]=(lueckenMat[lid]||[]).filter(x=>x!==mid);document.getElementById('lcp-'+lid).innerHTML=rMats(lid,lueckenMat[lid]);const card=document.getElementById('lcard-'+lid);if(card){card.className='luecke-card';const f=document.getElementById('lcfb-'+lid);if(f)f.style.display='none';}drawCV2();}
function dropLC(lid){if(!lasiDrag)return;if(!(lueckenMat[lid]||[]).includes(lasiDrag.id)){if(!lueckenMat[lid])lueckenMat[lid]=[];lueckenMat[lid].push(lasiDrag.id);}document.getElementById('lcp-'+lid).innerHTML=rMats(lid,lueckenMat[lid]);drawCV2();}

function sDGut(e,g){e.preventDefault();palDrag=g;document.getElementById('pg'+g.id)?.classList.add('dragging');mkG(g.n.split('\n')[0],g.ic,g.f,e.clientX,e.clientY);document.addEventListener('mousemove',onMMG);document.addEventListener('mouseup',onMUG);}

function sDGutT(e,g){e.preventDefault();palDrag=g;const t=e.touches[0];document.getElementById('pg'+g.id)?.classList.add('dragging');mkG(g.n.split('\n')[0],g.ic,g.f,t.clientX,t.clientY);document.addEventListener('touchmove',onTMG,{passive:false});document.addEventListener('touchend',onTEG);}
function onTMG(e){e.preventDefault();if(!palDrag)return;const t=e.touches[0];mvG(t.clientX,t.clientY);updPrev(t.clientX,t.clientY,palDrag);drawCV1();}
function onTEG(e){document.removeEventListener('touchmove',onTMG);document.removeEventListener('touchend',onTEG);if(!palDrag)return;document.getElementById('pg'+palDrag.id)?.classList.remove('dragging');rmG();const t=e.changedTouches[0];tryDG(t.clientX,t.clientY,palDrag);palDrag=null;dragPrev=null;drawCV1();}
function updPrev(cx,cy,g){const rect=cv1.getBoundingClientRect();const px=(cx-rect.left)*(cv1.width/rect.width),py=(cy-rect.top)*(cv1.height/rect.height);const s=snapPos(px,py,g.cw,g.ch,cv1);dragPrev={...s,cw:g.cw,ch:g.ch,g};}
function tryDG(cx,cy,g){const rect=cv1.getBoundingClientRect();const px=(cx-rect.left)*(cv1.width/rect.width),py=(cy-rect.top)*(cv1.height/rect.height);const tr=gTR(cv1);if(px<tr.x||px>tr.x+tr.w||py<tr.y||py>tr.y+tr.h)return;const s=snapPos(px,py,g.cw,g.ch,cv1);if(s.fits){spp[g.id]={col:s.col,row:s.row};placeGrid(g.id,s.col,s.row,g.cw,g.ch);document.getElementById('pg'+g.id)?.classList.add('placed');updStats();updFill();bldPal();}else{const el=document.getElementById('pg'+g.id);if(el){el.classList.add('no-fit');setTimeout(()=>el.classList.remove('no-fit'),500);}}}

function sDLasi(e,m){e.preventDefault();lasiDrag=m;document.getElementById('lm'+m.id)?.classList.add('dragging-lasi');mkG(m.n,m.ic,m.f,e.clientX,e.clientY);document.addEventListener('mousemove',onMML);document.addEventListener('mouseup',onMUL);}

function sDLasiT(e,m){e.preventDefault();lasiDrag=m;const t=e.touches[0];document.getElementById('lm'+m.id)?.classList.add('dragging-lasi');mkG(m.n,m.ic,m.f,t.clientX,t.clientY);document.addEventListener('touchmove',onTML,{passive:false});document.addEventListener('touchend',onTEL);}
function onTML(e){e.preventDefault();if(!lasiDrag)return;const t=e.touches[0];mvG(t.clientX,t.clientY);if(cv2){const rect=cv2.getBoundingClientRect();lasiHover={px:(t.clientX-rect.left)*(cv2.width/rect.width),py:(t.clientY-rect.top)*(cv2.height/rect.height)};}drawCV2();}
function onTEL(e){document.removeEventListener('touchmove',onTML);document.removeEventListener('touchend',onTEL);if(!lasiDrag)return;document.getElementById('lm'+lasiDrag.id)?.classList.remove('dragging-lasi');const t=e.changedTouches[0];if(cv2){const rect=cv2.getBoundingClientRect();const px=t.clientX-rect.left,py=t.clientY-rect.top;if(px>=0&&px<=rect.width&&py>=0&&py<=rect.height){dropLasiCV((px/rect.width)*cv2.width,(py/rect.height)*cv2.height);}}const cards=document.querySelectorAll('.luecke-card');cards.forEach(card=>{const r=card.getBoundingClientRect();if(t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom){dropLC(card.id.replace('lcard-',''));}});rmG();lasiDrag=null;lasiHover=null;drawCV2();}
function dropLasiCV(px,py){if(!lasiDrag||!detLuecken.length)return;const tr=gTR(cv2),cW=tr.w/COLS;const col=Math.floor((px-tr.x)/cW);const l=detLuecken.find(l=>l.cols&&l.cols.includes(col))||detLuecken[0];if(l){if(!(lueckenMat[l.id]||[]).includes(lasiDrag.id)){if(!lueckenMat[l.id])lueckenMat[l.id]=[];lueckenMat[l.id].push(lasiDrag.id);}document.getElementById('lcp-'+l.id).innerHTML=rMats(l.id,lueckenMat[l.id]);}}

function gutAt(px,py){const tr=gTR(cv1),cW=tr.w/COLS,cH=tr.h/ROWS;const col=Math.floor((px-tr.x)/cW),row=Math.floor((py-tr.y)/cH);const id=grid[Math.max(0,Math.min(ROWS-1,row))]?.[Math.max(0,Math.min(COLS-1,col))];return id?spa.g.find(g=>g.id===id):null;}
function initCV1(){cv1=document.getElementById('cv1');ctx1=cv1.getContext('2d');const W=document.getElementById('cv1wrap').clientWidth||610,H=Math.round(W*0.3);cv1.width=W;cv1.height=H;cv1.style.height=H+'px';cv1.addEventListener('mousedown',cv1MD);cv1.addEventListener('touchstart',cv1TS,{passive:false});drawCV1();}
function cv1MD(e){const rect=cv1.getBoundingClientRect();const px=(e.clientX-rect.left)*(cv1.width/rect.width),py=(e.clientY-rect.top)*(cv1.height/rect.height);const g=gutAt(px,py);if(!g)return;canDrag={g,sc:spp[g.id].col,sr:spp[g.id].row};removeGrid(g.id);document.addEventListener('mousemove',cv1MM);document.addEventListener('mouseup',cv1MU);}
function cv1MM(e){if(!canDrag)return;const rect=cv1.getBoundingClientRect();const px=(e.clientX-rect.left)*(cv1.width/rect.width),py=(e.clientY-rect.top)*(cv1.height/rect.height);const s=snapPos(px,py,canDrag.g.cw,canDrag.g.ch,cv1,canDrag.g.id);dragPrev={...s,cw:canDrag.g.cw,ch:canDrag.g.ch,g:canDrag.g};drawCV1();}
function cv1MU(e){document.removeEventListener('mousemove',cv1MM);document.removeEventListener('mouseup',cv1MU);if(!canDrag)return;const g=canDrag.g;const rect=cv1.getBoundingClientRect();const px=(e.clientX-rect.left)*(cv1.width/rect.width),py=(e.clientY-rect.top)*(cv1.height/rect.height);const s=snapPos(px,py,g.cw,g.ch,cv1);if(s.fits){spp[g.id]={col:s.col,row:s.row};placeGrid(g.id,s.col,s.row,g.cw,g.ch);}else{spp[g.id]={col:canDrag.sc,row:canDrag.sr};placeGrid(g.id,canDrag.sc,canDrag.sr,g.cw,g.ch);}canDrag=null;dragPrev=null;drawCV1();updStats();updFill();}
function cv1TS(e){e.preventDefault();const t=e.touches[0];const rect=cv1.getBoundingClientRect();const px=(t.clientX-rect.left)*(cv1.width/rect.width),py=(t.clientY-rect.top)*(cv1.height/rect.height);const g=gutAt(px,py);if(!g)return;canDrag={g,sc:spp[g.id].col,sr:spp[g.id].row};removeGrid(g.id);cv1.addEventListener('touchmove',cv1TM,{passive:false});cv1.addEventListener('touchend',cv1TE);}
function cv1TM(e){e.preventDefault();if(!canDrag)return;const t=e.touches[0];const rect=cv1.getBoundingClientRect();const px=(t.clientX-rect.left)*(cv1.width/rect.width),py=(t.clientY-rect.top)*(cv1.height/rect.height);const s=snapPos(px,py,canDrag.g.cw,canDrag.g.ch,cv1,canDrag.g.id);dragPrev={...s,cw:canDrag.g.cw,ch:canDrag.g.ch,g:canDrag.g};drawCV1();}

function initCV2(){cv2=document.getElementById('cv2');ctx2=cv2.getContext('2d');const W=document.getElementById('cv2wrap').clientWidth||380,H=Math.round(W*0.3);cv2.width=W;cv2.height=H;cv2.style.height=H+'px';drawCV2();}

// ── DRAW BASE ──
function drawBase(cv,ctx){
  const tr=gTR(cv),cW=tr.w/COLS,cH=tr.h/ROWS,c=ctx;
  c.clearRect(0,0,cv.width,cv.height);
  c.fillStyle='#ddeedd';c.beginPath();c.roundRect(tr.x,tr.y,tr.w,tr.h,5);c.fill();
  for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++){c.strokeStyle='rgba(26,122,74,0.1)';c.lineWidth=0.5;c.strokeRect(tr.x+col*cW+.5,tr.y+r*cH+.5,cW-1,cH-1);}
  c.strokeStyle='#1a7a4a';c.lineWidth=1.5;c.beginPath();c.roundRect(tr.x,tr.y,tr.w,tr.h,5);c.stroke();
  c.fillStyle='#1a5c38';c.fillRect(tr.x-PAD.l+3,tr.y+tr.h*.08,PAD.l-5,tr.h*.84);
  c.font='12px sans-serif';c.textAlign='center';c.fillText('🚛',tr.x-PAD.l/2+3,tr.y+tr.h/2+4);
  const fv=spa.fz;[fv.va,fv.ha].forEach(v=>{const ax=tr.x+v*tr.w;c.strokeStyle='rgba(0,0,0,0.12)';c.lineWidth=1;c.setLineDash([3,3]);c.beginPath();c.moveTo(ax,tr.y);c.lineTo(ax,tr.y+tr.h);c.stroke();c.setLineDash([]);});
  c.fillStyle='#68788f';c.font='7px sans-serif';c.textAlign='center';
  c.fillText('VA',tr.x+fv.va*tr.w,tr.y+tr.h+12);c.fillText('HA',tr.x+fv.ha*tr.w,tr.y+tr.h+12);
}
function drawGueter(cv,ctx,skipDrag=false){
  const tr=gTR(cv),cW=tr.w/COLS,cH=tr.h/ROWS,c=ctx;
  spa.g.forEach(g=>{const p=spp[g.id];if(!p||(skipDrag&&canDrag&&canDrag.g.id===g.id))return;const x=tr.x+p.col*cW,y=tr.y+p.row*cH,gw=g.cw*cW,gh=g.ch*cH;c.fillStyle=g.f+'cc';c.beginPath();c.roundRect(x+1,y+1,gw-2,gh-2,3);c.fill();c.strokeStyle=g.f;c.lineWidth=1.5;c.beginPath();c.roundRect(x+1,y+1,gw-2,gh-2,3);c.stroke();c.fillStyle='#fff';c.font='bold 9px sans-serif';c.textAlign='center';c.fillText(g.ic,x+gw/2,y+gh/2+3);if(gh>16){c.font='7px sans-serif';c.fillStyle='rgba(255,255,255,.8)';c.fillText(g.gw+'kg',x+gw/2,y+gh/2+12);}});
}
function drawSP(cv,ctx){
  const tr=gTR(cv),c=ctx;let sm=0,sg=0;
  spa.g.forEach(g=>{const p=spp[g.id];if(p){const cx=(p.col+g.cw/2)/COLS;sm+=g.gw*cx;sg+=g.gw;}});
  if(!sg)return;const sp_r=sm/sg,spx=tr.x+sp_r*tr.w;
  c.fillStyle='rgba(245,166,35,0.08)';c.fillRect(tr.x+spa.sp[0]*tr.w,tr.y,(spa.sp[1]-spa.sp[0])*tr.w,tr.h);
  c.strokeStyle='#f5a623';c.lineWidth=2;c.setLineDash([4,3]);c.beginPath();c.moveTo(spx,tr.y);c.lineTo(spx,tr.y+tr.h);c.stroke();c.setLineDash([]);
  c.fillStyle='#f5a623';c.font='bold 7px sans-serif';c.textAlign='center';c.fillText('SP',spx,tr.y-5);
}

function drawCV1(){
  if(!cv1||!ctx1||!spa)return;
  const tr=gTR(cv1),cW=tr.w/COLS,cH=tr.h/ROWS,c=ctx1;
  drawBase(cv1,ctx1);drawGueter(cv1,ctx1,true);
  if(dragPrev){const{col,row,cw,ch,fits,g}=dragPrev;const x=tr.x+col*cW,y=tr.y+row*cH,gw=cw*cW,gh=ch*cH;c.fillStyle=fits?g.f+'55':'rgba(192,57,43,0.3)';c.beginPath();c.roundRect(x+1,y+1,gw-2,gh-2,3);c.fill();c.strokeStyle=fits?g.f:'#c0392b';c.lineWidth=2;c.setLineDash([3,2]);c.beginPath();c.roundRect(x+1,y+1,gw-2,gh-2,3);c.stroke();c.setLineDash([]);c.fillStyle=fits?'#fff':'#c0392b';c.font='bold 8px sans-serif';c.textAlign='center';c.fillText(fits?'✓':'✗',x+gw/2,y+gh/2+3);}
  if(Object.keys(spp).length===spa.g.length)drawSP(cv1,ctx1);
}
function drawCV2(){
  if(!cv2||!ctx2||!spa)return;
  const tr=gTR(cv2),cW=tr.w/COLS,cH=tr.h/ROWS,c=ctx2;
  drawBase(cv2,ctx2);drawGueter(cv2,ctx2,false);
  // Lücken rot
  for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++){if(!grid[r][col]){c.fillStyle='rgba(192,57,43,0.22)';c.fillRect(tr.x+col*cW+1,tr.y+r*cH+1,cW-2,cH-2);}}
  // LaSi-Material in Lücken anzeigen
  detLuecken.forEach(l=>{
    const mats=lueckenMat[l.id]||[];if(!mats.length)return;
    const cols=l.cols||(l.typ==='quer_seite'?[...Array(COLS).keys()].filter(cc=>!grid.some(r=>r[cc])):null);if(!cols||!cols.length)return;
    const midC=Math.round((Math.min(...cols)+Math.max(...cols))/2);
    const lx=tr.x+midC*cW,ly=tr.y+tr.h*0.5;
    mats.slice(0,2).forEach((mid,i)=>{const m=LASI.find(x=>x.id===mid);if(!m)return;c.fillStyle=m.f+'dd';c.beginPath();c.roundRect(lx-cW*0.9,ly-9+i*15,cW*1.8,13,3);c.fill();c.fillStyle='#fff';c.font='bold 7px sans-serif';c.textAlign='center';c.fillText(m.ic+' '+m.n.slice(0,7),lx,ly-1+i*15);});
  });
  // Hover
  if(lasiDrag&&lasiHover){const col=Math.floor((lasiHover.px-tr.x)/cW);const l=detLuecken.find(l=>l.cols&&l.cols.includes(col));if(l&&l.cols){const x1=tr.x+Math.min(...l.cols)*cW,x2=tr.x+(Math.max(...l.cols)+1)*cW;c.fillStyle='rgba(245,166,35,0.2)';c.fillRect(x1,tr.y,x2-x1,tr.h);c.strokeStyle='#f5a623';c.lineWidth=2;c.setLineDash([4,3]);c.strokeRect(x1,tr.y,x2-x1,tr.h);c.setLineDash([]);c.fillStyle='#92400e';c.font='bold 8px sans-serif';c.textAlign='center';c.fillText(lasiDrag.ic+' ablegen',x1+(x2-x1)/2,tr.y+tr.h/2+3);}}
  drawSP(cv2,ctx2);
}

// ── AUSWERTUNGS-CANVAS ──
function drawCvAusw(){
  cvA=document.getElementById('cvAusw');if(!cvA||!spa)return;
  ctxA=cvA.getContext('2d');
  const W=cvA.parentElement.clientWidth||640;
  const H=Math.round(W*0.48);
  cvA.width=W;cvA.height=H;cvA.style.height=H+'px';
  const c=ctxA;
  const PADX={l:50,r:14,t:30,b:60};
  const tr={x:PADX.l,y:PADX.t,w:W-PADX.l-PADX.r,h:H-PADX.t-PADX.b};
  const cW=tr.w/COLS,cH=tr.h/ROWS;

  c.clearRect(0,0,W,H);

  // Ladefläche Hintergrund
  c.fillStyle='#e0ede0';c.beginPath();c.roundRect(tr.x,tr.y,tr.w,tr.h,7);c.fill();
  c.strokeStyle='#1a7a4a';c.lineWidth=2;c.beginPath();c.roundRect(tr.x,tr.y,tr.w,tr.h,7);c.stroke();

  // Raster
  for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++){c.strokeStyle='rgba(26,122,74,0.08)';c.lineWidth=0.5;c.strokeRect(tr.x+col*cW+.5,tr.y+r*cH+.5,cW-1,cH-1);}

  // Kabine
  c.fillStyle='#1a5c38';c.fillRect(tr.x-PADX.l+3,tr.y+tr.h*.06,PADX.l-6,tr.h*.88);
  c.font='16px sans-serif';c.textAlign='center';c.fillText('🚛',tr.x-PADX.l/2+3,tr.y+tr.h/2+5);

  // Achslinien
  const fv=spa.fz;
  [fv.va,fv.ha].forEach(v=>{const ax=tr.x+v*tr.w;c.strokeStyle='rgba(0,0,0,0.15)';c.lineWidth=1;c.setLineDash([4,3]);c.beginPath();c.moveTo(ax,tr.y);c.lineTo(ax,tr.y+tr.h);c.stroke();c.setLineDash([]);c.fillStyle='#68788f';c.font='9px sans-serif';c.textAlign='center';c.fillText(v===fv.va?'VA':'HA',ax,tr.y+tr.h+14);});

  // Güter zeichnen
  spa.g.forEach(g=>{
    const p=spp[g.id];if(!p)return;
    const x=tr.x+p.col*cW,y=tr.y+p.row*cH,gw=g.cw*cW,gh=g.ch*cH;
    c.fillStyle=g.f+'cc';c.beginPath();c.roundRect(x+1,y+1,gw-2,gh-2,4);c.fill();
    c.strokeStyle=g.f;c.lineWidth=1.5;c.beginPath();c.roundRect(x+1,y+1,gw-2,gh-2,4);c.stroke();
    c.fillStyle='#fff';c.font='bold 10px sans-serif';c.textAlign='center';c.fillText(g.ic,x+gw/2,y+gh/2+3);
    c.font='8px sans-serif';c.fillStyle='rgba(255,255,255,.85)';c.fillText(g.gw+'kg',x+gw/2,y+gh/2+13);
  });

  // ── Fehler-Overlays ──
  let annotNr=1;
  const annotations=[];

  // 1. Lücken: richtig gesichert = grün, falsch/offen = rot
  detLuecken.forEach(l=>{
    const mats=lueckenMat[l.id]||[];
    const hatR=mats.some(k=>l.ok.includes(k));
    const hatF=mats.some(k=>l.falsch.includes(k));
    const ok=mats.length>0&&hatR&&!hatF;
    const cols=l.cols||(l.typ==='quer_seite'?null:[]);
    if(!cols)return;
    const x1=tr.x+Math.min(...cols)*cW,x2=tr.x+(Math.max(...cols)+1)*cW;
    c.fillStyle=ok?'rgba(26,158,110,0.25)':'rgba(192,57,43,0.3)';
    c.fillRect(x1,tr.y,x2-x1,tr.h);
    c.strokeStyle=ok?'#1a9e6e':'#c0392b';c.lineWidth=2.5;c.setLineDash([5,3]);
    c.strokeRect(x1,tr.y,x2-x1,tr.h);c.setLineDash([]);
    // Nummer-Badge
    const bx=x1+(x2-x1)/2,by=tr.y+tr.h/2;
    c.fillStyle=ok?'#1a9e6e':'#c0392b';
    c.beginPath();c.arc(bx,by,12,0,Math.PI*2);c.fill();
    c.fillStyle='#fff';c.font='bold 11px sans-serif';c.textAlign='center';
    c.fillText(annotNr,bx,by+4);
    // LaSi-Material anzeigen wenn gesetzt
    if(mats.length>0){
      const m=LASI.find(x=>x.id===mats[0]);
      if(m){c.fillStyle=ok?'#1a9e6e':'#c0392b';c.font='bold 8px sans-serif';c.fillText(m.ic+' '+m.n.slice(0,8),bx,by+20);}
    }
    annotations.push({nr:annotNr,ok,label:l.tit,detail:ok?`✓ Korrekt gesichert mit: ${mats.map(k=>LASI.find(x=>x.id===k)?.n||k).join(', ')}`:`✗ ${mats.length===0?'Keine Sicherung!':'Falsche Sicherung: '+mats.map(k=>LASI.find(x=>x.id===k)?.n||k).join(', ')}`});
    annotNr++;
  });

  // 2. Achslasten-Fehler: Pfeil + Markierung
  let sumG=0,sumM=0;
  spa.g.forEach(g=>{const p=spp[g.id];if(p){const cx=(p.col+g.cw/2)/COLS;sumG+=g.gw;sumM+=g.gw*cx;}});
  const sp_r=sumG>0?sumM/sumG:0.5;
  const haA=Math.max(0,Math.min(1,(sp_r-fv.va)/(fv.ha-fv.va)));
  const ha=sumG*haA,va=sumG-ha,fzG=sumG+8000,va_p=(va/fzG)*100;

  // Schwerpunkt markieren
  const spx=tr.x+sp_r*tr.w;
  const spOk=sp_r>=spa.sp[0]&&sp_r<=spa.sp[1];
  c.fillStyle='rgba(245,166,35,0.12)';c.fillRect(tr.x+spa.sp[0]*tr.w,tr.y,(spa.sp[1]-spa.sp[0])*tr.w,tr.h);
  c.strokeStyle='#f5a623';c.lineWidth=3;c.setLineDash([5,3]);
  c.beginPath();c.moveTo(spx,tr.y);c.lineTo(spx,tr.y+tr.h);c.stroke();c.setLineDash([]);
  c.fillStyle='#f5a623';c.font='bold 9px sans-serif';c.textAlign='center';c.fillText('SP',spx,tr.y-8);
  // SP-Badge
  c.fillStyle=spOk?'#1a9e6e':'#f5a623';
  c.beginPath();c.arc(spx,tr.y-20,11,0,Math.PI*2);c.fill();
  c.fillStyle='#fff';c.font='bold 10px sans-serif';c.fillText(annotNr,spx,tr.y-16);
  annotations.push({nr:annotNr,ok:spOk,label:'Schwerpunkt',detail:spOk?`✓ SP bei ${(sp_r*100).toFixed(0)}% – im Idealbereich`:`✗ SP bei ${(sp_r*100).toFixed(0)}% – Idealbereich: ${spa.sp[0]*100}–${spa.sp[1]*100}%`});
  annotNr++;

  // Lenkachse – Markierung an VA
  const vaOk=va_p>=20;
  const axVx=tr.x+fv.va*tr.w;
  c.fillStyle=vaOk?'#1a9e6e':'#c0392b';
  c.beginPath();c.arc(axVx,tr.y+tr.h+30,11,0,Math.PI*2);c.fill();
  c.fillStyle='#fff';c.font='bold 10px sans-serif';c.textAlign='center';c.fillText(annotNr,axVx,tr.y+tr.h+34);
  c.fillStyle=vaOk?'#1a9e6e':'#c0392b';c.font='bold 8px sans-serif';c.fillText(va_p.toFixed(0)+'%',axVx,tr.y+tr.h+46);
  annotations.push({nr:annotNr,ok:vaOk,label:'Lenkachse',detail:vaOk?`✓ Lenkachse ${va_p.toFixed(1)}% – ok`:`✗ Lenkachse ${va_p.toFixed(1)}% – mind. 20% erforderlich (§37 DGUV Vo70)`});
  annotNr++;

  // Hinterachse
  const haOk=ha<=fv.mh;
  const axHx=tr.x+fv.ha*tr.w;
  c.fillStyle=haOk?'#1a9e6e':'#c0392b';
  c.beginPath();c.arc(axHx,tr.y+tr.h+30,11,0,Math.PI*2);c.fill();
  c.fillStyle='#fff';c.font='bold 10px sans-serif';c.textAlign='center';c.fillText(annotNr,axHx,tr.y+tr.h+34);
  c.fillStyle=haOk?'#1a9e6e':'#c0392b';c.font='bold 8px sans-serif';c.fillText((ha/1000).toFixed(1)+'t',axHx,tr.y+tr.h+46);
  annotations.push({nr:annotNr,ok:haOk,label:'Hinterachse',detail:haOk?`✓ Hinterachse ${(ha/1000).toFixed(1)}t – ok`:`✗ Hinterachse ${(ha/1000).toFixed(1)}t – max ${(fv.mh/1000)}t (§34 StVZO)`});

  // ── Legende + Kriterien-Liste ──
  const leg=document.getElementById('legende');
  leg.innerHTML=`<div class="leg-item"><div class="leg-dot" style="background:#1a9e6e"></div>Korrekt</div><div class="leg-item"><div class="leg-dot" style="background:#c0392b"></div>Fehler / offen</div><div class="leg-item"><div class="leg-dot" style="background:#f5a623"></div>Schwerpunkt</div><div class="leg-item" style="font-size:10px;color:var(--muted)">① ② ... = Annotationen</div>`;

  const ckList=document.getElementById('ckList');
  ckList.innerHTML=annotations.map(a=>`
    <div class="ck-item ${a.ok?'ok':'no'}">
      <div class="ck-icon">${a.ok?'✅':'❌'}</div>
      <div class="ck-txt">
        <div class="ck-lbl">${a.nr} ${a.label}</div>
        <div class="ck-sub">${a.detail}</div>
      </div>
    </div>`).join('');

  document.getElementById('tipps3').innerHTML=spa.tipps.map(t=>`<div style="font-size:10px;color:var(--muted);margin-bottom:3px">• ${t}</div>`).join('');
}

// Stats
function updFill(){const pct=fillPct();const bar=document.getElementById('fillbar'),lbl=document.getElementById('fillpct');if(!bar||!lbl)return;bar.style.width=pct+'%';bar.style.background=pct>=80?'var(--ok)':pct>=50?'var(--warn)':'var(--no)';lbl.textContent=pct+'%';lbl.style.color=pct>=80?'var(--ok)':pct>=50?'var(--warn)':'var(--no)';}
function updStats(){if(!spa)return;const placed=Object.keys(spp).length,tot=spa.g.length;let sumG=0,sumM=0;spa.g.forEach(g=>{const p=spp[g.id];if(p){const cx=(p.col+g.cw/2)/COLS;sumG+=g.gw;sumM+=g.gw*cx;}});const sp_r=sumG>0?sumM/sumG:0.5,fv=spa.fz;const haA=Math.max(0,Math.min(1,(sp_r-fv.va)/(fv.ha-fv.va)));const ha=sumG*haA,va=sumG-ha,fzG=sumG+8000,va_p=fzG>0?(va/fzG)*100:0;const row=document.getElementById('statsrow');if(placed===0){row.innerHTML='';return;}row.innerHTML=`<div class="stat"><div class="stat-n">${placed}/${tot}</div><div class="stat-l">Platziert</div></div><div class="stat"><div class="stat-n" style="color:${sumG>fv.nl?'var(--no)':'var(--lasi)'}">${sumG.toLocaleString()}</div><div class="stat-l">kg</div></div><div class="stat"><div class="stat-n" style="color:${va_p<20?'var(--no)':'var(--ok)'}">${va_p.toFixed(0)}%</div><div class="stat-l">Lenkachse</div></div><div class="stat"><div class="stat-n" style="color:${ha>fv.mh?'var(--no)':'var(--ok)'}">${(ha/1000).toFixed(1)}t</div><div class="stat-l">Hinterachse</div></div>`;}

// Auswerten
function ausw(){
  let allOk=true;
  detLuecken.forEach(l=>{
    const mats=lueckenMat[l.id]||[];
    const hatR=mats.some(k=>l.ok.includes(k));
    const hatF=mats.some(k=>l.falsch.includes(k));
    const ok=mats.length>0&&hatR&&!hatF;
    if(!ok)allOk=false;
    const card=document.getElementById('lcard-'+l.id);
    const lcfb=document.getElementById('lcfb-'+l.id);
    const lcp=document.getElementById('lcp-'+l.id);
    if(card)card.className='luecke-card '+(ok?'ok':'nok');
    if(lcp)lcp.innerHTML=mats.length===0?'<span style="font-size:9px;color:var(--no);font-weight:700">⚠️ Keine Sicherung!</span>':mats.map(mid=>{const m=LASI.find(x=>x.id===mid);if(!m)return'';return`<div class="lc-mat-tag ${l.ok.includes(mid)?'ok-tag':'no-tag'}" onclick="rmMat('${l.id}','${mid}')">${m.ic} ${m.n} ${l.ok.includes(mid)?'✓':'✗'} ✕</div>`;}).join('');
    if(lcfb){lcfb.style.display='block';const rk=mats.find(k=>l.ok.includes(k));const fk=mats.find(k=>l.falsch.includes(k));lcfb.innerHTML=mats.length===0?'⚠️ Lücke offen!':ok?`✓ ${LASI.find(x=>x.id===rk)?.erkl||''}`:`✗ ${LASI.find(x=>x.id===fk)?.n||''} ungeeignet. ${LASI.find(x=>x.id===fk)?.erkl||''}`;lcfb.style.color=ok?'var(--ok)':'var(--no)';}
  });
  let sumG=0,sumM=0;spa.g.forEach(g=>{const p=spp[g.id];if(p){const cx=(p.col+g.cw/2)/COLS;sumG+=g.gw;sumM+=g.gw*cx;}});
  const sp_r=sumG>0?sumM/sumG:0.5,fv=spa.fz;const haA=Math.max(0,Math.min(1,(sp_r-fv.va)/(fv.ha-fv.va)));
  const ha=sumG*haA,va=sumG-ha,fzG=sumG+8000,va_p=(va/fzG)*100,pct=fillPct();
  const cks=[
    {ok:sumG<=fv.nl},{ok:va_p>=20},{ok:ha<=fv.mh},{ok:sp_r>=spa.sp[0]&&sp_r<=spa.sp[1]},{ok:allOk}
  ];
  const sc=cks.filter(c=>c.ok).length,best=sc>=4;
  showP(3);
  document.getElementById('fb3').className=`m-fb ${best?'ok':'no'} show`;
  document.getElementById('fb3').innerHTML=best?`<strong>✓ Sehr gut!</strong> ${sc}/5 Kriterien erfüllt – Lkw korrekt beladen und gesichert.`:`<strong>✗ Noch nicht optimal.</strong> ${sc}/5 Kriterien. Sieh dir die Markierungen auf dem Lkw an.`;
}
