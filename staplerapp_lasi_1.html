<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ladungssicherung VDI 2700 – Ausbildung</title>
<style>
:root{
  --navy:#16243f;--steel:#2b6cb0;--safety:#f5a623;--safety-d:#d4880f;
  --ink:#1a2330;--muted:#68788f;--line:#e3e8f0;--bg:#edf1f7;--card:#fff;
  --ok:#1a9e6e;--okbg:#e8f7f2;--no:#c0392b;--nobg:#fdecea;
  --shadow:0 4px 22px rgba(22,36,63,.10);--r:14px;
  --lasi:#e8690f;--lasi-l:#f0904a;--lasi-d:#7a3502;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}

/* LOGIN */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#1f1206,#3d2410 55%,#7a3502);padding:20px}
.lcard{background:#fff;border-radius:22px;box-shadow:0 24px 64px rgba(0,0,0,.28);
  width:100%;max-width:420px;overflow:hidden}
.lcard-top{background:linear-gradient(135deg,#7a3502,#b8500a);padding:36px 32px 28px;text-align:center}
.lcard-top .ico{width:64px;height:64px;border-radius:14px;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.lcard-top .ico svg{width:34px;height:34px;fill:#fff}
.lcard-top h1{color:#fff;font-size:19px;margin-bottom:4px}
.lcard-top p{color:rgba(255,255,255,.55);font-size:13px}
.lcard-body{padding:26px 30px 30px}
.lf{margin-bottom:16px}
.lf label{display:block;font-size:12px;font-weight:700;color:var(--navy);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.lf input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:10px;
  font-size:16px;background:#fafbfc;transition:border-color .15s}
.lf input:focus{outline:none;border-color:var(--lasi)}
.lbtn{width:100%;padding:13px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--lasi),var(--lasi-d));
  color:#fff;font-size:15px;font-weight:700}
.lbtn:hover{opacity:.9}
.lerr{color:#c0392b;font-size:13px;margin-top:9px;text-align:center;min-height:18px}
.lhint{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}

/* APP */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:linear-gradient(90deg,#7a3502,#b8500a);color:#fff;height:56px;
  display:flex;align-items:center;gap:12px;padding:0 16px;
  position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.burger{width:38px;height:38px;border:none;background:rgba(255,255,255,.1);
  border-radius:9px;color:#fff;font-size:20px;display:none;align-items:center;justify-content:center}
.topbar-logo{width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--lasi),var(--lasi-l));
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar-logo svg{width:19px;height:19px;fill:#fff}
.topbar-title{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar-who{font-size:12px;color:rgba(255,255,255,.5)}
.back-home{padding:5px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.1);color:#fff;font-size:12px;font-weight:600;
  cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.back-home:hover{background:rgba(255,255,255,.2)}
.pbar-wrap{height:3px;background:rgba(255,255,255,.1)}
.pbar{height:100%;background:var(--safety);width:0;transition:width .35s}

.layout{flex:1;display:flex;max-width:1600px;margin:0 auto;width:100%}

/* SIDEBAR */
.sidebar{width:272px;background:var(--card);border-right:1px solid var(--line);
  overflow-y:auto;padding:8px 0;position:sticky;top:59px;
  max-height:calc(100vh - 59px);flex-shrink:0}
.sidebar-item{padding:10px 14px;font-size:13px;cursor:pointer;
  display:flex;align-items:flex-start;gap:10px;border-left:3px solid transparent;transition:background .1s}
.sidebar-item:hover{background:#fdf1e7}
.sidebar-item.active{background:#fce8d5;border-left-color:var(--lasi);font-weight:600;color:#7a3502}
.snum{width:23px;height:23px;border-radius:50%;background:var(--line);color:var(--muted);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.sidebar-item.active .snum{background:var(--lasi);color:#fff}
.stxt{flex:1}.stitle{line-height:1.3}.scnt{font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.scrim{display:none}

/* STAGE */
.stage{flex:1;padding:22px 26px 60px;min-width:0}
.crumb{font-size:11px;color:var(--lasi);font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;margin-bottom:10px}

@keyframes fin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* WELCOME */
.welcome-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  text-align:center;padding:52px 28px 44px;animation:fin .28s ease}
.w-icon{width:82px;height:82px;border-radius:50%;
  background:linear-gradient(135deg,var(--lasi),#7a3502);
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.w-icon svg{width:42px;height:42px;fill:#fff}
.welcome-card h2{font-size:26px;color:var(--navy);margin-bottom:10px}
.welcome-card p{color:var(--muted);font-size:15px;max-width:500px;margin:0 auto 22px;line-height:1.6}
.w-stats{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.wstat{background:#f4f7fc;border:1px solid var(--line);border-radius:12px;padding:12px 20px}
.wn{font-size:22px;font-weight:800;color:var(--lasi)}
.wl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* CHAPTER INTRO */
.chapter-intro{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  text-align:center;padding:48px 28px 44px;animation:fin .28s ease;border-top:5px solid var(--lasi)}
.ci-num{font-size:13px;font-weight:700;color:var(--lasi);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:10px}
.chapter-intro h2{font-size:28px;color:var(--navy);margin-bottom:12px;font-weight:800}
.ci-meta{font-size:14px;color:var(--muted);margin-bottom:4px}

/* SLIDE (Folienbild) */
.slide-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;animation:fin .28s ease}
.slide-img-full{width:100%;display:block;border-radius:var(--r) var(--r) 0 0}
/* ERKLÄRUNGS-KASTEN (immer eingeblendet, unter der Folie) */
.erklaerung-box{background:var(--card);border-top:1px solid var(--line)}
.erklaerung-label{display:flex;align-items:center;gap:8px;padding:12px 20px 0;font-size:14px;
  font-weight:700;color:var(--lasi-d)}
.erklaerung-content p{margin:0;padding:10px 20px 20px;font-size:17px;line-height:1.75;color:var(--ink)}
@media(max-width:600px){
  .erklaerung-label{font-size:13px;padding:10px 14px 0}
  .erklaerung-content p{font-size:15px;padding:8px 14px 16px}
}
.slide-footer{display:flex;align-items:center;gap:8px;padding:10px 16px;
  border-top:1px solid var(--line);background:#fafbfc;flex-wrap:wrap}
.slide-nr{font-size:11px;color:var(--muted);background:var(--line);
  border-radius:5px;padding:2px 7px;flex-shrink:0}
.wa-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;
  background:#f0fdf4;border:1px solid #bbf7d0;border-radius:20px;
  color:#16a34a;font-size:11.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.wa-btn:hover{background:#dcfce7}
.wa-btn svg{width:13px;height:13px;fill:#16a34a;flex-shrink:0}
.mail-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;
  background:#e8f0fe;border:1px solid #c5d5f5;border-radius:20px;
  color:#1a56db;font-size:11.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.mail-btn:hover{background:#d2e3fc}

/* VIDEO-FOLIE */
.video-slide{display:flex;flex-direction:column}
.video-wrap{display:flex;flex-direction:column}
.video-label{background:#16243f;color:#7ec8e3;font-size:13px;font-weight:700;
  padding:10px 16px;letter-spacing:.03em;display:flex;align-items:center;
  justify-content:space-between;border-radius:var(--r) var(--r) 0 0}
.video-fs-btn{background:rgba(255,255,255,.15);border:none;border-radius:7px;
  color:#fff;font-size:12px;font-weight:600;padding:4px 10px;cursor:pointer;
  font-family:inherit;flex-shrink:0}
.video-fs-btn:hover{background:rgba(255,255,255,.28)}
.video-wrap iframe{display:block;width:100%;aspect-ratio:16/9;border:none}
.mail-btn svg{width:13px;height:13px;fill:#1a56db;flex-shrink:0}

/* QUIZ */
.quiz-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;animation:fin .28s ease}
.quiz-hd{display:flex;justify-content:space-between;align-items:center;
  padding:14px 20px;border-bottom:1px solid var(--line);background:#f4fbf7}
.quiz-kap{font-size:12px;font-weight:700;color:var(--lasi);text-transform:uppercase;letter-spacing:.5px}
.quiz-prog{font-size:13px;color:var(--muted)}
.quiz-q{font-size:17px;font-weight:600;color:var(--navy);padding:22px 20px 16px;line-height:1.45}
.quiz-opts{padding:0 20px 20px;display:grid;gap:8px}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border:2px solid var(--line);
  border-radius:11px;background:#fff;font-size:14.5px;color:var(--ink);transition:all .1s}
.opt:hover:not(:disabled){border-color:var(--lasi);background:#fdf1e7}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok)!important;background:var(--okbg)!important;color:var(--ok)!important}
.opt.wrong{border-color:var(--no)!important;background:var(--nobg)!important;color:var(--no)!important}
.quiz-fb{padding:0 20px 16px;font-size:14px;font-weight:600;min-height:24px}
.quiz-fb.ok{color:var(--ok)}.quiz-fb.no{color:var(--no)}
.quiz-result{text-align:center;padding:40px 24px}
.qr-icon{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;margin:0 auto 16px;font-size:30px;font-weight:800}
.qr-icon.ok{background:var(--okbg);color:var(--ok)}
.qr-icon.no{background:var(--nobg);color:var(--no)}
.qr-score{font-size:30px;font-weight:800;color:var(--navy);margin-bottom:8px}

/* EXAM */
.exam-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  text-align:center;padding:52px 28px 44px;animation:fin .28s ease}
.exam-icon{width:82px;height:82px;border-radius:50%;
  background:linear-gradient(135deg,var(--safety),var(--safety-d));
  display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.exam-icon svg{width:42px;height:42px;fill:#fff}

/* BUTTONS */
.btn{padding:12px 28px;border:none;border-radius:11px;
  background:linear-gradient(135deg,var(--lasi),var(--lasi-d));
  color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{opacity:.88}
.btn.safety{background:linear-gradient(135deg,var(--safety),var(--safety-d));color:#3a2800}
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:18px;gap:10px}
.navbtn{padding:11px 20px;border-radius:11px;border:2px solid var(--lasi);
  background:#fff;color:var(--lasi);font-size:14px;font-weight:700;transition:all .12s}
.navbtn:hover:not(:disabled){background:var(--lasi);color:#fff}
.navbtn.primary{background:var(--lasi);color:#fff}
.navbtn.primary:hover:not(:disabled){background:var(--lasi-d);border-color:var(--lasi-d)}
.navbtn:disabled{opacity:.35;cursor:not-allowed;border-color:var(--line);color:var(--muted)}
.pageno{font-size:13px;color:var(--muted);white-space:nowrap}

@media(max-width:820px){
  .burger{display:flex}
  .sidebar{position:fixed;top:59px;left:0;bottom:0;z-index:30;
    transform:translateX(-100%);transition:transform .25s;max-height:none;
    box-shadow:4px 0 18px rgba(0,0,0,.17)}
  .sidebar.open{transform:translateX(0)}
  .scrim.show{display:block;position:fixed;inset:59px 0 0 0;
    background:rgba(0,0,0,.36);z-index:29}
  .stage{padding:14px 14px 60px}
}

</style>
</head>

const ERKLAERUNG_DE = {
  4:'Diese Legende begleitet Sie durch die gesamte Schulung: Der lila Praxis-Tipp zeigt, worauf im Betrieb konkret zu achten ist. Der blaue Kasten mit Klemmbrett deutet an, wie eine Prüfungsfrage zu diesem Thema aussehen könnte. Grün mit dem "i" liefert interessante Zusatzinformationen, die nicht prüfungsrelevant sind. Rot mit Ausrufezeichen markiert eine echte Gefährdung oder eine Handlung, die Sie unbedingt vermeiden müssen. Und das rote Video-Symbol kennzeichnet ausgewählte YouTube-Videos zum jeweiligen Thema.',
  5:'Nach VDI 2700 Blatt 5 reicht eine einmalige Unterweisung nicht aus: Mitarbeiterinnen und Mitarbeiter, die mit Ladungssicherungsaufgaben oder deren Kontrolle betraut sind, müssen mindestens alle 3 Jahre nach dieser Richtlinie geschult werden. Dabei werden z.B. physikalische Grundlagen, Eigenschaften der Ladung und die Möglichkeiten der Ladungssicherung sowie deren praktische Durchführung vermittelt. Sicherzustellen, dass diese Schulungspflicht eingehalten wird, ist Aufgabe des "Leiters der Ladearbeit" – der die Schulung auch selbst durchführen darf.',
  6:'Vier gute Gründe für sorgfältige Ladungssicherung: Erstens Sicherheit für alle – mangelhafte Sicherung gefährdet vor allem unbeteiligte Dritte im Straßenverkehr. Zweitens die Vermeidung von Kapital- und Imageschäden – Unfälle kosten Geld, verzögern Lieferungen und schaden dem Ruf des Unternehmens. Drittens die Vermeidung rechtlicher Konsequenzen – vorschriftsmäßige Ladungssicherung ist gesetzlich gefordert, bei Nichtbeachtung drohen rechtliche Folgen. Und viertens Ihre eigene Verantwortung: Auch wenn die Ladung durch Dritte vorbereitet und gesichert wird, ändert das nichts an Ihrer eigenen Verantwortung als Fahrer.',
  10:'Dieser reale Fall zeigt, wie schnell aus verlorener Ladung ein Großschaden wird: Ein Lkw-Fahrer verlor auf der Autobahn bei Hagen rund 800 Getränkekisten, die über Stunden die Auffahrt blockierten. Verletzt wurde bei diesem Unfall zufällig niemand – das ist aber reines Glück, kein Verdienst der Ladungssicherung.',
  11:'Auch bei besonders schweren Lasten versagt Ladungssicherung: Ein Sattelauflieger geriet in Schräglage, zwei jeweils neun Tonnen schwere Betonteile durchbrachen die Seitenwand. Ein Teil beschädigte die Fahrbahn auf 15 Metern Länge, der Gesamtschaden lag bei mindestens 50.000 Euro – zur Bergung musste ein Schwerlastkran anrücken. Das zeigt: Auch scheinbar "unbewegliche" Lasten brauchen fachgerechte Sicherung.',
  12:'Auch dieser Fall – ein acht Tonnen schweres Bauteil musste nach dem Ladungsverlust mit einem Kran auf einen Ersatz-Lkw gehoben werden – macht deutlich, welchen Aufwand und welche Kosten ein einziger Ladungssicherungsmangel nach sich ziehen kann, ganz unabhängig davon, ob dabei Personen verletzt werden.',
  13:'Sechs weit verbreitete Irrtümer, die immer wieder zu Unfällen führen: "Schwere Ladung sichert sich selbst" – falsch, sie rutscht und kippt trotzdem. "Die Fahrt geht nur um die Ecke" – die Gefährdung besteht auf jeder Strecke, zu jeder Zeit. "Stirn- und Bodenwände reichen aus" – eine rutschende Ladung kann diese leicht zerstören. "Vorausschauendes Fahren reicht" – niemand kann spielende Kinder oder Gefahren hinter einer Kurve vorhersehen. "Mir ist noch nie was passiert" – fast täglich liegt verlorene Ladung auf der Fahrbahn, unangekündigt. Und "jeder Gurt hält zwei Tonnen" – ein in eine Curtainsider-Plane verarbeitetes Gurtsystem hält durch die Vernietung oft nur noch bis zu 400 kg.',
  14:'Ladungssicherung dient nicht nur dem Selbstschutz: Sie schützt Fahrer und Beifahrer, andere Verkehrsteilnehmer, das Fahrzeug selbst, die Ladung vor Beschädigung, die Infrastruktur (Straßen, Leitplanken) vor Beschädigung, hilft Staus durch verlorene Ladung zu vermeiden, schützt vor rechtlichen Konsequenzen und Rechtsstreitigkeiten, vermeidet Imageschäden für das Unternehmen – und sichert damit letztlich auch Arbeitsplätze.',
  15:'Mögliche Gefährdungen bei mangelhafter Ladungssicherung reichen weit über das reine Verrutschen hinaus: Ladung kann verrutschen, umfallen, hin- und herrollen oder als Geschoss umherfliegen; sie kann beim Be- und Entladen herabfallen, herausfallen oder kippen, es drohen Absturz von der Ladefläche, verlorene Ladung auf der Fahrbahn, Überladung des Fahrzeugs, ungleichmäßige Lastverteilung, ungeeignete Transportbehälter, Zurrgurte über scharfen Kanten, beschädigte Behälter mit auslaufendem Transportgut sowie psychische Belastung der Fahrer und körperliche Belastung für Be- und Entlader.',
  16:'Die Folgen unzureichender Ladungssicherung reichen von Verletzungen bei Fahrer, Beifahrer oder anderen Verkehrsteilnehmern über bleibende Körperschäden bis hin zum Tod, Beschädigung oder Verlust der Ladung selbst, Lieferverzug mit Kosten und Kundenverlust sowie Imageschaden für das Unternehmen, bis hin zu konkreten Forderungen wie Bußgeldern und Schadenersatz.',
  19:'Im Arbeits- und Gesundheitsschutz gibt es eine Rangfolge von EU-Recht über das Grundgesetz bis zu einzelnen Gesetzen wie dem Arbeitsschutzgesetz (ArbSchG). Dieses richtet sich sowohl an den Arbeitgeber/Unternehmer als auch an die Beschäftigten: Abschnitt 2 (§3 Grundpflichten des Arbeitgebers, §4 Allgemeine Grundsätze, §12 Unterweisung der Mitarbeiter) regelt die Pflichten des Arbeitgebers, Abschnitt 3 (§15 Pflichten der Beschäftigten, §16 besondere Unterstützungspflichten) die Pflichten und Rechte der Beschäftigten selbst.',
  20:'Die DGUV Vorschrift 1 "Grundsätze der Prävention" konkretisiert die Unterweisungspflicht: Nach §4 hat der Unternehmer die Versicherten über Sicherheit und Gesundheitsschutz bei der Arbeit zu unterweisen, insbesondere über die mit ihrer Arbeit verbundenen Gefährdungen und Maßnahmen zu deren Verhütung. Die Unterweisung muss bei Bedarf wiederholt werden, mindestens aber einmal jährlich erfolgen, und sie muss dokumentiert werden. Zudem müssen die relevanten Inhalte der geltenden Vorschriften und Regeln in verständlicher Weise vermittelt werden.',
  21:'Warum gilt bei der Ladungssicherung anderes Recht als im normalen Arbeitsschutz? Weil der Verladeprozess meist innerbetrieblich abläuft – dort greift das Arbeitsschutzrecht –, der eigentliche Transport aber im öffentlichen Straßenverkehr stattfindet. Sobald das Fahrzeug den Betrieb verlässt, gilt zusätzlich das Straßenverkehrsrecht.',
  22:'Weil der Transport im öffentlichen Straßenverkehr stattfindet, ändern sich auch die Begrifflichkeiten der beteiligten Personen: Aus dem Arbeitgeber/Unternehmer wird rechtlich der Halter/Verlader, aus dem Mitarbeiter/Beschäftigten wird der Fahrer. Diese Doppelrolle ist wichtig, weil für beide Rollen unterschiedliche Vorschriften gelten.',
  23:'Mit der Rolle ändert sich auch die einschlägige Rechtsgrundlage: Für Arbeitgeber/Unternehmer und Mitarbeiter/Beschäftigte gelten das Handelsgesetzbuch (HGB) sowie die arbeitsschutzrechtlichen Gesetze und Verordnungen. Für Halter/Verlader und Fahrer im öffentlichen Straßenverkehr gelten dagegen die Straßenverkehrs-Ordnung (StVO) und die Straßenverkehrs-Zulassungs-Ordnung (StVZO) – die für die Ladungssicherung zentralen Vorschriften.',
  24:'§22 Abs. 1 StVO ist die wichtigste rechtliche Grundlage der Ladungssicherung: Ladung einschließlich Geräten zur Ladungssicherung und Ladeeinrichtungen sind so zu verstauen und zu sichern, dass sie selbst bei Vollbremsung oder plötzlicher Ausweichbewegung nicht verrutschen, umfallen, hin- und herrollen, herabfallen oder vermeidbaren Lärm erzeugen können. Dabei sind die anerkannten Regeln der Technik zu beachten – das ist die rechtliche Grundlage, auf der auch die VDI 2700 aufbaut.',
  25:'§23 StVO legt fest, wer für die vorschriftsmäßige Ladungssicherung verantwortlich ist: der Fahrzeugführer. Wer ein Fahrzeug führt, ist dafür verantwortlich, dass seine Sicht nicht durch die Ladung beeinträchtigt wird, dass Fahrzeug, Zug bzw. Gespann und Ladung vorschriftsmäßig sind, und dass die Verkehrssicherheit des Fahrzeugs durch die Ladung nicht leidet. Diese Verantwortung trägt der Fahrer unabhängig davon, wer die Ladung ursprünglich verstaut hat.',
  26:'Auch der Unternehmer bzw. Fahrzeughalter trägt Verantwortung, geregelt in §§30 und 31 StVZO – auch wenn er diese meist an einen Verlader oder Leiter der Ladearbeiten delegiert. §30 Abs. 1 StVZO verlangt, dass Fahrzeuge so gebaut und ausgerüstet sind, dass ihr Betrieb niemanden gefährdet und Insassen bei Unfällen möglichst geschützt sind. §31 Abs. 2 StVZO verbietet dem Halter ausdrücklich, die Inbetriebnahme anzuordnen oder zuzulassen, wenn ihm bekannt ist oder bekannt sein muss, dass die Ladung nicht vorschriftsmäßig ist oder die Verkehrssicherheit darunter leidet.',
  28:'Auf Basis dieser Urteile gilt die Richtlinie VDI 2700 als der gegenwärtig technisch anerkannte Stand der Beladungsregeln – sie wird als "objektiviertes Sachverständigengutachten" bezeichnet, das allgemein zu beachten ist. Das bedeutet: Verlader und Fahrer haben die Ladungssicherung auf Basis der VDI 2700 durchzuführen, während der Halter das Fahrzeug so ausreichend mit Ladungssicherungsmitteln ausrüsten muss, dass das überhaupt möglich ist.',
  29:'Der Unternehmer muss betriebliche Strukturen schaffen, anhand derer die Verantwortung für die ordnungsgemäße Ladungssicherung lückenlos gewährleistet und nachvollziehbar ist. Konkret bedeutet das: "ordnungsgemäß" heißt Ladungssicherung nach dem Stand der Technik, "lückenlos" heißt Fahrzeugkontrollen ohne Ausnahmen, und "nachvollziehbar" heißt Verladungskontrolle mit Dokumentation – also schriftlich nachweisbar.',
  30:'Die VDI 2700 fordert ein Qualitätsmanagement mit klarer Organisationsstruktur: Der Unternehmer beauftragt den "Leiter der Ladearbeiten" mit der Umsetzung und überträgt ihm dafür die entsprechenden Unternehmerpflichten. Dieser trägt als Verlader die Verantwortung für den Verladebereich und die Ladungssicherung und legt gemeinsam mit dem Unternehmer Strukturen und Abläufe fest. Das Ladepersonal (z.B. Staplerfahrer, Hubwagenfahrer, Kranführer) trägt die Verantwortung für die eigentliche Beladung, muss sich dabei an die Verladeanweisung halten und Mängel oder Störungen sofort dem Leiter der Ladearbeiten melden.',
  31:'Der "Leiter der Ladearbeiten" hat sechs zentrale Aufgaben: die Organisation der dokumentierten Fahrzeugkontrollen vor dem Beladen, die Organisation der Ausfahrtkontrollen, dem Ladepersonal Anweisungen zum Arbeitsablauf erteilen, das Ladepersonal kontrollieren, dem Unternehmer Rückmeldung geben (z.B. über Jahresberichte), und eine Verladeanweisung mit den konkreten Sicherungsmaßnahmen für die jeweilige Ladung erstellen.',
  32:'Das Ladepersonal hat vor und während der Beladung eine ganze Reihe von Pflichten: Fahrzeugkontrollen auf augenscheinliche Mängel vor dem Beladen, Verwendung geeigneter Ladungssicherungssysteme (z.B. Ladebordwände, Zurrgurte, Ankerstangen, Antirutschmatten), Kontrolle der Sicherung vor Fahrtantritt sowie nach kurzer Fahrt oder extremen Fahrmanövern, Wahl des passenden Fahrzeugs, Beachtung von Lastverteilungsplan und zulässigem Gesamtgewicht, Reinigung und Kontrolle der Ladefläche, verkehrssicheres Zusammenstellen der Ladeeinheiten, regelmäßige Kontrolle der Sicherungsmaßnahmen, Tragen von PSA (z.B. Sicherheitsschuhe), und eine letzte Kontrolle vor Verlassen des Betriebsgeländes. Machen Sie sich unbedingt mit der Verladeanweisung Ihres eigenen Unternehmens vertraut!',
  33:'Die DGUV Vorschrift 70 "Fahrzeuge" ist die einschlägige Unfallverhütungsvorschrift für Fahrzeuge im Betrieb: Jeder Unternehmer muss Maßnahmen zur Unfallverhütung treffen, und die Fahrzeuge des Betriebes müssen den gültigen Unfallverhütungsvorschriften entsprechen.',
  34:'Der DGUV Grundsatz 314-002 "Kontrolle von Fahrzeugen durch Fahrpersonal" stellt klar: Der Lkw ist für das Unternehmen ein Arbeitsmittel nach der Betriebssicherheitsverordnung. Deshalb muss – wie bei jedem anderen Arbeitsmittel auch – vom "Bediener", also dem Fahrer, vor jedem ersten Einsatz eine Sicht- und Funktionsprüfung durchgeführt werden.',
  35:'Die DGHM Information 108 "Be- und Entladen von Fahrzeugen" ergänzt die technischen Anforderungen speziell für den Be- und Entladevorgang – auch hier gilt: Der Lkw als Arbeitsmittel muss vor dem Einsatz kontrolliert werden, und die konkreten Anforderungen an Zurrmittel, Anschlagpunkte und Vorgehensweise beim Be-/Entladen sind in dieser Information zusammengefasst.',
  36:'Dieses Beispiel aus einem Land ohne vergleichbare Vorschriften zeigt drastisch, was ohne verbindliche Ladungssicherungsregeln passiert: hoffnungslos überladene und ungesicherte Fahrzeuge im Straßenverkehr. Es macht deutlich, warum die in Deutschland geltenden rechtlichen Anforderungen an die Ladungssicherung so wichtig sind – sie schützen vor genau solchen Zuständen.',
  37:'Für die Frage, ob und in welchem Umfang jemand haftet, ist entscheidend, welcher Grad von Verschulden vorliegt – die Stufen reichen von niedrig nach hoch: Unbewusste/leichte Fahrlässigkeit ("er hätte das anders machen müssen"), bewusste/grobe Fahrlässigkeit ("er hatte gehofft, es klappt", "das war offensichtlich"), bedingter Vorsatz ("er hatte es gewusst, war ausreichend qualifiziert"), bis hin zum direkten Vorsatz (bewusstes Wissen und Wollen einer strafbaren Handlung). Je höher der Verschuldensgrad, desto schwerwiegender die möglichen Haftungsansprüche.',
  38:'Das Strafrecht schützt zentrale Rechtsgüter wie Leben, Gesundheit, Freiheit und Eigentum – bei Verstößen drohen Geld- oder Freiheitsstrafen. Im Zusammenhang mit Arbeitsunfällen sind vor allem Körperverletzung und Tötung relevant. Wichtig: Für eine strafrechtliche Verfolgung reicht bereits fahrlässiges Handeln oder Unterlassen – man handelt schon dann fahrlässig, wenn man die Sorgfalt außer Acht lässt, zu der man nach den eigenen Kenntnissen und Fähigkeiten imstande gewesen wäre. Fahrlässige Körperverletzung nach §229 StGB kann mit Freiheitsstrafe bis zu 3 bzw. 5 Jahren oder Geldstrafe geahndet werden.',
  39:'Werden die Vorschriften zur Ladungssicherung nicht eingehalten, drohen Fahrer, Verlader und Fahrzeughalter unterschiedliche Konsequenzen: Bei einer routinemäßigen Verkehrskontrolle drohen Untersagung der Weiterfahrt bis zur ordnungsgemäßen Sicherung sowie eine Ordnungswidrigkeitenanzeige mit Bußgeld und Punkten in Flensburg. Kommt es zum Unfall, drohen bei reinem Sachschaden ebenfalls Bußgeld und Punkte, bei Personenschäden dagegen eine Strafanzeige mit Geld- oder Freiheitsstrafe. Zusätzlich drohen Haftungsansprüche: bei Fremdschäden nach §823 BGB, bei Eigenschäden ggf. gekürzt durch §254 BGB (Mitverschulden), und bei Schäden an der Ladung selbst nach dem HGB.',
  42:'Diese Tabelle zeigt, wie unterschiedlich hoch die Konsequenzen je nach Rechtsbereich und Verschuldensgrad ausfallen können: Im Arbeitsschutzrecht drohen bei fahrlässigem oder vorsätzlichem Verstoß Geldbußen von bis zu 25.000 € (ArbSchG/BetrSichV), bis zu 100.000 € (ProdSG), bis zu 10.000 € (SGB VII) oder sogar bis zu 1 Million € (OWiG). Im Strafrecht drohen bei Vorsatz oder wiederholter Fahrlässigkeit Geld- oder Freiheitsstrafen von bis zu 1 Jahr, bis zu 3 Jahren (§230 StGB, Körperverletzung) oder bis zu 10 Jahren (§222 StGB, Tötung). Im Zivilrecht ist nach §823 BGB der Sachschaden vollständig zu ersetzen.',
  43:'Diese offizielle Bußgeldtabelle zeigt konkrete Beträge für typische Ladungssicherungsmängel: vermeidbaren Lärm nicht verhindert (10 €), Ladung ragt unzulässig über das Fahrzeug hinaus (20–25 €, je nach Richtung und Kennzeichnung), Ladung nicht ausreichend gegen Herabfallen gesichert (35 €), mit Gefährdung anderer (60 € + 1 Punkt), mit Sachbeschädigung (75 € + 1 Punkt), sowie ein zu hohes Fahrzeug mit Ladung über 4,20 m (60 € + 1 Punkt). Diese Beträge zeigen, wie schnell aus einem kleinen Sicherungsmangel ein Punkt in Flensburg wird.',
  44:'Auch der Kranführer braucht je nach Einsatz und Gefährdung passende persönliche Schutzausrüstung: einen Schutzhelm wegen der Anstoßgefahr, z.B. an Kranhaken oder beim Gang durch Lagerregale; Gehörschutz in als Lärmbereich gekennzeichneten Zonen (vom Unternehmer bereitzustellen); Handschutz, da beim Umgang mit Anschlagmitteln immer wieder Handverletzungen durch abstehende Drähte oder scharfkantige Lasten entstehen; Warnweste in Verkehrsbereichen (meist Pflicht) sowie ggf. Wetterschutzkleidung; und Sicherheitsschuhe gegen herabfallende Gegenstände oder scharfe Kanten – diese sind immer zu tragen.',
  45:'Diese Frage leitet zum nächsten wichtigen Thema über: Wann ist ein Bediener eines Arbeitsmittels – also z.B. ein Fahrer oder Kranführer – nicht mehr in der Lage, dieses sicher zu bedienen? Eine der häufigsten Ursachen dafür sind Alkohol, Drogen und bestimmte Medikamente, die im Folgenden genauer betrachtet werden.',
  47:'Der männliche Körper baut durchschnittlich nur etwa 0,1 bis 0,15 Promille pro Stunde ab. Das Beispiel zeigt: Wer um 9 Uhr morgens noch 0,6 Promille im Blut hat (z.B. von einem Vorabend), kann bei entsprechendem Konsum bis 24 Uhr wieder auf 1,5 Promille kommen – der Abbau ist also deutlich langsamer, als viele glauben, und "einfach eine Nacht drüber schlafen" reicht oft nicht aus, um wieder nüchtern zu sein.',
  48:'Wie viel Alkohol führt zu 0,5 Promille? Das hängt von Körpergewicht und Geschlecht ab: Eine 70 kg schwere Frau erreicht diesen Wert bereits nach rund 21 Gramm Alkohol – das entspricht etwa einem 0,5-Liter-Bier (ca. 20 g) oder einem 0,2-Liter-Glas Wein (ca. 19 g). Je leichter die Person, desto weniger Alkohol reicht für denselben Promillewert – Frauen erreichen die 0,5-Promille-Grenze bei gleichem Körpergewicht mit weniger Alkohol als Männer.',
  49:'Auch beim Alkoholabbau selbst gibt es einen Unterschied zwischen Mann und Frau: Frauen bauen durchschnittlich nur etwa 0,1 Promille pro Stunde ab, Männer dagegen 0,1 bis maximal 0,2 Promille pro Stunde. Im Beispiel dauert der Abbau eines Standardglases (z.B. 0,25 l Bier) bei einer 55 kg schweren Frau rund 3 Stunden, bei einem 80 kg schweren Mann dagegen nur 1 bis 2 Stunden.',
  50:'Schon geringe Mengen Alkohol beeinträchtigen Leistung und Sicherheit spürbar: Bei 0,3 ‰ sinken Aufmerksamkeit, Konzentrationsfähigkeit und Widerstand gegen Ermüdung. Bei 0,5 ‰ verlangsamt sich die Reaktionsfähigkeit. Bei 0,8 ‰ sind Gleichgewichtssinn, klares Denken und selbstkritisches Handeln deutlich beeinträchtigt, die Reaktionsfähigkeit ist stark verlangsamt. Insgesamt werden 15–30 % aller Arbeitsunfälle durch Alkoholgenuss verursacht oder beeinflusst. Wichtig: Bei Volltrunkenheit besteht kein gesetzlicher Unfallversicherungsschutz mehr, wenn Beschäftigte dadurch ihre Arbeitsaufgaben nicht mehr erfüllen können.',
  51:'Ist bei einem Mitarbeiter Alkohol- oder Drogenkonsum erkennbar, sind Sofortmaßnahmen nötig: Zugang zum Werkgelände bzw. Arbeitsbereich verweigern, Weiterarbeit untersagen bzw. den Mitarbeiter aus dem Bereich verweisen, je nach Rauschzustand einen beaufsichtigten Ort zum Ausnüchtern bereitstellen, und für einen gesicherten Nachhauseweg bis zur Wohnungstür sorgen. Bei wiederholtem Konsum folgen weitere Schritte: Information des Betriebsrats bzw. der Arbeitnehmervertretung sowie die Empfehlung, den Betriebsarzt oder eine Suchthilfe aufzusuchen. Grundsatz dabei: Hilfe sollte immer vor Strafe stehen.',
  55:'In diesem Kapitel geht es um zwei physikalische Grundlagen, mit denen sich fast alles zur Ladungssicherung erklären lässt: das Hebelgesetz von Archimedes und die Schwerkraft, die Newton (der Legende nach durch einen fallenden Apfel) erforschte.',
  56:'Der Hebel ist eines der ältesten Hilfsmittel der Menschheit – schon lange bevor Archimedes (287–212 v. Chr.) um 250 v. Chr. das Hebelgesetz mathematisch formulierte, wusste man: Ein großer Stein lässt sich leichter anheben, wenn man einen Ast als Hebel darunterschiebt. Sein berühmtes Zitat "Gebt mir einen Hebel, der lang genug, und einen Angelpunkt, der stark genug ist, dann kann ich die Welt mit einer Hand bewegen" bringt das Prinzip auf den Punkt: Mit einem ausreichend langen Hebelarm lässt sich auch eine sehr große Kraft mit wenig Aufwand überwinden.',
  57:'Newton und die Schwerkraft (Gravitation) sind untrennbar miteinander verbunden – ob ihm die Idee tatsächlich durch einen herunterfallenden Apfel kam, ist zwar unwahrscheinlich, aber eine schöne Anekdote. Für die Ladungssicherung wichtig ist die Gewichtskraft (F bzw. G), die durch die Wirkung der Schwerkraft entsteht und in der Einheit Newton (N) gemessen wird – sie ist die Basis für alle weiteren Kraftberechnungen in diesem Kapitel.',
  58:'Die Schwerkraft ist eine unsichtbare, aber allgegenwärtige Kraft – sie sorgt dafür, dass der Mond nicht wegfliegt, und genauso dafür, dass ein mobiles Arbeitsmittel wie ein Kran sicher steht. Das gilt aber nur so lange, wie die durch den Hebel wirkende Last diese Gewichtskraft nicht "aushebelt", also das kippende Moment nicht größer wird als das haltende Moment.',
  59:'Bei einer klassischen Wippe muss die schwerere Person näher am Drehpunkt sitzen und die leichtere Person weiter außen, damit sich die Kräfte ausgleichen – in diesem Bild ist genau das vertauscht: Die schwere Person sitzt weit außen, die leichte Person nah am Drehpunkt. So kann die Wippe nicht im Gleichgewicht sein.',
  60:'So sieht die korrekte Anordnung aus: Die schwerere Person sitzt nah am Drehpunkt (kurzer Hebelarm), die leichtere Person sitzt weiter außen (langer Hebelarm) – nur so gleichen sich die beiden Momente (Kraft × Hebelarm) aus und die Wippe bleibt im Gleichgewicht.',
  61:'Genau dieses Prinzip nutzt auch der Gabelstapler für seine Standsicherheit: ein großes (Gegen-)Gewicht nah am Fahrzeug, aber mit langem Hebelarm zur Kippkante, steht einer möglichst nah am Gabelrücken aufgenommenen Last mit kurzem Hebelarm gegenüber. Das Staplermoment (Staplerarm × Staplergewicht) muss dabei immer größer sein als das Lastmoment bzw. Kippmoment (Lastarm × Lastgewicht) – sonst kippt der Stapler über die Kippkante nach vorne.',
  62:'Auch der Bagger nutzt dasselbe Hebelprinzip für seine Standsicherheit: Das Eigengewicht des Baggers mit kurzem Hebelarm zur Kippkante muss dem Moment aus Auslegerarm und angehobener Last (bzw. Anbaugerät) mit oft deutlich längerem Hebelarm standhalten.',
  64:'Auch beim Lkw spielt dieses Prinzip eine Rolle, obwohl er im stehenden Zustand nicht wie eine Wippe kippt: Eine ungünstige Lastverteilung – z.B. wenn die Last ausschließlich auf der Hinterachse liegt – entlastet die Vorderachse so stark, dass sich dies negativ auf die Fahreigenschaften auswirkt. Die richtige Lastverteilung ist deshalb für die Ladungssicherung von entscheidender Bedeutung.',
  65:'Vier Kräfte bestimmen, ob eine Ladung sicher liegen bleibt: Die Gewichtskraft zieht die Masse lotrecht zum Erdmittelpunkt (Einheit Newton). Die Massenkraft (auch Trägheitskraft) will die Ladung in ihrer augenblicklichen Position bzw. Bewegung halten und wirkt Beschleunigung, Bremsen und Richtungsänderungen entgegen. Die Reibungskraft unterstützt die Ladungssicherung, weil sie einem Verrutschen entgegenwirkt. Und die Sicherungskraft ist genau jene Kraft, die durch die Ladungssicherungsmaßnahmen selbst aufgebracht werden muss, um die restlichen Kräfte auszugleichen.',
  66:'Die Masse eines Körpers – umgangssprachlich sein "Gewicht" – berechnet sich als Volumen mal spezifisches Gewicht des Materials. Die Tabelle zeigt, wie stark sich das spezifische Gewicht je nach Baustoff unterscheidet: Granit wiegt mit 2,8 t/m³ fast doppelt so viel wie Lochziegel mit 1,5 t/m³ bei gleichem Volumen. Das ist wichtig, weil Sie die Masse einer Ladung oft nur über ihr Volumen und Material abschätzen können, wenn keine Gewichtsangabe vorliegt.',
  67:'Die Gewichtskraft ist das Produkt aus Masse und Erdbeschleunigung (Gravitation g). Die Erdbeschleunigung beschreibt, wie schnell ein Gegenstand zur Erde fällt bzw. wie stark eine Last auf einen Untergrund drückt – sie beträgt 9,81 m/s², was 9,81 Newton entspricht. Damit wird das Gewicht in eine Kraft übersetzt: 1 kg Masse erzeugt eine Gewichtskraft von 9,81 N, zur Vereinfachung meist auf 10 N (bzw. 1 daN) aufgerundet.',
  68:'Die Gewichtskraft allein hält eine Kiste nicht automatisch fest – die entscheidende Frage ist: Unter welchen Bedingungen kommt sie trotzdem ins Rutschen? Die Antwort darauf finden Sie auf der nächsten Folie – so viel vorab: Es sind vier ganz alltägliche Fahrsituationen.',
  69:'Eine Ladung kann in vier typischen Situationen ins Rutschen kommen: beim normalen und vor allem beim unvorhergesehenen Abbremsen (je stärker die Bremsung, desto größer die Kraft nach vorne), in Kurven, im Kreisverkehr oder bei Ausweichmanövern (wenn die Haftreibung nicht ausreicht), durch Vibration bei Unebenheiten der Straße (schon im normalen Fahrbetrieb), und beim erneuten Beschleunigen, wodurch die Ladung zum Fahrzeugheck rutschen kann.',
  70:'Die Massenkraft – auch Trägheitskraft, Fliehkraft oder Beschleunigungskraft genannt – ist die Kraft, die einer Änderung des Bewegungszustands entgegenwirkt. Sie entsteht immer dann, wenn Massen beschleunigt, abgebremst werden oder die Richtung geändert wird, und will dabei die ursprüngliche Bewegung beibehalten. Die Formel lautet: Massenkraft (FM) = Masse (m) × Beschleunigung (a). Wichtig: Die VDI 2700 legt fest, welche Massenkräfte im normalen Fahrbetrieb maximal auftreten – das ist die Grundlage aller weiteren Berechnungen zur Ladungssicherung.',
  71:'Beim Abbremsen wirkt die Massenkraft in Fahrtrichtung, versucht die Ladung also nach vorne zur Stirnwand bzw. Fahrerkabine zu schieben. Bei einer Vollbremsung legt die VDI 2700 diese Massenkraft auf 0,8 der Gewichtskraft fest – das bedeutet: Die Sicherung nach vorne muss 80 % des Ladungsgewichts standhalten können.',
  72:'Dieses Unfallfoto zeigt drastisch, was passiert, wenn Ladung – hier ein transportiertes Fahrzeug – dieser nach vorne wirkenden Massenkraft nicht standhält: Bei ungenügender Sicherung nach vorne rutscht bzw. kippt die Last regelrecht über das Zugfahrzeug hinaus. Genau diese Kraft von 0,8 der Gewichtskraft muss die Ladungssicherung nach vorne aufnehmen können.',
  74:'Achtung: Die Fliehkraft wächst nicht proportional zur Geschwindigkeit, sondern quadratisch – verdoppelt sich die Geschwindigkeit in der Kurve, vervierfacht sich die Fliehkraft. Umgekehrt gilt: Ein halber Kurvenradius bedeutet doppelte Fliehkraft. Schon kleine Geschwindigkeits- oder Radiusänderungen wirken sich also überproportional stark aus.',
  75:'Besondere Vorsicht vor erhöhten Fliehkräften ist geboten bei: engen Ausweichmanövern, raschen Spurwechseln, in Kreiseln und bei Autobahnausfahrten – überall dort, wo enge Kurvenradien mit oft noch zu hoher Geschwindigkeit zusammentreffen.',
  76:'Dieses reale Foto zeigt, was passiert, wenn die seitliche Sicherung nicht für die tatsächlich auftretenden Fliehkräfte ausgelegt war: Die komplette Ladung im Laderaum hat sich durch eine Kurvenfahrt verschoben und ist teilweise umgekippt – mit entsprechender Beschädigungs- und Unfallgefahr.',
  77:'Beim Beschleunigen des Fahrzeugs ändert die Last ihren Bewegungszustand von Ruhe zu Bewegung – die dabei entstehenden Kräfte sind entgegen der Fahrtrichtung gerichtet und versuchen, die Ladung von der Ladefläche nach hinten "herunterzuschieben". Die VDI 2700 legt diese Massenkraft beim Beschleunigen auf 0,5 der Gewichtskraft fest – die Sicherung nach hinten muss also 50 % des Ladungsgewichts standhalten können.',
  78:'Diese Übersicht fasst die drei maximal auftretenden Massenkräfte im normalen Fahrbetrieb nach VDI 2700 zusammen – merken Sie sich diese drei Werte, sie sind die Grundlage jeder Ladungssicherungsberechnung: 0,8 der Gewichtskraft nach vorne (Bremskraft), 0,5 der Gewichtskraft zur Seite (Fliehkraft), und 0,5 der Gewichtskraft nach hinten (Beschleunigungskraft).',
  79:'Damit lässt sich beantworten, was Ladungssicherung eigentlich bedeutet: Sie hat das Ziel, genau diese maximal auftretenden Massenkräfte – 0,8 nach vorne, je 0,5 zur Seite und nach hinten – durch geeignete Sicherungsmaßnahmen aufzunehmen, sodass die Ladung auch im Grenzfall (Vollbremsung, starke Kurvenfahrt, starkes Beschleunigen) nicht in Bewegung gerät.',
  80:'Ein konkretes Rechenbeispiel macht es greifbar: Beträgt die Gewichtskraft der Ladung 1000 kg, müssen nach vorne 800 kg gesichert werden (1000 × 0,8). Anders ausgedrückt: Der nach vorne wirkenden Bremskraft muss eine mindestens gleich große Sicherungskraft entgegengesetzt werden – nur dann bleibt die Ladung bei einer Vollbremsung an Ort und Stelle.',
  81:'Es gibt aber noch eine weitere Kraft, die bei der Ladungssicherung eine große Rolle spielt: die Reibungskraft (Haftreibung) zwischen Ladung und Ladefläche. Am Beispiel: Bei 1000 daN Gewichtskraft und einer Bremskraft von 0,8 FG (also 800 daN) würde man ohne Berücksichtigung der Reibung eine Sicherungskraft von ebenfalls 800 daN benötigen. Doch wie verändert die Reibung diesen Wert?',
  82:'Die Antwort: Ein Teil der nötigen Sicherungskraft wird bereits durch die Reibungskraft (Haftreibung) zwischen Ladung und Ladefläche automatisch abgesichert. Das bedeutet: Je höher die Reibung zwischen Ladung und Ladefläche, desto geringer die Sicherungskraft, die durch Zurrmittel & Co. zusätzlich aufgebracht werden muss – die Reibung "arbeitet" quasi kostenlos mit.',
  84:'Die Reibungskraft ist der wichtigste passive Helfer der Ladungssicherung. Sie hängt von den Oberflächenstrukturen von Ladung und Ladefläche ab: Egal wie glatt sich eine Oberfläche anfühlt, findet immer eine "Mikroverzahnung" zwischen den Kontaktflächen statt, die umso stärker wirkt, je rauer die Oberflächen sind. Die Bezugsgröße dafür ist der Gleit-Reibbeiwert μ (sprich "mü").',
  85:'Wichtig zu verstehen: Die wirksame Reibungskraft wird allein durch die Struktur und den Zustand der sich berührenden Materialien beeinflusst – sie ist unabhängig vom Gewicht der Ladung und unabhängig von der Größe der Auflagefläche. Eine kleine raue Kontaktfläche kann also relativ zur Last genauso viel Reibung erzeugen wie eine große.',
  86:'Die Formel lautet: Reibungskraft (FR) = Gleitreibbeiwert (μ) × Gewichtskraft (FG). Die Reibungskraft wirkt einer Ladungsverschiebung (Zugkraft) entgegen und unterstützt dadurch die Ladungssicherungsmaßnahmen – aufgrund der Mikroverzahnung wird die Ladung bis zu einem bestimmten Grad in ihrer ursprünglichen Position fixiert. Je rauer die Oberfläche, desto stärker kann die Reibungskraft wirken.',
  87:'Es gibt zwei Arten von Reibung: Haftreibung ist die Widerstandskraft, die ein ruhender Körper dem Verschieben auf seiner Unterlage entgegensetzt; Gleitreibung ist die Widerstandskraft, die ein bereits bewegter Körper dem weiteren Verschieben entgegensetzt. Da die Haftreibung immer größer ist als die Gleitreibung, wird aus Sicherheitsgründen bei der Ladungssicherung immer mit dem niedrigeren Gleitreibwert gerechnet. Dieser hängt von der Materialpaarung und den Umgebungsbedingungen ab – z.B. Holz auf Holz trocken: 0,2–0,5, nass: 0,2–0,25, fettig nur noch 0,05–0,15. Auch Beton auf Holz (0,3–0,6 trocken), Metall auf Holz und Metall auf Metall haben jeweils eigene Werte, die bei Nässe oder Verschmutzung deutlich sinken.',
  88:'Werden spezielle Antirutschmatten zwischen Ladung und Ladefläche eingesetzt, lässt sich ein deutlich höherer Gleitreibbeiwert von bis zu 0,6 ansetzen – das reduziert die zusätzlich benötigte Sicherungskraft erheblich und macht Antirutschmatten zu einem der wirksamsten und günstigsten Hilfsmittel der Ladungssicherung.',
  89:'Rechenbeispiel bei trockenem Holz auf Holz mit μ = 0,4: Reibungskraft FR = Gewichtskraft FG × μ = 1000 daN × 0,4 = 400 daN. Das bedeutet: Von den ursprünglich benötigten 800 daN Sicherungskraft nach vorne übernimmt die Reibung allein schon 400 daN.',
  90:'Der noch verbleibende Sicherungsbedarf berechnet sich als FS = FG (der ursprünglich nach vorne zu sichernde Anteil, hier 0,8 × 1000 daN = 800 daN) minus FR (die durch Reibung bereits abgedeckte Kraft, hier 400 daN). Im Beispiel: FS = 800 daN − 400 daN = 400 daN. Nur noch diese 400 daN müssen also durch zusätzliche Ladungssicherungsmaßnahmen wie Zurrgurte aufgebracht werden.',
  91:'Es gibt zwei Stellschrauben, um die nötigen Sicherungskräfte herzustellen: erstens durch die Art der Ladungssicherung bzw. die verwendeten Hilfsmittel wie Zurrgurte oder Ketten (mehr dazu im nächsten Kapitel), und zweitens durch die Höhe der Reibungskraft selbst, die sich z.B. mit Antirutschmatten gezielt erhöhen lässt. Je mehr Reibung von vornherein vorhanden ist, desto weniger muss über Zurrmittel zusätzlich gesichert werden.',
  92:'Diese Frage prüft ein wichtiges Verständnis: Eine 30-kg-Kiste rutscht bei gleicher Bremsverzögerung nicht eher oder langsamer als eine 300-kg-Kiste! Da sowohl die wirkende Massenkraft als auch die rückhaltende Reibungskraft proportional zum Gewicht der jeweiligen Kiste sind, kürzt sich das Gewicht in der Rechnung heraus – beide Kisten beginnen bei identischem Reibbeiwert gleichzeitig zu rutschen, unabhängig von ihrer Masse.',
  93:'Diese Beispielfragen fassen die zentralen Punkte dieses Abschnitts zusammen: Wann treten Beschleunigungskräfte auf (beim Anfahren bzw. Beschleunigen des Fahrzeugs, wirken entgegen der Fahrtrichtung)? Und womit ist bei einer ungleichmäßigen Lastverteilung zu rechnen (mit negativen Auswirkungen auf die Fahreigenschaften, z.B. entlastete Vorderachse und schlechteres Bremsverhalten)?',
  73:'Bei Kurvenfahrt (auf einer Kreisbahn) entstehen Fliehkräfte, die die Ladung zum Kurvenäußeren schieben wollen. Die VDI 2700 legt diese seitliche Massenkraft auf 0,5 der Gewichtskraft fest – die Sicherung zur Seite muss also 50 % des Ladungsgewichts standhalten können, deutlich weniger als die 80 % nach vorne, aber immer noch erheblich.',
  63:'Genauso funktioniert die Standsicherheit eines Turmdrehkrans: Das Gegengewicht am kurzen Auslegerarm hinter dem Turm muss das Kippmoment der Last am langen Auslegerarm vor dem Turm ausgleichen – dasselbe Hebelprinzip wie bei Wippe, Gabelstapler und Bagger, nur in deutlich größerem Maßstab.',
  53:'Diese drei Beispielfragen fassen die zentralen Punkte dieses Kapitels zusammen und zeigen, wie eine Prüfungsfrage dazu aussehen könnte: Wer ist für die Ladungssicherung auf Fahrzeugen verantwortlich (Fahrer, Halter und Verlader gemeinsam)? Welche Rechtsgrundlage ist grundsätzlich zu beachten (§22 StVO bzw. die VDI 2700 als anerkannter Stand der Technik)? Und warum muss Ladung überhaupt gesichert werden (Sicherheit für alle, Vermeidung von Schäden und rechtlichen Konsequenzen)?',
  40:'Die Rechtsfolgen bei Nichtbeachtung wirken auf drei Ebenen: betriebliche Folgen aus dem Arbeitsvertrag (Ermahnung, Abmahnung), privat-/zivilrechtliche Folgen (Schadenersatzansprüche eines Geschädigten), und strafrechtliche Folgen bei Verstößen gegen geltendes Recht wie fahrlässiger Körperverletzung oder Tötung (Geld- oder Freiheitsstrafe bis zu 5 Jahren). Bei gravierenden Verstößen mit besonders schweren Folgen oder im Wiederholungsfall droht sogar die Kündigung.',
  27:'Drei obergerichtliche Grundsatzurteile konkretisieren, wer welche Verantwortung trägt: Das OLG Koblenz (06.09.1991) stellte fest, dass der Fahrer die Ladungssicherung auf Basis der VDI 2700 durchzuführen hat. Das OLG Düsseldorf (18.07.1989) stellte fest, dass der Halter das Fahrzeug so ausreichend mit Ladungssicherungsmitteln ausrüsten muss, dass dem Fahrer die ordnungsgemäße Sicherung überhaupt möglich ist. Und das OLG Stuttgart (27.12.1982) stellte fest, dass auch der Verlader neben dem Fahrer für die Ladungssicherung gemäß §22 StVO mitverantwortlich ist. Verantwortung liegt also nie nur bei einer Person allein.',
  17:'Für den Ernstfall gelten fünf Grundregeln: Unbedingt Ruhe bewahren, dann gedanklich die Reihenfolge durchgehen – Situation erkennen, weitere Schritte planen (Eigen- und Drittschutz geht immer vor), überlegt und entschlossen handeln. Danach den Unfall über die 112 melden (wo, was, wie viele Verletzte, welche Verletzungsart), soweit möglich Erste Hilfe leisten und weitere Maßnahmen wie Absicherung der Unfallstelle organisieren. Zuspruch und Beistand für Betroffene sind dabei ebenfalls wichtig.'
};

/* ── STEPS ── */
let STEPS = [];
function buildSteps(){
  STEPS = [{type:'welcome'}];
  KAPITEL.forEach((k,ki)=>{
    STEPS.push({type:'chapter',ki});
    k.folien.forEach((fn,fi)=>{
      if(VIDEO_MAP[fn]) STEPS.push({type:'video',ki,fi,fn,vidUrl:VIDEO_MAP[fn].url,titel:VIDEO_MAP[fn].titel});
      else STEPS.push({type:'folie',ki,fi,fn});
    });
    STEPS.push({type:'quiz',ki,qi:0});
  });
  STEPS.push({type:'exam'});
}

let cur = 0, quizState = {}, regnr = '';
let kapitelAbgeschlossen = {}, kapitelStartZeit = {};

/* ── LOGIN ── */
function doLogin(){
  const val = document.getElementById('regnr').value.trim();
  const vorname = document.getElementById('vorname').value.trim();
  const nachname = document.getElementById('nachname').value.trim();
  const errEl = document.getElementById('lerr');
  errEl.textContent = '';
  if(!val){errEl.textContent='Bitte Registriernummer eingeben.';return;}
  if(!/^\d{4}-\d{3,4}$/.test(val)){errEl.textContent='Ungültig. Format: 2025-001';return;}
  if(!vorname || !nachname){errEl.textContent='Bitte Vor- und Nachnamen eingeben.';return;}
  startApp(val, vorname, nachname);
}

async function startApp(nr, vorname, nachname){
  regnr = nr;
  const overlay = document.getElementById('zugangsCheckOverlay');
  const content = document.getElementById('zugangsCheckContent');
  overlay.style.display = 'flex';
  const backBtnHtml = '<button onclick="window.location.href=\'' + PORTAL_URL + '?regnr=' + encodeURIComponent(nr) + '\'" style="padding:12px 28px;border:none;border-radius:12px;background:#fff;color:#7a3502;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit">&larr; Zur&uuml;ck zur Startseite</button>';
  try {
    const res = await fetch(ZUGANGSPRUEFUNG_URL, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ registrierungsnummer: nr, vorname: vorname, nachname: nachname })
    });
    const data = await res.json();
    if(!(data && data.zugang === true)){
      content.innerHTML = '<div style="max-width:420px"><div style="font-size:40px;margin-bottom:12px">&#x1F512;</div><div style="font-size:18px;font-weight:700;margin-bottom:8px">Zugriff nicht m&ouml;glich</div><div style="font-size:14px;color:rgba(255,255,255,.75);line-height:1.6;margin-bottom:20px">Registriernummer, Vor- oder Nachname stimmen nicht &uuml;berein. Bitte pr&uuml;fen Sie Ihre Eingaben oder wenden Sie sich an Ihren Ausbilder.</div>' + backBtnHtml + '</div>';
      return;
    }
    let fVal = data.pruefung_lasi_freigegeben;
    if(fVal && typeof fVal === 'object') fVal = fVal.Value;
    if(fVal === 'Geschlossen'){
      content.innerHTML = '<div style="max-width:420px"><div style="font-size:40px;margin-bottom:12px">&#x1F512;</div><div style="font-size:18px;font-weight:700;margin-bottom:8px">Schulung abgeschlossen</div><div style="font-size:14px;color:rgba(255,255,255,.75);line-height:1.6;margin-bottom:20px">Sie haben die Pr&uuml;fung zu diesem Kurs bereits bestanden. Der Zugriff auf die Schulungsinhalte ist daher nicht mehr m&ouml;glich.</div>' + backBtnHtml + '</div>';
      return;
    }
  } catch(e){}
  overlay.style.display = 'none';
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('topbar-who').textContent = nr;
  const backBtn = document.getElementById('backHomeBtn');
  backBtn.href = PORTAL_URL + '?regnr=' + encodeURIComponent(nr);
  buildSidebar();
  goStep(0);
}

/* ── SIDEBAR ── */
function buildSidebar(){
  const list = document.getElementById('sidebarList');
  list.innerHTML = '';
  KAPITEL.forEach((k,ki)=>{
    const chIdx = STEPS.findIndex(s=>s.type==='chapter'&&s.ki===ki);
    const div = document.createElement('div');
    div.className='sidebar-item'+(isInChapter(ki)?' active':'');
    div.id='si-'+ki;
    div.innerHTML=`<div class="snum">${ki+1}</div>
      <div class="stxt"><div class="stitle">${k.title}</div>
      <div class="scnt">${k.folien.length} Folien · ${k.quiz.length} Fragen</div></div>`;
    div.onclick=()=>{goStep(chIdx);closeSidebar();};
    list.appendChild(div);
  });
  const examIdx = STEPS.findIndex(s=>s.type==='exam');
  const examDiv = document.createElement('div');
  examDiv.className='sidebar-item'+(STEPS[cur]?.type==='exam'?' active':'');
  examDiv.id='si-exam';
  examDiv.innerHTML=`<div class="snum">📋</div>
    <div class="stxt"><div class="stitle">Abschlussprüfung</div>
    <div class="scnt">Theoretische Prüfung</div></div>`;
  examDiv.onclick=()=>{goStep(examIdx);closeSidebar();};
  list.appendChild(examDiv);
}

function isInChapter(ki){
  const s=STEPS[cur];
  if(!s||s.type==='welcome'||s.type==='exam')return false;
  return s.ki===ki;
}
function updateSidebar(){
  KAPITEL.forEach((_,ki)=>{
    const el=document.getElementById('si-'+ki);
    if(el)el.classList.toggle('active',isInChapter(ki));
  });
  const examEl=document.getElementById('si-exam');
  if(examEl)examEl.classList.toggle('active',STEPS[cur]?.type==='exam');
}

/* ── PROGRESS ── */
function updatePbar(){
  const pct=STEPS.length>1?(cur/(STEPS.length-1))*100:0;
  document.getElementById('pbar').style.width=pct+'%';
}

/* ── NAVIGATION ── */
function goStep(idx){
  cur=Math.max(0,Math.min(STEPS.length-1,idx));
  render();updateSidebar();updatePbar();
  window.scrollTo(0,0);
}

function renderFoot(showBack=true,showNext=true,nextLabel='Weiter →'){
  const foot=document.getElementById('foot');
  const s=STEPS[cur];
  let pageText='';
  if(s.type==='folie'||s.type==='video'){
    const k=KAPITEL[s.ki];
    pageText=`Folie ${s.fi+1} / ${k.folien.length}`;
  }
  foot.innerHTML=`
    ${showBack?`<button class="navbtn" onclick="goStep(${cur-1})" ${cur===0?'disabled':''}>← Zurück</button>`:'<div></div>'}
    <span class="pageno">${pageText}</span>
    ${showNext?`<button class="navbtn primary" onclick="goStep(${cur+1})">${nextLabel}</button>`:'<div></div>'}
  `;
}

/* ── RENDER ── */
function render(){
  const s=STEPS[cur];
  const host=document.getElementById('host');
  const crumb=document.getElementById('crumb');
  if(s.type==='welcome'){crumb.textContent='';renderWelcome(host);}
  else if(s.type==='chapter'){crumb.textContent=`Kapitel ${s.ki+1}`;renderChapter(host,s.ki);}
  else if(s.type==='folie'){crumb.textContent=`Kapitel ${s.ki+1} · Folie ${s.fi+1}`;renderFolie(host,s);}
  else if(s.type==='video'){crumb.textContent=`Kapitel ${s.ki+1} · Folie ${s.fi+1}`;renderVideo(host,s);}
  else if(s.type==='quiz'){crumb.textContent=`Kapitel ${s.ki+1} · Wissenstest`;renderQuiz(host,s.ki);}
  else if(s.type==='exam'){crumb.textContent='';renderExam(host);}
}

function renderWelcome(host){
  const totalF=KAPITEL.reduce((a,k)=>a+k.folien.length,0);
  const totalQ=KAPITEL.reduce((a,k)=>a+k.quiz.length,0);
  host.innerHTML=`<div class="welcome-card">
    <div class="w-icon"><svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4z"/></svg></div>
    <h2>Willkommen zur Ladungssicherung</h2>
    <p>Offizielle Ausbildung nach DGUV Grundsatz 308-009 auf der Basis der Richtlinie VDI 2700 ff.</p>
    <div class="w-stats">
      <div class="wstat"><div class="wn">${KAPITEL.length}</div><div class="wl">Kapitel</div></div>
      <div class="wstat"><div class="wn">${totalF}</div><div class="wl">Folien</div></div>
      <div class="wstat"><div class="wn">${totalQ}</div><div class="wl">Quizfragen</div></div>
    </div>
    <button class="btn" onclick="goStep(1)">Ausbildung starten →</button>
  </div>`;
  document.getElementById('foot').innerHTML='';
}

function renderChapter(host,ki){
  const k=KAPITEL[ki];
  if(!kapitelStartZeit[ki])kapitelStartZeit[ki]=Date.now();
  host.innerHTML=`<div class="chapter-intro">
    <div class="ci-num">Kapitel ${ki+1} von ${KAPITEL.length}</div>
    <h2>${k.title}</h2>
    <p class="ci-meta">${k.folien.length} Folien · ${k.quiz.length} Quizfragen</p>
    <p style="color:var(--muted);font-size:14px;max-width:440px;margin:12px auto 24px;line-height:1.6">
      Arbeiten Sie die Folien dieses Kapitels durch und testen Sie anschließend Ihr Wissen.
    </p>
    <button class="btn" onclick="goStep(${cur+1})">Kapitel starten →</button>
  </div>`;
  document.getElementById('foot').innerHTML='';
}

function renderFolie(host,s){
  const k=KAPITEL[s.ki];
  const fn=s.fn;
  const imgUrl=IMG_BASE+'Folie'+fn+'.PNG';
  const waText=encodeURIComponent(`Hallo, ich habe eine Frage zu:\nKapitel ${s.ki+1}: ${k.title}\nFolie ${fn}\n\nMeine Frage:`);
  const mailSubj=encodeURIComponent(`Frage zu Folie ${fn} – ${k.title}`);
  const mailBody=encodeURIComponent(`Hallo,\n\nFrage zu Kapitel ${s.ki+1}: ${k.title}\nFolie ${fn}\n\nMeine Frage:\n\n`);

  const nextStep=STEPS[cur+1];
  const isLast=nextStep&&nextStep.type==='quiz';

  const erkl=ERKLAERUNG_DE[fn];
  const erklHtml=erkl?`<div class="erklaerung-box"><div class="erklaerung-label">💡 Erklärung</div><div class="erklaerung-content"><p>${erkl}</p></div></div>`:'';
  host.innerHTML=`<div class="slide-card">
    <img class="slide-img-full" src="${imgUrl}" loading="lazy" alt="Folie ${fn}">
    ${erklHtml}
    <div class="slide-footer">
      <span class="slide-nr">Folie ${fn}</span>
      <span style="flex:1"></span>
      <a class="wa-btn" href="https://wa.me/${WA_NR}?text=${waText}" target="_blank">
        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        WhatsApp
      </a>
      <a class="mail-btn" href="mailto:${MAIL}?subject=${mailSubj}&body=${mailBody}">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        E-Mail
      </a>
    </div>
  </div>`;
  renderFoot(true,true,isLast?'Zum Quiz →':'Weiter →');
}

function renderVideo(host,s){
  const nextStep=STEPS[cur+1];
  const isLast=nextStep&&nextStep.type==='quiz';
  host.innerHTML=`<div class="slide-card video-slide">
    <div class="video-wrap">
      <div class="video-label"><span>▶ ${s.titel}</span><button class="video-fs-btn" onclick="videoVollbild()">⛶ Vollbild</button></div>
      <iframe id="videoFrame" src="${s.vidUrl}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>`;
  renderFoot(true,true,isLast?'Zum Quiz →':'Weiter →');
}

function videoVollbild(){
  const el=document.getElementById('videoFrame');
  if(!el)return;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
  if(req)req.call(el);
}

/* ── QUIZ ── */
function renderQuiz(host,ki){
  if(!quizState[ki])quizState[ki]={qi:0,score:0};
  const qs=quizState[ki];
  const k=KAPITEL[ki];
  if(qs.qi>=k.quiz.length){
    const pct=Math.round(qs.score/k.quiz.length*100);
    const pass=pct>=70;
    const done=!!kapitelAbgeschlossen[ki];
    host.innerHTML=`<div class="quiz-card"><div class="quiz-result">
      <div class="qr-icon ${pass?'ok':'no'}">${pass?'✓':'✗'}</div>
      <div class="qr-score">${qs.score} / ${k.quiz.length} richtig</div>
      <p style="color:var(--muted);margin-bottom:20px">${pass?'Gut gemacht! Weiter zum nächsten Kapitel.':'Bitte das Kapitel wiederholen.'}</p>
      ${pass?`<button class="btn" id="aBtn" onclick="kapitelAbschliessen(${ki})" ${done?'disabled style="background:var(--ok)"':''}>${done?'✓ Abgeschlossen':'Thema abschließen &amp; speichern'}</button>
             <div class="abschluss-status" id="aStat" style="margin-top:10px;font-size:13px;color:var(--muted)">${done?'Kapitel '+(ki+1)+' gespeichert.':''}</div>
             <button class="btn" style="margin-top:10px;background:var(--muted)" onclick="goStep(${cur+1})" ${done?'':'disabled'} id="weiterBtn">Weiter →</button>`
             :`<button class="btn" onclick="resetQuiz(${ki})">Wiederholen</button>`}
    </div></div>`;
    document.getElementById('foot').innerHTML='';
    return;
  }
  const q=k.quiz[qs.qi];
  host.innerHTML=`<div class="quiz-card">
    <div class="quiz-hd">
      <span class="quiz-kap">${k.title}</span>
      <span class="quiz-prog">Frage ${qs.qi+1} / ${k.quiz.length}</span>
    </div>
    <div class="quiz-q">${q.q}</div>
    <div class="quiz-opts">
      ${q.o.map((o,i)=>`<button class="opt" id="opt-${i}" onclick="answerQuiz(${ki},${i})">${o}</button>`).join('')}
    </div>
    <div class="quiz-fb" id="qfb"></div>
  </div>`;
  document.getElementById('foot').innerHTML='';
}

function answerQuiz(ki,chosen){
  const k=KAPITEL[ki];
  const qs=quizState[ki];
  const q=k.quiz[qs.qi];
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  document.getElementById('opt-'+q.c).classList.add('correct');
  const fb=document.getElementById('qfb');
  if(chosen===q.c){qs.score++;fb.className='quiz-fb ok';fb.textContent='✓ Richtig!';}
  else{document.getElementById('opt-'+chosen).classList.add('wrong');fb.className='quiz-fb no';fb.textContent='✗ Falsch. Richtig: '+q.o[q.c];}
  qs.qi++;
  setTimeout(()=>renderQuiz(document.getElementById('host'),ki),1200);
}

function resetQuiz(ki){
  quizState[ki]={qi:0,score:0};
  const chIdx=STEPS.findIndex(s=>s.type==='chapter'&&s.ki===ki);
  goStep(chIdx);
}

function kapitelAbschliessen(ki){
  const btn=document.getElementById('aBtn');
  const stat=document.getElementById('aStat');
  const weiterBtn=document.getElementById('weiterBtn');
  if(!btn||!stat)return;
  const k=KAPITEL[ki];
  const qs=quizState[ki];
  btn.disabled=true;btn.textContent='Wird gespeichert…';
  const payload={
    regnr:regnr,
    kapitel_nr:ki+1,
    kapitel_name:k.title,
    datum_uhrzeit:new Date().toISOString(),
    quiz_richtig:qs.score,
    quiz_gesamt:k.quiz.length,
    quiz_prozent:Math.round(qs.score/k.quiz.length*100),
    bestanden:true,
    lernzeit_sekunden:Math.round((Date.now()-(kapitelStartZeit[ki]||Date.now()))/1000),
    gesamt_kapitel_abgeschlossen:Object.keys(kapitelAbgeschlossen).length+1
  };
  function onOK(){
    kapitelAbgeschlossen[ki]=true;
    btn.textContent='✓ Abgeschlossen';btn.style.background='var(--ok)';
    stat.textContent='Kapitel '+(ki+1)+' gespeichert.';
    if(weiterBtn)weiterBtn.disabled=false;
  }
  fetch(LERNFORTSCHRITT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(onOK)
    .catch(()=>{btn.disabled=false;btn.textContent='Thema abschließen & speichern';stat.textContent='Fehler beim Speichern. Bitte erneut versuchen.';stat.style.color='var(--no)';});
}

/* ── EXAM ── */

  host.innerHTML=`<div class="exam-card">
    <div class="exam-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg></div>
    <h2>Theoretische Prüfung</h2>
    <p style="color:var(--muted);font-size:15px;max-width:480px;margin:10px auto 24px;line-height:1.6">
      Sie haben alle Lerneinheiten abgeschlossen.<br>Bitte melden Sie sich bei Ihrem Ausbilder.<br><br>
      <strong>Bestehensgrenze: 12 von 20 Fragen (60 %)</strong>

    <a href="https://wa.me/${WA_NR}?text=${encodeURIComponent('Hallo, ich habe die Ladungssicherungs-Ausbildung abgeschlossen und möchte die Prüfung anmelden.')}"
       target="_blank"
       style="display:inline-flex;align-items:center;gap:10px;padding:12px 24px;background:#25D366;color:#fff;border-radius:11px;font-size:15px;font-weight:700;text-decoration:none">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      WhatsApp – Prüfung anmelden
    </a>
  </div>`;
  document.getElementById('foot').innerHTML='';
}

/* ── SIDEBAR TOGGLE ── */
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}

/* ── INIT ── */
buildSteps();
buildSidebar();

// Auto-Login: nur wenn diese Registriernummer bereits in dieser Sitzung
// mit Vor-/Nachname erfolgreich angemeldet wurde.
(function(){
  const params=new URLSearchParams(window.location.search);
  const nr=params.get('regnr');
  const authRegnr = sessionStorage.getItem('authRegnr');
  const authVorname = sessionStorage.getItem('authVorname');
  const authNachname = sessionStorage.getItem('authNachname');
  if(nr && /^\d{4}-\d{3,4}$/.test(nr)){
    document.getElementById('regnr').value = nr;
    if(authRegnr === nr && authVorname && authNachname){
      document.getElementById('vorname').value = authVorname;
      document.getElementById('nachname').value = authNachname;
      startApp(nr, authVorname, authNachname);
    }
  }
})();
</script>
