<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gabelstapler Stufe 1 – Allgemeine Ausbildung</title>
<style>
:root{
  --bg:#0d1f12;--green:#1a7a4a;--green-l:#2ea865;--green-d:#0d4a24;
  --acc1:#1a3a6b;--acc2:#2e6cb0;
  --navy:#16243f;--muted:#68788f;--line:#e3e8f0;--ink:#1a2330;
  --shadow:0 8px 40px rgba(0,0,0,.25);
  --ok:#1a9e6e;--okbg:#e8f7f2;--no:#c0392b;--nobg:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,sans-serif;
  min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;padding:16px;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(26,122,74,.25) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 80%, rgba(13,74,36,.3) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}
.wrap{position:relative;z-index:1;width:100%;max-width:1280px;display:flex;flex-direction:column;flex:1}
/* TOPBAR */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.ti{width:46px;height:46px;border-radius:12px;flex-shrink:0;
  background:#fff;padding:5px;
  display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 20px rgba(0,0,0,.3);}
.ti img{width:100%;height:100%;object-fit:contain;}
.topbar h1{color:#fff;font-size:18px;font-weight:700;line-height:1.2}
.topbar p{color:rgba(255,255,255,.45);font-size:12px}
/* STAGE */
.stage{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;
  display:flex;flex-direction:column;height:max-content;width:100%;}
.progress{height:5px;background:var(--line)}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--acc1),var(--acc2));transition:width .25s ease;width:0}
/* WELCOME */
.welcome-box{padding:40px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(135deg,var(--green-d),var(--green-l));}
.welcome-titel{font-size:26px;font-weight:800;color:#fff;line-height:1.3;}
.welcome-sub{font-size:15px;color:rgba(255,255,255,.85);line-height:1.6;max-width:500px;}
.welcome-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:500px;}
.wg{background:rgba(255,255,255,.15);border-radius:12px;padding:12px;text-align:left;}
.wg-icon{font-size:20px;margin-bottom:4px;}
.wg-titel{font-size:12px;font-weight:700;color:#fff;margin-bottom:2px;}
.wg-text{font-size:11px;color:rgba(255,255,255,.75);}
.welcome-start{padding:14px 36px;border:none;border-radius:12px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;background:#fff;color:var(--green-d);margin-top:6px;}
/* KAPITEL-TITELFOLIE */
.kapitel-box{padding:48px 28px;text-align:center;background:linear-gradient(135deg,var(--acc1),var(--acc2));
  color:#fff;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.kapitel-nr{font-size:13px;font-weight:700;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.kapitel-titel{font-size:30px;font-weight:800;line-height:1.3;}
.kapitel-sub{font-size:14px;color:rgba(255,255,255,.7);margin-top:10px;}
/* FOLIENBOX */
.slidebox{position:relative;background:#0d1a2e;display:flex;align-items:center;justify-content:center;
  min-height:200px;}
.slidebox img{width:100%;height:auto;display:block;max-height:65vh;object-fit:contain;}

/* ERKLÄRUNGS-KASTEN (aufklappbar, standardmäßig eingeklappt) */
.erklaerung-box{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;overflow:hidden}
.erklaerung-label{display:flex;align-items:center;gap:8px;padding:12px 20px;font-size:14px;
  font-weight:700;color:var(--acc1);cursor:pointer;user-select:none}
.erklaerung-label .chev{margin-left:auto;font-size:12px;transition:transform .2s ease}
.erklaerung-box.open .erklaerung-label .chev{transform:rotate(180deg)}
.erklaerung-content{max-height:0;overflow:hidden;transition:max-height .25s ease}
.erklaerung-box.open .erklaerung-content{max-height:2000px}
.erklaerung-content p{margin:0;padding:10px 20px 20px;font-size:17px;line-height:1.75;color:var(--ink)}
@media(max-width:600px){
  .erklaerung-label{font-size:13px;padding:10px 14px}
  .erklaerung-content p{font-size:15px;padding:8px 14px 16px}
}
.nav-zone{position:absolute;top:0;bottom:0;width:30%;cursor:pointer;z-index:2;
  display:flex;align-items:center;opacity:0;transition:opacity .15s}
.nav-zone:hover{opacity:1}
.nav-zone.prev{left:0;justify-content:flex-start;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}
.nav-zone.next{right:0;justify-content:flex-end;background:linear-gradient(270deg,rgba(0,0,0,.35),transparent)}
.nav-zone span{color:#fff;font-size:30px;padding:0 14px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
/* QUIZ */
.quizbox{padding:28px;display:flex;flex-direction:column;}
.quiz-badge{font-size:12px;font-weight:700;color:var(--acc2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;}
.quiz-q{font-size:19px;font-weight:700;color:var(--navy);margin-bottom:20px;line-height:1.4;}
.quiz-opts{display:flex;flex-direction:column;gap:10px;}
.opt{text-align:left;padding:14px 18px;border:2px solid var(--line);border-radius:12px;
  background:#fff;font-size:15px;color:var(--ink);cursor:pointer;font-family:inherit;transition:all .12s;}
.opt:hover:not(:disabled){border-color:var(--acc2);background:#f0f7ff;}
.opt:disabled{cursor:default;}
.opt.correct{border-color:var(--ok)!important;background:var(--okbg)!important;color:var(--ok)!important;font-weight:700;}
.opt.wrong{border-color:var(--no)!important;background:var(--nobg)!important;color:var(--no)!important;}
.quiz-fb{margin-top:16px;font-size:15px;font-weight:700;min-height:24px;}
.quiz-fb.ok{color:var(--ok)}.quiz-fb.no{color:var(--no)}
.quiz-prog{font-size:12px;color:var(--muted);margin-bottom:6px;}
/* THEMA ABSCHLIESSEN */
.abschluss-box{padding:36px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.abschluss-icon{font-size:50px;}
.abschluss-titel{font-size:22px;font-weight:800;color:var(--navy);}
.abschluss-sub{font-size:14px;color:var(--muted);max-width:400px;}
.abschluss-score{background:var(--okbg);border:1px solid var(--ok);border-radius:12px;padding:12px 20px;font-size:15px;color:#0d5c3a;font-weight:600;}
.abschluss-btn{padding:14px 32px;border:none;border-radius:12px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;transition:all .15s;}
.abschluss-btn:hover:not(:disabled){opacity:.9;}
.abschluss-btn:disabled{opacity:.6;cursor:not-allowed;}
.abschluss-status{font-size:13px;color:var(--ok);font-weight:600;min-height:18px;}
/* ERGEBNIS */
.result{padding:48px 28px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;}
.result .ic{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:38px;font-weight:800;}
.result .ic.ok{background:var(--okbg);color:var(--ok)}
.result .ic.no{background:var(--nobg);color:var(--no)}
.result h2{font-size:28px;color:var(--navy);}
.result p{color:var(--muted);font-size:15px;max-width:420px;}
/* CONTROLS */
.controls{display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:#fff;border-top:1px solid var(--line);gap:12px;}
.ctrl-btn{display:flex;align-items:center;gap:7px;padding:11px 20px;border:none;border-radius:11px;
  background:linear-gradient(135deg,var(--acc1),var(--acc2));
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:inherit;}
.ctrl-btn:hover{opacity:.9;}
.ctrl-btn:disabled{opacity:.35;cursor:not-allowed;}
.counter{font-size:13px;font-weight:700;color:var(--muted);text-align:center;line-height:1.4;}
/* KONTAKT */
.kontakt-bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.kontakt-btn{display:flex;align-items:center;gap:7px;padding:10px 18px;border:none;border-radius:10px;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;
  transition:all .15s;flex:1;justify-content:center;}
.kontakt-btn.wa{background:#25D366;color:#fff;}
.kontakt-btn.mail{background:#0072C6;color:#fff;}
.back-btn{display:block;width:100%;padding:12px;border:2px solid rgba(255,255,255,.2);
  border-radius:12px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);
  font-size:14px;font-weight:600;cursor:pointer;text-align:center;font-family:inherit;margin-top:8px;}
.back-btn:hover{border-color:var(--green-l);color:#fff;background:rgba(255,255,255,.12);}
/* DIAGRAM */
.diag-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;flex:1;display:flex;flex-direction:column;}
.diag-hd{padding:14px 20px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,var(--acc1),var(--acc2));}
.diag-hd-title{font-size:15px;font-weight:700;color:#fff;}
.diag-svg-box{padding:12px 16px;background:#fafbfc;border-bottom:1px solid var(--line);}
.diag-info{padding:12px 20px;font-size:14px;color:var(--muted);line-height:1.6;border-bottom:1px solid var(--line);}
.dq{padding:14px 20px;border-bottom:1px solid var(--line);}
.dq:last-child{border-bottom:none;}
.dq-text{font-size:14px;color:var(--ink);line-height:1.5;margin-bottom:10px;}
.dq-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.dq-input{padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:#fafbfc;color:var(--ink);font-size:14px;width:120px;font-family:inherit;}
.dq-input:focus{outline:none;border-color:var(--acc2);}
.dqbtn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:13px;transition:all .12s;cursor:pointer;font-family:inherit;}
.dqbtn:hover{background:#f3f7fc;}
.dqbtn.info{border-color:var(--acc2);color:var(--acc2);}.dqbtn.info:hover{background:#e8f0fb;}
.dqhbtn{padding:8px 14px;border-radius:8px;border:2px solid;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.dqhbtn.ok{border-color:var(--ok)!important;background:var(--okbg)!important;color:var(--ok)!important;}
.dqhbtn.no{border-color:var(--no)!important;background:var(--nobg)!important;color:var(--no)!important;}
.dq-fb{display:none;margin-top:8px;padding:8px 12px;border-radius:8px;font-size:13px;}
.dq-fb.ok{display:block;background:var(--okbg);color:var(--ok);border:1px solid #9dd4b8;}
.dq-fb.no{display:block;background:var(--nobg);color:var(--no);border:1px solid #f5b7b1;}
/* --- TABLET (bis 900px) --- */
@media(max-width:900px){
  .topbar h1{font-size:16px}
  .kapitel-titel{font-size:24px}
  .quiz-q{font-size:17px}
}
/* --- SMARTPHONE (bis 600px) --- */
@media(max-width:600px){
  body{padding:6px 6px 10px}
  .topbar{gap:8px;margin-bottom:8px}
  .ti{width:36px;height:36px;font-size:17px;border-radius:9px}
  .topbar h1{font-size:14px;line-height:1.2}
  .topbar p{font-size:10px}
  .ov-btn{padding:7px 10px;font-size:12px}
  .stage{border-radius:12px}
  .welcome-box{padding:22px 14px;gap:10px}
  .welcome-titel{font-size:19px}
  .welcome-sub{font-size:13px}
  .welcome-grid{grid-template-columns:1fr}
  .wg{padding:10px}
  .kapitel-box{padding:26px 14px;min-height:180px}
  .kapitel-titel{font-size:20px}
  .kapitel-sub{font-size:12px}
  .slidebox{min-height:220px}
  .slidebox img{max-height:52vh}
  .nav-zone{opacity:.35;width:22%}
  .quizbox{padding:16px 14px}
  .quiz-badge{font-size:11px}
  .quiz-prog{font-size:11px}
  .quiz-q{font-size:15px;margin-bottom:14px}
  .opt{padding:11px 13px;font-size:14px}
  .abschluss-box{padding:22px 14px;gap:10px}
  .abschluss-icon{font-size:40px}
  .abschluss-titel{font-size:18px}
  .abschluss-btn{padding:12px 22px;font-size:15px}
  .result{padding:26px 14px;gap:10px}
  .result h2{font-size:21px}
  .result p{font-size:14px}
  .controls{padding:9px 10px;gap:8px}
  .ctrl-btn{padding:10px 13px;font-size:13px}
  .counter{font-size:12px}
  .kontakt-bar{gap:6px;margin-top:8px}
  .kontakt-btn{padding:9px 12px;font-size:13px}
  .back-btn{padding:10px;font-size:13px;margin-top:6px}
  .video-label{font-size:12px;padding:6px 12px}
}
/* --- KLEINES SMARTPHONE (bis 380px) --- */
@media(max-width:380px){
  .topbar p{display:none}
  .topbar h1{font-size:13px}
  .kapitel-titel{font-size:18px}
  .quiz-q{font-size:14px}
  .opt{font-size:13px}
  .ctrl-btn{padding:9px 10px;font-size:12px}
}
/* OVERVIEW BUTTON */
.ov-btn{margin-left:auto;padding:9px 14px;border:none;border-radius:10px;
  background:rgba(255,255,255,.13);color:#fff;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;flex-shrink:0;white-space:nowrap;}
.ov-btn:hover{background:rgba(255,255,255,.22);}
.prog-badge{font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;min-height:14px;}
/* OVERVIEW PANEL */
.ov-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;}
.ov-overlay.active{display:block;}
.ov-panel{position:fixed;top:0;right:-400px;bottom:0;width:370px;max-width:100vw;
  background:#fff;z-index:101;display:flex;flex-direction:column;
  box-shadow:-8px 0 40px rgba(0,0,0,.3);transition:right .25s ease;}
.ov-panel.active{right:0;}
.ov-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;flex-shrink:0;}
.ov-head-title{font-size:16px;font-weight:700;}
.ov-close{background:rgba(255,255,255,.2);border:none;border-radius:8px;
  color:#fff;font-size:18px;padding:4px 10px;cursor:pointer;line-height:1;}
.ov-summary{padding:14px 20px;background:#f5f7fa;border-bottom:1px solid var(--line);
  font-size:13px;color:var(--muted);flex-shrink:0;}
.ov-pbar-wrap{height:6px;background:var(--line);border-radius:3px;margin-top:8px;}
.ov-pbar{height:100%;background:linear-gradient(90deg,var(--acc1),var(--acc2));border-radius:3px;transition:width .3s;}
.ov-list{flex:1;overflow-y:auto;}
.ov-chapter{display:flex;align-items:center;gap:12px;padding:13px 20px;
  cursor:pointer;border-bottom:1px solid var(--line);transition:background .12s;}
.ov-chapter:hover{background:#f0f7ff;}
.ov-chapter.ok{background:#f0faf5;}.ov-chapter.ok:hover{background:#e0f5ea;}
.ov-chapter.prog{background:#fffdf0;}.ov-chapter.prog:hover{background:#fff8d6;}
.ov-ch-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;
  background:var(--line);color:var(--muted);}
.ov-chapter.ok .ov-ch-icon{background:var(--okbg);color:var(--ok);}
.ov-chapter.prog .ov-ch-icon{background:#fff3cd;color:#c88a00;}
.ov-ch-info{flex:1;min-width:0;}
.ov-ch-title{font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ov-ch-score{font-size:11px;color:var(--muted);margin-top:2px;}
.ov-ch-arr{font-size:16px;color:var(--muted);flex-shrink:0;}
.ov-foot{padding:16px 20px;border-top:1px solid var(--line);flex-shrink:0;}
.ov-weiter{width:100%;padding:12px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;
  font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.ov-weiter:hover{opacity:.9;}
/* VIDEO SLIDE */
.video-slide{display:flex;flex-direction:row;align-items:stretch;background:#0b1620;border-radius:12px;overflow:hidden;}
.video-wrap{flex:1;display:flex;flex-direction:column;}
.video-label{background:#1a2a3a;color:#7ec8e3;font-size:13px;font-weight:700;padding:8px 16px;letter-spacing:.03em;display:flex;align-items:center;justify-content:space-between;}
.video-fs-btn{background:rgba(255,255,255,.15);border:none;border-radius:7px;color:#fff;font-size:12px;font-weight:600;padding:4px 10px;cursor:pointer;font-family:inherit;flex-shrink:0;}
.video-fs-btn:hover{background:rgba(255,255,255,.28);}
.video-wrap iframe{display:block;width:100%;aspect-ratio:16/9;border:none;flex:1;}
</style>
</head>

var ERKLAERUNG_MAP_DE={
  3:'In diesem Kapitel geht es zunächst darum, wann rechtlich überhaupt ein Arbeitsunfall vorliegt. Danach schauen wir uns an, welche rechtlichen Konsequenzen ein Arbeitsunfall für Sie als Fahrer haben kann – strafrechtlich, im Ordnungswidrigkeitenrecht, arbeitsrechtlich und beim sogenannten Regress.',
  4:'Ein Arbeitsunfall im rechtlichen Sinn liegt nur vor, wenn alle drei Voraussetzungen gleichzeitig erfüllt sind: Es muss sich um eine versicherte Person handeln (z.B. eine Beschäftigte oder ein Beschäftigter), die eine versicherte Tätigkeit ausgeübt hat (also im Rahmen ihrer Arbeit), und dabei tatsächlich körperlich zu Schaden gekommen ist. Fehlt auch nur eine dieser drei Voraussetzungen, handelt es sich rechtlich nicht um einen Arbeitsunfall – auch wenn etwas passiert ist. Das ist wichtig, weil davon abhängt, ob die Berufsgenossenschaft für die Folgen aufkommt.',
  5:'Diese Zahlen zeigen, wie ernst das Thema ist: über 20.000 Unfälle pro Jahr allein beim Umgang mit Flurförderzeugen in Deutschland, davon etwa 200 mit schweren Verletzungen durch Fallen oder Kippen des Fahrzeugs, und im Schnitt 3 bis 5 tödliche Unfälle allein im Großhandel und in der Lagerei. Insgesamt sterben jährlich 23 Menschen bei Staplerunfällen. Der Gabelstapler ist also kein harmloses Arbeitsmittel, sondern eines der gefährlichsten überhaupt, wenn nicht sorgfältig gefahren wird.',
  6:'Die Statistik zeigt zwei klare Schwerpunkte, auf die wir im Folgenden genauer eingehen: Anfahrunfälle (der Stapler erfasst eine Person) und Kippunfälle (der Stapler kippt um). Diese beiden Unfallarten sind für den Großteil der schweren und tödlichen Unfälle verantwortlich – deshalb schauen wir uns beide im Detail an.',
  7:'Diese echten Unfallbeispiele zeigen, wie schnell es zu einem Anfahrunfall kommen kann: ein kurzer Moment der Unachtsamkeit, eine Person im toten Winkel, oder eine spontane Anfahrt ohne vorherigen Blickkontakt – und schon kommt es zur Kollision. Häufigste Ursachen sind Unachtsamkeit, eingeschränkte Sicht und zu wenig Platz. Merken Sie sich: Vor jedem Anfahren erst umschauen, hupen und sicherstellen, dass niemand im Gefahrenbereich steht.',
  8:'Kippunfälle passieren zwar seltener als Anfahrunfälle, enden aber besonders oft tödlich – über die Hälfte aller tödlichen Staplerunfälle sind Kippunfälle. Nach der DGUV Vorschrift 68 zählen dazu unter anderem: zu schnelles Kurvenfahren, Fahren mit angehobener Last, Fahren gegen Hindernisse, Wenden und Schrägfahrt auf Gefällstrecken, Neigen des Mastes nach vorn, Fahren auf unebenem Untergrund, Überlastung und starker Wind. Deshalb gilt: Last beim Fahren immer absenken, in Kurven langsam fahren und auf den Zustand des Bodens achten.',
  9:'Ein Arbeitsunfall kann für Sie mehrere rechtliche Konsequenzen gleichzeitig nach sich ziehen, die unabhängig voneinander greifen können: strafrechtliche Folgen (z.B. bei grober Fahrlässigkeit), Bußgelder nach dem Ordnungswidrigkeitenrecht, arbeitsrechtliche Konsequenzen durch Ihren Arbeitgeber, und im schlimmsten Fall Regressforderungen der Berufsgenossenschaft. Auf den folgenden Folien schauen wir uns jede dieser vier Kategorien einzeln an.',
  10:'Strafrechtlich wird es nur dann brenzlig, wenn drei Dinge zusammenkommen: Der Unfall hat zu einer Verletzung oder zum Tod geführt, diesem Unfall lag eine rechtswidrige Handlung zugrunde, und diese Handlung geschah schuldhaft – also fahrlässig oder sogar vorsätzlich. Liegen alle drei Punkte vor, drohen Freiheits- oder Geldstrafe. Normales, vorschriftsmäßiges Fahren, bei dem trotzdem etwas Unvorhergesehenes passiert, führt in der Regel nicht zu strafrechtlichen Konsequenzen.',
  11:'Das Ordnungswidrigkeitenrecht ist eine Stufe milder als das Strafrecht und soll die Einhaltung von Regeln wie dem Arbeitsschutz sicherstellen. Es reicht hier schon ein fahrlässiger oder vorsätzlicher Verstoß gegen eine bußgeldbewährte Vorschrift – z.B. eine Unfallverhütungsvorschrift der Berufsgenossenschaft –, um ein Bußgeld zu riskieren. Es muss dafür noch nicht einmal jemand zu Schaden gekommen sein; der reine Regelverstoß reicht bereits aus.',
  12:'Verstoßen Sie gegen arbeitsvertragliche Pflichten (z.B. gegen betriebliche Sicherheitsvorschriften), kann Ihr Arbeitgeber unabhängig von Straf- oder Bußgeldverfahren arbeitsrechtlich reagieren. Die möglichen Stufen reichen von einer einfachen Ermahnung über eine Abmahnung und Verwarnung bis hin zur Kündigung – je nach Schwere und Häufigkeit des Verstoßes.',
  13:'Regress bedeutet: Die Berufsgenossenschaft übernimmt normalerweise die Kosten eines Arbeitsunfalls, unabhängig davon, wer schuld war. Nur wenn Sie den Unfall grob fahrlässig verursacht haben, kann die BG diese Kosten im Nachhinein von Ihnen zurückfordern. Das nach dem BGB übliche Schadenersatz-Prinzip, bei dem der Verursacher direkt haftet, gilt hier normalerweise nicht – außer bei vorsätzlich verursachten Unfällen.',
  15:'In diesem Kapitel geht es um die Berufsgenossenschaft: was sie ist und welche Aufgaben sie hat, welches Regelwerk sie herausgibt, welche Vorschrift speziell für Ihre Staplerausbildung gilt, und wie diese Ausbildung in drei Stufen aufgebaut ist.',
  16:'Die Berufsgenossenschaft ist Träger der gesetzlichen Unfallversicherung. Es gibt drei Arten: die gewerblichen Berufsgenossenschaften (für die meisten Betriebe, auch Lager und Logistik), die landwirtschaftliche Berufsgenossenschaft und die Unfallversicherungsträger der öffentlichen Hand (z.B. für Kitas oder Schulen). Für Sie als Staplerfahrer im Betrieb ist in der Regel die gewerbliche Berufsgenossenschaft zuständig.',
  17:'Die Berufsgenossenschaft hat den gesetzlichen Auftrag, mit allen geeigneten Mitteln Arbeitsunfälle, Berufskrankheiten und arbeitsbedingte Gesundheitsgefahren zu verhüten – zum Beispiel durch Beratung der Betriebe, Schulungen und die Veröffentlichung des berufsgenossenschaftlichen Vorschriften- und Regelwerks, das Sie in dieser Ausbildung kennenlernen.',
  18:'Das Regelwerk der Berufsgenossenschaften gliedert sich in vier Arten von Dokumenten: BG-Vorschriften sind rechtlich bindend, z.B. die Unfallverhütungsvorschrift „Flurförderzeuge". BG-Regeln beschreiben, wie eine Vorschrift üblicherweise umgesetzt wird, z.B. der Einsatz von Sicherheitsschuhen. BG-Informationen geben praktische Hinweise, z.B. für Gabelstaplerfahrer. Und BG-Grundsätze legen z.B. fest, wie eine Ausbildung wie diese hier aufgebaut sein muss.',
  19:'Der frühere „BGG 925" heißt heute „DGUV Grundsatz 308-001" und regelt genau die Ausbildung und Beauftragung von Staplerfahrern, die Sie gerade durchlaufen. Er gliedert die Ausbildung in drei Stufen: Stufe 1 (Allgemeine Ausbildung, die Sie gerade machen), Stufe 2 (Zusatzausbildung für spezielle Gerätetypen) und Stufe 3 (betriebliche Ausbildung direkt bei Ihrem Arbeitgeber).',
  20:'Stufe 1, die allgemeine Ausbildung, besteht aus einem theoretischen Teil (Sicherheitsbestimmungen, Betriebsanleitungen, Gerätetechnik – das, was Sie gerade lernen) und einem praktischen Teil (Aufnehmen, Transportieren, Absetzen und Stapeln von Lasten, Umgang mit gängigen Anbaugeräten). Beide Teile enden mit einer Abschlussprüfung, nach der Sie ein Zertifikat erhalten.',
  21:'Stufe 2 ist eine Zusatzausbildung, die nur nötig ist, wenn Sie mit speziellen Flurförderzeugen arbeiten sollen, die über den normalen Gabelstapler hinausgehen – z.B. Containerstapler, Regalflurförderzeuge, Quergabelstapler, Teleskopstapler oder besondere Anbaugeräte. Auch diese Zusatzausbildung endet mit einer Abschlussprüfung und einem eigenen Zertifikat.',
  22:'Stufe 3, die betriebliche Ausbildung, findet direkt bei Ihrem Arbeitgeber statt und hat zwei Teile: den gerätebezogenen Teil (die tatsächlich in Ihrem Betrieb vorhandenen Flurförderzeuge und Anbaugeräte sowie die betrieblichen Gegebenheiten) und den verhaltensbezogenen Teil (die Verhaltensweisen laut der Betriebsanweisung Ihres Arbeitgebers). Die Durchführung muss dokumentiert werden – erst danach darf Ihr Arbeitgeber Sie schriftlich mit dem selbstständigen Fahren beauftragen.',
  24:'In diesem Kapitel geht es darum, wer überhaupt Flurförderzeuge führen darf: welche formalen Voraussetzungen gelten, welche körperlichen, geistigen und charakterlichen Eigenschaften Sie mitbringen müssen, und wie die abschließende Beauftragung durch Ihren Arbeitgeber abläuft.',
  25:'Um Flurförderzeuge selbstständig führen zu dürfen, müssen vier Voraussetzungen gleichzeitig erfüllt sein: Sie müssen mindestens 18 Jahre alt sein, für die Tätigkeit geeignet und ausgebildet sein, Ihre Befähigung nachgewiesen haben (z.B. durch das Zertifikat aus dieser Ausbildung), und schriftlich von Ihrem Unternehmer beauftragt worden sein. Eine bloße Mitgliedschaft in einer Gewerkschaft oder ähnliches reicht nicht aus – es zählen ausschließlich diese vier Punkte.',
  26:'Zur körperlichen Eignung gehören: ausreichende Sehschärfe für den sicheren Fahrbetrieb, ein funktionierendes Hörvermögen, um akustische Warnsignale zu erkennen, räumliches Sehen zum Einschätzen von Abständen, und ausreichende Beweglichkeit der Gliedmaßen für eine gute Reaktionsfähigkeit. Nicht gefordert ist dagegen z.B. eine überdurchschnittliche Körpergröße.',
  27:'Neben der körperlichen Eignung wird von Staplerfahrern erwartet: Verständnis für technische und physikalische Zusammenhänge (z.B. Standsicherheit, Hebelgesetz), die Fähigkeit, Signale zu erkennen und richtig umzusetzen, sowie Verantwortungsbewusstsein, Zuverlässigkeit und umsichtiges Handeln. Die körperliche Eignung wird üblicherweise durch eine arbeitsmedizinische Vorsorgeuntersuchung nach dem Grundsatz G25 festgestellt.',
  28:'Erst wenn Ausbildung und Befähigungsnachweis vorliegen, darf der Unternehmer die Beauftragung erteilen – und das nur schriftlich, z.B. in Form eines innerbetrieblichen Fahrausweises. Wichtig: Diese Beauftragung gilt ausschließlich für den Betrieb, der sie ausgestellt hat, und kann nicht auf ein anderes Unternehmen übertragen werden. Wechseln Sie den Arbeitgeber, brauchen Sie dort eine neue Beauftragung.',
  30:'In diesem Kapitel schauen wir uns das tatsächliche Unfallgeschehen genauer an: aktuelle Unfallzahlen, die beiden großen Unfallschwerpunkte, und danach jeweils im Detail Anfahrunfälle und Kippunfälle.',
  31:'Diese drei Zahlen fassen das Risiko zusammen: über 20.000 Unfälle jährlich beim Umgang mit Flurförderzeugen in Deutschland, davon etwa 200 schwere Unfälle durch Fallen oder Kippen des Fahrzeugs, und 23 tödliche Unfälle pro Jahr. Das zeigt: Ein Stapler ist ein Arbeitsmittel mit echtem Gefahrenpotenzial, kein harmloses Werkzeug.',
  32:'Die beiden Unfallschwerpunkte haben unterschiedliche Ursachen: Anfahrunfälle entstehen vor allem durch Unachtsamkeit des Fahrers, eingeschränkte Sicht auf die Fahrbahn und räumliche Enge im Betrieb. Kippunfälle entstehen vor allem durch Fahren mit angehobener Last, Bodenunebenheiten und zu schnelles Kurvenfahren – und sie sind für über 50% aller tödlichen Staplerunfälle verantwortlich.',
  33:'Diese echten Unfallberichte zeigen typische Anfahrunfälle: In einem Fall übersah der Fahrer beim Rückwärtsfahren eine neben ihm stehende Person und fuhr ihr über den Fuß. In einem anderen Fall ging der Verletzte zum Stapler, um den Fahrer etwas zu fragen – der Fahrer bemerkte ihn nicht und fuhr los. Beide Fälle zeigen: Vor jeder Fahrbewegung erst umschauen, hupen, Blickkontakt suchen. Klare Verkehrsregeln, Spiegel und Warnanlagen helfen zusätzlich.',
  34:'Diese Statistik enthält eine überraschende, aber wichtige Erkenntnis: Bei mehr als 80% der tödlichen Kippunfälle war der Stapler unbeladen. Das widerlegt den Irrglauben, Kippgefahr bestehe nur bei schweren Lasten – tatsächlich unterschätzen viele Fahrer gerade den unbeladenen Stapler, obwohl auch er bei zu schnellem Kurvenfahren oder auf unebenem Boden kippen kann. Deshalb gilt unabhängig von der Beladung: Last (falls vorhanden) absenken, Bodenunebenheiten melden, Kurvengeschwindigkeit anpassen und die Fahrerrückhalteeinrichtung immer nutzen.',
  37:'In diesem Kapitel geht es um das sichere Lagern und Stapeln mit dem Stapler: welche Lagereinrichtungen und -geräte es gibt, welche Anforderungen beim Lagern und Stapeln gelten, wie in Regalen gelagert wird, welche Verhaltensweisen beim Ein- und Auslagern wichtig sind, und was bei Schäden an Lagereinrichtungen zu tun ist.',
  38:'Die beiden gängigsten Ladehilfsmittel haben unterschiedliche Belastungsgrenzen: Eine Flachpalette (Europalette) darf mit 1000–1500 kg belastet werden; bei Blocklagerung (Paletten übereinander) gilt: die unterste Palette darf maximal das Vierfache der zulässigen Last tragen. Eine Gitterbox darf max. 1000 kg Nutzlast haben und bei gleichmäßig verteilter Last höchstens fünffach übereinandergestapelt werden.',
  39:'Regale dürfen nicht beliebig belastet werden: Am Regal selbst ist die zulässige Belastung für Regalfach und Regalfeld angegeben (z.B. auf einem Belastungsschild) – diese Werte sowie die zulässigen Fach- und Feldlasten müssen eingehalten werden. Regale sind außerdem regelmäßig auf Schäden zu prüfen, z.B. verbogene Regalständer, und solche Schäden müssen sofort gemeldet werden.',
  40:'Beim Lagern in Regalen gilt: In den obersten Ablagen müssen stirnseitig mindestens 0,5 m hohe Sicherungseinrichtungen gegen Herabfallen vorhanden sein. Ladeeinheiten dürfen nicht stoßartig in Palettenregale abgestellt werden. Zum Heben über 1,80 m darf nur ein Stapler mit Fahrerschutzdach verwendet werden, und Lasten dürfen nur auf ausreichend tragfähigem Untergrund abgesetzt werden.',
  41:'Auch der Stapler selbst muss zur Aufgabe passen: Zum Heben von Lasten höher als 1,80 m über Flur darf nur ein Stapler mit Fahrerschutzdach eingesetzt werden. Außerdem muss der Stapler grundsätzlich für die zu tragende Last geeignet sein, und seine zulässige Tragfähigkeit darf niemals überschritten werden – dazu mehr im Kapitel zum Traglastdiagramm.',
  42:'Beim Ein- und Auslagern gilt: Der Hubmast darf nur zum Aufnehmen und Absetzen der Last nach vorne geneigt werden, nicht beim Fahren. Nicht ordnungsgemäß gepackte Lasten dürfen nicht gestapelt werden, und Ladeeinheiten mit beschädigten Paletten dürfen nicht auf höher gelegenen Stellen abgesetzt werden. Grundsätzlich dürfen Lasten nur auf ausreichend tragfähigem Untergrund standsicher abgesetzt werden.',
  43:'Bestimmte Bereiche dürfen niemals durch abgestellte Lasten blockiert werden, weil sie im Notfall frei zugänglich sein müssen: Fluchtwege, Notausgänge, Feuerlöscheinrichtungen, Erste-Hilfe-Einrichtungen und alle Betriebseinrichtungen, die jederzeit zugänglich sein müssen (z.B. Elektroverteilungen).',
  44:'Schäden an Lagereinrichtungen wie Regalen (z.B. verbogene Regalständer) müssen sofort gemeldet werden – das beschädigte Regal darf erst wieder genutzt werden, nachdem es instandgesetzt wurde. Auch fehlende oder beschädigte Aushebesicherungen an Regalträgern (die verhindern, dass sich Träger unbeabsichtigt aus der Verankerung heben) müssen gemeldet und ersetzt werden.',
  46:'In diesem Kapitel geht es um Verkehrswege: die erforderlichen Abmessungen von Wegen im Betrieb, allgemeine Anforderungen an Verkehrswege, die besonderen Regeln in Schmalgängen, und was beim Fahren auf öffentlichen Verkehrswegen gilt.',
  47:'Es dürfen ausschließlich Verkehrswege befahren werden, die vom Unternehmer ausreichend bemessen, festgelegt und freigegeben wurden. Bereiche, die für Stapler gesperrt sind, müssen durch entsprechende Verbotsschilder eindeutig gekennzeichnet sein – ein solches Schild ist immer verbindlich zu beachten.',
  48:'Bei Einbahnverkehr richtet sich die Mindestbreite eines Verkehrsweges nach der Breite des Flurförderzeugs bzw. der Ladung, zuzüglich eines Randzuschlags von 0,5 m auf beiden Seiten. Dieser Randzuschlag ist nötig, damit auch bei kleinen Lenkungenauigkeiten kein Kontakt mit Wänden, Regalen oder anderen Hindernissen entsteht.',
  49:'Begegnen sich zwei Flurförderzeuge auf demselben Weg (Gegenverkehr), kommt zum beidseitigen Randzuschlag von 0,5 m zusätzlich ein Begegnungszuschlag von 0,4 m zwischen den beiden Fahrzeugen bzw. Lasten hinzu. Der Verkehrsweg muss also insgesamt entsprechend breiter ausgelegt sein als bei reinem Einbahnverkehr.',
  50:'Wird derselbe Verkehrsweg gleichzeitig auch von Fußgängern genutzt (Gehverkehr), erhöht sich der Randzuschlag beidseitig von 0,5 m auf 0,75 m – denn Fußgänger brauchen mehr Sicherheitsabstand zum Fahrzeug als es rein technisch für die Fahrzeugbreite nötig wäre. Der Begegnungszuschlag von 0,4 m zwischen den Fahrzeugen bleibt dabei gleich.',
  51:'An Verkehrswege werden mehrere Anforderungen gestellt: Der Boden muss mindestens 1700 kg/m² tragen können, vor Türen, Toren und Durchgängen ist ein Sicherheitsabstand von mindestens 1 m einzuhalten, Bodenunebenheiten und Hindernisse müssen gemeldet und beseitigt werden, an Kreuzungen müssen eindeutige Vorfahrtsregeln gelten (z.B. rechts vor links), und es muss ausreichende Beleuchtung vorhanden sein.',
  52:'Bei Pendeltoren darf nur eingefahren werden, wenn ausreichende Durchsicht gewährleistet ist – im Zweifel die Durchfahrt vorher durch Hupen ankündigen. Ladebrücken müssen ausreichend breit (Flurförderzeugbreite plus 0,70 m) und tragfähig sein. Und ganz grundsätzlich: Verkehrswege müssen freigehalten werden und dürfen nicht mit abgestellten Waren zugestellt werden.',
  53:'In Schmalgängen (Regalgängen, in denen kaum Platz neben dem Stapler ist) braucht es besonderen Personenschutz: bauliche Maßnahmen wie Zäune oder Mauern, die Fußgängern den Zugang verwehren, Warnanlagen wie Lichtschranken, die bei Betreten Alarm auslösen, Sensoren bzw. Laserscanner am Stapler selbst, die den Fahrbereich überwachen, und die Verhaltensregel, nur einzufahren, wenn erkennbar keine Fußgänger im Gang sind.',
  54:'Auf öffentlichen Verkehrswegen gelten für Flurförderzeuge zusätzlich zur Unfallverhütungsvorschrift „Flurförderzeuge" die allgemeinen Straßenverkehrsgesetze: das Straßenverkehrsgesetz (StVG), die Straßenverkehrs-Ordnung (StVO), die Straßenverkehrs-Zulassungs-Ordnung (StVZO) und die Fahrerlaubnisverordnung (FeV).',
  55:'Um auf öffentlichen Straßen fahren zu dürfen, brauchen Sie zusätzlich zur Staplerfahrerausbildung einen Fahrauftrag und die passende Fahrerlaubnis. Seit dem 1.1.1999 gilt: Klasse L reicht für Fahrzeuge unter 25 km/h (unabhängig vom zulässigen Gesamtgewicht) – das betrifft die meisten Stapler im Werksverkehr. Schnellere Fahrzeuge benötigen je nach zulässigem Gesamtgewicht Klasse B (unter 3,5 t) oder Klasse C (über 3,5 t).',
  58:'In diesem Kapitel geht es um die Physik hinter der Standsicherheit: die Bauweise des Staplers, Schwerpunkt und seine Bedeutung, das Hebelgesetz und die Kippachse, Traglastdiagramme mit Übungsbeispielen, das sogenannte Kippkantendreieck, und zum Schluss eine Zusammenfassung der wichtigsten Verhaltensweisen.',
  59:'Beim Stapler befinden sich Lastaufnahmemittel und Last vor der Vorderachse. Damit das Fahrzeug nicht nach vorne kippt, bildet das Eigengewicht des Staplers – vor allem das Gegengewicht am Heck – das Gegengewicht zur Last auf der Gabel. Staplergewicht und Lastgewicht müssen dabei im Gleichgewicht stehen: Ist die Last zu schwer oder zu weit vorne, kippt der Stapler.',
  60:'Der Staplerschwerpunkt liegt etwa auf Höhe des Fahrersitzes und – beim unbeladenen Stapler – nahe an den seitlichen Kippkanten, was ihn anfälliger für Kippen macht als man vermuten würde. Der Lastschwerpunkt ist der gedachte Punkt, in dem sich die Masse der Last vereinigt; er wandert beim Anheben der Last nach oben. Last- und Staplerschwerpunkt zusammen ergeben den Gesamtschwerpunkt, der über die Standsicherheit entscheidet.',
  61:'Die Vorderachse des Staplers ist die Kippachse. Es gilt das Prinzip einer Wippe: Kraft mal Kraftarm muss gleich Last mal Lastarm sein. Damit der Stapler beim Betrieb stabil bleibt, muss das Produkt auf der Staplerseite (Eigengewicht × Hebelarm) immer größer sein als auf der Lastseite. Deshalb gilt: Last möglichst nah am Gabelrücken aufnehmen, um den Lastarm – und damit das kippende Moment – klein zu halten.',
  62:'Wandert der Gesamtschwerpunkt über die Vorderachse (Kippachse) hinaus, kippt der Stapler nach vorne. Um das zu verhindern: Last bis zum Gabelrücken aufnehmen, den Gesamtschwerpunkt möglichst niedrig halten (Last nicht unnötig hoch anheben) und die Geschwindigkeit in Kurven anpassen. Auch hier gilt wieder: über 80% der tödlichen Kippunfälle passierten mit unbeladenem Stapler – Vorsicht gilt also immer, nicht nur bei schweren Lasten.',
  63:'Jeder Stapler ist für eine bestimmte Nenntragfähigkeit gebaut, die der Hersteller auf dem Fabrikschild angibt. Diese Angabe gilt aber nur für eine genormte Hubhöhe und einen festgelegten Lastschwerpunktabstand. Die tatsächliche Tragfähigkeit in einer konkreten Situation hängt zusätzlich vom tatsächlichen Lastschwerpunktabstand und der tatsächlichen Hubhöhe ab und muss dem Traglastdiagramm entnommen werden.',
  64:'Das Traglastdiagramm zeigt auf der X-Achse den Lastschwerpunktabstand in mm und auf der Y-Achse die zulässige Last in kg; jede Linie im Diagramm steht für eine andere Hubhöhe. Je weiter die Last vom Gabelrücken entfernt ist und je höher gehoben wird, desto geringer ist die zulässige Last. Im E-Learning können Sie das Diagramm später interaktiv mit Reglern selbst ausprobieren.',
  65:'Beim Kurvenfahren wirkt seitlich die Fliehkraft auf den Stapler – und diese Kraft steigt nicht linear, sondern quadratisch mit der Geschwindigkeit: Eine Verdoppelung der Geschwindigkeit vervierfacht die Fliehkraft. Besonders gefährlich sind Kurvenfahrten mit dem unbeladenen Stapler, weil dessen Schwerpunkt nahe an den seitlichen Kippkanten liegt. Deshalb gilt: Kurven immer mit angepasster, niedriger Geschwindigkeit und möglichst großem Radius durchfahren.',
  66:'Anders als ein PKW, der auf vier Rädern ein Standviereck bildet, steht ein Dreiradstapler nur auf einem Standdreieck – die Kippkanten verlaufen von den Vorderrädern zu einem Punkt an der Hinterachse. Beim unbeladenen Stapler liegt der Schwerpunkt nahe an den seitlichen Kippkanten dieses Dreiecks, was die Kippgefahr erhöht. Eine bodennah aufgenommene Last erhöht die Standsicherheit, eine angehobene Last verringert sie wieder.',
  67:'Auch ein Vierradstapler bildet trotz seiner vier Räder rechnerisch ein Standdreieck, weil die Hinter- bzw. Lenkachse pendelnd nur an einem einzigen Punkt am Fahrgestell befestigt ist (Pendelachse). Die Mitte dieser pendelnden Achse bildet die Spitze des Standdreiecks. Ergebnis: Ein Vierradstapler hat grundsätzlich dieselbe Kippgefahr wie ein Dreiradstapler – der vierte Radkontakt bringt keine zusätzliche Stabilität gegen seitliches Kippen.',
  68:'Als Zusammenfassung die wichtigsten Verhaltensweisen für die Standsicherheit: Stapler nicht überlasten, Lasten bis zum Gabelrücken aufnehmen, die Höhe des Gesamtschwerpunktes klein halten, Kurven mit angepasster Geschwindigkeit und möglichst großem Radius durchfahren, und starkes Beschleunigen sowie Bremsen vermeiden.',
  70:'In diesem Kapitel geht es um den praktischen Staplerbetrieb: die verschiedenen Arten von Flurförderzeugen und ihre Antriebsarten, Betriebsanleitung und Betriebsanweisung, die tägliche Einsatzprüfung, das Aufnehmen, Beladen und Absetzen von Lasten, das Verfahren von Lasten inklusive Sichtverhältnisse, und das richtige Verlassen des Staplers.',
  71:'Es gibt viele verschiedene Bauarten von Flurförderzeugen für unterschiedliche Einsatzzwecke: der klassische Gabelstapler (Gegengewichtsstapler) als Allzweckgerät für Lager und Außeneinsatz, der Schubmaststapler für schmale Gänge (der Mast wird zur Lastaufnahme nach vorne ausgeschoben), der Kommissionierstapler (der Fahrer fährt mit der Plattform selbst in die Höhe) und der Containerstapler für schwere Lasten im Containerbetrieb.',
  72:'Elektromotoren sind geräuscharm und stoßen keine Abgase aus, haben aber Ladezeiten der Batterie und eine dadurch begrenzte Einsatzdauer – gut geeignet für den Einsatz in geschlossenen Räumen. Verbrennungsmotoren bieten eine hohe Antriebsleistung, sind aber in geschlossenen Räumen wegen der Abgase nur bedingt einsetzbar.',
  73:'Bei Flüssiggas-Staplern gilt: nur in ausreichend durchlüfteten Räumen abstellen, mindestens 3 m Abstand zu Öffnungen von Kellerräumen, Kanälen oder Gruben einhalten (da Flüssiggas schwerer als Luft ist und sich dort ansammeln kann), und die Anlage regelmäßig überprüfen. Bei Diesel-Staplern in geschlossenen Räumen ist schwefelarmer Kraftstoff zu verwenden, ein Wartungskonzept einzuhalten und eine Abgasreinigung (z.B. Partikelfilter) erforderlich; bei Gasstaplern in Räumen ist zusätzlich ein Katalysator und regelmäßige CO-Messung vorgeschrieben.',
  74:'Abgestellte Wechselaufbauten (z.B. Lkw-Aufbauten oder Container ohne Fahrgestell) dürfen nur mit dem Stapler befahren werden, wenn sie für die auftretenden Belastungen ausgelegt sind, die Aufstellfläche ausreichend tragfähig ist und der Aufbau gegen Kippen gesichert ist. Fehlt eine dieser drei Voraussetzungen, darf nicht hineingefahren werden.',
  75:'Während des Betriebs darf der Stapler nur von den dafür vorgesehenen Steuerplätzen aus bedient werden, und bei jeder Aktion muss darauf geachtet werden, dass keine Personen gefährdet werden. Auf- und Absteigen ist nur bei stillstehendem Fahrzeug erlaubt. Absolut verboten ist es, sich auf der Last, unter einer angehobenen Last oder unter einem angehobenen Lastaufnahmemittel aufzuhalten – das gilt auch für kurze Handgriffe.',
  77:'Fahrerrückhalteeinrichtungen verhindern, dass der Fahrer bei einem Kippunfall aus dem Stapler herausgeschleudert wird – das ist besonders gefährlich, weil der Fahrer dann meist unter dem Stapler eingequetscht wird. Es gibt verschiedene Bauarten: die geschlossene Fahrerkabine (Türen müssen während des Betriebs geschlossen sein), Bügeltüren, den Beckengurt (erst gurten, dann starten – die kostengünstigste Lösung) und ein Netz mit Schwenkbügel. Welche Einrichtung vorhanden ist, hängt vom Stapler ab – wichtig ist, sie immer zu benutzen.',
  78:'Vor Einsatzbeginn muss der Fahrer den Stapler nach den Vorgaben der Betriebsanleitung prüfen (tägliche Einsatzprüfung). Werden dabei sicherheitsbeeinträchtigende Mängel festgestellt, darf der Stapler nicht in Betrieb genommen werden. Mängel sind dem Unternehmer oder Vorgesetzten zu melden und dürfen nur von fachkundigen Personen (z.B. Monteuren des Herstellers) beseitigt werden – nicht vom Fahrer selbst.',
  79:'Sicherheitsmängel, auf die bei der täglichen Einsatzprüfung besonders zu achten ist: schadhafte Reifen oder falscher Luftdruck, unwirksame Betriebs- oder Feststellbremse, ausgeschlagene oder verformte Gabelzinkenaufhängungen, defekte Sicherungen gegen Herausheben oder Verschieben der Gabelzinken, Risse an tragenden Teilen wie dem Hubmast, Leckagen im Bereich der Hydraulik sowie verbogene, rissige oder stark abgeschliffene Gabelzinken. Jeder dieser Mängel bedeutet: Stapler nicht in Betrieb nehmen, sondern melden.',
  80:'Die sieben Schritte beim Aufnehmen einer Last: gerade vor die Last fahren, Hubmast senkrecht stellen, Gabelzinken langsam einfahren und Last bis zum Gabelrücken aufnehmen, Last bodenfrei anheben, Hubmast zurückneigen, vor der Rückwärtsfahrt beidseitig nach hinten schauen, und erst dann langsam rückwärts fahren.',
  81:'Die sieben Schritte beim Absetzen einer Last im Regal: ans Regal heranfahren, Hubmast senkrecht stellen, Last leicht anheben, in das Regal einfahren, Last absetzen, beidseitig nach hinten schauen und vom Regal zurückstoßen, und zum Schluss Gabelzinken absenken, Hubmast zurückneigen und wegfahren.',
  82:'Beim Verfahren von Lasten gilt: mit zurückgeneigtem Hubmast fahren, das Lastaufnahmemittel nur bodenfrei anheben (max. 50 cm), bei zu großer Last einweisen lassen oder rückwärts fahren, in Fahrtrichtung dürfen nicht mehr als 10 m des Bodens verdeckt sein, auf Steigungen und Gefällen die Last immer bergseitig führen, und auf Gefällstrecken niemals wenden – hohe Kippgefahr!',
  83:'Die Fahrgeschwindigkeit muss immer den betrieblichen Gegebenheiten angepasst werden, Kurven sind grundsätzlich langsam zu durchfahren – ein Großteil der tödlichen Unfälle entsteht durch zu hohe Fahrgeschwindigkeit. Die Sicht muss so gut sein, dass durch die Last nicht mehr als 10 m Boden in Fahrtrichtung verdeckt sind. Grundsatz: Es darf nur verfahren werden, wenn der Fahrer ausreichende Sicht hat – notfalls einweisen lassen.',
  85:'Beim Verlassen des Staplers ist zuerst die Feststellbremse zu betätigen (auch bei nur kurzem Verlassen), dann die Gabelzinken in die tiefste Stellung absenken und die Spitzen nach unten neigen, den Motor abstellen, den Schlüssel abziehen und mitnehmen (damit niemand Unbefugtes den Stapler nutzen kann), und sicherstellen, dass der abgestellte Stapler kein Hindernis auf Verkehrs- und Fluchtwegen darstellt.',
  86:'Beim Befahren von Aufzügen mit dem Stapler: die Tragfähigkeit des Aufzuges beachten, nur freigegebene Aufzüge benutzen, vom Stapler absteigen und sich im Bereich der Steuerung aufhalten, den Stapler mittig im Aufzug abstellen, die Feststellbremse betätigen und einen ausreichenden Abstand von mindestens 0,1 m zu den Fahrschachtwänden einhalten.',
  87:'Beim Be- und Entladen von Fahrzeugen (Lkw, Anhänger) müssen diese gegen Rollen und gegebenenfalls Kippen gesichert sein – üblicherweise durch Feststellbremse plus Unterlegkeile vor den nicht gelenkten Rädern. Bei Sattelanhängern können zusätzliche Stützeinrichtungen nötig sein. Fahrer und Staplerfahrer müssen sich vor dem Be-/Entladen verständigen, und Fahrzeugbewegungen während des Ladevorgangs müssen sicher verhindert werden.',
  88:'Anhänger mit Drehschemel-Lenkung (bei denen sich die komplette Vorderachse verdreht) haben eine besondere Kippgefahr: Vor dem Be- oder Entladen muss die Vorderachse unbedingt gerade ausgerichtet werden, sonst kann der Anhänger kippen. Auch hier gilt: Verständigung zwischen Staplerfahrer und Fahrzeugführer, und Fahrzeugbewegungen während des Ladevorgangs verhindern.',
  90:'In diesem Kapitel geht es um besondere Einsatzsituationen: den Einsatz von Anbaugeräten, die Mitnahme von Personen, das Verfahren von Anhängern und Schienenfahrzeugen, den Einsatz von Arbeitsbühnen und den Transport hängender Lasten.',
  91:'Anbaugeräte (z.B. Schaufeln, Klammern, Dorne) dürfen nur eingesetzt werden, wenn Anbaugerät und Stapler aufeinander abgestimmt sind – z.B. bei Tragfähigkeit, Befestigung und Energiezufuhr. Das Anbaugerät muss bestimmungsgemäß befestigt werden, weder die Tragfähigkeit des Anbaugerätes noch die des Staplers dürfen überschritten werden, und Anbaugeräte müssen regelmäßig geprüft werden.',
  92:'Die Mitnahme von Personen auf dem Stapler ist nur zulässig, wenn sie durch die Betriebsanweisung ausdrücklich geregelt ist, geeignete Sitz- oder Standplätze sowie Haltegriffe vorhanden sind, und eine zusätzliche Fahrerrückhalteeinrichtung für die mitfahrende Person vorhanden ist. Fehlt auch nur eine dieser Voraussetzungen, ist die Mitnahme von Personen nicht zulässig.',
  93:'Anhänger dürfen mit dem Stapler nur verfahren werden, wenn der Zug bei allen Bewegungen sicher gebremst werden kann, Stapler und Anhänger für den Anhängerbetrieb eingerichtet sind (z.B. mit passender Anhängevorrichtung), und die zulässige Anhängelast bekannt ist und nicht überschritten wird.',
  94:'Schienenfahrzeuge dürfen mit dem Stapler nur unter besonderen Voraussetzungen mit Seilen verzogen werden – z.B. mit einer Slip-Kupplung, die sich bei Überlastung löst. Voraussetzungen: Der Stapler befindet sich außerhalb des Fahrbereiches des Schienenfahrzeuges, der Staplerfahrer kann den Gleisbereich beobachten oder wird eingewiesen, und es ist eine Bremseinrichtung vorhanden.',
  95:'Das Drücken von Schienenfahrzeugen mit dem Stapler ist nur zulässig, wenn der Stapler dafür eingerichtet ist (z.B. mit einer Druckbohle), spezielle Rangiergeräte verwendet werden, der Staplerfahrer eingewiesen ist und eine Bremseinrichtung vorhanden ist. Ausdrücklich NICHT zulässig ist das Drücken mit losen Stempeln oder direkt mit Teilen des Staplers (z.B. den Gabelzinken) – das kann zu schweren Unfällen führen.',
  97:'Das Hochfahren von Personen mittels Stapler (also der Einsatz einer Arbeitsbühne) ist nur zulässig, wenn ein ausreichend tragfähiger Stapler und eine vorschriftsmäßige Arbeitsbühne verwendet werden. Das bloße Stehen auf den Gabelzinken oder einer Palette ohne geprüfte Arbeitsbühne ist ausdrücklich unzulässig.',
  98:'Eine vorschriftsmäßige Arbeitsbühne muss ausgestattet sein mit: einer Absturzsicherung aus Hand-, Knie- und Fußleiste, einem durchgriffsicheren Rückenschutz (schützt vor Quetschgefahren am Hubmast), Einfahrtaschen an der Unterseite (zur sicheren Aufnahme durch die Gabelzinken), einer Sicherung gegen Verrutschen auf den Gabelzinken, und die Zugangstür darf sich nur nach innen öffnen lassen.',
  99:'Beim Einsatz von Arbeitsbühnen gilt: einwandfreie Verständigung zwischen Fahrer und den Personen in der Arbeitsbühne, der Fahrer darf seinen Platz bei hochgefahrener Arbeitsbühne NICHT verlassen, der Standplatz auf der Arbeitsbühne darf NICHT durch Hilfsmittel (z.B. eine Leiter) erhöht werden, und der Stapler darf bei besetzter und angehobener Arbeitsbühne nur zur Feinpositionierung verfahren werden – keine normalen Fahrbewegungen.',
  100:'Der Transport hängender Lasten (an Seilen oder Ketten) ist wegen der hohen Kippgefahr nur mit dafür geeigneten, ausreichend standsicheren Staplern zulässig. Personen, die die hängende Last mit Halteseilen führen, dürfen sich dabei nicht in der Fahrspur des Staplers befinden. Pendelbewegungen der hängenden Last können durch spezielle Anbaugeräte eingeschränkt werden.',
  102:'In diesem letzten Kapitel geht es um Prüfungen und Wartung: die tägliche Einsatzprüfung (die Sie schon kennen), regelmäßige Prüfungen durch befähigte Personen, den Prüfnachweis und die Prüfplakette.',
  103:'Zusätzlich zur täglichen Einsatzprüfung durch den Fahrer müssen Stapler und Anbaugeräte in regelmäßigen Abständen von einer befähigten Person überprüft werden – z.B. einem Werkstattmeister oder Monteuren des Herstellers. Die genauen Prüffristen werden im Rahmen einer Gefährdungsbeurteilung festgelegt; eine bewährte Prüffrist ist längstens ein Jahr.',
  104:'Über die wiederkehrenden Prüfungen muss ein Prüfnachweis geführt werden, z.B. in einem Prüfbuch. Darin müssen enthalten sein: Datum und Umfang der Prüfung, das Ergebnis mit Angabe eventueller Mängel, Angaben über notwendige Nachprüfungen, Name und Anschrift des Prüfers, und ein Vermerk über die Beseitigung der Mängel.',
  105:'Am Stapler kann eine Prüfplakette auf die nächste fällige Prüfung hinweisen. Wichtig dabei: Die Plakette sollte erst angebracht werden, wenn die bei der letzten Prüfung festgestellten sicherheitstechnischen Mängel tatsächlich beseitigt wurden – sonst könnte eine frische Plakette fälschlich einen mangelfreien Zustand suggerieren.'
};

var ERKLAERUNG_MAP_PL={
  3:'W tym rozdziale najpierw wyjaśnimy, kiedy prawnie w ogóle mamy do czynienia z wypadkiem przy pracy. Następnie omówimy, jakie konsekwencje prawne może mieć dla Pana/Pani jako kierowcy wypadek przy pracy – karne, w prawie wykroczeń, pracownicze oraz tzw. regres.',
  4:'Wypadek przy pracy w sensie prawnym zachodzi tylko wtedy, gdy spełnione są jednocześnie trzy warunki: musi chodzić o osobę ubezpieczoną (np. pracownika), która wykonywała ubezpieczoną czynność (a więc w ramach swojej pracy), i przy tym rzeczywiście doznała szkody na zdrowiu. Jeśli brakuje choćby jednego z tych trzech warunków, prawnie nie mamy do czynienia z wypadkiem przy pracy – nawet jeśli coś się wydarzyło. Jest to ważne, ponieważ od tego zależy, czy koszty pokryje kasa ubezpieczeń wypadkowych.',
  5:'Te liczby pokazują, jak poważny jest to temat: ponad 20 000 wypadków rocznie tylko przy obsłudze wózków widłowych w Niemczech, z czego około 200 z ciężkimi obrażeniami wskutek upadku lub przewrócenia się pojazdu, a średnio 3 do 5 wypadków śmiertelnych rocznie tylko w handlu hurtowym i magazynowaniu. Łącznie każdego roku umiera 23 osoby w wypadkach z wózkami widłowymi. Wózek widłowy nie jest więc nieszkodliwym narzędziem pracy, lecz jednym z najbardziej niebezpiecznych, jeśli nie jest prowadzony ostrożnie.',
  6:'Statystyka pokazuje dwa wyraźne punkty ciężkości, którymi zajmiemy się szczegółowo: wypadki najechania (wózek uderza osobę) oraz wypadki przewrócenia (wózek się przewraca). Te dwa rodzaje wypadków odpowiadają za większość ciężkich i śmiertelnych wypadków – dlatego przyjrzymy się obu szczegółowo.',
  7:'Te prawdziwe przykłady wypadków pokazują, jak szybko może dojść do wypadku najechania: krótka chwila nieuwagi, osoba w martwym polu widzenia, albo spontaniczne ruszenie bez wcześniejszego kontaktu wzrokowego – i już dochodzi do kolizji. Najczęstsze przyczyny to nieuwaga, ograniczona widoczność i zbyt mało miejsca. Proszę zapamiętać: przed każdym ruszeniem najpierw rozejrzeć się, zatrąbić i upewnić się, że nikt nie znajduje się w strefie zagrożenia.',
  8:'Wypadki przewrócenia zdarzają się wprawdzie rzadziej niż wypadki najechania, ale kończą się szczególnie często śmiercią – ponad połowa wszystkich śmiertelnych wypadków z wózkami widłowymi to wypadki przewrócenia. Zgodnie z DGUV Vorschrift 68 należą do nich między innymi: zbyt szybka jazda na zakręcie, jazda z podniesionym ładunkiem, najechanie na przeszkodę, zawracanie i jazda ukośna na pochyłościach, pochylenie masztu do przodu, jazda po nierównym podłożu, przeciążenie i silny wiatr. Dlatego obowiązuje zasada: podczas jazdy zawsze opuszczać ładunek, na zakrętach jechać wolno i zwracać uwagę na stan podłoża.',
  9:'Wypadek przy pracy może pociągnąć za sobą dla Pana/Pani jednocześnie kilka konsekwencji prawnych, które mogą działać niezależnie od siebie: skutki karne (np. przy rażącym niedbalstwie), grzywny na podstawie prawa wykroczeń, konsekwencje pracownicze ze strony pracodawcy oraz w najgorszym przypadku roszczenia regresowe kasy ubezpieczeń wypadkowych. Na kolejnych slajdach przyjrzymy się każdej z tych czterech kategorii osobno.',
  10:'Sytuacja robi się poważna pod względem karnym dopiero wtedy, gdy zbiegają się trzy rzeczy: wypadek doprowadził do obrażeń lub śmierci, u podstaw wypadku leżało bezprawne działanie, oraz działanie to było zawinione – czyli niedbałe albo nawet umyślne. Jeśli spełnione są wszystkie trzy punkty, grozi kara pozbawienia wolności lub grzywna. Zwykła, zgodna z przepisami jazda, podczas której mimo to zdarzy się coś nieprzewidzianego, z reguły nie prowadzi do konsekwencji karnych.',
  11:'Prawo wykroczeń jest o stopień łagodniejsze niż prawo karne i ma zapewnić przestrzeganie zasad, takich jak ochrona pracy. Wystarczy tu już niedbałe lub umyślne naruszenie przepisu zagrożonego grzywną – np. przepisu BHP kasy ubezpieczeń wypadkowych – aby narazić się na grzywnę. Nie musi przy tym nawet dojść do jakiejkolwiek szkody osobowej; samo naruszenie zasady już wystarczy.',
  12:'Jeśli naruszy Pan/Pani obowiązki wynikające z umowy o pracę (np. zakładowe przepisy bezpieczeństwa), pracodawca może zareagować na gruncie prawa pracy niezależnie od postępowania karnego czy o wykroczenie. Możliwe stopnie sięgają od zwykłego upomnienia, przez naganę i ostrzeżenie, aż po wypowiedzenie – w zależności od wagi i częstotliwości naruszenia.',
  13:'Regres oznacza: kasa ubezpieczeń wypadkowych zazwyczaj pokrywa koszty wypadku przy pracy, niezależnie od tego, kto zawinił. Tylko jeśli spowodował Pan/Pani wypadek w sposób rażąco niedbały, kasa może następnie zażądać zwrotu tych kosztów od Pana/Pani. Zasada odszkodowawcza z BGB, według której sprawca odpowiada bezpośrednio, tutaj z reguły nie obowiązuje – z wyjątkiem wypadków spowodowanych umyślnie.',
  15:'W tym rozdziale chodzi o kasę ubezpieczeń wypadkowych: czym jest i jakie ma zadania, jakie przepisy wydaje, który przepis dotyczy konkretnie Pana/Pani szkolenia na operatora wózków widłowych, i jak to szkolenie jest podzielone na trzy stopnie.',
  16:'Kasa ubezpieczeń wypadkowych jest nosicielem ustawowego ubezpieczenia wypadkowego. Istnieją trzy rodzaje: przemysłowe kasy ubezpieczeń wypadkowych (dla większości zakładów, także magazynów i logistyki), rolnicza kasa ubezpieczeń wypadkowych oraz nosiciele ubezpieczenia wypadkowego sektora publicznego (np. dla przedszkoli czy szkół). Dla Pana/Pani jako operatora wózka widłowego w zakładzie z reguły właściwa jest przemysłowa kasa ubezpieczeń wypadkowych.',
  17:'Kasa ubezpieczeń wypadkowych ma ustawowy obowiązek zapobiegania wszelkimi odpowiednimi środkami wypadkom przy pracy, chorobom zawodowym i zagrożeniom zdrowia związanym z pracą – na przykład poprzez doradztwo dla zakładów, szkolenia oraz publikację przepisów i zasad zawodowych, które Pan/Pani poznaje w ramach tego szkolenia.',
  18:'Zbiór przepisów kas ubezpieczeń wypadkowych dzieli się na cztery rodzaje dokumentów: Przepisy BG są prawnie wiążące, np. przepis BHP „Wózki widłowe". Zasady BG opisują, jak zwykle wdraża się dany przepis, np. stosowanie obuwia ochronnego. Informacje BG dają praktyczne wskazówki, np. dla operatorów wózków widłowych. A zasady zasadnicze BG określają np., jak musi być zbudowane takie szkolenie jak to.',
  19:'Dawny „BGG 925" nazywa się dziś „DGUV Grundsatz 308-001" i reguluje dokładnie szkolenie i upoważnienie operatorów wózków widłowych, które Pan/Pani właśnie przechodzi. Dzieli szkolenie na trzy stopnie: Stopień 1 (szkolenie ogólne, które Pan/Pani właśnie odbywa), Stopień 2 (szkolenie dodatkowe dla specjalnych typów urządzeń) i Stopień 3 (szkolenie zakładowe bezpośrednio u pracodawcy).',
  20:'Stopień 1, szkolenie ogólne, składa się z części teoretycznej (przepisy bezpieczeństwa, instrukcje obsługi, technika urządzeń – to, czego Pan/Pani właśnie się uczy) oraz części praktycznej (podnoszenie, transportowanie, odstawianie i układanie ładunków, obsługa typowych osprzętów). Obie części kończą się egzaminem końcowym, po którym otrzymuje Pan/Pani certyfikat.',
  21:'Stopień 2 to szkolenie dodatkowe, potrzebne tylko wtedy, gdy ma Pan/Pani pracować ze specjalnymi wózkami widłowymi wykraczającymi poza zwykły wózek widłowy – np. wózki do kontenerów, regałowe wózki widłowe, wózki z widłami poprzecznymi, wózki teleskopowe lub specjalne osprzęty. Także to szkolenie dodatkowe kończy się egzaminem i własnym certyfikatem.',
  22:'Stopień 3, szkolenie zakładowe, odbywa się bezpośrednio u pracodawcy i ma dwie części: część dotyczącą urządzenia (faktycznie występujące w zakładzie wózki widłowe i osprzęty oraz warunki zakładowe) oraz część dotyczącą zachowania (sposoby postępowania zgodnie z instrukcją zakładową pracodawcy). Przeprowadzenie musi zostać udokumentowane – dopiero potem pracodawca może pisemnie upoważnić Pana/Panią do samodzielnej jazdy.',
  24:'W tym rozdziale chodzi o to, kto w ogóle może prowadzić wózki widłowe: jakie wymagania formalne obowiązują, jakie cechy fizyczne, umysłowe i charakterologiczne musi Pan/Pani posiadać, i jak przebiega ostateczne upoważnienie przez pracodawcę.',
  25:'Aby móc samodzielnie prowadzić wózki widłowe, muszą być spełnione jednocześnie cztery warunki: musi Pan/Pani mieć co najmniej 18 lat, być odpowiednim i wyszkolonym do tej czynności, wykazać swoje kwalifikacje (np. certyfikatem z tego szkolenia), oraz być pisemnie upoważnionym przez swojego pracodawcę. Samo członkostwo w związku zawodowym lub podobne nie wystarczy – liczą się wyłącznie te cztery punkty.',
  26:'Do przydatności fizycznej należą: wystarczająca ostrość wzroku dla bezpiecznej jazdy, sprawny słuch do rozpoznawania sygnałów ostrzegawczych, widzenie przestrzenne do oceny odległości, oraz wystarczająca sprawność kończyn dla dobrej zdolności reakcji. Nie jest natomiast wymagany np. ponadprzeciętny wzrost ciała.',
  27:'Oprócz przydatności fizycznej od operatorów wózków widłowych oczekuje się: zrozumienia związków technicznych i fizycznych (np. stateczność, prawo dźwigni), zdolności rozpoznawania sygnałów i prawidłowego reagowania na nie, a także odpowiedzialności, rzetelności i rozważnego działania. Przydatność fizyczną stwierdza się zwykle poprzez profilaktyczne badanie medycyny pracy według zasady G25.',
  28:'Dopiero gdy dostępne jest szkolenie i dowód kwalifikacji, pracodawca może udzielić upoważnienia – i to wyłącznie pisemnie, np. w formie wewnątrzzakładowego dowodu uprawnień. Ważne: to upoważnienie obowiązuje wyłącznie dla zakładu, który je wystawił, i nie może zostać przeniesione na inne przedsiębiorstwo. Przy zmianie pracodawcy potrzebuje Pan/Pani tam nowego upoważnienia.',
  30:'W tym rozdziale przyjrzymy się dokładniej rzeczywistym wypadkom: aktualnym liczbom wypadków, dwóm głównym punktom ciężkości wypadków, a następnie szczegółowo wypadkom najechania i przewrócenia.',
  31:'Te trzy liczby podsumowują ryzyko: ponad 20 000 wypadków rocznie przy obsłudze wózków widłowych w Niemczech, z czego około 200 ciężkich wypadków wskutek upadku lub przewrócenia pojazdu, oraz 23 wypadki śmiertelne rocznie. To pokazuje: wózek widłowy jest środkiem pracy z realnym potencjałem zagrożenia, a nie nieszkodliwym narzędziem.',
  32:'Oba punkty ciężkości wypadków mają różne przyczyny: wypadki najechania powstają przede wszystkim wskutek nieuwagi kierowcy, ograniczonej widoczności jezdni i ciasnoty przestrzennej w zakładzie. Wypadki przewrócenia powstają przede wszystkim wskutek jazdy z podniesionym ładunkiem, nierówności podłoża i zbyt szybkiej jazdy na zakręcie – i odpowiadają za ponad 50% wszystkich śmiertelnych wypadków z wózkami widłowymi.',
  33:'Te prawdziwe raporty wypadkowe pokazują typowe wypadki najechania: w jednym przypadku kierowca podczas jazdy do tyłu nie zauważył stojącej obok osoby i przejechał jej po stopie. W innym przypadku poszkodowany podszedł do wózka, aby o coś zapytać kierowcę – kierowca go nie zauważył i ruszył. Oba przypadki pokazują: przed każdym ruchem jazdy najpierw rozejrzeć się, zatrąbić, nawiązać kontakt wzrokowy. Dodatkowo pomagają jasne zasady ruchu, lustra i instalacje ostrzegawcze.',
  34:'Ta statystyka zawiera zaskakujące, ale ważne spostrzeżenie: przy ponad 80% śmiertelnych wypadków przewrócenia wózek widłowy był nieobciążony. Obala to mylne przekonanie, że niebezpieczeństwo przewrócenia istnieje tylko przy ciężkich ładunkach – w rzeczywistości wielu kierowców niedocenia właśnie nieobciążonego wózka, choć i on może się przewrócić przy zbyt szybkiej jeździe na zakręcie lub na nierównym podłożu. Dlatego niezależnie od załadunku obowiązuje: opuszczać ładunek (jeśli jest), zgłaszać nierówności podłoża, dostosowywać prędkość na zakrętach i zawsze korzystać z urządzenia przytrzymującego kierowcę.',
  37:'W tym rozdziale chodzi o bezpieczne składowanie i sztaplowanie wózkiem widłowym: jakie są urządzenia i sprzęty magazynowe, jakie wymagania obowiązują przy składowaniu i sztaplowaniu, jak składuje się w regałach, jakie zachowania są ważne przy wkładaniu i wyjmowaniu, oraz co robić w przypadku uszkodzeń urządzeń magazynowych.',
  38:'Oba najpopularniejsze środki pomocnicze do ładunku mają różne granice obciążenia: paleta płaska (paleta euro) może być obciążona 1000–1500 kg; przy składowaniu blokowym (palety jedna na drugiej) obowiązuje: najniższa paleta może udźwignąć maksymalnie czterokrotność dopuszczalnego ładunku. Skrzyniopaleta może mieć maks. 1000 kg ładowności użytkowej i przy równomiernie rozłożonym ładunku może być piętrzona maksymalnie pięciokrotnie.',
  39:'Regałów nie wolno obciążać dowolnie: na samym regale podana jest dopuszczalna nośność dla półki i pola regału (np. na tabliczce obciążenia) – te wartości oraz dopuszczalne obciążenia półek i pól muszą być przestrzegane. Regały należy dodatkowo regularnie sprawdzać pod kątem uszkodzeń, np. wygiętych słupków regałowych, a takie uszkodzenia muszą być natychmiast zgłaszane.',
  40:'Przy składowaniu w regałach obowiązuje: na najwyższych półkach muszą być na przedzie zamontowane co najmniej 0,5 m wysokie zabezpieczenia przed spadaniem. Jednostek ładunkowych nie wolno odstawiać gwałtownie w regałach paletowych. Do podnoszenia powyżej 1,80 m wolno używać wyłącznie wózka z dachem ochronnym kierowcy, a ładunki wolno odstawiać wyłącznie na wystarczająco nośnym podłożu.',
  41:'Także sam wózek widłowy musi być dostosowany do zadania: do podnoszenia ładunków powyżej 1,80 m nad podłogą wolno używać wyłącznie wózka z dachem ochronnym kierowcy. Ponadto wózek musi zasadniczo nadawać się do przenoszonego ładunku, a jego dopuszczalna nośność nigdy nie może zostać przekroczona – więcej na ten temat w rozdziale o diagramie nośności.',
  42:'Przy wkładaniu i wyjmowaniu obowiązuje: maszt podnoszący wolno pochylać do przodu tylko podczas podnoszenia i odstawiania ładunku, nie podczas jazdy. Nieprawidłowo zapakowanych ładunków nie wolno piętrzyć, a jednostek ładunkowych z uszkodzonymi paletami nie wolno odstawiać na wyżej położonych miejscach. Zasadniczo ładunki wolno odstawiać stabilnie wyłącznie na wystarczająco nośnym podłożu.',
  43:'Pewnych obszarów nigdy nie wolno blokować odstawionymi ładunkami, ponieważ muszą być swobodnie dostępne w razie awarii: drogi ewakuacyjne, wyjścia awaryjne, urządzenia gaśnicze, urządzenia pierwszej pomocy oraz wszystkie urządzenia zakładowe, które muszą być dostępne przez cały czas (np. rozdzielnice elektryczne).',
  44:'Uszkodzenia urządzeń magazynowych, takich jak regały (np. wygięte słupki regałowe), muszą być natychmiast zgłaszane – uszkodzony regał wolno ponownie użytkować dopiero po naprawie. Także brakujące lub uszkodzone zabezpieczenia przed wysunięciem belek regałowych (które zapobiegają niezamierzonemu wysunięciu belek z zakotwiczenia) muszą być zgłaszane i wymieniane.',
  46:'W tym rozdziale chodzi o drogi transportowe: wymagane wymiary dróg w zakładzie, ogólne wymagania dotyczące dróg transportowych, szczególne zasady w wąskich korytarzach, oraz co obowiązuje przy jeździe po drogach publicznych.',
  47:'Wolno poruszać się wyłącznie po drogach transportowych, które zostały odpowiednio wymiarowane, wyznaczone i dopuszczone przez przedsiębiorcę. Obszary zamknięte dla wózków widłowych muszą być jednoznacznie oznaczone odpowiednimi znakami zakazu – taki znak jest zawsze wiążący.',
  48:'Przy ruchu jednokierunkowym minimalna szerokość drogi transportowej zależy od szerokości wózka widłowego lub ładunku, plus dodatek boczny 0,5 m po obu stronach. Ten dodatek boczny jest potrzebny, aby nawet przy niewielkich niedokładnościach kierowania nie doszło do kontaktu ze ścianami, regałami lub innymi przeszkodami.',
  49:'Gdy dwa wózki widłowe spotykają się na tej samej drodze (ruch przeciwny), do obustronnego dodatku bocznego 0,5 m dochodzi dodatkowo dodatek spotkania 0,4 m między obydwoma pojazdami lub ładunkami. Droga transportowa musi więc być odpowiednio szersza niż przy czystym ruchu jednokierunkowym.',
  50:'Jeśli ta sama droga transportowa jest jednocześnie używana przez pieszych (ruch pieszy), dodatek boczny zwiększa się obustronnie z 0,5 m do 0,75 m – ponieważ piesi potrzebują większego odstępu bezpieczeństwa od pojazdu niż wynikałoby to czysto technicznie z szerokości pojazdu. Dodatek spotkania 0,4 m między pojazdami pozostaje przy tym bez zmian.',
  51:'Wobec dróg transportowych stawia się kilka wymagań: podłoże musi udźwignąć co najmniej 1700 kg/m², przed drzwiami, bramami i przejściami należy zachować odstęp bezpieczeństwa co najmniej 1 m, nierówności podłoża i przeszkody muszą być zgłaszane i usuwane, na skrzyżowaniach muszą obowiązywać jednoznaczne zasady pierwszeństwa (np. prawo przed lewem), oraz musi być zapewnione wystarczające oświetlenie.',
  52:'Przez bramy wahadłowe wolno wjeżdżać tylko wtedy, gdy zapewniona jest wystarczająca widoczność – w razie wątpliwości wcześniej zapowiedzieć przejazd sygnałem dźwiękowym. Rampy załadunkowe muszą być wystarczająco szerokie (szerokość wózka widłowego plus 0,70 m) i nośne. I zupełnie zasadniczo: drogi transportowe muszą być utrzymywane w stanie wolnym i nie mogą być zastawiane odstawionym towarem.',
  53:'W wąskich korytarzach (przejściach między regałami, gdzie jest ledwo miejsca obok wózka) potrzebna jest szczególna ochrona osób: środki budowlane, takie jak ogrodzenia lub mury, uniemożliwiające dostęp pieszym, instalacje ostrzegawcze, takie jak kurtyny świetlne, wywołujące alarm przy wejściu, czujniki lub skanery laserowe na samym wózku, monitorujące obszar jazdy, oraz zasada postępowania, by wjeżdżać tylko wtedy, gdy widocznie nie ma pieszych w korytarzu.',
  54:'Na drogach publicznych dla wózków widłowych obowiązują dodatkowo do przepisu BHP „Wózki widłowe" ogólne ustawy o ruchu drogowym: ustawa o ruchu drogowym (StVG), kodeks drogowy (StVO), rozporządzenie o dopuszczeniu pojazdów do ruchu drogowego (StVZO) oraz rozporządzenie o prawie jazdy (FeV).',
  55:'Aby móc jeździć po drogach publicznych, potrzebuje Pan/Pani oprócz szkolenia na operatora wózka widłowego zlecenia jazdy i odpowiedniego prawa jazdy. Od 1.1.1999 obowiązuje: kategoria L wystarcza dla pojazdów poniżej 25 km/h (niezależnie od dopuszczalnej masy całkowitej) – dotyczy to większości wózków w ruchu zakładowym. Szybsze pojazdy wymagają w zależności od dopuszczalnej masy całkowitej kategorii B (poniżej 3,5 t) lub kategorii C (powyżej 3,5 t).',
  58:'W tym rozdziale chodzi o fizykę stojącą za statecznością: budowę wózka widłowego, środek ciężkości i jego znaczenie, prawo dźwigni i oś przewrócenia, diagramy nośności z przykładami ćwiczeniowymi, tzw. trójkąt krawędzi przewrócenia, oraz na koniec podsumowanie najważniejszych zasad postępowania.',
  59:'W wózku widłowym urządzenie do przenoszenia ładunku i sam ładunek znajdują się przed osią przednią. Aby pojazd nie przewrócił się do przodu, ciężar własny wózka – przede wszystkim przeciwwaga z tyłu – stanowi przeciwwagę dla ładunku na widłach. Ciężar wózka i ciężar ładunku muszą przy tym pozostawać w równowadze: jeśli ładunek jest zbyt ciężki lub zbyt daleko z przodu, wózek się przewraca.',
  60:'Środek ciężkości wózka widłowego znajduje się mniej więcej na wysokości siedzenia kierowcy i – przy nieobciążonym wózku – blisko bocznych krawędzi przewrócenia, co czyni go bardziej podatnym na przewrócenie, niż mogłoby się wydawać. Środek ciężkości ładunku to umowny punkt, w którym skupia się masa ładunku; przesuwa się on w górę przy podnoszeniu ładunku. Środek ciężkości ładunku i wózka razem dają środek ciężkości całkowity, który decyduje o stateczności.',
  61:'Oś przednia wózka widłowego jest osią przewrócenia. Obowiązuje zasada wagi: siła razy ramię siły musi być równe ładunkowi razy ramię ładunku. Aby wózek pozostał stabilny podczas pracy, iloczyn po stronie wózka (ciężar własny × ramię dźwigni) musi być zawsze większy niż po stronie ładunku. Dlatego obowiązuje: ładunek podnosić możliwie blisko oparcia wideł, aby ramię ładunku – a tym samym moment przewracający – utrzymać małym.',
  62:'Jeśli całkowity środek ciężkości przesunie się poza oś przednią (oś przewrócenia), wózek przewraca się do przodu. Aby temu zapobiec: ładunek podnosić aż do oparcia wideł, utrzymywać całkowity środek ciężkości możliwie nisko (nie podnosić ładunku niepotrzebnie wysoko) oraz dostosowywać prędkość na zakrętach. Także tutaj obowiązuje: ponad 80% śmiertelnych wypadków przewrócenia zdarzyło się z nieobciążonym wózkiem – ostrożność obowiązuje więc zawsze, nie tylko przy ciężkich ładunkach.',
  63:'Każdy wózek widłowy jest zbudowany na określoną nośność znamionową, którą producent podaje na tabliczce znamionowej. Ta wartość obowiązuje jednak tylko dla znormalizowanej wysokości podnoszenia i ustalonego odstępu środka ciężkości ładunku. Rzeczywista nośność w konkretnej sytuacji zależy dodatkowo od rzeczywistego odstępu środka ciężkości ładunku i rzeczywistej wysokości podnoszenia i musi zostać odczytana z diagramu nośności.',
  64:'Diagram nośności pokazuje na osi X odstęp środka ciężkości ładunku w mm, a na osi Y dopuszczalny ładunek w kg; każda linia w diagramie odpowiada innej wysokości podnoszenia. Im dalej ładunek jest oddalony od oparcia wideł i im wyżej jest podnoszony, tym mniejszy jest dopuszczalny ładunek. W e-learningu może Pan/Pani później samodzielnie wypróbować diagram interaktywnie za pomocą suwaków.',
  65:'Podczas jazdy na zakręcie na wózek działa bocznie siła odśrodkowa – i siła ta rośnie nie liniowo, lecz kwadratowo wraz z prędkością: podwojenie prędkości poczwórnia siłę odśrodkową. Szczególnie niebezpieczna jest jazda na zakręcie z nieobciążonym wózkiem, ponieważ jego środek ciężkości leży blisko bocznych krawędzi przewrócenia. Dlatego obowiązuje: zakręty zawsze pokonywać z dostosowaną, niską prędkością i możliwie dużym promieniem.',
  66:'Inaczej niż samochód osobowy, który na czterech kołach tworzy czworokąt podparcia, wózek trójkołowy stoi tylko na trójkącie podparcia – krawędzie przewrócenia biegną od kół przednich do punktu na osi tylnej. Przy nieobciążonym wózku środek ciężkości leży blisko bocznych krawędzi przewrócenia tego trójkąta, co zwiększa niebezpieczeństwo przewrócenia. Ładunek podniesiony nisko przy podłodze zwiększa stateczność, podniesiony ładunek ją ponownie zmniejsza.',
  67:'Także wózek czterokołowy tworzy mimo swoich czterech kół rachunkowo trójkąt podparcia, ponieważ oś tylna wzgl. skrętna jest zamocowana wahliwie tylko w jednym punkcie do podwozia (oś wahliwa). Środek tej wahliwej osi tworzy wierzchołek trójkąta podparcia. Wynik: wózek czterokołowy ma zasadniczo takie samo niebezpieczeństwo przewrócenia jak wózek trójkołowy – czwarty kontakt koła nie daje dodatkowej stabilności przeciw przewróceniu bocznemu.',
  68:'Podsumowując, najważniejsze zasady postępowania dla stateczności: nie przeciążać wózka, podnosić ładunki aż do oparcia wideł, utrzymywać wysokość całkowitego środka ciężkości niską, pokonywać zakręty z dostosowaną prędkością i możliwie dużym promieniem, oraz unikać gwałtownego przyspieszania i hamowania.',
  70:'W tym rozdziale chodzi o praktyczną eksploatację wózka widłowego: różne rodzaje wózków widłowych i ich rodzaje napędu, instrukcję obsługi i instrukcję stanowiskową, codzienną kontrolę przed użyciem, podnoszenie, załadunek i odstawianie ładunków, przemieszczanie ładunków wraz z warunkami widoczności, oraz prawidłowe opuszczanie wózka widłowego.',
  71:'Istnieje wiele różnych typów wózków widłowych do różnych celów zastosowania: klasyczny wózek widłowy (wózek z przeciwwagą) jako urządzenie uniwersalne do magazynu i pracy na zewnątrz, wózek z wysuwanym masztem do wąskich korytarzy (maszt jest wysuwany do przodu przy podnoszeniu ładunku), wózek kompletacyjny (kierowca sam unosi się z platformą) oraz wózek do kontenerów do ciężkich ładunków w eksploatacji kontenerowej.',
  72:'Silniki elektryczne są ciche i nie emitują spalin, mają jednak czas ładowania akumulatora i przez to ograniczony czas pracy – dobrze nadają się do pracy w pomieszczeniach zamkniętych. Silniki spalinowe oferują wysoką moc napędową, ale w pomieszczeniach zamkniętych ze względu na spaliny nadają się tylko ograniczenie.',
  73:'Przy wózkach na gaz płynny obowiązuje: odstawiać tylko w wystarczająco wentylowanych pomieszczeniach, zachować co najmniej 3 m odstępu od otworów piwnic, kanałów lub dołów (ponieważ gaz płynny jest cięższy od powietrza i może się tam gromadzić), oraz regularnie kontrolować instalację. Przy wózkach z silnikiem diesla w pomieszczeniach zamkniętych należy stosować paliwo o niskiej zawartości siarki, przestrzegać koncepcji konserwacji i stosować oczyszczanie spalin (np. filtr cząstek stałych); przy wózkach na gaz w pomieszczeniach dodatkowo wymagany jest katalizator i regularny pomiar CO.',
  74:'Odstawione nadwozia wymienne (np. nadwozia ciężarówek lub kontenery bez podwozia) wolno najeżdżać wózkiem widłowym tylko wtedy, gdy są przystosowane do występujących obciążeń, powierzchnia ustawienia jest wystarczająco nośna, a nadwozie jest zabezpieczone przed przewróceniem. Brak choćby jednego z tych trzech warunków oznacza zakaz wjazdu.',
  75:'Podczas pracy wózek widłowy wolno obsługiwać wyłącznie z przewidzianych do tego stanowisk sterowania, a przy każdej czynności trzeba uważać, by nie zagrozić żadnym osobom. Wsiadanie i wysiadanie dozwolone jest tylko przy zatrzymanym pojeździe. Bezwzględnie zabronione jest przebywanie na ładunku, pod podniesionym ładunkiem lub pod podniesionym urządzeniem do przenoszenia ładunku – dotyczy to także krótkich czynności.',
  77:'Urządzenia przytrzymujące kierowcę zapobiegają wyrzuceniu kierowcy z wózka podczas wypadku przewrócenia – jest to szczególnie niebezpieczne, ponieważ kierowca zostaje wtedy zwykle przygnieciony przez wózek. Istnieją różne rodzaje: zamknięta kabina kierowcy (drzwi muszą być zamknięte podczas pracy), drzwi z pałąkiem, pas biodrowy (najpierw zapiąć, potem uruchomić – najtańsze rozwiązanie) oraz siatka z pałąkiem obrotowym. To, które urządzenie jest zamontowane, zależy od wózka – ważne jest, aby zawsze go używać.',
  78:'Przed rozpoczęciem pracy kierowca musi sprawdzić wózek widłowy zgodnie z wytycznymi instrukcji obsługi (codzienna kontrola przed użyciem). Jeśli stwierdzone zostaną usterki zagrażające bezpieczeństwu, wózka nie wolno uruchamiać. Usterki należy zgłaszać przedsiębiorcy lub przełożonemu, a usuwać je mogą wyłącznie osoby fachowe (np. monterzy producenta) – nie sam kierowca.',
  79:'Usterki bezpieczeństwa, na które trzeba szczególnie zwracać uwagę podczas codziennej kontroli przed użyciem: uszkodzone opony lub nieprawidłowe ciśnienie powietrza, nieskuteczny hamulec roboczy lub postojowy, wybite lub odkształcone zawieszenia wideł, uszkodzone zabezpieczenia przed wysunięciem lub przesunięciem wideł, pęknięcia elementów nośnych, takich jak maszt podnoszący, przecieki w obszarze hydrauliki oraz wygięte, popękane lub mocno starte widły. Każda z tych usterek oznacza: nie uruchamiać wózka, lecz zgłosić.',
  80:'Siedem kroków przy podnoszeniu ładunku: podjechać prosto przed ładunek, ustawić maszt pionowo, powoli wsunąć widły i podnieść ładunek aż do oparcia wideł, unieść ładunek nad podłoże, odchylić maszt do tyłu, przed jazdą do tyłu spojrzeć obustronnie do tyłu, i dopiero potem powoli jechać do tyłu.',
  81:'Siedem kroków przy odstawianiu ładunku w regale: podjechać do regału, ustawić maszt pionowo, lekko unieść ładunek, wjechać w regał, odstawić ładunek, spojrzeć obustronnie do tyłu i cofnąć się od regału, i na koniec opuścić widły, odchylić maszt do tyłu i odjechać.',
  82:'Przy przemieszczaniu ładunków obowiązuje: jechać z odchylonym do tyłu masztem, unosić urządzenie do przenoszenia ładunku tylko nad podłoże (maks. 50 cm), przy zbyt dużym ładunku poprosić o wskazywanie drogi lub jechać do tyłu, w kierunku jazdy nie może być zasłonięte więcej niż 10 m podłoża, na wzniesieniach i spadkach zawsze prowadzić ładunek od strony góry, i na terenach pochyłych nigdy nie zawracać – wysokie niebezpieczeństwo przewrócenia!',
  83:'Prędkość jazdy musi być zawsze dostosowana do warunków zakładowych, zakręty zasadniczo należy pokonywać powoli – większość śmiertelnych wypadków powstaje przez zbyt wysoką prędkość jazdy. Widoczność musi być na tyle dobra, by przez ładunek nie było zasłonięte więcej niż 10 m podłoża w kierunku jazdy. Zasada: wolno jechać tylko wtedy, gdy kierowca ma wystarczającą widoczność – w razie potrzeby poprosić o wskazywanie drogi.',
  85:'Przy opuszczaniu wózka widłowego należy najpierw zaciągnąć hamulec postojowy (także przy krótkim opuszczeniu), następnie opuścić widły do najniższego położenia i pochylić końcówki w dół, wyłączyć silnik, wyjąć kluczyk i zabrać go ze sobą (aby żadna nieuprawniona osoba nie mogła użyć wózka), oraz upewnić się, że odstawiony wózek nie stanowi przeszkody na drogach transportowych i ewakuacyjnych.',
  86:'Przy wjeżdżaniu wózkiem do wind: uwzględnić nośność windy, korzystać tylko z dopuszczonych wind, zejść z wózka i przebywać w obszarze sterowania, ustawić wózek centralnie w windzie, zaciągnąć hamulec postojowy i zachować wystarczający odstęp co najmniej 0,1 m od ścian szybu windy.',
