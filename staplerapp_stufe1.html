var NS='http://www.w3.org/2000/svg';
var _ds={};
function mkEl(t,a){var e=document.createElementNS(NS,t);Object.keys(a).forEach(function(k){e.setAttribute(k,a[k]);});return e;}

function drawDiag(svgId,type,hl,arrows){
  hl=hl||[];arrows=arrows||[];
  var svg=document.getElementById(svgId);if(!svg)return;
  svg.innerHTML='';
  var iS=type==='single';
  var ox=58,w=370,oy=iS?200:185,h=iS?160:150,yMin=500,yMax=iS?3200:1200;
  var sx=function(v){return ox+(v-500)/500*w;};
  var sy=function(v){return oy-(v-yMin)/(yMax-yMin)*h;};
  _ds[svgId]={sx:sx,sy:sy,oy:oy};
  [500,600,700,800,900,1000].forEach(function(g){
    svg.appendChild(mkEl('line',{x1:sx(g),y1:oy,x2:sx(g),y2:oy-h,stroke:'var(--line)'}));
    var t=mkEl('text',{x:sx(g),y:oy+14,'font-size':10,'text-anchor':'middle',fill:'var(--muted)'});t.textContent=g;svg.appendChild(t);
  });
  (iS?[500,1000,1500,2000,2500,3000]:[500,600,700,800,900,1000,1100,1200]).forEach(function(g){
    svg.appendChild(mkEl('line',{x1:ox,y1:sy(g),x2:ox+w,y2:sy(g),stroke:'var(--line)'}));
    var t=mkEl('text',{x:ox-5,y:sy(g)+4,'font-size':10,'text-anchor':'end',fill:'var(--muted)'});t.textContent=g;svg.appendChild(t);
  });
  svg.appendChild(mkEl('line',{x1:ox,y1:oy,x2:ox+w,y2:oy,stroke:'var(--ink)','stroke-width':2}));
  svg.appendChild(mkEl('line',{x1:ox,y1:oy,x2:ox,y2:oy-h,stroke:'var(--ink)','stroke-width':2}));
  if(iS){
    svg.appendChild(mkEl('polygon',{points:sx(500)+','+sy(3000)+' '+sx(1000)+','+sy(500)+' '+sx(1000)+','+oy+' '+sx(500)+','+oy,fill:'rgba(29,158,117,.12)',stroke:'none'}));
    svg.appendChild(mkEl('line',{x1:sx(500),y1:sy(3000),x2:sx(1000),y2:sy(500),stroke:'var(--ink)','stroke-width':3}));
    var gt=mkEl('text',{x:sx(560),y:sy(1800),'font-size':11,fill:'var(--muted)'});gt.textContent=T.gabelruecken;svg.appendChild(gt);
  }else{
    MULTI_LINES.forEach(function(L){
      var dim=hl.length>0&&hl.indexOf(L.hub)<0;
      svg.appendChild(mkEl('line',{x1:sx(L.a[0]),y1:sy(L.a[1]),x2:sx(L.b[0]),y2:sy(L.b[1]),stroke:L.color,'stroke-width':hl.indexOf(L.hub)>=0?L.w+1.5:L.w,opacity:dim?.2:1}));
      var lt=mkEl('text',{x:sx(L.b[0])+6,y:sy(L.b[1])+4,'font-size':10,'font-weight':'bold',fill:L.color,opacity:dim?.3:1});lt.textContent=L.hub;svg.appendChild(lt);
    });
    var ht=mkEl('text',{x:sx(1000)+6,y:oy-h+2,'font-size':9,fill:'var(--muted)'});ht.textContent=T.hubLabel;svg.appendChild(ht);
  }
  var xl=mkEl('text',{x:ox+w/2,y:oy+26,'font-size':10,'text-anchor':'middle',fill:'var(--muted)'});xl.textContent=T.lsaLabel;svg.appendChild(xl);
  var yl=mkEl('text',{x:13,y:oy-h/2,'font-size':10,'text-anchor':'middle',fill:'var(--muted)',transform:'rotate(-90,13,'+(oy-h/2)+')'});yl.textContent=T.lastLabel;svg.appendChild(yl);
  arrows.forEach(function(arr){
    var ax=arr[0],ayv=arr[1],ds=_ds[svgId],col='#D85A30';
    svg.appendChild(mkEl('line',{x1:ds.sx(500),y1:ds.sy(ayv),x2:ds.sx(ax),y2:ds.sy(ayv),stroke:col,'stroke-width':2.5,'stroke-dasharray':'5,3'}));
    svg.appendChild(mkEl('line',{x1:ds.sx(ax),y1:ds.sy(ayv),x2:ds.sx(ax),y2:ds.oy,stroke:col,'stroke-width':2.5}));
    svg.appendChild(mkEl('circle',{cx:ds.sx(ax),cy:ds.sy(ayv),r:4,fill:col}));
    var p=document.createElementNS(NS,'polygon');p.setAttribute('points',(ds.sx(ax)-5)+','+(ds.oy-8)+' '+(ds.sx(ax)+5)+','+(ds.oy-8)+' '+ds.sx(ax)+','+(ds.oy-1));p.setAttribute('fill',col);svg.appendChild(p);
  });
}

}

function dFb(di,qi,ok,msg){var d=document.getElementById('dfb'+di+''+qi);if(!d)return;d.className='dq-fb '+(ok?'ok':'no');d.textContent=msg;}
function chkDI(di,qi){var dp=DIAG_PAGES[di],q=dp.qs[qi],v=parseFloat(document.getElementById('di'+di+'q'+qi).value);if(isNaN(v)){dFb(di,qi,false,T.bitteWert);return;}var ok=q.check(v);drawDiag('dsvg',dp.svg,q.highlight?[q.highlight]:[],[q.arrow()]);dFb(di,qi,ok,ok?'✓ '+q.ans():'✗ '+q.ans());}
function hintDI(di,qi){var dp=DIAG_PAGES[di],q=dp.qs[qi];drawDiag('dsvg',dp.svg,q.highlight?[q.highlight]:[],[q.arrow()]);dFb(di,qi,true,'✓ '+q.ans());}
function ynDI(di,qi,ans){var dp=DIAG_PAGES[di],q=dp.qs[qi],ok=ans===q.correct;drawDiag('dsvg',dp.svg,q.highlight?[q.highlight]:[],[q.arrow()]);dFb(di,qi,ok,ok?T.richtigDiag+q.explain():T.falschDiag+q.explain());}
function hubDI(di,qi,sel){var dp=DIAG_PAGES[di],q=dp.qs[qi],ok=sel===q.correct;drawDiag('dsvg',dp.svg,[q.highlight||q.correct],[]);dFb(di,qi,ok,ok?T.kennlinieRichtig+sel+' mm.':T.korrekt+q.correct+' mm.');}

function quizScoreForKapitel(knr){
  var richtig=0,gesamt=0;
  STEPS.forEach(function(s){if(s.type==='quiz'&&s.kapitel_nr===knr){gesamt++;if(answered[knr+'-'+s.qi]===true)richtig++;}});
  return{richtig:richtig,gesamt:gesamt};
}

function toggleErkl(el){var box=el.closest('.erklaerung-box');if(box)box.classList.toggle('open');}

function render(){
  var s=STEPS[cur];
  pbar.style.width=(cur/(STEPS.length-1)*100)+'%';
  prevBtn.disabled=(cur===0);
  nextBtn.textContent=T.weiter;
  nextBtn.disabled=false;

  if(s.type==='welcome'){
    prevBtn.onclick=function(){goBack();};
    host.innerHTML='<div class="welcome-box">'+
      '<div class="welcome-titel">'+T.welcomeTitel+'</div>'+
      '<div class="welcome-sub">Diese Schulung vermittelt alle theoretischen Grundlagen nach <strong>DGUV Grundsatz 308-001</strong> f&uuml;r das sichere F&uuml;hren von Gabelstaplern.</div>'+
      '<div class="welcome-grid">'+
        '<div class="wg"><div class="wg-icon">📋</div><div class="wg-titel">'+KAPITEL.length+' Kapitel</div><div class="wg-text">Alle Themen der allgemeinen Ausbildung</div></div>'+
        '<div class="wg"><div class="wg-icon">✏️</div><div class="wg-titel">100+ Fragen</div><div class="wg-text">Mind. 10 Quizfragen pro Kapitel</div></div>'+
        '<div class="wg"><div class="wg-icon">💬</div><div class="wg-titel">Kontakt</div><div class="wg-text">WhatsApp & E-Mail bei Fragen</div></div>'+
        '<div class="wg"><div class="wg-icon">✅</div><div class="wg-titel">Nachweis</div><div class="wg-text">Jedes Kapitel wird dokumentiert</div></div>'+
      '</div>'+
      '<button class="welcome-start" onclick="next()">'+T.startBtn+'</button>'+
      '</div>';
    counter.textContent=T.willkommen;
    nextBtn.style.display='none';
  }
  else{
    prevBtn.onclick=function(){prev();};
    nextBtn.style.display='';
  }

  if(s.type==='folie'){
    var erklaerung=ERKLAERUNG_MAP[s.fn];
    host.innerHTML='<div class="slidebox">'+
      '<img src="'+ORDNER+'/Folie'+s.fn+'.PNG" alt="Folie '+s.fn+'">'+
      '</div>'+
      (erklaerung?(
        '<div class="erklaerung-box">'+
          '<div class="erklaerung-label" onclick="toggleErkl(this)">💡 '+T.erklaerung+'<span class="chev">▾</span></div>'+
          '<div class="erklaerung-content"><p>'+erklaerung+'</p></div>'+
        '</div>'
      ):'');
    counter.textContent=T.folie+' '+s.fn+' / '+TOTAL_FOLIEN;
  }
  else if(s.type==='video'){
    host.innerHTML='<div class="slidebox video-slide">'+
      '<div class="video-wrap">'+
        '<div class="video-label"><span>&#9654; '+s.titel+'</span><button class="video-fs-btn" onclick="videoVollbild()">&#x26F6; '+T.vollbild+'</button></div>'+
        '<iframe id="videoFrame" src="'+s.vidUrl+'" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>'+
      '</div>'+
      '</div>';
    counter.textContent='&#9654; '+s.titel;
  }
  else if(s.type==='quiz'){
    var key=s.kapitel_nr+'-'+s.qi;
    var done=(key in answered);
    // Quiz-Nummer im Kapitel
    var qNr=s.qi+1;
    var qGes=QUIZ_DATA[s.kapitel_nr].length;
    host.innerHTML='<div class="quizbox">'+
      '<div class="quiz-prog">'+T.kapitel+' '+s.kapitel_nr+' &middot; '+s.kapitel_titel+'</div>'+
      '<div class="quiz-badge">✏️ '+T.wissensfrage+' '+qNr+' / '+qGes+'</div>'+
      '<div class="quiz-q">'+s.q+'</div>'+
      '<div class="quiz-opts" id="opts">'+
        s.o.map(function(o,i){return'<button class="opt" id="opt-'+i+'" onclick="answer(&#39;'+key+'&#39;,'+i+','+s.c+')">'+o+'</button>';}).join('')+
      '</div>'+
      '<div class="quiz-fb" id="fb"></div>'+
      '</div>';
    counter.textContent=T.frage+' '+qNr+' / '+qGes+' ('+T.kap+' '+s.kapitel_nr+')';
    if(done){showAnswerState(key,s.c,s.o);nextBtn.disabled=false;}
    else{nextBtn.disabled=true;}
  }
  else if(s.type==='abschluss'){
    var sc=quizScoreForKapitel(s.kapitel_nr);
    var done=kapitelAbgeschlossen[s.kapitel_nr];
    var pct=sc.gesamt>0?Math.round(sc.richtig/sc.gesamt*100):0;
    host.innerHTML='<div class="abschluss-box">'+
      '<div class="abschluss-icon">📋</div>'+
      '<div class="abschluss-titel">'+T.kapitel+' '+s.kapitel_nr+': '+s.kapitel_titel+'</div>'+
      '<div class="abschluss-sub">'+T.abschlussSub+'</div>'+
      '<div class="abschluss-score">'+T.abschlussScore+sc.richtig+' / '+sc.gesamt+T.richtigLabel+pct+' %)</div>'+
      '<button class="abschluss-btn" id="aBtn" onclick="kapitelAbschliessen('+s.kapitel_nr+',&#39;'+s.kapitel_titel.replace(/'/g,'&#39;')+'&#39;)" '+
        (done?'disabled style="background:var(--ok)"':'')+'>'+(done?'✓ Abgeschlossen':'Thema abschlie&szlig;en &amp; speichern')+'</button>'+
      '<div class="abschluss-status" id="aStat">'+(done?T.kapitel+' '+s.kapitel_nr+' '+T.gespeichert:'')+'</div>'+
      '</div>';
    counter.textContent=T.kapitel+' '+s.kapitel_nr+' / '+KAPITEL.length;
    nextBtn.disabled=!done;
  }
  else if(s.type==='diag'){
    nextBtn.disabled=false;
    renderDiag(host,s.di);
    counter.textContent=T.diagramm+' '+(s.di+1)+' / '+DIAG_PAGES.length+' '+T.kap8;
  }
  else if(s.type==='ergebnis'){
    var total=0,richtig=0;
    Object.keys(QUIZ_DATA).forEach(function(k){total+=QUIZ_DATA[k].length;});
    Object.keys(answered).forEach(function(k){if(answered[k]===true)richtig++;});
    var pct=Math.round(richtig/total*100);
    var pass=pct>=80;
    host.innerHTML='<div class="result">'+
      '<div class="ic '+(pass?'ok':'no')+'">'+(pass?'✓':'✗')+'</div>'+
      '<h2>'+richtig+' / '+total+T.richtigLabel+pct+' %)</h2>'+
      '<p>'+(pass?T.ergebnisPass:T.ergebnisFail)+'</p>'+
      '<button class="ctrl-btn" onclick="'+(pass?'goBack()':'restart()')+'">'+
        (pass?T.zurueck:T.wiederholen)+'</button>'+
      '</div>';
    counter.textContent=T.abschluss;
    nextBtn.disabled=true;
    prevBtn.disabled=true;
  }
  updateKontaktLinks();
}

function updateKontaktLinks(){
  var s=STEPS[cur];
  var ctx='';
  if(s.type==='welcome') ctx=T.willkommen;
  else if(s.type==='kapitel') ctx=T.kapitel+' '+s.nr+': '+s.titel;
  else if(s.type==='folie') ctx=T.kapitel+' '+s.kapitel_nr+' | '+T.folie+' '+s.fn+' / '+TOTAL_FOLIEN;
  else if(s.type==='video') ctx=T.kapitel+' '+s.kapitel_nr+' | '+s.titel;
  else if(s.type==='quiz') ctx=T.kapitel+' '+s.kapitel_nr+' | '+T.wissensfrage+' '+(s.qi+1);
  else if(s.type==='abschluss') ctx=T.kapitel+' '+s.kapitel_nr+': '+s.kapitel_titel;
  else if(s.type==='diag') ctx=T.diagramm+' '+(s.di+1)+' '+T.kap8;
  else if(s.type==='ergebnis') ctx=T.abschluss;
  var waMsg=T.waMsg.replace('{ctx}',ctx);
  var mailSubj=T.mailSubj.replace('{ctx}',ctx);
  var mailBody=T.mailBody.replace('{ctx}',ctx);
  var wa=document.getElementById('waBtn');
  var ml=document.getElementById('mailBtn');
  if(wa) wa.href='https://wa.me/'+WA_NR+'?text='+encodeURIComponent(waMsg);
  if(ml) ml.href='mailto:'+MAIL+'?subject='+encodeURIComponent(mailSubj)+'&body='+encodeURIComponent(mailBody);
}

function answer(key,chosen,richtig){
  if(key in answered)return;
  document.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});
  document.getElementById('opt-'+richtig).classList.add('correct');
  var fb=document.getElementById('fb');
  var s=STEPS[cur];
  if(chosen===richtig){
    if(!(key in answered))score++;
    fb.className='quiz-fb ok';fb.textContent=T.richtig;
  }else{
    document.getElementById('opt-'+chosen).classList.add('wrong');
    fb.className='quiz-fb no';fb.textContent=T.falsch+s.o[richtig];
  }
  answered[key]=(chosen===richtig);
  nextBtn.disabled=false;
  if(quizTimer)clearTimeout(quizTimer);
  quizTimer=setTimeout(function(){quizTimer=null;next();},1400);
}

function showAnswerState(key,richtig,opts){
  document.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});
  document.getElementById('opt-'+richtig).classList.add('correct');
  var fb=document.getElementById('fb');
  if(answered[key]){fb.className='quiz-fb ok';fb.textContent=T.richtig;}
  else{fb.className='quiz-fb no';fb.textContent='✓ Richtige Antwort markiert';}
}

function kapitelAbschliessen(knr,kname){
  var btn=document.getElementById('aBtn');
  var stat=document.getElementById('aStat');
  if(!btn||!stat)return;
  var sc=quizScoreForKapitel(knr);
  var bestanden=sc.gesamt>0?(sc.richtig/sc.gesamt>=0.8):true;
  if(!bestanden){
    btn.disabled=true;
    stat.style.color='var(--no)';
    stat.textContent=T.nichtBestanden;
    setTimeout(function(){
      STEPS.forEach(function(s){if(s.type==='quiz'&&s.kapitel_nr===knr)delete answered[knr+'-'+s.qi];});
      kapitelStartZeit=Date.now();
      cur=kapitelStart[knr]||0;
      render();
    },3000);
    return;
  }
  btn.disabled=true;btn.textContent=T.wirdGespeichert;
  var payload={
    regnr:regnr,kapitel_nr:knr,kapitel_name:kname,
    datum_uhrzeit:new Date().toISOString(),
    quiz_richtig:sc.richtig,quiz_gesamt:sc.gesamt,
    quiz_prozent:sc.gesamt>0?Math.round(sc.richtig/sc.gesamt*100):0,
    bestanden:bestanden,
    lernzeit_sekunden:Math.round((Date.now()-kapitelStartZeit)/1000),
    gesamt_kapitel_abgeschlossen:Object.keys(kapitelAbgeschlossen).length+1
  };
  function onOK(){
    kapitelAbgeschlossen[knr]=true;kapitelStartZeit=Date.now();
    btn.textContent=T.abschlussAbgeschlossen;btn.style.background='var(--ok)';
    stat.textContent=T.kapitel+' '+knr+' '+T.gespeichert;
    nextBtn.disabled=false;
    saveProgress();
  }
  if(FLOW_URL==='DEIN_FLOW_URL_HIER'){onOK();return;}
  fetch(FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(onOK)
    .catch(function(){btn.disabled=false;btn.textContent=T.abschlussBtnTxt;stat.textContent=T.fehler;stat.style.color='var(--no)';});
}

var quizTimer=null;
function next(){if(quizTimer){clearTimeout(quizTimer);quizTimer=null;}if(cur<STEPS.length-1){cur++;render();saveProgress();}}
function prev(){if(quizTimer){clearTimeout(quizTimer);quizTimer=null;}if(cur>0){cur--;render();saveProgress();}}
function restart(){cur=0;answered={};score=0;kapitelAbgeschlossen={};render();}

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'&&!nextBtn.disabled)next();
  if(e.key==='ArrowLeft'&&!prevBtn.disabled)prev();
});
var tx=0;
host.addEventListener('touchstart',function(e){tx=e.changedTouches[0].screenX;},{passive:true});
host.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].screenX-tx;
  if(dx<-50&&!nextBtn.disabled)next();
  if(dx>50)prev();
},{passive:true});

function goBack(){
  window.location.href=BASE+(regnr?'?regnr='+encodeURIComponent(regnr)+'&lang='+lang:'');
}

prevBtn.textContent=T.prevBtnTxt;
document.querySelector('.back-btn').textContent=T.backBtnTxt;
document.getElementById('appTitle').textContent=T.appTitel;
document.getElementById('appSubtitle').innerHTML=T.appSub;
document.getElementById('ovBtn').textContent=T.ovBtnTxt;
document.documentElement.lang=lang;
loadProgress();
updateProgBadge();
render();
</script>
