.progress{height:5px;background:var(--line)}

.welcome-sub{font-size:15px;color:rgba(255,255,255,.85);line-height:1.6;max-width:500px;}
.welcome-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:500px;}
.wg{background:rgba(255,255,255,.15);border-radius:12px;padding:12px;text-align:left;}
.wg-icon{font-size:20px;margin-bottom:4px;}
.wg-titel{font-size:12px;font-weight:700;color:#fff;margin-bottom:2px;}

.kapitel-titel{font-size:30px;font-weight:800;line-height:1.3;}
.kapitel-sub{font-size:14px;color:rgba(255,255,255,.7);margin-top:10px;}

.slidebox img{width:100%;height:auto;display:block;max-height:65vh;object-fit:contain;}
.nav-zone{position:absolute;top:0;bottom:0;width:30%;cursor:pointer;z-index:2;

.nav-zone:hover{opacity:1}
.nav-zone.prev{left:0;justify-content:flex-start;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}
.nav-zone.next{right:0;justify-content:flex-end;background:linear-gradient(270deg,rgba(0,0,0,.35),transparent)}

.opt.correct{border-color:var(--ok)!important;background:var(--okbg)!important;color:var(--ok)!important;font-weight:700;}
.opt.wrong{border-color:var(--no)!important;background:var(--nobg)!important;color:var(--no)!important;}

.quiz-fb.ok{color:var(--ok)}.quiz-fb.no{color:var(--no)}

.abschluss-status{font-size:13px;color:var(--ok);font-weight:600;min-height:18px;}

.dqbtn.info{border-color:var(--acc2);color:var(--acc2);}.dqbtn.info:hover{background:#e8f0fb;}

      var lt=mkEl('text',{x:sx(L.b[0])+6,y:sy(L.b[1])+4,'font-size':10,'font-weight':'bold',fill:L.color,opacity:dim?.3:1});lt.textContent=L.hub;svg.appendChild(lt);
    });
    var ht=mkEl('text',{x:sx(1000)+6,y:oy-h+2,'font-size':9,fill:'var(--muted)'});ht.textContent='Hub in mm';svg.appendChild(ht);
  }
  var xl=mkEl('text',{x:ox+w/2,y:oy+26,'font-size':10,'text-anchor':'middle',fill:'var(--muted)'});xl.textContent='Lastschwerpunktabstand in mm';svg.appendChild(xl);
  var yl=mkEl('text',{x:13,y:oy-h/2,'font-size':10,'text-anchor':'middle',fill:'var(--muted)',transform:'rotate(-90,13,'+(oy-h/2)+')'});yl.textContent='Last in kg';svg.appendChild(yl);
  arrows.forEach(function(arr){
    var ax=arr[0],ayv=arr[1],ds=_ds[svgId],col='#D85A30';
    svg.appendChild(mkEl('line',{x1:ds.sx(500),y1:ds.sy(ayv),x2:ds.sx(ax),y2:ds.sy(ayv),stroke:col,'stroke-width':2.5,'stroke-dasharray':'5,3'}));
    svg.appendChild(mkEl('line',{x1:ds.sx(ax),y1:ds.sy(ayv),x2:ds.sx(ax),y2:ds.oy,stroke:col,'stroke-width':2.5}));
    svg.appendChild(mkEl('circle',{cx:ds.sx(ax),cy:ds.sy(ayv),r:4,fill:col}));
    var p=document.createElementNS(NS,'polygon');p.setAttribute('points',(ds.sx(ax)-5)+','+(ds.oy-8)+' '+(ds.sx(ax)+5)+','+(ds.oy-8)+' '+ds.sx(ax)+','+(ds.oy-1));p.setAttribute('fill',col);svg.appendChild(p);
  });
}

function renderDiag(host,di){
  var dp=DIAG_PAGES[di];
  var vb=dp.svg==='single'?'0 0 480 220':'0 0 480 200';
  var qHtml='';
  dp.qs.forEach(function(q,qi){
    if(q.type==='input'){
      qHtml+='<div class="dq"><div class="dq-text">'+q.q+'</div>'+
        '<div class="dq-row">'+
        '<input class="dq-input" type="number" id="di'+di+'q'+qi+'" placeholder="'+q.unit+'" step="'+(q.unit==='mm'?50:100)+'">'+
        '<button class="dqbtn info" onclick="chkDI('+di+','+qi+')">Prüfen</button>'+
        '<button class="dqbtn" onclick="hintDI('+di+','+qi+')">Lösung</button>'+
        '</div><div class="dq-fb" id="dfb'+di+''+qi+'"></div></div>';
    }else if(q.type==='yn'){
      qHtml+='<div class="dq"><div class="dq-text">'+q.q+'</div>'+
        '<div class="dq-row">'+
        '<button class="dqbtn info" onclick="ynDI('+di+','+qi+',\'ja\')">Ja</button>'+
        '<button class="dqbtn info" onclick="ynDI('+di+','+qi+',\'nein\')">Nein</button>'+
        '</div><div class="dq-fb" id="dfb'+di+''+qi+'"></div></div>';
    }else if(q.type==='hub'){
      qHtml+='<div class="dq"><div class="dq-text">'+q.q+'</div>'+
        '<div class="dq-row">'+
        '<button class="dqhbtn" style="color:#1a1a2e;border-color:#1a1a2e" onclick="hubDI('+di+','+qi+',4250)">4250 mm</button>'+
        '<button class="dqhbtn" style="color:#0a7a5a;border-color:#0a7a5a" onclick="hubDI('+di+','+qi+',5250)">5250 mm</button>'+
        '<button class="dqhbtn" style="color:#1a5fa8;border-color:#1a5fa8" onclick="hubDI('+di+','+qi+',6150)">6150 mm</button>'+
        '</div><div class="dq-fb" id="dfb'+di+''+qi+'"></div></div>';
    }
  });
  var info=dp.info?'<div class="diag-info">'+dp.info+'</div>':'';
  host.innerHTML='<div class="diag-card">'+
    '<div class="diag-hd"><span class="diag-hd-title">'+dp.title+'</span></div>'+
    '<div class="diag-svg-box"><svg id="dsvg" viewBox="'+vb+'" width="100%"></svg></div>'+
    info+qHtml+'</div>';
  drawDiag('dsvg',dp.svg,[],[]);
}

function dFb(di,qi,ok,msg){var d=document.getElementById('dfb'+di+''+qi);if(!d)return;d.className='dq-fb '+(ok?'ok':'no');d.textContent=msg;}
function chkDI(di,qi){var dp=DIAG_PAGES[di],q=dp.qs[qi],v=parseFloat(document.getElementById('di'+di+'q'+qi).value);if(isNaN(v)){dFb(di,qi,false,'Bitte Wert eingeben.');return;}var ok=q.check(v);drawDiag('dsvg',dp.svg,q.highlight?[q.highlight]:[],[q.arrow()]);dFb(di,qi,ok,ok?'✓ '+q.ans():'✗ '+q.ans());}
function hintDI(di,qi){var dp=DIAG_PAGES[di],q=dp.qs[qi];drawDiag('dsvg',dp.svg,q.highlight?[q.highlight]:[],[q.arrow()]);dFb(di,qi,true,'✓ '+q.ans());}
function ynDI(di,qi,ans){var dp=DIAG_PAGES[di],q=dp.qs[qi],ok=ans===q.correct;drawDiag('dsvg',dp.svg,q.highlight?[q.highlight]:[],[q.arrow()]);dFb(di,qi,ok,ok?'✓ Richtig! '+q.explain():'✗ Falsch. '+q.explain());}
function hubDI(di,qi,sel){var dp=DIAG_PAGES[di],q=dp.qs[qi],ok=sel===q.correct;drawDiag('dsvg',dp.svg,[q.highlight||q.correct],[]);dFb(di,qi,ok,ok?'✓ Richtig! Kennlinie '+sel+' mm.':'✗ Korrekt: '+q.correct+' mm.');}

function quizScoreForKapitel(knr){
  var richtig=0,gesamt=0;
  STEPS.forEach(function(s){if(s.type==='quiz'&&s.kapitel_nr===knr){gesamt++;if(answered[knr+'-'+s.qi]===true)richtig++;}});
  return{richtig:richtig,gesamt:gesamt};
}

function render(){
  var s=STEPS[cur];
  pbar.style.width=(cur/(STEPS.length-1)*100)+'%';
  prevBtn.disabled=(cur===0);
  nextBtn.textContent='Weiter ›';
  nextBtn.disabled=false;

  if(s.type==='welcome'){
    prevBtn.onclick=function(){goBack();};
    host.innerHTML='<div class="welcome-box">'+
      '<div class="welcome-logo">🚜</div>'+
      '<div class="welcome-titel">Willkommen zur Gabelstapler-Ausbildung</div>'+
      '<div class="welcome-sub">Diese Schulung vermittelt alle theoretischen Grundlagen nach <strong>DGUV Grundsatz 308-001</strong> f&uuml;r das sichere F&uuml;hren von Gabelstaplern.</div>'+
      '<div class="welcome-grid">'+
        '<div class="wg"><div class="wg-icon">📋</div><div class="wg-titel">10 Kapitel</div><div class="wg-text">Alle Themen der allgemeinen Ausbildung</div></div>'+
        '<div class="wg"><div class="wg-icon">✏️</div><div class="wg-titel">100+ Fragen</div><div class="wg-text">Mind. 10 Quizfragen pro Kapitel</div></div>'+
        '<div class="wg"><div class="wg-icon">💬</div><div class="wg-titel">Kontakt</div><div class="wg-text">WhatsApp & E-Mail bei Fragen</div></div>'+
        '<div class="wg"><div class="wg-icon">✅</div><div class="wg-titel">Nachweis</div><div class="wg-text">Jedes Kapitel wird dokumentiert</div></div>'+
      '</div>'+
      '<button class="welcome-start" onclick="next()">Schulung starten ›</button>'+
      '</div>';
    counter.textContent='Willkommen';
    nextBtn.style.display='none';
  }
  else{
    prevBtn.onclick=function(){prev();};
    nextBtn.style.display='';
  }

  if(s.type==='kapitel'){
    host.innerHTML='<div class="kapitel-box">'+
      '<div class="kapitel-nr">Kapitel '+s.nr+' von '+KAPITEL.length+'</div>'+
      '<div class="kapitel-titel">'+s.titel+'</div>'+
      '<div class="kapitel-sub">Allgemeine Staplerfahrerausbildung &middot; DGUV 308-001</div>'+
      '</div>';
    counter.textContent='Kapitel '+s.nr;
  }
  else if(s.type==='folie'){
    host.innerHTML='<div class="slidebox">'+
      '<div class="nav-zone prev" onclick="prev()"><span>‹</span></div>'+
      '<img src="'+ORDNER+'/Folie'+s.fn+'.PNG" alt="Folie '+s.fn+'">'+
      '<div class="nav-zone next" onclick="next()"><span>›</span></div>'+
      '</div>';
    counter.textContent='Folie '+s.fn+' / '+TOTAL_FOLIEN;
  }
  else if(s.type==='quiz'){
    var key=s.kapitel_nr+'-'+s.qi;
    var done=(key in answered);
    // Quiz-Nummer im Kapitel
    var qNr=s.qi+1;
    var qGes=QUIZ_DATA[s.kapitel_nr].length;
    host.innerHTML='<div class="quizbox">'+
      '<div class="quiz-prog">Kapitel '+s.kapitel_nr+' &middot; '+s.kapitel_titel+'</div>'+
      '<div class="quiz-badge">✏️ Wissensfrage '+qNr+' / '+qGes+'</div>'+
      '<div class="quiz-q">'+s.q+'</div>'+
      '<div class="quiz-opts" id="opts">'+
        s.o.map(function(o,i){return'<button class="opt" id="opt-'+i+'" onclick="answer(&#39;'+key+'&#39;,'+i+','+s.c+')">'+o+'</button>';}).join('')+
      '</div>'+
      '<div class="quiz-fb" id="fb"></div>'+
      '</div>';
    counter.textContent='Frage '+qNr+' / '+qGes+' (Kap. '+s.kapitel_nr+')';
    if(done){showAnswerState(key,s.c,s.o);nextBtn.disabled=false;}
    else{nextBtn.disabled=true;}
  }
  else if(s.type==='abschluss'){
    var sc=quizScoreForKapitel(s.kapitel_nr);
    var done=kapitelAbgeschlossen[s.kapitel_nr];
    var pct=sc.gesamt>0?Math.round(sc.richtig/sc.gesamt*100):0;
    host.innerHTML='<div class="abschluss-box">'+
      '<div class="abschluss-icon">📋</div>'+
      '<div class="abschluss-titel">Kapitel '+s.kapitel_nr+': '+s.kapitel_titel+'</div>'+
      '<div class="abschluss-sub">Sie haben alle Inhalte und Fragen dieses Kapitels durchgearbeitet.</div>'+
      '<div class="abschluss-score">Quiz-Ergebnis: '+sc.richtig+' / '+sc.gesamt+' richtig ('+pct+' %)</div>'+
      '<button class="abschluss-btn" id="aBtn" onclick="kapitelAbschliessen('+s.kapitel_nr+',&#39;'+s.kapitel_titel.replace(/'/g,'&#39;')+'&#39;)" '+
        (done?'disabled style="background:var(--ok)"':'')+'>'+(done?'✓ Abgeschlossen':'Thema abschlie&szlig;en &amp; speichern')+'</button>'+
      '<div class="abschluss-status" id="aStat">'+(done?'Kapitel '+s.kapitel_nr+' wurde gespeichert.':'')+'</div>'+
      '</div>';
    counter.textContent='Kapitel '+s.kapitel_nr+' / '+KAPITEL.length+' abschließen';
    nextBtn.disabled=!done;
  }
  else if(s.type==='diag'){
    nextBtn.disabled=false;
    renderDiag(host,s.di);
    counter.textContent='Diagramm '+(s.di+1)+' / '+DIAG_PAGES.length+' (Kap. 8)';
  }
  else if(s.type==='ergebnis'){
    var total=0,richtig=0;
    Object.keys(QUIZ_DATA).forEach(function(k){total+=QUIZ_DATA[k].length;});
    Object.keys(answered).forEach(function(k){if(answered[k]===true)richtig++;});
    var pct=Math.round(richtig/total*100);
    var pass=pct>=80;
    host.innerHTML='<div class="result">'+
      '<div class="ic '+(pass?'ok':'no')+'">'+(pass?'✓':'✗')+'</div>'+
      '<h2>'+richtig+' / '+total+' richtig ('+pct+' %)</h2>'+
      '<p>'+(pass?'Herzlichen Glückwunsch! Schulung erfolgreich abgeschlossen.':'Mindestpunktzahl 80% nicht erreicht. Bitte wiederholen.')+'</p>'+
      '<button class="ctrl-btn" onclick="'+(pass?'goBack()':'restart()')+'">'+
        (pass?'← Zur Startseite':'Schulung wiederholen')+'</button>'+
      '</div>';
    counter.textContent='Abschluss';
    nextBtn.disabled=true;
    prevBtn.disabled=true;
  }
}

function answer(key,chosen,richtig){
  if(key in answered)return;
  document.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});
  document.getElementById('opt-'+richtig).classList.add('correct');
  var fb=document.getElementById('fb');
  var s=STEPS[cur];
  if(chosen===richtig){
    if(!(key in answered))score++;
    fb.className='quiz-fb ok';fb.textContent='✓ Richtig!';
  }else{
    document.getElementById('opt-'+chosen).classList.add('wrong');
    fb.className='quiz-fb no';fb.textContent='✗ Leider falsch. Richtig: '+s.o[richtig];
  }
  answered[key]=(chosen===richtig);
  nextBtn.disabled=false;
}

function showAnswerState(key,richtig,opts){
  document.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});
  document.getElementById('opt-'+richtig).classList.add('correct');
  var fb=document.getElementById('fb');
  if(answered[key]){fb.className='quiz-fb ok';fb.textContent='✓ Richtig!';}
  else{fb.className='quiz-fb no';fb.textContent='✓ Richtige Antwort markiert';}
}

function kapitelAbschliessen(knr,kname){
  var btn=document.getElementById('aBtn');
  var stat=document.getElementById('aStat');
  if(!btn||!stat)return;
  btn.disabled=true;btn.textContent='Wird gespeichert...';
  var sc=quizScoreForKapitel(knr);
  var payload={
    regnr:regnr,kapitel_nr:knr,kapitel_name:kname,
    datum_uhrzeit:new Date().toISOString(),
    quiz_richtig:sc.richtig,quiz_gesamt:sc.gesamt,
    quiz_prozent:sc.gesamt>0?Math.round(sc.richtig/sc.gesamt*100):0,
    bestanden:sc.gesamt>0?(sc.richtig/sc.gesamt>=0.8):true,
    lernzeit_sekunden:Math.round((Date.now()-kapitelStartZeit)/1000),
    gesamt_kapitel_abgeschlossen:Object.keys(kapitelAbgeschlossen).length+1
  };
  function onOK(){
    kapitelAbgeschlossen[knr]=true;kapitelStartZeit=Date.now();
    btn.textContent='✓ Abgeschlossen';btn.style.background='var(--ok)';
    stat.textContent='Kapitel '+knr+' gespeichert.';
    nextBtn.disabled=false;
  }
  if(FLOW_URL==='DEIN_FLOW_URL_HIER'){onOK();return;}
  fetch(FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(onOK)
    .catch(function(){btn.disabled=false;btn.textContent='Thema abschließen & speichern';stat.textContent='⚠️ Fehler. Bitte erneut versuchen.';stat.style.color='var(--no)';});
}

function next(){if(cur<STEPS.length-1){cur++;render();}}
function prev(){if(cur>0){cur--;render();}}
function restart(){cur=0;answered={};score=0;kapitelAbgeschlossen={};render();}

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'&&!nextBtn.disabled)next();
  if(e.key==='ArrowLeft'&&!prevBtn.disabled)prev();
});
var tx=0;
host.addEventListener('touchstart',function(e){tx=e.changedTouches[0].screenX;},{passive:true});
host.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].screenX-tx;
  if(dx<-50&&!nextBtn.disabled)next();
  if(dx>50)prev();
},{passive:true});

function goBack(){
  window.location.href=BASE+(regnr?'?regnr='+encodeURIComponent(regnr)+'&lang='+lang:'');
}

render();
</script>
