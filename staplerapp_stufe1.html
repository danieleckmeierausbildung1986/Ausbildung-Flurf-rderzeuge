  87:'Przy załadunku i rozładunku pojazdów (ciężarówki, przyczepy) muszą być one zabezpieczone przed staczaniem się i ewentualnie przewróceniem – zwykle poprzez hamulec postojowy plus kliny podkładane przed niekierowanymi kołami. Przy naczepach mogą być potrzebne dodatkowe podpory. Kierowca pojazdu i kierowca wózka widłowego muszą porozumieć się przed załadunkiem/rozładunkiem, a ruchy pojazdu podczas załadunku muszą być bezpiecznie uniemożliwione.',
  88:'Przyczepy ze skrętem karuzelowym (u których obraca się cała oś przednia) mają szczególne niebezpieczeństwo przewrócenia: przed załadunkiem lub rozładunkiem oś przednia musi koniecznie zostać ustawiona prosto, w przeciwnym razie przyczepa może się przewrócić. Także tutaj obowiązuje: porozumienie między kierowcą wózka widłowego a kierowcą pojazdu, oraz uniemożliwienie ruchów pojazdu podczas załadunku.',
  90:'W tym rozdziale chodzi o szczególne sytuacje eksploatacyjne: zastosowanie osprzętów, przewożenie osób, przemieszczanie przyczep i pojazdów szynowych, zastosowanie platform roboczych oraz transport ładunków wiszących.',
  91:'Osprzęty (np. łyżki, zaciski, trzpienie) wolno stosować tylko wtedy, gdy osprzęt i wózek są ze sobą dopasowane – np. pod względem nośności, mocowania i zasilania energią. Osprzęt musi być zamocowany zgodnie z przeznaczeniem, nie wolno przekraczać ani nośności osprzętu, ani wózka widłowego, a osprzęty muszą być regularnie kontrolowane.',
  92:'Przewożenie osób na wózku widłowym jest dozwolone tylko wtedy, gdy jest to wyraźnie uregulowane instrukcją stanowiskową, dostępne są odpowiednie miejsca siedzące lub stojące oraz uchwyty, i istnieje dodatkowe urządzenie przytrzymujące dla przewożonej osoby. Jeśli brakuje choćby jednego z tych warunków, przewożenie osób jest niedozwolone.',
  93:'Przyczepy wolno przemieszczać wózkiem widłowym tylko wtedy, gdy zespół pojazdów może być bezpiecznie hamowany przy wszystkich ruchach, wózek i przyczepa są przystosowane do eksploatacji z przyczepą (np. z odpowiednim urządzeniem sprzęgającym), oraz dopuszczalne obciążenie przyczepy jest znane i nie zostaje przekroczone.',
  94:'Pojazdy szynowe wolno przemieszczać wózkiem widłowym za pomocą lin tylko pod szczególnymi warunkami – np. ze sprzęgłem poślizgowym, które zwalnia się przy przeciążeniu. Warunki: wózek znajduje się poza obszarem jazdy pojazdu szynowego, kierowca wózka może obserwować obszar torów lub jest naprowadzany, oraz dostępne jest urządzenie hamujące.',
  95:'Popychanie pojazdów szynowych wózkiem widłowym jest dozwolone tylko wtedy, gdy wózek jest do tego przystosowany (np. belką popychającą), stosowane są specjalne urządzenia manewrowe, kierowca wózka jest przeszkolony i dostępne jest urządzenie hamujące. Wyraźnie NIEDOZWOLONE jest popychanie luźnymi podporami lub bezpośrednio częściami wózka (np. widłami) – może to prowadzić do ciężkich wypadków.',
  97:'Podnoszenie osób za pomocą wózka widłowego (czyli zastosowanie platformy roboczej) jest dozwolone tylko wtedy, gdy używa się wystarczająco nośnego wózka i zgodnej z przepisami platformy roboczej. Samo stanie na widłach lub palecie bez sprawdzonej platformy roboczej jest wyraźnie niedozwolone.',
  98:'Zgodna z przepisami platforma robocza musi być wyposażona w: zabezpieczenie przed upadkiem z poręczą na wysokości dłoni, kolan i stóp, osłonę pleców odporną na przenikanie (chroni przed niebezpieczeństwem zmiażdżenia przy maszcie podnoszącym), kieszenie wsuwowe od spodu (do bezpiecznego podjęcia przez widły), zabezpieczenie przed zsuwaniem się z wideł, a drzwi wejściowe mogą otwierać się tylko do wewnątrz.',
  99:'Przy stosowaniu platform roboczych obowiązuje: nienaganne porozumiewanie się między kierowcą a osobami na platformie roboczej, kierowca NIE może opuścić swojego miejsca przy podniesionej platformie roboczej, miejsce stania na platformie roboczej NIE może być podwyższane środkami pomocniczymi (np. drabiną), a wózek widłowy przy obsadzonej i podniesionej platformie roboczej wolno przemieszczać tylko w celu precyzyjnego pozycjonowania – żadnych normalnych ruchów jazdy.',
  100:'Transport ładunków wiszących (na linach lub łańcuchach) jest ze względu na wysokie niebezpieczeństwo przewrócenia dozwolony tylko odpowiednio do tego przystosowanymi, wystarczająco statecznymi wózkami widłowymi. Osoby prowadzące wiszący ładunek linami przytrzymującymi nie mogą przy tym znajdować się w torze jazdy wózka. Ruchy wahadłowe wiszącego ładunku można ograniczyć specjalnymi osprzętami.',
  102:'W tym ostatnim rozdziale chodzi o kontrole i konserwację: codzienną kontrolę przed użyciem (którą Pan/Pani już zna), regularne kontrole przez osoby kompetentne, dowód kontroli oraz plakietkę kontrolną.',
  103:'Oprócz codziennej kontroli przez kierowcę wózki widłowe i osprzęty muszą być w regularnych odstępach czasu kontrolowane przez osobę kompetentną – np. mistrza warsztatu lub monterów producenta. Dokładne terminy kontroli ustala się w ramach oceny ryzyka; sprawdzony termin kontroli to najwyżej jeden rok.',
  104:'O powtarzających się kontrolach musi być prowadzony dowód kontroli, np. w książce kontroli. Musi on zawierać: datę i zakres kontroli, wynik z podaniem ewentualnych usterek, informacje o koniecznych kontrolach powtórnych, imię i nazwisko oraz adres kontrolującego, oraz adnotację o usunięciu usterek.',
  105:'Na wózku widłowym plakietka kontrolna może wskazywać kolejną wymaganą kontrolę. Ważne przy tym: plakietkę należy umieścić dopiero wtedy, gdy usterki techniczne bezpieczeństwa stwierdzone przy ostatniej kontroli zostały faktycznie usunięte – w przeciwnym razie świeża plakietka mogłaby fałszywie sugerować stan wolny od usterek.'
};

var ERKLAERUNG_MAP_RO={
  3:'În acest capitol vom clarifica mai întâi când, din punct de vedere juridic, este vorba despre un accident de muncă. Apoi vom analiza ce consecințe juridice poate avea pentru dumneavoastră, ca șofer, un accident de muncă – penale, contravenționale, de dreptul muncii și așa-numitul regres.',
  4:'Un accident de muncă în sensul juridic există doar dacă sunt îndeplinite simultan trei condiții: trebuie să fie vorba despre o persoană asigurată (de ex. un angajat), care a desfășurat o activitate asigurată (deci în cadrul muncii sale) și a suferit efectiv un prejudiciu corporal. Dacă lipsește chiar și una dintre aceste trei condiții, din punct de vedere juridic nu este vorba despre un accident de muncă – chiar dacă s-a întâmplat ceva. Acest lucru este important deoarece de el depinde dacă asociația profesională suportă consecințele.',
  5:'Aceste cifre arată cât de serios este subiectul: peste 20.000 de accidente pe an numai la manipularea stivuitoarelor în Germania, dintre care aproximativ 200 cu răniri grave prin cădere sau răsturnarea vehiculului, și în medie 3 până la 5 accidente mortale pe an numai în comerțul cu ridicata și în depozitare. În total mor anual 23 de persoane în accidente cu stivuitoare. Stivuitorul nu este deci un echipament de lucru inofensiv, ci unul dintre cele mai periculoase, dacă nu este condus cu atenție.',
  6:'Statistica arată două puncte nevralgice clare, pe care le vom analiza în detaliu în continuare: accidentele de acroșare (stivuitorul lovește o persoană) și accidentele de răsturnare (stivuitorul se răstoarnă). Aceste două tipuri de accidente sunt responsabile pentru majoritatea accidentelor grave și mortale – de aceea le vom analiza pe amândouă în detaliu.',
  7:'Aceste exemple reale de accidente arată cât de repede se poate ajunge la un accident de acroșare: un moment scurt de neatenție, o persoană într-un unghi mort, sau o pornire spontană fără contact vizual prealabil – și deja se ajunge la coliziune. Cele mai frecvente cauze sunt neatenția, vizibilitatea limitată și spațiul insuficient. Rețineți: înainte de fiecare pornire, priviți mai întâi în jur, claxonați și asigurați-vă că nimeni nu se află în zona de pericol.',
  8:'Accidentele de răsturnare se întâmplă mai rar decât cele de acroșare, dar se termină deosebit de des mortal – peste jumătate din toate accidentele mortale cu stivuitoare sunt accidente de răsturnare. Conform DGUV Vorschrift 68, printre acestea se numără: mersul prea rapid în curbă, conducerea cu sarcina ridicată, deplasarea peste obstacole, întoarcerea și deplasarea oblică pe pante, înclinarea catargului spre înainte, deplasarea pe teren denivelat, supraîncărcarea și vântul puternic. De aceea se aplică regula: coborâți întotdeauna sarcina în timpul deplasării, conduceți încet în curbe și fiți atenți la starea solului.',
  9:'Un accident de muncă poate atrage pentru dumneavoastră simultan mai multe consecințe juridice, care pot acționa independent unele de altele: consecințe penale (de ex. în caz de neglijență gravă), amenzi conform dreptului contravențional, consecințe de dreptul muncii din partea angajatorului, și în cel mai rău caz pretenții de regres din partea asociației profesionale. În continuare vom analiza fiecare dintre aceste patru categorii separat.',
  10:'Din punct de vedere penal devine periculos abia atunci când se întâlnesc trei lucruri: accidentul a dus la o vătămare sau la deces, la baza acestui accident a stat o faptă ilegală, și această faptă a fost comisă cu vinovăție – deci din neglijență sau chiar cu intenție. Dacă sunt întrunite toate cele trei puncte, amenință pedeapsa cu închisoarea sau amenda penală. Conducerea normală, conformă cu regulile, în care totuși se întâmplă ceva neprevăzut, nu duce de regulă la consecințe penale.',
  11:'Dreptul contravențional este cu un grad mai blând decât dreptul penal și are scopul de a asigura respectarea unor reguli precum protecția muncii. Aici este suficientă deja o încălcare din neglijență sau intenționată a unei prevederi sancționate cu amendă – de ex. o normă de prevenire a accidentelor a asociației profesionale – pentru a risca o amendă. Nu trebuie să se fi produs vreo pagubă; simpla încălcare a regulii este deja suficientă.',
  12:'Dacă încălcați obligații contractuale de muncă (de ex. prevederi interne de siguranță), angajatorul poate reacționa din punct de vedere al dreptului muncii, independent de procedurile penale sau contravenționale. Nivelurile posibile merg de la o simplă avertizare, prin somație și avertisment, până la concediere – în funcție de gravitatea și frecvența încălcării.',
  13:'Regresul înseamnă: asociația profesională suportă în mod normal costurile unui accident de muncă, indiferent de cine este vinovat. Doar dacă ați provocat accidentul din neglijență gravă, asociația profesională poate solicita ulterior aceste costuri de la dumneavoastră. Principiul despăgubirii obișnuit conform BGB, conform căruia autorul răspunde direct, nu se aplică aici de regulă – cu excepția accidentelor provocate intenționat.',
  15:'În acest capitol este vorba despre asociația profesională: ce este și ce sarcini are, ce set de reguli emite, ce prevedere se aplică special pentru formarea dumneavoastră ca operator de stivuitor, și cum este structurată această formare în trei niveluri.',
  16:'Asociația profesională este purtătorul asigurării legale de accidente. Există trei tipuri: asociațiile profesionale industriale (pentru majoritatea întreprinderilor, inclusiv depozitare și logistică), asociația profesională agricolă și purtătorii asigurării de accidente ai sectorului public (de ex. pentru grădinițe sau școli). Pentru dumneavoastră, ca operator de stivuitor în întreprindere, de regulă este responsabilă asociația profesională industrială.',
  17:'Asociația profesională are misiunea legală de a preveni prin toate mijloacele adecvate accidentele de muncă, bolile profesionale și riscurile de sănătate legate de muncă – de exemplu prin consilierea întreprinderilor, formări și publicarea setului de prevederi și reguli al asociației profesionale, pe care îl cunoașteți în cadrul acestei formări.',
  18:'Setul de reguli al asociațiilor profesionale se împarte în patru tipuri de documente: Prevederile BG sunt obligatorii din punct de vedere juridic, de ex. norma de prevenire a accidentelor „Flurförderzeuge" (Mijloace de transport intern). Regulile BG descriu cum se implementează de obicei o prevedere, de ex. utilizarea încălțămintei de protecție. Informațiile BG oferă indicații practice, de ex. pentru operatorii de stivuitoare. Iar principiile BG stabilesc, de ex., cum trebuie structurată o formare precum aceasta.',
  19:'Fostul „BGG 925" se numește astăzi „DGUV Grundsatz 308-001" și reglementează exact formarea și autorizarea operatorilor de stivuitoare, pe care o parcurgeți acum. El împarte formarea în trei niveluri: Nivelul 1 (formarea generală, pe care o faceți acum), Nivelul 2 (formare suplimentară pentru tipuri speciale de echipamente) și Nivelul 3 (formare la locul de muncă direct la angajatorul dumneavoastră).',
  20:'Nivelul 1, formarea generală, constă dintr-o parte teoretică (prevederi de siguranță, instrucțiuni de exploatare, tehnica echipamentelor – ceea ce învățați acum) și o parte practică (preluarea, transportul, depunerea și stivuirea sarcinilor, manipularea echipamentelor atașabile uzuale). Ambele părți se încheie cu un examen final, după care primiți un certificat.',
  21:'Nivelul 2 este o formare suplimentară, necesară doar dacă urmează să lucrați cu mijloace de transport intern speciale, care depășesc stivuitorul normal – de ex. stivuitoare pentru containere, mijloace de transport pentru rafturi, stivuitoare cu furcă transversală, stivuitoare telescopice sau echipamente atașabile speciale. Și această formare suplimentară se încheie cu un examen final și un certificat propriu.',
  22:'Nivelul 3, formarea la locul de muncă, are loc direct la angajatorul dumneavoastră și are două părți: partea legată de echipament (mijloacele de transport intern și echipamentele atașabile prezente efectiv în întreprinderea dumneavoastră, precum și condițiile din întreprindere) și partea legată de comportament (comportamentele conform instrucțiunii de exploatare a angajatorului dumneavoastră). Desfășurarea trebuie documentată – abia după aceea angajatorul dumneavoastră vă poate autoriza în scris pentru conducerea independentă.',
  24:'În acest capitol este vorba despre cine are voie să conducă mijloace de transport intern: ce condiții formale se aplică, ce calități fizice, mentale și de caracter trebuie să aveți, și cum decurge autorizarea finală din partea angajatorului dumneavoastră.',
  25:'Pentru a avea voie să conduceți independent mijloace de transport intern, trebuie îndeplinite simultan patru condiții: trebuie să aveți cel puțin 18 ani, să fiți apt și instruit pentru activitate, să vă fi dovedit competența (de ex. prin certificatul din această formare), și să fi fost autorizat în scris de către întreprinzătorul dumneavoastră. O simplă apartenență la un sindicat sau similar nu este suficientă – contează exclusiv aceste patru puncte.',
  26:'Din aptitudinea fizică fac parte: acuitate vizuală suficientă pentru conducerea în siguranță, o capacitate auditivă funcțională pentru a recunoaște semnalele de avertizare acustice, vedere spațială pentru a estima distanțele, și mobilitate suficientă a membrelor pentru o bună capacitate de reacție. Nu este necesară, în schimb, de ex. o statură corporală peste medie.',
  27:'Pe lângă aptitudinea fizică, se așteaptă de la operatorii de stivuitoare: înțelegerea relațiilor tehnice și fizice (de ex. stabilitatea, legea pârghiei), capacitatea de a recunoaște semnalele și de a le pune corect în practică, precum și responsabilitate, fiabilitate și acțiune prudentă. Aptitudinea fizică se stabilește de obicei printr-un control medical de medicina muncii conform principiului G25.',
  28:'Abia atunci când există formarea și dovada de competență, întreprinzătorul poate acorda autorizarea – și aceasta doar în scris, de ex. sub forma unui permis de conducere intern al întreprinderii. Important: această autorizare este valabilă exclusiv pentru întreprinderea care a emis-o și nu poate fi transferată către o altă întreprindere. Dacă schimbați angajatorul, aveți nevoie acolo de o nouă autorizare.',
  30:'În acest capitol analizăm mai îndeaproape accidentele reale: cifrele actuale ale accidentelor, cele două puncte nevralgice majore, și apoi în detaliu accidentele de acroșare și de răsturnare.',
  31:'Aceste trei cifre rezumă riscul: peste 20.000 de accidente anual la manipularea mijloacelor de transport intern în Germania, dintre care aproximativ 200 de accidente grave prin cădere sau răsturnarea vehiculului, și 23 de accidente mortale pe an. Aceasta arată: un stivuitor este un echipament de lucru cu un potențial de pericol real, nu un instrument inofensiv.',
  32:'Cele două puncte nevralgice ale accidentelor au cauze diferite: accidentele de acroșare apar în principal din cauza neatenției șoferului, vizibilității limitate asupra căii de circulație și spațiului restrâns în întreprindere. Accidentele de răsturnare apar în principal din cauza conducerii cu sarcina ridicată, denivelărilor solului și vitezei prea mari în curbă – și sunt responsabile pentru peste 50% din toate accidentele mortale cu stivuitoare.',
  33:'Aceste rapoarte reale de accidente arată accidente tipice de acroșare: într-un caz, șoferul, mergând cu spatele, nu a observat o persoană aflată alături și a trecut peste piciorul acesteia. Într-un alt caz, victima s-a apropiat de stivuitor pentru a întreba ceva pe șofer – șoferul nu a observat-o și a pornit. Ambele cazuri arată: înainte de fiecare mișcare de deplasare, priviți mai întâi în jur, claxonați, căutați contact vizual. Regulile clare de circulație, oglinzile și instalațiile de avertizare ajută suplimentar.',
  34:'Această statistică conține o constatare surprinzătoare, dar importantă: la peste 80% din accidentele mortale de răsturnare, stivuitorul era neîncărcat. Aceasta contrazice ideea greșită conform căreia pericolul de răsturnare există doar la sarcini grele – de fapt, mulți șoferi subestimează tocmai stivuitorul neîncărcat, deși și acesta se poate răsturna la conducere prea rapidă în curbă sau pe sol denivelat. De aceea, indiferent de încărcare, se aplică: coborâți sarcina (dacă există), semnalați denivelările solului, adaptați viteza în curbe și folosiți întotdeauna dispozitivul de reținere a șoferului.',
  37:'În acest capitol este vorba despre depozitarea și stivuirea sigură cu stivuitorul: ce echipamente și dispozitive de depozitare există, ce cerințe se aplică la depozitare și stivuire, cum se depozitează în rafturi, ce comportamente sunt importante la depunerea și scoaterea mărfurilor, și ce trebuie făcut în caz de deteriorări ale echipamentelor de depozitare.',
  38:'Cele două mijloace auxiliare de încărcare cele mai comune au limite de încărcare diferite: un palet plat (europalet) poate fi încărcat cu 1000–1500 kg; la depozitarea în bloc (paleți suprapuși) se aplică: paletul cel mai de jos poate suporta maximum de patru ori sarcina admisă. O cutie-grilaj poate avea maximum 1000 kg capacitate utilă și, la o sarcină distribuită uniform, poate fi stivuită maximum de cinci ori suprapusă.',
  39:'Rafturile nu pot fi încărcate arbitrar: pe raftul însuși este indicată sarcina admisă pentru compartiment și câmp de raft (de ex. pe o plăcuță de sarcină) – aceste valori, precum și sarcinile admise pentru compartimente și câmpuri, trebuie respectate. Rafturile trebuie, de asemenea, verificate regulat pentru deteriorări, de ex. stâlpi de raft îndoiți, iar astfel de deteriorări trebuie semnalate imediat.',
  40:'La depozitarea în rafturi se aplică: în rafturile de sus trebuie să existe frontal dispozitive de siguranță împotriva căderii înalte de cel puțin 0,5 m. Unitățile de încărcare nu au voie să fie depuse brusc în rafturile pentru paleți. Pentru ridicarea peste 1,80 m se poate folosi doar un stivuitor cu acoperiș de protecție pentru șofer, iar sarcinile pot fi depuse doar pe un teren cu capacitate portantă suficientă.',
  41:'Și stivuitorul însuși trebuie să corespundă sarcinii: pentru ridicarea sarcinilor mai înalte de 1,80 m deasupra solului se poate folosi doar un stivuitor cu acoperiș de protecție pentru șofer. În plus, stivuitorul trebuie să fie în principiu adecvat pentru sarcina de transportat, iar capacitatea sa de încărcare admisă nu trebuie niciodată depășită – mai multe despre aceasta în capitolul despre diagrama de capacitate de încărcare.',
  42:'La depunerea și scoaterea mărfurilor se aplică: catargul de ridicare poate fi înclinat spre înainte doar pentru preluarea și depunerea sarcinii, nu în timpul deplasării. Sarcinile ambalate necorespunzător nu au voie să fie stivuite, iar unitățile de încărcare cu paleți deteriorați nu au voie să fie depuse în locuri înalte. În principiu, sarcinile pot fi depuse stabil doar pe un teren cu capacitate portantă suficientă.',
  43:'Anumite zone nu trebuie niciodată blocate prin sarcini depuse, deoarece trebuie să fie liber accesibile în caz de urgență: căile de evacuare, ieșirile de urgență, echipamentele de stingere a incendiilor, echipamentele de prim ajutor și toate echipamentele întreprinderii care trebuie să fie accesibile în orice moment (de ex. tablourile electrice).',
  44:'Deteriorările echipamentelor de depozitare, precum rafturile (de ex. stâlpi de raft îndoiți), trebuie semnalate imediat – raftul deteriorat poate fi refolosit abia după ce a fost reparat. De asemenea, siguranțele lipsă sau deteriorate împotriva ridicării grinzilor de raft (care previn ridicarea neintenționată a grinzilor din ancorare) trebuie semnalate și înlocuite.',
  46:'În acest capitol este vorba despre căile de circulație: dimensiunile necesare ale căilor din întreprindere, cerințele generale privind căile de circulație, regulile speciale din culoarele înguste, și ce se aplică la conducerea pe căile publice de circulație.',
  47:'Se pot circula exclusiv pe căile de circulație care au fost dimensionate, stabilite și aprobate suficient de către întreprinzător. Zonele blocate pentru stivuitoare trebuie marcate clar prin indicatoare de interdicție corespunzătoare – un astfel de indicator trebuie respectat întotdeauna cu caracter obligatoriu.',
  48:'La circulația într-un singur sens, lățimea minimă a unei căi de circulație se orientează după lățimea mijlocului de transport intern respectiv a sarcinii, plus un adaos marginal de 0,5 m pe ambele părți. Acest adaos marginal este necesar pentru ca, chiar și la mici imprecizii de direcție, să nu apară contact cu pereți, rafturi sau alte obstacole.',
  49:'Dacă două mijloace de transport intern se întâlnesc pe același drum (circulație în sens opus), la adaosul marginal bilateral de 0,5 m se adaugă suplimentar un adaos de întâlnire de 0,4 m între cele două vehicule respectiv sarcini. Calea de circulație trebuie deci proiectată corespunzător mai lată decât la circulația pură într-un singur sens.',
  50:'Dacă aceeași cale de circulație este utilizată simultan și de pietoni (circulație pietonală), adaosul marginal crește bilateral de la 0,5 m la 0,75 m – deoarece pietonii au nevoie de o distanță de siguranță mai mare față de vehicul decât ar fi necesar din punct de vedere pur tehnic pentru lățimea vehiculului. Adaosul de întâlnire de 0,4 m între vehicule rămâne neschimbat.',
  51:'Căilor de circulație li se impun mai multe cerințe: solul trebuie să poarte cel puțin 1700 kg/m², în fața ușilor, porților și trecerilor trebuie respectată o distanță de siguranță de cel puțin 1 m, denivelările solului și obstacolele trebuie semnalate și îndepărtate, la intersecții trebuie să existe reguli clare de prioritate (de ex. prioritate de dreapta), și trebuie să existe iluminare suficientă.',
  52:'Prin porțile pendulare se poate intra doar dacă este garantată o vizibilitate suficientă – în caz de îndoială, anunțați trecerea în prealabil prin claxon. Rampele de încărcare trebuie să fie suficient de late (lățimea mijlocului de transport intern plus 0,70 m) și portante. Și cu totul fundamental: căile de circulație trebuie menținute libere și nu au voie să fie blocate cu marfă depozitată.',
  53:'În culoarele înguste (culoare între rafturi în care abia există loc lângă stivuitor) este necesară o protecție specială a persoanelor: măsuri constructive precum garduri sau ziduri, care împiedică accesul pietonilor, instalații de avertizare precum barierele fotoelectrice, care declanșează alarma la intrare, senzori respectiv scanere laser pe stivuitorul însuși, care monitorizează zona de deplasare, și regula de comportament de a intra doar atunci când se poate observa clar că nu se află pietoni în culoar.',
  54:'Pe căile publice de circulație, pentru mijloacele de transport intern se aplică, pe lângă norma de prevenire a accidentelor „Flurförderzeuge", legile generale privind circulația rutieră: legea circulației rutiere (StVG), codul rutier (StVO), regulamentul de înmatriculare a vehiculelor rutiere (StVZO) și regulamentul privind permisul de conducere (FeV).',
  55:'Pentru a avea voie să conduceți pe drumuri publice, aveți nevoie, pe lângă formarea de operator de stivuitor, de o dispoziție de conducere și de permisul de conducere corespunzător. Din 1.1.1999 se aplică: categoria L este suficientă pentru vehicule sub 25 km/h (independent de masa totală admisă) – aceasta privește majoritatea stivuitoarelor în traficul din întreprindere. Vehiculele mai rapide necesită, în funcție de masa totală admisă, categoria B (sub 3,5 t) sau categoria C (peste 3,5 t).',
  58:'În acest capitol este vorba despre fizica din spatele stabilității: construcția stivuitorului, centrul de greutate și semnificația sa, legea pârghiei și axa de răsturnare, diagrame de capacitate de încărcare cu exemple de exerciții, așa-numitul triunghi al muchiilor de răsturnare, și la final un rezumat al celor mai importante comportamente.',
  59:'La stivuitor, dispozitivul de preluare a sarcinii și sarcina se află în fața axei față. Pentru ca vehiculul să nu se răstoarne spre înainte, greutatea proprie a stivuitorului – în special contragreutatea din spate – formează contragreutatea pentru sarcina de pe furcă. Greutatea stivuitorului și greutatea sarcinii trebuie să fie în echilibru: dacă sarcina este prea grea sau prea în față, stivuitorul se răstoarnă.',
  60:'Centrul de greutate al stivuitorului se află aproximativ la înălțimea scaunului șoferului și – la stivuitorul neîncărcat – aproape de muchiile laterale de răsturnare, ceea ce îl face mai predispus la răsturnare decât s-ar putea presupune. Centrul de greutate al sarcinii este punctul imaginar în care se concentrează masa sarcinii; acesta se deplasează în sus la ridicarea sarcinii. Centrul de greutate al sarcinii și al stivuitorului împreună dau centrul de greutate total, care decide asupra stabilității.',
  61:'Axa față a stivuitorului este axa de răsturnare. Se aplică principiul unui balansoar: forța înmulțită cu brațul forței trebuie să fie egală cu sarcina înmulțită cu brațul sarcinii. Pentru ca stivuitorul să rămână stabil în timpul funcționării, produsul de pe partea stivuitorului (greutate proprie × braț de pârghie) trebuie să fie întotdeauna mai mare decât pe partea sarcinii. De aceea se aplică: preluați sarcina cât mai aproape de spatele furcii posibil, pentru a menține mic brațul sarcinii – și astfel momentul de răsturnare.',
  62:'Dacă centrul de greutate total se deplasează dincolo de axa față (axa de răsturnare), stivuitorul se răstoarnă spre înainte. Pentru a preveni acest lucru: preluați sarcina până la spatele furcii, mențineți centrul de greutate total cât mai jos posibil (nu ridicați sarcina inutil de sus) și adaptați viteza în curbe. Și aici se aplică din nou: peste 80% din accidentele mortale de răsturnare s-au întâmplat cu stivuitorul neîncărcat – prudența se aplică deci întotdeauna, nu doar la sarcini grele.',
  63:'Fiecare stivuitor este construit pentru o anumită capacitate de încărcare nominală, pe care producătorul o indică pe plăcuța de fabricație. Această indicație este însă valabilă doar pentru o înălțime de ridicare standardizată și o distanță stabilită a centrului de greutate al sarcinii. Capacitatea de încărcare reală într-o situație concretă depinde suplimentar de distanța reală a centrului de greutate al sarcinii și de înălțimea reală de ridicare și trebuie preluată din diagrama de capacitate de încărcare.',
  64:'Diagrama de capacitate de încărcare arată pe axa X distanța centrului de greutate al sarcinii în mm și pe axa Y sarcina admisă în kg; fiecare linie din diagramă reprezintă o altă înălțime de ridicare. Cu cât sarcina este mai departe de spatele furcii și cu cât este ridicată mai sus, cu atât este mai mică sarcina admisă. În e-learning veți putea încerca ulterior diagrama interactiv, singur, cu ajutorul cursoarelor.',
  65:'La deplasarea în curbă, forța centrifugă acționează lateral asupra stivuitorului – iar această forță crește nu liniar, ci pătratic cu viteza: o dublare a vitezei cvadruplează forța centrifugă. Deosebit de periculoasă este deplasarea în curbă cu stivuitorul neîncărcat, deoarece centrul său de greutate se află aproape de muchiile laterale de răsturnare. De aceea se aplică: parcurgeți întotdeauna curbele cu viteză adaptată, redusă, și cu raza cât mai mare posibil.',
  66:'Spre deosebire de un autoturism, care formează un patrulater de sprijin pe patru roți, un stivuitor cu trei roți stă doar pe un triunghi de sprijin – muchiile de răsturnare merg de la roțile din față la un punct de pe axa din spate. La stivuitorul neîncărcat, centrul de greutate se află aproape de muchiile laterale de răsturnare ale acestui triunghi, ceea ce crește pericolul de răsturnare. O sarcină preluată aproape de sol crește stabilitatea, o sarcină ridicată o reduce din nou.',
  67:'Și un stivuitor cu patru roți formează, în ciuda celor patru roți, matematic un triunghi de sprijin, deoarece axa din spate respectiv axa de direcție este fixată oscilant doar într-un singur punct pe șasiu (axă oscilantă). Mijlocul acestei axe oscilante formează vârful triunghiului de sprijin. Rezultat: un stivuitor cu patru roți are în principiu același pericol de răsturnare ca un stivuitor cu trei roți – al patrulea contact al roții nu aduce stabilitate suplimentară împotriva răsturnării laterale.',
  68:'Ca rezumat, cele mai importante comportamente pentru stabilitate: nu supraîncărcați stivuitorul, preluați sarcinile până la spatele furcii, mențineți mică înălțimea centrului de greutate total, parcurgeți curbele cu viteză adaptată și rază cât mai mare posibil, și evitați accelerarea și frânarea puternică.',
  70:'În acest capitol este vorba despre exploatarea practică a stivuitorului: diferitele tipuri de mijloace de transport intern și tipurile lor de acționare, instrucțiunile de exploatare și instrucțiunea de lucru, controlul zilnic înainte de utilizare, preluarea, încărcarea și depunerea sarcinilor, deplasarea sarcinilor inclusiv condițiile de vizibilitate, și părăsirea corectă a stivuitorului.',
  71:'Există multe tipuri diferite de construcție a mijloacelor de transport intern pentru scopuri diferite de utilizare: stivuitorul clasic (stivuitor cu contragreutate) ca echipament universal pentru depozit și utilizare exterioară, stivuitorul cu catarg retractabil pentru culoare înguste (catargul este extins spre înainte pentru preluarea sarcinii), stivuitorul de comisionare (șoferul se ridică el însuși cu platforma) și stivuitorul pentru containere pentru sarcini grele în exploatarea cu containere.',
  72:'Motoarele electrice sunt silențioase și nu emit gaze de eșapament, dar au timpi de încărcare a bateriei și, prin aceasta, o durată de utilizare limitată – bine adecvate pentru utilizarea în spații închise. Motoarele cu ardere internă oferă o putere de acționare ridicată, dar sunt utilizabile doar limitat în spații închise din cauza gazelor de eșapament.',
  73:'La stivuitoarele pe gaz lichefiat se aplică: depozitați doar în spații suficient ventilate, păstrați o distanță de cel puțin 3 m față de deschiderile subsolurilor, canalelor sau gropilor (deoarece gazul lichefiat este mai greu decât aerul și se poate acumula acolo), și verificați regulat instalația. La stivuitoarele diesel în spații închise trebuie folosit combustibil cu conținut redus de sulf, respectat un concept de întreținere și este necesară o purificare a gazelor de eșapament (de ex. filtru de particule); la stivuitoarele pe gaz în spații închise este necesar suplimentar un catalizator și măsurarea regulată a CO.',
  74:'Suprastructurile interschimbabile depozitate (de ex. suprastructuri de camion sau containere fără șasiu) pot fi accesate cu stivuitorul doar dacă sunt concepute pentru sarcinile care apar, suprafața de amplasare are capacitate portantă suficientă, iar suprastructura este asigurată împotriva răsturnării. Dacă lipsește chiar și una dintre aceste trei condiții, nu se poate intra.',
  75:'În timpul funcționării, stivuitorul poate fi acționat doar de la posturile de comandă prevăzute pentru aceasta, iar la fiecare acțiune trebuie avut grijă să nu fie puse în pericol persoane. Urcarea și coborârea sunt permise doar la vehiculul oprit. Este absolut interzis să staționați pe sarcină, sub o sarcină ridicată sau sub un dispozitiv de preluare a sarcinii ridicat – acest lucru se aplică și pentru acțiuni scurte.',
  77:'Dispozitivele de reținere a șoferului previn aruncarea șoferului din stivuitor în cazul unui accident de răsturnare – acest lucru este deosebit de periculos, deoarece șoferul este apoi de obicei strivit sub stivuitor. Există diferite tipuri: cabina închisă a șoferului (ușile trebuie să fie închise în timpul funcționării), uși cu bară, centura de siguranță pentru bazin (mai întâi centura, apoi pornirea – soluția cea mai economică) și o plasă cu bară pivotantă. Care dispozitiv este disponibil depinde de stivuitor – important este să îl folosiți întotdeauna.',
  78:'Înainte de începerea utilizării, șoferul trebuie să verifice stivuitorul conform prevederilor instrucțiunilor de exploatare (control zilnic înainte de utilizare). Dacă se constată deficiențe care afectează siguranța, stivuitorul nu are voie să fie pus în funcțiune. Deficiențele trebuie raportate întreprinzătorului sau superiorului și pot fi remediate doar de persoane competente (de ex. tehnicieni ai producătorului) – nu de șofer însuși.',
  79:'Deficiențe de siguranță la care trebuie acordată o atenție deosebită la controlul zilnic înainte de utilizare: anvelope deteriorate sau presiune incorectă a aerului, frâna de serviciu sau de parcare ineficientă, suporturile furcilor deformate sau lovite, siguranțele defecte împotriva ridicării sau deplasării furcilor, fisuri la părțile portante precum catargul de ridicare, scurgeri în zona hidraulicii, precum și furci îndoite, fisurate sau puternic uzate. Fiecare dintre aceste deficiențe înseamnă: nu puneți stivuitorul în funcțiune, ci raportați-l.',
  80:'Cei șapte pași la preluarea unei sarcini: conduceți drept în fața sarcinii, poziționați catargul vertical, introduceți încet furcile și preluați sarcina până la spatele furcii, ridicați sarcina deasupra solului, înclinați catargul spre înapoi, priviți în ambele părți înapoi înainte de deplasarea cu spatele, și abia apoi conduceți încet cu spatele.',
  81:'Cei șapte pași la depunerea unei sarcini în raft: apropiați-vă de raft, poziționați catargul vertical, ridicați ușor sarcina, intrați în raft, depuneți sarcina, priviți în ambele părți înapoi și retrageți-vă de la raft, și în final coborâți furcile, înclinați catargul spre înapoi și plecați.',
  82:'La deplasarea sarcinilor se aplică: conduceți cu catargul înclinat spre înapoi, ridicați dispozitivul de preluare a sarcinii doar deasupra solului (max. 50 cm), la o sarcină prea mare cereți îndrumare sau conduceți cu spatele, în direcția de deplasare nu trebuie acoperiți mai mult de 10 m de sol, pe urcări și coborâri conduceți sarcina întotdeauna pe partea dinspre deal, și pe porțiunile în pantă nu întoarceți niciodată – pericol ridicat de răsturnare!',
  83:'Viteza de deplasare trebuie întotdeauna adaptată condițiilor din întreprindere, curbele trebuie în principiu parcurse încet – majoritatea accidentelor mortale apar din cauza vitezei de deplasare prea mari. Vizibilitatea trebuie să fie atât de bună încât, prin sarcină, să nu fie acoperiți mai mult de 10 m de sol în direcția de deplasare. Principiu: se poate deplasa doar dacă șoferul are vizibilitate suficientă – la nevoie, cereți îndrumare.',
  85:'La părăsirea stivuitorului trebuie mai întâi acționată frâna de parcare (chiar și la o părăsire scurtă), apoi coborâte furcile în poziția cea mai joasă și înclinate vârfurile în jos, oprit motorul, scoasă și luată cheia (pentru ca nicio persoană neautorizată să nu poată folosi stivuitorul), și asigurat că stivuitorul parcat nu constituie un obstacol pe căile de circulație și de evacuare.',
  86:'La accesarea liftelor cu stivuitorul: respectați capacitatea de încărcare a liftului, folosiți doar lifturi aprobate, coborâți din stivuitor și rămâneți în zona comenzii, poziționați stivuitorul central în lift, acționați frâna de parcare și păstrați o distanță suficientă de cel puțin 0,1 m față de pereții puțului liftului.',
  87:'La încărcarea și descărcarea vehiculelor (camioane, remorci), acestea trebuie asigurate împotriva rostogolirii și, dacă este cazul, a răsturnării – de obicei prin frâna de parcare plus pene sub roțile neghidate. La semiremorci pot fi necesare dispozitive de sprijin suplimentare. Șoferul vehiculului și șoferul stivuitorului trebuie să se înțeleagă înainte de încărcare/descărcare, iar mișcările vehiculului în timpul încărcării trebuie prevenite în siguranță.',
  88:'Remorcile cu direcție pe pivot central (la care se rotește întreaga axă față) au un pericol special de răsturnare: înainte de încărcare sau descărcare, axa față trebuie neapărat aliniată drept, altfel remorca se poate răsturna. Și aici se aplică: înțelegere între șoferul stivuitorului și conducătorul vehiculului, și prevenirea mișcărilor vehiculului în timpul încărcării.',
  90:'În acest capitol este vorba despre situații speciale de utilizare: utilizarea echipamentelor atașabile, transportul de persoane, deplasarea remorcilor și a vehiculelor pe șine, utilizarea platformelor de lucru și transportul sarcinilor suspendate.',
  91:'Echipamentele atașabile (de ex. cupe, cleme, dornuri) pot fi utilizate doar dacă echipamentul atașabil și stivuitorul sunt compatibile între ele – de ex. în privința capacității de încărcare, fixării și alimentării cu energie. Echipamentul atașabil trebuie fixat conform destinației, nu trebuie depășită nici capacitatea de încărcare a echipamentului atașabil, nici a stivuitorului, iar echipamentele atașabile trebuie verificate regulat.',
  92:'Transportul de persoane pe stivuitor este permis doar dacă este reglementat expres prin instrucțiunea de exploatare, există locuri de șezut sau de staționare adecvate, precum și mânere de susținere, și există un dispozitiv suplimentar de reținere pentru persoana transportată. Dacă lipsește chiar și una dintre aceste condiții, transportul de persoane nu este permis.',
  93:'Remorcile pot fi deplasate cu stivuitorul doar dacă ansamblul poate fi frânat în siguranță la toate mișcările, stivuitorul și remorca sunt echipate pentru exploatarea cu remorcă (de ex. cu dispozitiv de remorcare adecvat), și sarcina admisă a remorcii este cunoscută și nu este depășită.',
  94:'Vehiculele pe șine pot fi deplasate cu stivuitorul prin tragere cu cabluri doar în condiții speciale – de ex. cu un cuplaj de alunecare, care se eliberează în caz de suprasolicitare. Condiții: stivuitorul se află în afara zonei de deplasare a vehiculului pe șine, șoferul stivuitorului poate observa zona șinelor sau este îndrumat, și există un dispozitiv de frânare.',
  95:'Împingerea vehiculelor pe șine cu stivuitorul este permisă doar dacă stivuitorul este echipat pentru aceasta (de ex. cu o grindă de împingere), sunt utilizate echipamente speciale de manevră, șoferul stivuitorului este instruit și există un dispozitiv de frânare. Este expres NEpermisă împingerea cu suporturi libere sau direct cu părți ale stivuitorului (de ex. furcile) – aceasta poate duce la accidente grave.',
  97:'Ridicarea persoanelor cu ajutorul stivuitorului (deci utilizarea unei platforme de lucru) este permisă doar dacă se folosește un stivuitor cu capacitate de încărcare suficientă și o platformă de lucru conformă cu prevederile. Simpla staționare pe furci sau pe un palet fără o platformă de lucru verificată este expres nepermisă.',
  98:'O platformă de lucru conformă cu prevederile trebuie echipată cu: o protecție împotriva căderii formată din bară de mână, genunchi și picior, o protecție a spatelui rezistentă la pătrundere (protejează împotriva pericolului de strivire la catargul de ridicare), buzunare de introducere pe partea inferioară (pentru preluarea sigură prin furci), o siguranță împotriva alunecării de pe furci, iar ușa de acces poate fi deschisă doar spre interior.',
  99:'La utilizarea platformelor de lucru se aplică: comunicare impecabilă între șofer și persoanele de pe platforma de lucru, șoferul NU are voie să își părăsească locul cât timp platforma de lucru este ridicată, locul de staționare pe platforma de lucru NU are voie să fie ridicat cu mijloace auxiliare (de ex. o scară), iar stivuitorul poate fi deplasat, cu platforma de lucru ocupată și ridicată, doar pentru poziționare fină – nicio mișcare normală de deplasare.',
  100:'Transportul sarcinilor suspendate (pe cabluri sau lanțuri) este permis, din cauza pericolului ridicat de răsturnare, doar cu stivuitoare adecvate în acest scop, suficient de stabile. Persoanele care conduc sarcina suspendată cu cabluri de reținere nu au voie să se afle în traiectoria de deplasare a stivuitorului. Mișcările pendulare ale sarcinii suspendate pot fi limitate prin echipamente atașabile speciale.',
  102:'În acest ultim capitol este vorba despre verificări și întreținere: controlul zilnic înainte de utilizare (pe care îl cunoașteți deja), verificările regulate efectuate de persoane competente, dovada de verificare și eticheta de verificare.',
  103:'Pe lângă controlul zilnic efectuat de șofer, stivuitoarele și echipamentele atașabile trebuie verificate la intervale regulate de o persoană competentă – de ex. un maistru de atelier sau tehnicieni ai producătorului. Termenele exacte de verificare sunt stabilite în cadrul unei evaluări de risc; un termen de verificare consacrat este de cel mult un an.',
  104:'Despre verificările periodice trebuie ținută o dovadă de verificare, de ex. într-un registru de verificare. Acesta trebuie să conțină: data și amploarea verificării, rezultatul cu indicarea eventualelor deficiențe, informații despre verificările ulterioare necesare, numele și adresa verificatorului, și o mențiune privind remedierea deficiențelor.',
  105:'Pe stivuitor, o etichetă de verificare poate indica următoarea verificare scadentă. Important aici: eticheta trebuie aplicată abia atunci când deficiențele tehnice de siguranță constatate la ultima verificare au fost efectiv remediate – altfel o etichetă nouă ar putea sugera fals o stare fără deficiențe.'
};

var ERKLAERUNG_MAP_SQ={
  3:'Në këtë kapitull së pari do të sqarojmë kur ligjërisht ekziston fare një aksident në punë. Pastaj do të shohim se çfarë pasojash ligjore mund të ketë për ju si shofer një aksident në punë – penale, sipas së drejtës së kundërvajtjeve, të së drejtës së punës dhe të ashtuquajturin regres.',
  4:'Një aksident në punë në kuptimin ligjor ekziston vetëm nëse plotësohen njëkohësisht tri kushte: duhet të bëhet fjalë për një person të siguruar (p.sh. një të punësuar), i cili ka ushtruar një veprimtari të siguruar (pra në kuadër të punës së tij), dhe në këtë rast ka pësuar realisht dëmtim trupor. Nëse mungon qoftë edhe një nga këto tri kushte, ligjërisht nuk bëhet fjalë për një aksident në punë – edhe nëse ka ndodhur diçka. Kjo është e rëndësishme sepse nga kjo varet nëse shoqëria e sigurimeve mbulon pasojat.',
  5:'Këto shifra tregojnë sa serioz është tema: mbi 20.000 aksidente në vit vetëm gjatë përdorimit të stivueseve në Gjermani, nga të cilat rreth 200 me lëndime të rënda nga rënia ose përmbysja e mjetit, dhe mesatarisht 3 deri 5 aksidente vdekjeprurëse në vit vetëm në tregtinë me shumicë dhe magazinim. Gjithsej vdesin çdo vit 23 persona në aksidente me stivuese. Stivuesja pra nuk është një mjet pune i padëmshëm, por një ndër më të rrezikshmit, nëse nuk drejtohet me kujdes.',
  6:'Statistika tregon dy pika kryesore të qarta, të cilat do t\'i trajtojmë më në detaje në vazhdim: aksidentet e përplasjes (stivuesja godet një person) dhe aksidentet e përmbysjes (stivuesja përmbyset). Këto dy lloje aksidentesh janë përgjegjëse për shumicën e aksidenteve të rënda dhe vdekjeprurëse – prandaj do t\'i shohim të dyja në detaje.',
  7:'Këto shembuj të vërtetë aksidentesh tregojnë sa shpejt mund të ndodhë një aksident përplasjeje: një moment i shkurtër mosvëmendjeje, një person në zonën e verbër, ose një nisje spontane pa kontakt paraprak vizual – dhe menjëherë ndodh përplasja. Shkaqet më të shpeshta janë mosvëmendja, shikueshmëria e kufizuar dhe hapësira e pamjaftueshme. Mbani mend: para çdo nisjeje shikoni përreth, bini bori dhe sigurohuni që askush të mos ndodhet në zonën e rrezikut.',
  8:'Aksidentet e përmbysjes ndodhin më rrallë se aksidentet e përplasjes, por përfundojnë veçanërisht shpesh vdekjeprurëse – mbi gjysma e të gjitha aksidenteve vdekjeprurëse me stivuese janë aksidente përmbysjeje. Sipas DGUV Vorschrift 68, ndër to bëjnë pjesë: lëvizja me shpejtësi të tepërt në kthesa, drejtimi me ngarkesë të ngritur, lëvizja kundër pengesave, kthimi dhe lëvizja në kënd në pjerrësi, përkulja e katargut përpara, lëvizja në sipërfaqe të pabarabartë, mbingarkesa dhe era e fortë. Prandaj vlen rregulli: gjatë lëvizjes uleni gjithmonë ngarkesën, në kthesa lëvizni ngadalë dhe kini kujdes për gjendjen e dyshemesë.',
  9:'Një aksident në punë mund të sjellë për ju njëkohësisht disa pasoja ligjore, të cilat mund të veprojnë të pavarura nga njëra-tjetra: pasoja penale (p.sh. në rast pakujdesie të rëndë), gjoba sipas së drejtës së kundërvajtjeve, pasoja të së drejtës së punës nga punëdhënësi juaj, dhe në rastin më të keq kërkesa regresi nga shoqëria e sigurimeve. Në vazhdim do të shohim secilën nga këto katër kategori veç e veç.',
  10:'Nga ana penale bëhet serioze vetëm kur bashkohen tri gjëra: aksidenti ka shkaktuar lëndim ose vdekje, në themel të këtij aksidenti ka qenë një veprim i kundërligjshëm, dhe ky veprim është kryer me faj – pra nga pakujdesia ose madje me dashje. Nëse plotësohen të tri pikat, kërcënon dënimi me burg ose gjobë. Drejtimi normal, sipas rregullave, gjatë të cilit megjithatë ndodh diçka e paparashikuar, zakonisht nuk sjell pasoja penale.',
  11:'E drejta e kundërvajtjeve është një shkallë më e butë se e drejta penale dhe ka për qëllim të sigurojë respektimin e rregullave si mbrojtja në punë. Këtu mjafton tashmë një shkelje nga pakujdesia ose me dashje e një dispozite të dënueshme me gjobë – p.sh. një rregull parandalimi aksidentesh i shoqërisë së sigurimeve – për të rrezikuar një gjobë. Për këtë nuk duhet as të ketë ndodhur ndonjë dëm; vetë shkelja e rregullit mjafton tashmë.',
  12:'Nëse shkelni detyrimet e kontratës së punës (p.sh. dispozitat e sigurisë të brendshme), punëdhënësi juaj mund të reagojë sipas së drejtës së punës, pavarësisht nga procedurat penale ose të kundërvajtjeve. Shkallët e mundshme shkojnë nga një paralajmërim i thjeshtë, përmes një vërejtjeje dhe qortimi, deri te largimi nga puna – në varësi të rëndësisë dhe shpeshtësisë së shkeljes.',
  13:'Regresi do të thotë: shoqëria e sigurimeve zakonisht mbulon kostot e një aksidenti në punë, pavarësisht se kush ka fajin. Vetëm nëse e keni shkaktuar aksidentin me pakujdesi të rëndë, shoqëria e sigurimeve mund të kërkojë më pas këto kosto nga ju. Parimi i zakonshëm i dëmshpërblimit sipas BGB, sipas të cilit shkaktari përgjigjet drejtpërdrejt, zakonisht nuk zbatohet këtu – përveç në rastet e aksidenteve të shkaktuara me dashje.',
  15:'Në këtë kapitull bëhet fjalë për shoqërinë e sigurimeve: çfarë është dhe çfarë detyrash ka, çfarë rregulloresh nxjerr, cila dispozitë vlen posaçërisht për trajnimin tuaj si operator stivueje, dhe si është ndërtuar ky trajnim në tri nivele.',
  16:'Shoqëria e sigurimeve është bartësja e sigurimit ligjor kundër aksidenteve. Ka tri lloje: shoqëritë e sigurimeve industriale (për shumicën e ndërmarrjeve, përfshirë magazinimin dhe logjistikën), shoqëria e sigurimeve bujqësore dhe bartësit e sigurimit kundër aksidenteve të sektorit publik (p.sh. për kopshte apo shkolla). Për ju si operator stivueje në ndërmarrje, zakonisht përgjegjëse është shoqëria e sigurimeve industriale.',
  17:'Shoqëria e sigurimeve ka detyrimin ligjor të parandalojë me të gjitha mjetet e përshtatshme aksidentet në punë, sëmundjet profesionale dhe rreziqet shëndetësore të lidhura me punën – për shembull përmes këshillimit të ndërmarrjeve, trajnimeve dhe publikimit të rregullores dhe udhëzimeve të shoqërisë së sigurimeve, të cilat i njihni në këtë trajnim.',
  18:'Rregullorja e shoqërive të sigurimeve ndahet në katër lloje dokumentesh: Dispozitat BG janë detyruese ligjërisht, p.sh. rregulli i parandalimit të aksidenteve „Flurförderzeuge" (Mjetet e transportit të brendshëm). Rregullat BG përshkruajnë si zakonisht zbatohet një dispozitë, p.sh. përdorimi i këpucëve mbrojtëse. Informacionet BG japin udhëzime praktike, p.sh. për operatorët e stivueseve. Ndërsa parimet BG përcaktojnë p.sh. si duhet ndërtuar një trajnim si ky këtu.',
  19:'Ish-„BGG 925" quhet sot „DGUV Grundsatz 308-001" dhe rregullon pikërisht trajnimin dhe autorizimin e operatorëve të stivueseve, të cilin po e ndiqni tani. Ai e ndan trajnimin në tri nivele: Niveli 1 (trajnimi i përgjithshëm, që po bëni tani), Niveli 2 (trajnim shtesë për lloje të veçanta pajisjesh) dhe Niveli 3 (trajnimi në ndërmarrje drejtpërdrejt te punëdhënësi juaj).',
  20:'Niveli 1, trajnimi i përgjithshëm, përbëhet nga një pjesë teorike (dispozita sigurie, udhëzime përdorimi, teknika e pajisjeve – ajo që po mësoni tani) dhe një pjesë praktike (marrja, transportimi, vendosja dhe stivosja e ngarkesave, përdorimi i pajisjeve shtesë të zakonshme). Të dyja pjesët përfundojnë me një provim përfundimtar, pas të cilit merrni një certifikatë.',
  21:'Niveli 2 është një trajnim shtesë, i nevojshëm vetëm nëse do të punoni me stivuese speciale që shkojnë përtej stivueses normale – p.sh. stivuese kontejnerësh, mjete transporti për rafte, stivuese me dhëmbë tërthorë, stivuese teleskopike ose pajisje shtesë të veçanta. Edhe ky trajnim shtesë përfundon me një provim përfundimtar dhe një certifikatë të vetën.',
  22:'Niveli 3, trajnimi në ndërmarrje, zhvillohet drejtpërdrejt te punëdhënësi juaj dhe ka dy pjesë: pjesën në lidhje me pajisjen (stivueset dhe pajisjet shtesë që ekzistojnë realisht në ndërmarrjen tuaj, si dhe kushtet e ndërmarrjes) dhe pjesën në lidhje me sjelljen (mënyrat e sjelljes sipas udhëzimit të punës të punëdhënësit tuaj). Zbatimi duhet të dokumentohet – vetëm pas kësaj punëdhënësi juaj mund t\'ju autorizojë me shkrim për drejtim të pavarur.',
  24:'Në këtë kapitull bëhet fjalë për atë se kush ka të drejtë të drejtojë fare stivuese: cilat kushte formale vlejnë, cilat cilësi fizike, mendore dhe karakteri duhet të keni, dhe si zhvillohet autorizimi përfundimtar nga punëdhënësi juaj.',
  25:'Për të pasur të drejtë të drejtoni në mënyrë të pavarur stivuese, duhet të plotësohen njëkohësisht katër kushte: duhet të jeni të paktën 18 vjeç, të përshtatshëm dhe të trajnuar për veprimtarinë, të keni dëshmuar aftësinë tuaj (p.sh. përmes certifikatës nga ky trajnim), dhe të jeni autorizuar me shkrim nga sipërmarrësi juaj. Vetëm anëtarësimi në një sindikatë ose diçka e ngjashme nuk mjafton – vlejnë ekskluzivisht këto katër pika.',
  26:'Aftësia fizike përfshin: mprehtësi të mjaftueshme të shikimit për drejtim të sigurt, aftësi dëgjimi funksionale për të njohur sinjalet paralajmëruese akustike, shikim hapësinor për të vlerësuar distancat, dhe lëvizshmëri të mjaftueshme të gjymtyrëve për një aftësi të mirë reagimi. Nuk kërkohet, në të kundërt, p.sh. gjatësi trupore mbi mesataren.',
  27:'Përveç aftësisë fizike, nga operatorët e stivueseve pritet: kuptimi i lidhjeve teknike dhe fizike (p.sh. qëndrueshmëria, ligji i levës), aftësia për të njohur sinjalet dhe për t\'i zbatuar saktë, si dhe përgjegjësi, besueshmëri dhe veprim i kujdesshëm. Aftësia fizike zakonisht konstatohet përmes një ekzaminimi mjekësor parandalues të mjekësisë së punës sipas parimit G25.',
  28:'Vetëm kur ekzistojnë trajnimi dhe dëshmia e aftësisë, sipërmarrësi mund të japë autorizimin – dhe këtë vetëm me shkrim, p.sh. në formën e një leje drejtimi të brendshme të ndërmarrjes. E rëndësishme: ky autorizim vlen ekskluzivisht për ndërmarrjen që e ka lëshuar, dhe nuk mund të transferohet te një ndërmarrje tjetër. Nëse ndryshoni punëdhënësin, atje ju nevojitet një autorizim i ri.',
  30:'Në këtë kapitull do të shohim më nga afër ngjarjet reale të aksidenteve: shifrat aktuale të aksidenteve, dy pikat kryesore të mëdha të aksidenteve, dhe pastaj në detaje aksidentet e përplasjes dhe të përmbysjes.',
  31:'Këto tri shifra përmbledhin rrezikun: mbi 20.000 aksidente në vit gjatë përdorimit të stivueseve në Gjermani, nga të cilat rreth 200 aksidente të rënda nga rënia ose përmbysja e mjetit, dhe 23 aksidente vdekjeprurëse në vit. Kjo tregon: një stivuese është një mjet pune me potencial real rreziku, jo një vegël e padëmshme.',
  32:'Dy pikat kryesore të aksidenteve kanë shkaqe të ndryshme: aksidentet e përplasjes lindin kryesisht nga mosvëmendja e shoferit, shikueshmëria e kufizuar mbi rrugën dhe ngushtësia hapësinore në ndërmarrje. Aksidentet e përmbysjes lindin kryesisht nga drejtimi me ngarkesë të ngritur, pabarazitë e dyshemesë dhe lëvizja shumë e shpejtë në kthesa – dhe janë përgjegjëse për mbi 50% të të gjitha aksidenteve vdekjeprurëse me stivuese.',
  33:'Këto raporte të vërteta aksidentesh tregojnë aksidente tipike përplasjeje: në një rast, shoferi, duke lëvizur prapa, nuk vuri re një person që qëndronte pranë dhe i kaloi mbi këmbë. Në një rast tjetër, i dëmtuari iu afrua stivueses për të pyetur diçka shoferin – shoferi nuk e vuri re dhe u nis. Të dy rastet tregojnë: para çdo lëvizjeje shikoni përreth, bini bori, kërkoni kontakt vizual. Rregullat e qarta të trafikut, pasqyrat dhe instalimet paralajmëruese ndihmojnë shtesë.',
  34:'Kjo statistikë përmban një konstatim befasues, por të rëndësishëm: në mbi 80% të aksidenteve vdekjeprurëse të përmbysjes, stivuesja ishte pa ngarkesë. Kjo hedh poshtë besimin e gabuar se rreziku i përmbysjes ekziston vetëm te ngarkesat e rënda – në fakt, shumë shoferë nënvlerësojnë pikërisht stivuesen pa ngarkesë, edhe pse edhe ajo mund të përmbyset gjatë lëvizjes shumë të shpejtë në kthesa ose në dysheme të pabarabartë. Prandaj, pavarësisht nga ngarkesa, vlen: ulni ngarkesën (nëse ka), raportoni pabarazitë e dyshemesë, përshtatni shpejtësinë në kthesa dhe përdorni gjithmonë pajisjen mbajtëse të shoferit.',
  37:'Në këtë kapitull bëhet fjalë për magazinimin dhe stivosjen e sigurt me stivuesen: cilat pajisje dhe mjete magazinimi ekzistojnë, cilat kërkesa vlejnë për magazinimin dhe stivosjen, si magazinohet në rafte, cilat sjellje janë të rëndësishme gjatë vendosjes dhe nxjerrjes, dhe çfarë duhet bërë në rast dëmtimesh të pajisjeve të magazinimit.',
  38:'Dy mjetet ndihmëse ngarkese më të zakonshme kanë kufij të ndryshëm ngarkese: një paletë e sheshtë (europaletë) mund të ngarkohet me 1000–1500 kg; në magazinimin në bllok (paleta mbi njëra-tjetrën) vlen: paleta më e poshtme mund të mbajë maksimumi katërfishin e ngarkesës së lejuar. Një kuti-rrjetë mund të ketë maksimumi 1000 kg ngarkesë të dobishme dhe, me ngarkesë të shpërndarë njëtrajtësisht, mund të stivoset maksimumi pesë herë mbi njëra-tjetrën.',
  39:'Raftet nuk mund të ngarkohen në mënyrë arbitrare: në vetë raftin është treguar ngarkesa e lejuar për sektorin dhe fushën e raftit (p.sh. në një pllakë ngarkese) – këto vlera, si dhe ngarkesat e lejuara të sektorëve dhe fushave, duhet të respektohen. Raftet duhet gjithashtu të kontrollohen rregullisht për dëmtime, p.sh. shtylla rafti të përkulura, dhe dëmtime të tilla duhet të raportohen menjëherë.',
  40:'Gjatë magazinimit në rafte vlen: në sektorët më të lartë duhet të ketë përpara pajisje sigurie kundër rënies me lartësi së paku 0,5 m. Njësitë e ngarkesës nuk duhet të vendosen befasisht në raftet e paletave. Për ngritje mbi 1,80 m mund të përdoret vetëm një stivuese me çati mbrojtëse për shoferin, dhe ngarkesat mund të vendosen vetëm në një sipërfaqe me kapacitet mbajtës të mjaftueshëm.',
  41:'Edhe vetë stivuesja duhet t\'i përshtatet detyrës: për ngritjen e ngarkesave më të larta se 1,80 m mbi dysheme mund të përdoret vetëm një stivuese me çati mbrojtëse për shoferin. Përveç kësaj, stivuesja duhet në parim të jetë e përshtatshme për ngarkesën që do të mbajë, dhe kapaciteti i saj mbajtës i lejuar nuk duhet kurrë të tejkalohet – më shumë për këtë në kapitullin për diagramin e kapacitetit mbajtës.',
  42:'Gjatë vendosjes dhe nxjerrjes vlen: katargu ngritës mund të përkulet përpara vetëm për marrjen dhe vendosjen e ngarkesës, jo gjatë lëvizjes. Ngarkesat e paketuara në mënyrë jo të rregullt nuk duhet të stivosen, dhe njësitë e ngarkesës me paleta të dëmtuara nuk duhet të vendosen në vende më të larta. Në parim, ngarkesat mund të vendosen në mënyrë të qëndrueshme vetëm në një sipërfaqe me kapacitet mbajtës të mjaftueshëm.',
  43:'Zona të caktuara nuk duhet kurrë të bllokohen nga ngarkesa të vendosura, sepse duhet të jenë të lira për t\'u aksesuar në raste emergjence: rrugët e evakuimit, daljet e emergjencës, pajisjet e fikjes së zjarrit, pajisjet e ndihmës së parë dhe të gjitha pajisjet e ndërmarrjes që duhet të jenë të aksesueshme në çdo kohë (p.sh. panelet elektrike).',
  44:'Dëmtimet e pajisjeve të magazinimit si raftet (p.sh. shtylla rafti të përkulura) duhet të raportohen menjëherë – rafti i dëmtuar mund të përdoret përsëri vetëm pasi të jetë riparuar. Gjithashtu, siguresat mungesore ose të dëmtuara kundër ngritjes së traversave të raftit (të cilat parandalojnë ngritjen e paqëllimshme të traversave nga ankorimi) duhet të raportohen dhe zëvendësohen.',
  46:'Në këtë kapitull bëhet fjalë për rrugët e trafikut: dimensionet e nevojshme të rrugëve në ndërmarrje, kërkesat e përgjithshme për rrugët e trafikut, rregullat e veçanta në korridoret e ngushta, dhe çfarë vlen gjatë lëvizjes në rrugët publike të trafikut.',
  47:'Mund të përdoren vetëm rrugët e trafikut që janë dimensionuar, përcaktuar dhe miratuar mjaftueshëm nga sipërmarrësi. Zonat e ndaluara për stivuese duhet të shënohen qartë me shenja ndalimi përkatëse – një shenjë e tillë duhet respektuar gjithmonë në mënyrë detyruese.',
  48:'Në trafikun me një drejtim, gjerësia minimale e një rruge trafiku përcaktohet nga gjerësia e stivueses respektivisht ngarkesës, plus një shtesë anësore prej 0,5 m në të dyja anët. Kjo shtesë anësore është e nevojshme që edhe në rast pasaktësish të vogla drejtimi të mos ndodhë kontakt me mure, rafte apo pengesa të tjera.',
  49:'Nëse dy stivuese takohen në të njëjtën rrugë (trafik i kundërt), përveç shtesës anësore dyanëshe prej 0,5 m shtohet edhe një shtesë takimi prej 0,4 m mes dy mjeteve respektivisht ngarkesave. Rruga e trafikut duhet pra të projektohet gjithsej më e gjerë se sa te trafiku i pastër me një drejtim.',
  50:'Nëse e njëjta rrugë trafiku përdoret njëkohësisht edhe nga këmbësorë (trafik këmbësorësh), shtesa anësore rritet dyanshëm nga 0,5 m në 0,75 m – sepse këmbësorët kanë nevojë për një distancë sigurie më të madhe nga mjeti sesa do të nevojitej thjesht teknikisht për gjerësinë e mjetit. Shtesa e takimit prej 0,4 m mes mjeteve mbetet e njëjtë.',
  51:'Rrugëve të trafikut u vendosen disa kërkesa: dyshemeja duhet të mbajë të paktën 1700 kg/m², para dyerve, portave dhe kalimeve duhet respektuar një distancë sigurie prej të paktën 1 m, pabarazitë e dyshemesë dhe pengesat duhet të raportohen dhe hiqen, në kryqëzime duhet të vlejnë rregulla të qarta përparësie (p.sh. e djathta ka përparësi), dhe duhet të ketë ndriçim të mjaftueshëm.',
  52:'Nëpër porta lëkundëse mund të hyhet vetëm nëse garantohet shikueshmëri e mjaftueshme – në rast dyshimi, njoftoni kalimin paraprakisht me bori. Rampat e ngarkimit duhet të jenë mjaftueshëm të gjera (gjerësia e stivueses plus 0,70 m) dhe mbajtëse. Dhe krejtësisht themelore: rrugët e trafikut duhet të mbahen të lira dhe nuk duhet të bllokohen me mallra të vendosura.',
  53:'Në korridoret e ngushta (korridore mes rafteve ku mezi ka vend përveç stivueses) nevojitet mbrojtje e veçantë e personave: masa ndërtimore si gardhe apo mure, që pengojnë hyrjen e këmbësorëve, instalime paralajmëruese si barriera fotoelektrike, që aktivizojnë alarmin gjatë hyrjes, sensorë respektivisht skanerë lazer në vetë stivuesen, që monitorojnë zonën e lëvizjes, dhe rregulli i sjelljes për të hyrë vetëm kur nuk ka dukshëm këmbësorë në korridor.',
  54:'Në rrugët publike të trafikut, për stivueset vlejnë përveç rregullit të parandalimit të aksidenteve „Flurförderzeuge" edhe ligjet e përgjithshme të trafikut rrugor: ligji i trafikut rrugor (StVG), kodi rrugor (StVO), rregullorja e regjistrimit të mjeteve rrugore (StVZO) dhe rregullorja e lejes së drejtimit (FeV).',
  55:'Për të pasur të drejtë të drejtoni në rrugë publike, ju nevojitet përveç trajnimit si operator stivueje edhe një urdhër drejtimi dhe leja e duhur e drejtimit. Që nga 1.1.1999 vlen: kategoria L mjafton për mjete nën 25 km/orë (pavarësisht nga pesha totale e lejuar) – kjo prek shumicën e stivueseve në trafikun e brendshëm të ndërmarrjes. Mjetet më të shpejta kërkojnë, në varësi të peshës totale të lejuar, kategorinë B (nën 3,5 ton) ose kategorinë C (mbi 3,5 ton).',
  58:'Në këtë kapitull bëhet fjalë për fizikën pas qëndrueshmërisë: konstruksioni i stivueses, qendra e rëndesës dhe rëndësia e saj, ligji i levës dhe boshti i përmbysjes, diagramet e kapacitetit mbajtës me shembuj ushtrimesh, të ashtuquajturin trekëndësh i skajeve të përmbysjes, dhe në fund një përmbledhje e sjelljeve më të rëndësishme.',
  59:'Te stivuesja, mjeti i marrjes së ngarkesës dhe ngarkesa ndodhen para boshtit të përparmë. Që mjeti të mos përmbyset përpara, pesha vetjake e stivueses – kryesisht kundërpesha në pjesën e pasme – formon kundërpeshën për ngarkesën në dhëmbë. Pesha e stivueses dhe pesha e ngarkesës duhet të jenë në ekuilibër: nëse ngarkesa është shumë e rëndë ose shumë përpara, stivuesja përmbyset.',
  60:'Qendra e rëndesës së stivueses ndodhet afërsisht në lartësinë e sediljes së shoferit dhe – te stivuesja pa ngarkesë – afër skajeve anësore të përmbysjes, gjë që e bën më të prirur për t\'u përmbysur sesa mund të mendohej. Qendra e rëndesës së ngarkesës është pika imagjinare në të cilën përqendrohet masa e ngarkesës; ajo lëviz lart gjatë ngritjes së ngarkesës. Qendra e rëndesës së ngarkesës dhe stivueses së bashku japin qendrën totale të rëndesës, e cila vendos për qëndrueshmërinë.',
  61:'Boshti i përparmë i stivueses është boshti i përmbysjes. Vlen parimi i një kolome-luhatëse: forca herë krahu i forcës duhet të jetë e barabartë me ngarkesën herë krahu i ngarkesës. Që stivuesja të mbetet e qëndrueshme gjatë punës, produkti në anën e stivueses (pesha vetjake × krahu i levës) duhet të jetë gjithmonë më i madh se në anën e ngarkesës. Prandaj vlen: merrni ngarkesën sa më afër pjesës së pasme të dhëmbëve, për ta mbajtur të vogël krahun e ngarkesës – dhe kështu momentin përmbysës.',
  62:'Nëse qendra totale e rëndesës kalon përtej boshtit të përparmë (boshti i përmbysjes), stivuesja përmbiset përpara. Për ta parandaluar këtë: merrni ngarkesën deri te pjesa e pasme e dhëmbëve, mbani qendrën totale të rëndesës sa më të ulët të jetë e mundur (mos e ngrini ngarkesën pa nevojë lart), dhe përshtatni shpejtësinë në kthesa. Edhe këtu vlen përsëri: mbi 80% e aksidenteve vdekjeprurëse të përmbysjes ndodhën me stivuese pa ngarkesë – kujdesi vlen pra gjithmonë, jo vetëm te ngarkesat e rënda.',
  63:'Çdo stivuese është ndërtuar për një kapacitet mbajtës nominal të caktuar, të cilin prodhuesi e tregon në pllakën e fabrikës. Kjo të dhënë vlen megjithatë vetëm për një lartësi ngritjeje të standardizuar dhe një distancë të caktuar të qendrës së rëndesës së ngarkesës. Kapaciteti aktual mbajtës në një situatë konkrete varet shtesë nga distanca aktuale e qendrës së rëndesës së ngarkesës dhe lartësia aktuale e ngritjes dhe duhet marrë nga diagrami i kapacitetit mbajtës.',
  64:'Diagrami i kapacitetit mbajtës tregon në boshtin X distancën e qendrës së rëndesës së ngarkesës në mm dhe në boshtin Y ngarkesën e lejuar në kg; çdo vijë në diagram përfaqëson një lartësi tjetër ngritjeje. Sa më larg të jetë ngarkesa nga pjesa e pasme e dhëmbëve dhe sa më lart të ngrihet, aq më e vogël është ngarkesa e lejuar. Në e-learning mund ta provoni më vonë vetë diagramin në mënyrë interaktive me rregullues.',
  65:'Gjatë lëvizjes në kthesë, forca centrifugale vepron anash mbi stivuesen – dhe kjo forcë rritet jo linearisht, por në mënyrë katrore me shpejtësinë: një dyfishim i shpejtësisë e katërfishon forcën centrifugale. Veçanërisht e rrezikshme është lëvizja në kthesë me stivuesen pa ngarkesë, sepse qendra e saj e rëndesës ndodhet afër skajeve anësore të përmbysjes. Prandaj vlen: kalojini kthesat gjithmonë me shpejtësi të përshtatur, të ulët, dhe me rreze sa më të madhe të jetë e mundur.',
  66:'Ndryshe nga një makinë personale, e cila me katër rrota formon një katërkëndësh mbështetjeje, një stivuese me tri rrota qëndron vetëm mbi një trekëndësh mbështetjeje – skajet e përmbysjes shkojnë nga rrotat e përparme te një pikë në boshtin e pasmë. Te stivuesja pa ngarkesë, qendra e rëndesës ndodhet afër skajeve anësore të përmbysjes së këtij trekëndëshi, gjë që rrit rrezikun e përmbysjes. Një ngarkesë e marrë afër tokës rrit qëndrueshmërinë, një ngarkesë e ngritur e zvogëlon atë përsëri.',
  67:'Edhe një stivuese me katër rrota formon, pavarësisht katër rrotave të saj, në mënyrë llogaritëse një trekëndësh mbështetjeje, sepse boshti i pasmë respektivisht drejtues është fiksuar në mënyrë luhatëse vetëm në një pikë të vetme te shasia (bosht luhatës). Mesi i këtij boshti luhatës formon majën e trekëndëshit të mbështetjes. Rezultati: një stivuese me katër rrota ka në parim të njëjtin rrezik përmbysjeje si një stivuese me tri rrota – kontakti i katërt i rrotës nuk sjell stabilitet shtesë kundër përmbysjes anësore.',
  68:'Si përmbledhje, sjelljet më të rëndësishme për qëndrueshmërinë: mos e mbingarkoni stivuesen, merrni ngarkesat deri te pjesa e pasme e dhëmbëve, mbani të vogël lartësinë e qendrës totale të rëndesës, kaloni kthesat me shpejtësi të përshtatur dhe rreze sa më të madhe të jetë e mundur, dhe shmangni përshpejtimin dhe frenimin e fortë.',
  70:'Në këtë kapitull bëhet fjalë për funksionimin praktik të stivueses: llojet e ndryshme të stivueseve dhe llojet e tyre të fuqisë, udhëzimet e përdorimit dhe udhëzimin e punës, kontrollin ditor para përdorimit, marrjen, ngarkimin dhe vendosjen e ngarkesave, lëvizjen e ngarkesave përfshirë kushtet e shikueshmërisë, dhe braktisjen e saktë të stivueses.',
  71:'Ka shumë lloje të ndryshme ndërtimi të stivueseve për qëllime të ndryshme përdorimi: stivuesja klasike (stivuese me kundrapeshë) si pajisje universale për magazinë dhe përdorim të jashtëm, stivuesja me katarg tërhequr për korridore të ngushta (katargu shtyhet përpara për marrjen e ngarkesës), stivuesja e komisionit (shoferi ngrihet vetë me platformën) dhe stivuesja e kontejnerëve për ngarkesa të rënda në operimin me kontejnerë.',
  72:'Motorët elektrikë janë të qetë dhe nuk lëshojnë gaze shkarkimi, por kanë kohë ngarkimi të baterisë dhe kështu një kohëzgjatje të kufizuar përdorimi – të përshtatshëm mirë për përdorim në ambiente të mbyllura. Motorët me djegie të brendshme ofrojnë fuqi të lartë lëvizjeje, por në ambiente të mbyllura mund të përdoren vetëm kufizimisht për shkak të gazeve të shkarkimit.',
  73:'Te stivueset me gaz të lëngshëm vlen: vendosini vetëm në ambiente të ventiluara mjaftueshëm, ruani të paktën 3 m distancë nga hapjet e bodrumeve, kanaleve ose gropave (sepse gazi i lëngshëm është më i rëndë se ajri dhe mund të grumbullohet atje), dhe kontrolloni rregullisht instalimin. Te stivueset me naftë në ambiente të mbyllura duhet përdorur karburant me përmbajtje të ulët squfuri, respektuar një koncept mirëmbajtjeje dhe kërkohet pastrim i gazeve të shkarkimit (p.sh. filtër grimcash); te stivueset me gaz në ambiente kërkohet shtesë një katalizator dhe matje e rregullt e CO.',
  74:'Superstrukturat e ndërrueshme të vendosura (p.sh. superstruktura kamionësh ose kontejnerë pa shasi) mund të hyhen me stivuesen vetëm nëse janë të projektuara për ngarkesat që paraqiten, sipërfaqja e vendosjes ka kapacitet mbajtës të mjaftueshëm, dhe superstruktura është e siguruar kundër përmbysjes. Nëse mungon qoftë edhe një nga këto tri kushte, nuk duhet hyrë brenda.',
  75:'Gjatë funksionimit, stivuesja mund të përdoret vetëm nga vendet e kontrollit të parashikuara për këtë, dhe në çdo veprim duhet pasur kujdes që të mos rrezikohen persona. Hipja dhe zbritja lejohen vetëm me mjetin të ndalur. Është rreptësisht e ndaluar të qëndrohet mbi ngarkesën, nën një ngarkesë të ngritur ose nën një mjet marrjeje ngarkese të ngritur – kjo vlen edhe për veprime të shkurtra.',
  77:'Pajisjet mbajtëse të shoferit parandalojnë hedhjen e shoferit jashtë stivueses gjatë një aksidenti përmbysjeje – kjo është veçanërisht e rrezikshme, sepse shoferi zakonisht ngjeshet nën stivuese. Ka lloje të ndryshme: kabina e mbyllur e shoferit (dyert duhet të jenë të mbyllura gjatë funksionimit), dyer me shufër, rripi i legenit (së pari lidheni, pastaj ndizni – zgjidhja më ekonomike) dhe një rrjetë me shufër rrotulluese. Cila pajisje ekziston varet nga stivuesja – e rëndësishme është ta përdorni gjithmonë.',
  78:'Para fillimit të punës, shoferi duhet të kontrollojë stivuesen sipas udhëzimeve të përdorimit (kontrolli ditor para përdorimit). Nëse konstatohen defekte që dëmtojnë sigurinë, stivuesja nuk duhet vënë në punë. Defektet duhet t\'i raportohen sipërmarrësit ose eprorit dhe mund të hiqen vetëm nga persona kompetentë (p.sh. teknikë të prodhuesit) – jo nga vetë shoferi.',
  79:'Defekte sigurie, të cilave duhet t\'u kushtohet vëmendje e veçantë gjatë kontrollit ditor para përdorimit: goma të dëmtuara ose presion i gabuar ajri, frenat e punës ose të parkimit joefektivë, varësit e dhëmbëve të shformuar ose të goditur, siguresa të prishura kundër nxjerrjes ose zhvendosjes së dhëmbëve, plasaritje në pjesët mbajtëse si katargu ngritës, rrjedhje në zonën e hidraulikës, si dhe dhëmbë të përkulur, të çarë ose të konsumuar shumë. Secili nga këto defekte do të thotë: mos e vini stivuesen në punë, por raportojeni.',
  80:'Shtatë hapat gjatë marrjes së një ngarkese: drejtohuni drejt përpara ngarkesës, vendosni katargun vertikalisht, futni ngadalë dhëmbët dhe merrni ngarkesën deri te pjesa e pasme e dhëmbëve, ngrini ngarkesën mbi dysheme, përkulni katargun prapa, shikoni në të dyja anët prapa para lëvizjes prapa, dhe vetëm atëherë lëvizni ngadalë prapa.',
  81:'Shtatë hapat gjatë vendosjes së një ngarkese në raft: afrohuni te rafti, vendosni katargun vertikalisht, ngrini lehtë ngarkesën, hyni në raft, vendosni ngarkesën, shikoni në të dyja anët prapa dhe tërhiquni nga rafti, dhe në fund uleni dhëmbët, përkulni katargun prapa dhe largohuni.',
  82:'Gjatë lëvizjes së ngarkesave vlen: lëvizni me katargun të përkulur prapa, ngrini mjetin e marrjes së ngarkesës vetëm mbi dysheme (maks. 50 cm), te ngarkesa shumë e madhe kërkoni udhëzim ose lëvizni prapa, në drejtim të lëvizjes nuk duhet të mbulohen më shumë se 10 m dysheme, në ngjitje dhe zbritje drejtoni gjithmonë ngarkesën nga ana e kodrës, dhe në pjerrësi mos ktheni kurrë – rrezik i lartë përmbysjeje!',
  83:'Shpejtësia e lëvizjes duhet gjithmonë të përshtatet me kushtet e ndërmarrjes, kthesat në parim duhet kaluar ngadalë – shumica e aksidenteve vdekjeprurëse ndodhin nga shpejtësia e tepërt e lëvizjes. Shikueshmëria duhet të jetë aq e mirë sa nga ngarkesa të mos mbulohen më shumë se 10 m dysheme në drejtim të lëvizjes. Parim: mund të lëvizet vetëm nëse shoferi ka shikueshmëri të mjaftueshme – në nevojë, kërkoni udhëzim.',
  85:'Gjatë braktisjes së stivueses, së pari duhet aktivizuar frena e parkimit (edhe gjatë një braktisje të shkurtër), pastaj uleni dhëmbët në pozicionin më të ulët dhe përkulni majat poshtë, fikeni motorin, hiqni çelësin dhe merreni me vete (që asnjë person i paautorizuar të mos përdorë stivuesen), dhe siguroni që stivuesja e parkuar të mos përbëjë pengesë në rrugët e trafikut dhe evakuimit.',
  86:'Gjatë hyrjes me stivuese në ashensorë: respektoni kapacitetin mbajtës të ashensorit, përdorni vetëm ashensorë të miratuar, zbrisni nga stivuesja dhe qëndroni në zonën e kontrollit, vendosni stivuesen në qendër të ashensorit, aktivizoni frenën e parkimit dhe ruani një distancë të mjaftueshme prej të paktën 0,1 m nga muret e boshtit të ashensorit.',
  87:'Gjatë ngarkimit dhe shkarkimit të mjeteve (kamionë, rimorkio), këto duhet të sigurohen kundër rrokullisjes dhe, nëse nevojitet, përmbysjes – zakonisht përmes frenës së parkimit plus pykave para rrotave të pandryshueshme drejtimi. Te gjysmërimorkiot mund të nevojiten mbështetëse shtesë. Shoferi i mjetit dhe shoferi i stivueses duhet të komunikojnë para ngarkim-shkarkimit, dhe lëvizjet e mjetit gjatë ngarkimit duhet të parandalohen me siguri.',
  88:'Rimorkiot me drejtim rrotullues (te të cilat rrotullohet i gjithë boshti i përparmë) kanë një rrezik të veçantë përmbysjeje: para ngarkimit ose shkarkimit, boshti i përparmë duhet domosdoshmërisht të vendoset drejt, përndryshe rimorkio mund të përmbiset. Edhe këtu vlen: komunikim mes shoferit të stivueses dhe drejtuesit të mjetit, dhe parandalimi i lëvizjeve të mjetit gjatë ngarkimit.',
  90:'Në këtë kapitull bëhet fjalë për situata të veçanta përdorimi: përdorimin e pajisjeve shtesë, transportin e personave, lëvizjen e rimorkiove dhe mjeteve hekurudhore, përdorimin e platformave të punës dhe transportin e ngarkesave të varura.',
  91:'Pajisjet shtesë (p.sh. lopata, kapëse, gjilpëra) mund të përdoren vetëm nëse pajisja shtesë dhe stivuesja janë të përshtatura me njëra-tjetrën – p.sh. në lidhje me kapacitetin mbajtës, fiksimin dhe furnizimin me energji. Pajisja shtesë duhet të fiksohet sipas destinacionit, nuk duhet tejkaluar as kapaciteti mbajtës i pajisjes shtesë, as ai i stivueses, dhe pajisjet shtesë duhet kontrolluar rregullisht.',
  92:'Transporti i personave në stivuese lejohet vetëm nëse është rregulluar shprehimisht nga udhëzimi i punës, ekzistojnë vende ulëse ose qëndrimi të përshtatshme, si dhe doreza mbajtëse, dhe ekziston një pajisje shtesë mbajtëse për personin që udhëton. Nëse mungon qoftë edhe një nga këto kushte, transporti i personave nuk lejohet.',
  93:'Rimorkiot mund të lëvizen me stivuesen vetëm nëse tërheqja mund të frenohet me siguri në të gjitha lëvizjet, stivuesja dhe rimorkio janë të pajisura për operimin me rimorkio (p.sh. me pajisje tërheqëse të përshtatshme), dhe ngarkesa e lejuar e rimorkios njihet dhe nuk tejkalohet.',
  94:'Mjetet hekurudhore mund të tërhiqen me stivuese vetëm në kushte të veçanta me litarë – p.sh. me një bashkim rrëshqitës, që lirohet në rast mbingarkese. Kushte: stivuesja ndodhet jashtë zonës së lëvizjes së mjetit hekurudhor, shoferi i stivueses mund të vëzhgojë zonën e binarëve ose udhëzohet, dhe ekziston një pajisje frenimi.',
  95:'Shtytja e mjeteve hekurudhore me stivuese lejohet vetëm nëse stivuesja është e pajisur për këtë (p.sh. me një traversë shtytëse), përdoren pajisje të veçanta manovrimi, shoferi i stivueses është i udhëzuar dhe ekziston një pajisje frenimi. Është shprehimisht E PALEJUAR shtytja me mbështetëse të lira ose drejtpërdrejt me pjesë të stivueses (p.sh. dhëmbët) – kjo mund të çojë në aksidente të rënda.',
  97:'Ngritja e personave me anë të stivueses (pra përdorimi i një platforme pune) lejohet vetëm nëse përdoret një stivuese me kapacitet mbajtës të mjaftueshëm dhe një platformë pune sipas rregullave. Thjesht qëndrimi mbi dhëmbë ose një paletë pa një platformë pune të kontrolluar është shprehimisht i palejuar.',
  98:'Një platformë pune sipas rregullave duhet të jetë e pajisur me: një sigurim kundër rënies me shufër dore, gjuri dhe këmbe, një mbrojtje shpine rezistente ndaj kalimit (mbron kundër rrezikut të shtypjes te katargu ngritës), xhepa futjeje në pjesën e poshtme (për marrje të sigurt nga dhëmbët), një sigurim kundër rrëshqitjes nga dhëmbët, dhe dera e hyrjes mund të hapet vetëm nga brenda.',
  99:'Gjatë përdorimit të platformave të punës vlen: komunikim i papërsosur mes shoferit dhe personave në platformën e punës, shoferi NUK ka të drejtë të lërë vendin e tij ndërkohë që platforma e punës është e ngritur, vendi i qëndrimit në platformën e punës NUK duhet ngritur me mjete ndihmëse (p.sh. një shkallë), dhe stivuesja, me platformën e punës të zënë dhe të ngritur, mund të lëvizet vetëm për pozicionim të imët – asnjë lëvizje normale.',
  100:'Transporti i ngarkesave të varura (me litarë ose zinxhirë) lejohet, për shkak të rrezikut të lartë të përmbysjes, vetëm me stivuese të përshtatshme dhe mjaftueshëm të qëndrueshme. Personat që drejtojnë ngarkesën e varur me litarë mbajtës nuk duhet të ndodhen në trajektoren e lëvizjes së stivueses. Lëvizjet lavjerrëse të ngarkesës së varur mund të kufizohen me pajisje shtesë të veçanta.',
  102:'Në këtë kapitull të fundit bëhet fjalë për kontrollet dhe mirëmbajtjen: kontrolli ditor para përdorimit (të cilin e njihni tashmë), kontrollet e rregullta nga persona kompetentë, dëshmia e kontrollit dhe stikeri i kontrollit.',

function openOv(){
  var totalAbg=Object.keys(kapitelAbgeschlossen).length;
  var totalQ=0,richtigQ=0;
  KAPITEL.forEach(function(k){var sc=quizScoreForKapitel(k.nr);totalQ+=sc.gesamt;richtigQ+=sc.richtig;});
  var pct=totalQ>0?Math.round(richtigQ/totalQ*100):0;
  var pbarPct=Math.round(totalAbg/KAPITEL.length*100);
  document.getElementById('ovSummaryText').innerHTML=
    '<b>'+totalAbg+' / '+KAPITEL.length+'</b> '+T.kapitelAbgeschlossen+(totalQ>0?' &middot; Ø '+pct+' % Quiz':'');
  document.getElementById('ovPbar').style.width=pbarPct+'%';
  var html='';
  KAPITEL.forEach(function(k){
    var sc=quizScoreForKapitel(k.nr);
    var done=!!kapitelAbgeschlossen[k.nr];
    var inProg=!done&&sc.richtig>0;
    var icon=done?'&#10003;':(inProg?'&#9711;':'&#9675;');
    var cls=done?'ok':(inProg?'prog':'');
    var scoreText=sc.gesamt>0?sc.richtig+'/'+sc.gesamt+T.ovQuizFragen+' '+(done?'&#10003;':''):T.ovNochNicht;
    html+='<div class="ov-chapter '+cls+'" onclick="jumpTo('+k.nr+')">'
      +'<div class="ov-ch-icon">'+icon+'</div>'
      +'<div class="ov-ch-info"><div class="ov-ch-title">'+T.ovKap+k.nr+': '+k.titel+'</div>'
      +'<div class="ov-ch-score">'+scoreText+'</div></div>'
      +'<div class="ov-ch-arr">&#8594;</div></div>';
  });
  document.getElementById('ovList').innerHTML=html;
  document.getElementById('ovOverlay').classList.add('active');
  document.getElementById('ovPanel').classList.add('active');
  document.getElementById('ovTitle').textContent='📋 '+T.ovTitel;
  document.getElementById('ovWeiterBtn').textContent='→ '+T.ovWeiter;
}
function closeOv(){
  document.getElementById('ovOverlay').classList.remove('active');
  document.getElementById('ovPanel').classList.remove('active');
}
function jumpTo(nr){
  closeOv();
  cur=kapitelStart[nr]||0;

}
function weiterLernen(){
  closeOv();
  for(var i=0;i<KAPITEL.length;i++){
    if(!kapitelAbgeschlossen[KAPITEL[i].nr]){cur=kapitelStart[KAPITEL[i].nr]||0;render();return;}
  }
  cur=STEPS.length-1;render();
}
