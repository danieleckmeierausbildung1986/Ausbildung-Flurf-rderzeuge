<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gabelstapler Stufe 1 – Allgemeine Ausbildung</title>
<style>
:root{
  --bg:#0d1f12;--green:#1a7a4a;--green-l:#2ea865;--green-d:#0d4a24;
  --acc1:#1a3a6b;--acc2:#2e6cb0;
  --navy:#16243f;--muted:#68788f;--line:#e3e8f0;--ink:#1a2330;
  --shadow:0 8px 40px rgba(0,0,0,.25);
  --ok:#1a9e6e;--okbg:#e8f7f2;--no:#c0392b;--nobg:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,sans-serif;
  min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;padding:16px;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(26,122,74,.25) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 80%, rgba(13,74,36,.3) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}
.wrap{position:relative;z-index:1;width:100%;max-width:1280px;display:flex;flex-direction:column;flex:1}
/* TOPBAR */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.ti{width:46px;height:46px;border-radius:12px;flex-shrink:0;
  background:#fff;padding:5px;
  display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 20px rgba(0,0,0,.3);}
.ti img{width:100%;height:100%;object-fit:contain;}
.topbar h1{color:#fff;font-size:18px;font-weight:700;line-height:1.2}
.topbar p{color:rgba(255,255,255,.45);font-size:12px}
/* STAGE */
.stage{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;
  display:flex;flex-direction:column;height:max-content;width:100%;}
.progress{height:5px;background:var(--line)}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--acc1),var(--acc2));transition:width .25s ease;width:0}
/* WELCOME */
.welcome-box{padding:40px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(135deg,var(--green-d),var(--green-l));}
.welcome-titel{font-size:26px;font-weight:800;color:#fff;line-height:1.3;}
.welcome-sub{font-size:15px;color:rgba(255,255,255,.85);line-height:1.6;max-width:500px;}
.welcome-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:500px;}
.wg{background:rgba(255,255,255,.15);border-radius:12px;padding:12px;text-align:left;}
.wg-icon{font-size:20px;margin-bottom:4px;}
.wg-titel{font-size:12px;font-weight:700;color:#fff;margin-bottom:2px;}
.wg-text{font-size:11px;color:rgba(255,255,255,.75);}
.welcome-start{padding:14px 36px;border:none;border-radius:12px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;background:#fff;color:var(--green-d);margin-top:6px;}
/* KAPITEL-TITELFOLIE */
.kapitel-box{padding:48px 28px;text-align:center;background:linear-gradient(135deg,var(--acc1),var(--acc2));
  color:#fff;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.kapitel-nr{font-size:13px;font-weight:700;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.kapitel-titel{font-size:30px;font-weight:800;line-height:1.3;}
.kapitel-sub{font-size:14px;color:rgba(255,255,255,.7);margin-top:10px;}
/* FOLIENBOX */
.slidebox{position:relative;background:#0d1a2e;display:flex;align-items:center;justify-content:center;
  min-height:200px;}
.slidebox img{width:100%;height:auto;display:block;max-height:65vh;object-fit:contain;}

/* ERKLÄRUNGS-KASTEN (immer eingeblendet, unter der Folie) */
.erklaerung-box{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px;overflow:hidden}
.erklaerung-label{display:flex;align-items:center;gap:8px;padding:12px 20px 0;font-size:14px;
  font-weight:700;color:var(--acc1)}
.erklaerung-content p{margin:0;padding:10px 20px 20px;font-size:17px;line-height:1.75;color:var(--ink)}
@media(max-width:600px){
  .erklaerung-label{font-size:13px;padding:10px 14px 0}
  .erklaerung-content p{font-size:15px;padding:8px 14px 16px}
}
.nav-zone{position:absolute;top:0;bottom:0;width:30%;cursor:pointer;z-index:2;
  display:flex;align-items:center;opacity:0;transition:opacity .15s}
.nav-zone:hover{opacity:1}
.nav-zone.prev{left:0;justify-content:flex-start;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}
.nav-zone.next{right:0;justify-content:flex-end;background:linear-gradient(270deg,rgba(0,0,0,.35),transparent)}
.nav-zone span{color:#fff;font-size:30px;padding:0 14px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
/* QUIZ */
.quizbox{padding:28px;display:flex;flex-direction:column;}
.quiz-badge{font-size:12px;font-weight:700;color:var(--acc2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;}
.quiz-q{font-size:19px;font-weight:700;color:var(--navy);margin-bottom:20px;line-height:1.4;}
.quiz-opts{display:flex;flex-direction:column;gap:10px;}
.opt{text-align:left;padding:14px 18px;border:2px solid var(--line);border-radius:12px;
  background:#fff;font-size:15px;color:var(--ink);cursor:pointer;font-family:inherit;transition:all .12s;}
.opt:hover:not(:disabled){border-color:var(--acc2);background:#f0f7ff;}
.opt:disabled{cursor:default;}
.opt.correct{border-color:var(--ok)!important;background:var(--okbg)!important;color:var(--ok)!important;font-weight:700;}
.opt.wrong{border-color:var(--no)!important;background:var(--nobg)!important;color:var(--no)!important;}
.quiz-fb{margin-top:16px;font-size:15px;font-weight:700;min-height:24px;}
.quiz-fb.ok{color:var(--ok)}.quiz-fb.no{color:var(--no)}
.quiz-prog{font-size:12px;color:var(--muted);margin-bottom:6px;}
/* THEMA ABSCHLIESSEN */
.abschluss-box{padding:36px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.abschluss-icon{font-size:50px;}
.abschluss-titel{font-size:22px;font-weight:800;color:var(--navy);}
.abschluss-sub{font-size:14px;color:var(--muted);max-width:400px;}
.abschluss-score{background:var(--okbg);border:1px solid var(--ok);border-radius:12px;padding:12px 20px;font-size:15px;color:#0d5c3a;font-weight:600;}
.abschluss-btn{padding:14px 32px;border:none;border-radius:12px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;transition:all .15s;}
.abschluss-btn:hover:not(:disabled){opacity:.9;}
.abschluss-btn:disabled{opacity:.6;cursor:not-allowed;}
.abschluss-status{font-size:13px;color:var(--ok);font-weight:600;min-height:18px;}
/* ERGEBNIS */
.result{padding:48px 28px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;}
.result .ic{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:38px;font-weight:800;}
.result .ic.ok{background:var(--okbg);color:var(--ok)}
.result .ic.no{background:var(--nobg);color:var(--no)}
.result h2{font-size:28px;color:var(--navy);}
.result p{color:var(--muted);font-size:15px;max-width:420px;}
/* CONTROLS */
.controls{display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:#fff;border-top:1px solid var(--line);gap:12px;}
.ctrl-btn{display:flex;align-items:center;gap:7px;padding:11px 20px;border:none;border-radius:11px;
  background:linear-gradient(135deg,var(--acc1),var(--acc2));
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:inherit;}
.ctrl-btn:hover{opacity:.9;}
.ctrl-btn:disabled{opacity:.35;cursor:not-allowed;}
.counter{font-size:13px;font-weight:700;color:var(--muted);text-align:center;line-height:1.4;}
/* KONTAKT */
.kontakt-bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.kontakt-btn{display:flex;align-items:center;gap:7px;padding:10px 18px;border:none;border-radius:10px;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;
  transition:all .15s;flex:1;justify-content:center;}
.kontakt-btn.wa{background:#25D366;color:#fff;}
.kontakt-btn.mail{background:#0072C6;color:#fff;}
.back-btn{display:block;width:100%;padding:12px;border:2px solid rgba(255,255,255,.2);
  border-radius:12px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);
  font-size:14px;font-weight:600;cursor:pointer;text-align:center;font-family:inherit;margin-top:8px;}
.back-btn:hover{border-color:var(--green-l);color:#fff;background:rgba(255,255,255,.12);}
/* DIAGRAM */
.diag-card{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;flex:1;display:flex;flex-direction:column;}
.diag-hd{padding:14px 20px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,var(--acc1),var(--acc2));}
.diag-hd-title{font-size:15px;font-weight:700;color:#fff;}
.diag-svg-box{padding:12px 16px;background:#fafbfc;border-bottom:1px solid var(--line);}
.diag-info{padding:12px 20px;font-size:14px;color:var(--muted);line-height:1.6;border-bottom:1px solid var(--line);}
.dq{padding:14px 20px;border-bottom:1px solid var(--line);}
.dq:last-child{border-bottom:none;}
.dq-text{font-size:14px;color:var(--ink);line-height:1.5;margin-bottom:10px;}
.dq-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.dq-input{padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:#fafbfc;color:var(--ink);font-size:14px;width:120px;font-family:inherit;}
.dq-input:focus{outline:none;border-color:var(--acc2);}
.dqbtn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:13px;transition:all .12s;cursor:pointer;font-family:inherit;}
.dqbtn:hover{background:#f3f7fc;}
.dqbtn.info{border-color:var(--acc2);color:var(--acc2);}.dqbtn.info:hover{background:#e8f0fb;}
.dqhbtn{padding:8px 14px;border-radius:8px;border:2px solid;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
.dqhbtn.ok{border-color:var(--ok)!important;background:var(--okbg)!important;color:var(--ok)!important;}
.dqhbtn.no{border-color:var(--no)!important;background:var(--nobg)!important;color:var(--no)!important;}
.dq-fb{display:none;margin-top:8px;padding:8px 12px;border-radius:8px;font-size:13px;}
.dq-fb.ok{display:block;background:var(--okbg);color:var(--ok);border:1px solid #9dd4b8;}
.dq-fb.no{display:block;background:var(--nobg);color:var(--no);border:1px solid #f5b7b1;}
/* --- TABLET (bis 900px) --- */
@media(max-width:900px){
  .topbar h1{font-size:16px}
  .kapitel-titel{font-size:24px}
  .quiz-q{font-size:17px}
}
/* --- SMARTPHONE (bis 600px) --- */
@media(max-width:600px){
  body{padding:6px 6px 10px}
  .topbar{gap:8px;margin-bottom:8px}
  .ti{width:36px;height:36px;font-size:17px;border-radius:9px}
  .topbar h1{font-size:14px;line-height:1.2}
  .topbar p{font-size:10px}
  .ov-btn{padding:7px 10px;font-size:12px}
  .stage{border-radius:12px}
  .welcome-box{padding:22px 14px;gap:10px}
  .welcome-titel{font-size:19px}
  .welcome-sub{font-size:13px}
  .welcome-grid{grid-template-columns:1fr}
  .wg{padding:10px}
  .kapitel-box{padding:26px 14px;min-height:180px}
  .kapitel-titel{font-size:20px}
  .kapitel-sub{font-size:12px}
  .slidebox{min-height:220px}
  .slidebox img{max-height:52vh}
  .nav-zone{opacity:.35;width:22%}
  .quizbox{padding:16px 14px}
  .quiz-badge{font-size:11px}
  .quiz-prog{font-size:11px}
  .quiz-q{font-size:15px;margin-bottom:14px}
  .opt{padding:11px 13px;font-size:14px}
  .abschluss-box{padding:22px 14px;gap:10px}
  .abschluss-icon{font-size:40px}
  .abschluss-titel{font-size:18px}
  .abschluss-btn{padding:12px 22px;font-size:15px}
  .result{padding:26px 14px;gap:10px}
  .result h2{font-size:21px}
  .result p{font-size:14px}
  .controls{padding:9px 10px;gap:8px}
  .ctrl-btn{padding:10px 13px;font-size:13px}
  .counter{font-size:12px}
  .kontakt-bar{gap:6px;margin-top:8px}
  .kontakt-btn{padding:9px 12px;font-size:13px}
  .back-btn{padding:10px;font-size:13px;margin-top:6px}
  .video-label{font-size:12px;padding:6px 12px}
}
/* --- KLEINES SMARTPHONE (bis 380px) --- */
@media(max-width:380px){
  .topbar p{display:none}
  .topbar h1{font-size:13px}
  .kapitel-titel{font-size:18px}
  .quiz-q{font-size:14px}
  .opt{font-size:13px}
  .ctrl-btn{padding:9px 10px;font-size:12px}
}
/* OVERVIEW BUTTON */
.ov-btn{margin-left:auto;padding:9px 14px;border:none;border-radius:10px;
  background:rgba(255,255,255,.13);color:#fff;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;flex-shrink:0;white-space:nowrap;}
.ov-btn:hover{background:rgba(255,255,255,.22);}
.prog-badge{font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;min-height:14px;}
/* OVERVIEW PANEL */
.ov-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;}
.ov-overlay.active{display:block;}
.ov-panel{position:fixed;top:0;right:-400px;bottom:0;width:370px;max-width:100vw;
  background:#fff;z-index:101;display:flex;flex-direction:column;
  box-shadow:-8px 0 40px rgba(0,0,0,.3);transition:right .25s ease;}
.ov-panel.active{right:0;}
.ov-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;flex-shrink:0;}
.ov-head-title{font-size:16px;font-weight:700;}
.ov-close{background:rgba(255,255,255,.2);border:none;border-radius:8px;
  color:#fff;font-size:18px;padding:4px 10px;cursor:pointer;line-height:1;}
.ov-summary{padding:14px 20px;background:#f5f7fa;border-bottom:1px solid var(--line);
  font-size:13px;color:var(--muted);flex-shrink:0;}
.ov-pbar-wrap{height:6px;background:var(--line);border-radius:3px;margin-top:8px;}
.ov-pbar{height:100%;background:linear-gradient(90deg,var(--acc1),var(--acc2));border-radius:3px;transition:width .3s;}
.ov-list{flex:1;overflow-y:auto;}
.ov-chapter{display:flex;align-items:center;gap:12px;padding:13px 20px;
  cursor:pointer;border-bottom:1px solid var(--line);transition:background .12s;}
.ov-chapter:hover{background:#f0f7ff;}
.ov-chapter.ok{background:#f0faf5;}.ov-chapter.ok:hover{background:#e0f5ea;}
.ov-chapter.prog{background:#fffdf0;}.ov-chapter.prog:hover{background:#fff8d6;}
.ov-ch-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;
  background:var(--line);color:var(--muted);}
.ov-chapter.ok .ov-ch-icon{background:var(--okbg);color:var(--ok);}
.ov-chapter.prog .ov-ch-icon{background:#fff3cd;color:#c88a00;}
.ov-ch-info{flex:1;min-width:0;}
.ov-ch-title{font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ov-ch-score{font-size:11px;color:var(--muted);margin-top:2px;}
.ov-ch-arr{font-size:16px;color:var(--muted);flex-shrink:0;}
.ov-foot{padding:16px 20px;border-top:1px solid var(--line);flex-shrink:0;}
.ov-weiter{width:100%;padding:12px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;
  font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.ov-weiter:hover{opacity:.9;}
/* VIDEO SLIDE */
.video-slide{display:flex;flex-direction:row;align-items:stretch;background:#0b1620;border-radius:12px;overflow:hidden;}
.video-wrap{flex:1;display:flex;flex-direction:column;}
.video-label{background:#1a2a3a;color:#7ec8e3;font-size:13px;font-weight:700;padding:8px 16px;letter-spacing:.03em;display:flex;align-items:center;justify-content:space-between;}
.video-fs-btn{background:rgba(255,255,255,.15);border:none;border-radius:7px;color:#fff;font-size:12px;font-weight:600;padding:4px 10px;cursor:pointer;font-family:inherit;flex-shrink:0;}
.video-fs-btn:hover{background:rgba(255,255,255,.28);}
.video-wrap iframe{display:block;width:100%;aspect-ratio:16/9;border:none;flex:1;}
</style>
</head>

var ERKLAERUNG_MAP={
  3:'In diesem Kapitel geht es zunächst darum, wann rechtlich überhaupt ein Arbeitsunfall vorliegt. Danach schauen wir uns an, welche rechtlichen Konsequenzen ein Arbeitsunfall für Sie als Fahrer haben kann – strafrechtlich, im Ordnungswidrigkeitenrecht, arbeitsrechtlich und beim sogenannten Regress.',
  4:'Ein Arbeitsunfall im rechtlichen Sinn liegt nur vor, wenn alle drei Voraussetzungen gleichzeitig erfüllt sind: Es muss sich um eine versicherte Person handeln (z.B. eine Beschäftigte oder ein Beschäftigter), die eine versicherte Tätigkeit ausgeübt hat (also im Rahmen ihrer Arbeit), und dabei tatsächlich körperlich zu Schaden gekommen ist. Fehlt auch nur eine dieser drei Voraussetzungen, handelt es sich rechtlich nicht um einen Arbeitsunfall – auch wenn etwas passiert ist. Das ist wichtig, weil davon abhängt, ob die Berufsgenossenschaft für die Folgen aufkommt.',
  5:'Diese Zahlen zeigen, wie ernst das Thema ist: über 20.000 Unfälle pro Jahr allein beim Umgang mit Flurförderzeugen in Deutschland, davon etwa 200 mit schweren Verletzungen durch Fallen oder Kippen des Fahrzeugs, und im Schnitt 3 bis 5 tödliche Unfälle allein im Großhandel und in der Lagerei. Insgesamt sterben jährlich 23 Menschen bei Staplerunfällen. Der Gabelstapler ist also kein harmloses Arbeitsmittel, sondern eines der gefährlichsten überhaupt, wenn nicht sorgfältig gefahren wird.',
  6:'Die Statistik zeigt zwei klare Schwerpunkte, auf die wir im Folgenden genauer eingehen: Anfahrunfälle (der Stapler erfasst eine Person) und Kippunfälle (der Stapler kippt um). Diese beiden Unfallarten sind für den Großteil der schweren und tödlichen Unfälle verantwortlich – deshalb schauen wir uns beide im Detail an.',
  7:'Diese echten Unfallbeispiele zeigen, wie schnell es zu einem Anfahrunfall kommen kann: ein kurzer Moment der Unachtsamkeit, eine Person im toten Winkel, oder eine spontane Anfahrt ohne vorherigen Blickkontakt – und schon kommt es zur Kollision. Häufigste Ursachen sind Unachtsamkeit, eingeschränkte Sicht und zu wenig Platz. Merken Sie sich: Vor jedem Anfahren erst umschauen, hupen und sicherstellen, dass niemand im Gefahrenbereich steht.',
  8:'Kippunfälle passieren zwar seltener als Anfahrunfälle, enden aber besonders oft tödlich – über die Hälfte aller tödlichen Staplerunfälle sind Kippunfälle. Nach der DGUV Vorschrift 68 zählen dazu unter anderem: zu schnelles Kurvenfahren, Fahren mit angehobener Last, Fahren gegen Hindernisse, Wenden und Schrägfahrt auf Gefällstrecken, Neigen des Mastes nach vorn, Fahren auf unebenem Untergrund, Überlastung und starker Wind. Deshalb gilt: Last beim Fahren immer absenken, in Kurven langsam fahren und auf den Zustand des Bodens achten.',
  9:'Ein Arbeitsunfall kann für Sie mehrere rechtliche Konsequenzen gleichzeitig nach sich ziehen, die unabhängig voneinander greifen können: strafrechtliche Folgen (z.B. bei grober Fahrlässigkeit), Bußgelder nach dem Ordnungswidrigkeitenrecht, arbeitsrechtliche Konsequenzen durch Ihren Arbeitgeber, und im schlimmsten Fall Regressforderungen der Berufsgenossenschaft. Auf den folgenden Folien schauen wir uns jede dieser vier Kategorien einzeln an.',
  10:'Strafrechtlich wird es nur dann brenzlig, wenn drei Dinge zusammenkommen: Der Unfall hat zu einer Verletzung oder zum Tod geführt, diesem Unfall lag eine rechtswidrige Handlung zugrunde, und diese Handlung geschah schuldhaft – also fahrlässig oder sogar vorsätzlich. Liegen alle drei Punkte vor, drohen Freiheits- oder Geldstrafe. Normales, vorschriftsmäßiges Fahren, bei dem trotzdem etwas Unvorhergesehenes passiert, führt in der Regel nicht zu strafrechtlichen Konsequenzen.',
  11:'Das Ordnungswidrigkeitenrecht ist eine Stufe milder als das Strafrecht und soll die Einhaltung von Regeln wie dem Arbeitsschutz sicherstellen. Es reicht hier schon ein fahrlässiger oder vorsätzlicher Verstoß gegen eine bußgeldbewährte Vorschrift – z.B. eine Unfallverhütungsvorschrift der Berufsgenossenschaft –, um ein Bußgeld zu riskieren. Es muss dafür noch nicht einmal jemand zu Schaden gekommen sein; der reine Regelverstoß reicht bereits aus.',
  12:'Verstoßen Sie gegen arbeitsvertragliche Pflichten (z.B. gegen betriebliche Sicherheitsvorschriften), kann Ihr Arbeitgeber unabhängig von Straf- oder Bußgeldverfahren arbeitsrechtlich reagieren. Die möglichen Stufen reichen von einer einfachen Ermahnung über eine Abmahnung und Verwarnung bis hin zur Kündigung – je nach Schwere und Häufigkeit des Verstoßes.',
  13:'Regress bedeutet: Die Berufsgenossenschaft übernimmt normalerweise die Kosten eines Arbeitsunfalls, unabhängig davon, wer schuld war. Nur wenn Sie den Unfall grob fahrlässig verursacht haben, kann die BG diese Kosten im Nachhinein von Ihnen zurückfordern. Das nach dem BGB übliche Schadenersatz-Prinzip, bei dem der Verursacher direkt haftet, gilt hier normalerweise nicht – außer bei vorsätzlich verursachten Unfällen.',
  15:'In diesem Kapitel geht es um die Berufsgenossenschaft: was sie ist und welche Aufgaben sie hat, welches Regelwerk sie herausgibt, welche Vorschrift speziell für Ihre Staplerausbildung gilt, und wie diese Ausbildung in drei Stufen aufgebaut ist.',
  16:'Die Berufsgenossenschaft ist Träger der gesetzlichen Unfallversicherung. Es gibt drei Arten: die gewerblichen Berufsgenossenschaften (für die meisten Betriebe, auch Lager und Logistik), die landwirtschaftliche Berufsgenossenschaft und die Unfallversicherungsträger der öffentlichen Hand (z.B. für Kitas oder Schulen). Für Sie als Staplerfahrer im Betrieb ist in der Regel die gewerbliche Berufsgenossenschaft zuständig.',
  17:'Die Berufsgenossenschaft hat den gesetzlichen Auftrag, mit allen geeigneten Mitteln Arbeitsunfälle, Berufskrankheiten und arbeitsbedingte Gesundheitsgefahren zu verhüten – zum Beispiel durch Beratung der Betriebe, Schulungen und die Veröffentlichung des berufsgenossenschaftlichen Vorschriften- und Regelwerks, das Sie in dieser Ausbildung kennenlernen.',
  18:'Das Regelwerk der Berufsgenossenschaften gliedert sich in vier Arten von Dokumenten: BG-Vorschriften sind rechtlich bindend, z.B. die Unfallverhütungsvorschrift „Flurförderzeuge". BG-Regeln beschreiben, wie eine Vorschrift üblicherweise umgesetzt wird, z.B. der Einsatz von Sicherheitsschuhen. BG-Informationen geben praktische Hinweise, z.B. für Gabelstaplerfahrer. Und BG-Grundsätze legen z.B. fest, wie eine Ausbildung wie diese hier aufgebaut sein muss.',
  19:'Der frühere „BGG 925" heißt heute „DGUV Grundsatz 308-001" und regelt genau die Ausbildung und Beauftragung von Staplerfahrern, die Sie gerade durchlaufen. Er gliedert die Ausbildung in drei Stufen: Stufe 1 (Allgemeine Ausbildung, die Sie gerade machen), Stufe 2 (Zusatzausbildung für spezielle Gerätetypen) und Stufe 3 (betriebliche Ausbildung direkt bei Ihrem Arbeitgeber).',
  20:'Stufe 1, die allgemeine Ausbildung, besteht aus einem theoretischen Teil (Sicherheitsbestimmungen, Betriebsanleitungen, Gerätetechnik – das, was Sie gerade lernen) und einem praktischen Teil (Aufnehmen, Transportieren, Absetzen und Stapeln von Lasten, Umgang mit gängigen Anbaugeräten). Beide Teile enden mit einer Abschlussprüfung, nach der Sie ein Zertifikat erhalten.',
  21:'Stufe 2 ist eine Zusatzausbildung, die nur nötig ist, wenn Sie mit speziellen Flurförderzeugen arbeiten sollen, die über den normalen Gabelstapler hinausgehen – z.B. Containerstapler, Regalflurförderzeuge, Quergabelstapler, Teleskopstapler oder besondere Anbaugeräte. Auch diese Zusatzausbildung endet mit einer Abschlussprüfung und einem eigenen Zertifikat.',
  22:'Stufe 3, die betriebliche Ausbildung, findet direkt bei Ihrem Arbeitgeber statt und hat zwei Teile: den gerätebezogenen Teil (die tatsächlich in Ihrem Betrieb vorhandenen Flurförderzeuge und Anbaugeräte sowie die betrieblichen Gegebenheiten) und den verhaltensbezogenen Teil (die Verhaltensweisen laut der Betriebsanweisung Ihres Arbeitgebers). Die Durchführung muss dokumentiert werden – erst danach darf Ihr Arbeitgeber Sie schriftlich mit dem selbstständigen Fahren beauftragen.',
  24:'In diesem Kapitel geht es darum, wer überhaupt Flurförderzeuge führen darf: welche formalen Voraussetzungen gelten, welche körperlichen, geistigen und charakterlichen Eigenschaften Sie mitbringen müssen, und wie die abschließende Beauftragung durch Ihren Arbeitgeber abläuft.',
  25:'Um Flurförderzeuge selbstständig führen zu dürfen, müssen vier Voraussetzungen gleichzeitig erfüllt sein: Sie müssen mindestens 18 Jahre alt sein, für die Tätigkeit geeignet und ausgebildet sein, Ihre Befähigung nachgewiesen haben (z.B. durch das Zertifikat aus dieser Ausbildung), und schriftlich von Ihrem Unternehmer beauftragt worden sein. Eine bloße Mitgliedschaft in einer Gewerkschaft oder ähnliches reicht nicht aus – es zählen ausschließlich diese vier Punkte.',
  26:'Zur körperlichen Eignung gehören: ausreichende Sehschärfe für den sicheren Fahrbetrieb, ein funktionierendes Hörvermögen, um akustische Warnsignale zu erkennen, räumliches Sehen zum Einschätzen von Abständen, und ausreichende Beweglichkeit der Gliedmaßen für eine gute Reaktionsfähigkeit. Nicht gefordert ist dagegen z.B. eine überdurchschnittliche Körpergröße.',
  27:'Neben der körperlichen Eignung wird von Staplerfahrern erwartet: Verständnis für technische und physikalische Zusammenhänge (z.B. Standsicherheit, Hebelgesetz), die Fähigkeit, Signale zu erkennen und richtig umzusetzen, sowie Verantwortungsbewusstsein, Zuverlässigkeit und umsichtiges Handeln. Die körperliche Eignung wird üblicherweise durch eine arbeitsmedizinische Vorsorgeuntersuchung nach dem Grundsatz G25 festgestellt.',
  28:'Erst wenn Ausbildung und Befähigungsnachweis vorliegen, darf der Unternehmer die Beauftragung erteilen – und das nur schriftlich, z.B. in Form eines innerbetrieblichen Fahrausweises. Wichtig: Diese Beauftragung gilt ausschließlich für den Betrieb, der sie ausgestellt hat, und kann nicht auf ein anderes Unternehmen übertragen werden. Wechseln Sie den Arbeitgeber, brauchen Sie dort eine neue Beauftragung.',
  30:'In diesem Kapitel schauen wir uns das tatsächliche Unfallgeschehen genauer an: aktuelle Unfallzahlen, die beiden großen Unfallschwerpunkte, und danach jeweils im Detail Anfahrunfälle und Kippunfälle.',
  31:'Diese drei Zahlen fassen das Risiko zusammen: über 20.000 Unfälle jährlich beim Umgang mit Flurförderzeugen in Deutschland, davon etwa 200 schwere Unfälle durch Fallen oder Kippen des Fahrzeugs, und 23 tödliche Unfälle pro Jahr. Das zeigt: Ein Stapler ist ein Arbeitsmittel mit echtem Gefahrenpotenzial, kein harmloses Werkzeug.',
  32:'Die beiden Unfallschwerpunkte haben unterschiedliche Ursachen: Anfahrunfälle entstehen vor allem durch Unachtsamkeit des Fahrers, eingeschränkte Sicht auf die Fahrbahn und räumliche Enge im Betrieb. Kippunfälle entstehen vor allem durch Fahren mit angehobener Last, Bodenunebenheiten und zu schnelles Kurvenfahren – und sie sind für über 50% aller tödlichen Staplerunfälle verantwortlich.',
  33:'Diese echten Unfallberichte zeigen typische Anfahrunfälle: In einem Fall übersah der Fahrer beim Rückwärtsfahren eine neben ihm stehende Person und fuhr ihr über den Fuß. In einem anderen Fall ging der Verletzte zum Stapler, um den Fahrer etwas zu fragen – der Fahrer bemerkte ihn nicht und fuhr los. Beide Fälle zeigen: Vor jeder Fahrbewegung erst umschauen, hupen, Blickkontakt suchen. Klare Verkehrsregeln, Spiegel und Warnanlagen helfen zusätzlich.',
  34:'Diese Statistik enthält eine überraschende, aber wichtige Erkenntnis: Bei mehr als 80% der tödlichen Kippunfälle war der Stapler unbeladen. Das widerlegt den Irrglauben, Kippgefahr bestehe nur bei schweren Lasten – tatsächlich unterschätzen viele Fahrer gerade den unbeladenen Stapler, obwohl auch er bei zu schnellem Kurvenfahren oder auf unebenem Boden kippen kann. Deshalb gilt unabhängig von der Beladung: Last (falls vorhanden) absenken, Bodenunebenheiten melden, Kurvengeschwindigkeit anpassen und die Fahrerrückhalteeinrichtung immer nutzen.',
  37:'In diesem Kapitel geht es um das sichere Lagern und Stapeln mit dem Stapler: welche Lagereinrichtungen und -geräte es gibt, welche Anforderungen beim Lagern und Stapeln gelten, wie in Regalen gelagert wird, welche Verhaltensweisen beim Ein- und Auslagern wichtig sind, und was bei Schäden an Lagereinrichtungen zu tun ist.',
  38:'Die beiden gängigsten Ladehilfsmittel haben unterschiedliche Belastungsgrenzen: Eine Flachpalette (Europalette) darf mit 1000–1500 kg belastet werden; bei Blocklagerung (Paletten übereinander) gilt: die unterste Palette darf maximal das Vierfache der zulässigen Last tragen. Eine Gitterbox darf max. 1000 kg Nutzlast haben und bei gleichmäßig verteilter Last höchstens fünffach übereinandergestapelt werden.',
  39:'Regale dürfen nicht beliebig belastet werden: Am Regal selbst ist die zulässige Belastung für Regalfach und Regalfeld angegeben (z.B. auf einem Belastungsschild) – diese Werte sowie die zulässigen Fach- und Feldlasten müssen eingehalten werden. Regale sind außerdem regelmäßig auf Schäden zu prüfen, z.B. verbogene Regalständer, und solche Schäden müssen sofort gemeldet werden.',
  40:'Beim Lagern in Regalen gilt: In den obersten Ablagen müssen stirnseitig mindestens 0,5 m hohe Sicherungseinrichtungen gegen Herabfallen vorhanden sein. Ladeeinheiten dürfen nicht stoßartig in Palettenregale abgestellt werden. Zum Heben über 1,80 m darf nur ein Stapler mit Fahrerschutzdach verwendet werden, und Lasten dürfen nur auf ausreichend tragfähigem Untergrund abgesetzt werden.',
  41:'Auch der Stapler selbst muss zur Aufgabe passen: Zum Heben von Lasten höher als 1,80 m über Flur darf nur ein Stapler mit Fahrerschutzdach eingesetzt werden. Außerdem muss der Stapler grundsätzlich für die zu tragende Last geeignet sein, und seine zulässige Tragfähigkeit darf niemals überschritten werden – dazu mehr im Kapitel zum Traglastdiagramm.',
  42:'Beim Ein- und Auslagern gilt: Der Hubmast darf nur zum Aufnehmen und Absetzen der Last nach vorne geneigt werden, nicht beim Fahren. Nicht ordnungsgemäß gepackte Lasten dürfen nicht gestapelt werden, und Ladeeinheiten mit beschädigten Paletten dürfen nicht auf höher gelegenen Stellen abgesetzt werden. Grundsätzlich dürfen Lasten nur auf ausreichend tragfähigem Untergrund standsicher abgesetzt werden.',
  43:'Bestimmte Bereiche dürfen niemals durch abgestellte Lasten blockiert werden, weil sie im Notfall frei zugänglich sein müssen: Fluchtwege, Notausgänge, Feuerlöscheinrichtungen, Erste-Hilfe-Einrichtungen und alle Betriebseinrichtungen, die jederzeit zugänglich sein müssen (z.B. Elektroverteilungen).',
  44:'Schäden an Lagereinrichtungen wie Regalen (z.B. verbogene Regalständer) müssen sofort gemeldet werden – das beschädigte Regal darf erst wieder genutzt werden, nachdem es instandgesetzt wurde. Auch fehlende oder beschädigte Aushebesicherungen an Regalträgern (die verhindern, dass sich Träger unbeabsichtigt aus der Verankerung heben) müssen gemeldet und ersetzt werden.',
  46:'In diesem Kapitel geht es um Verkehrswege: die erforderlichen Abmessungen von Wegen im Betrieb, allgemeine Anforderungen an Verkehrswege, die besonderen Regeln in Schmalgängen, und was beim Fahren auf öffentlichen Verkehrswegen gilt.',
  47:'Es dürfen ausschließlich Verkehrswege befahren werden, die vom Unternehmer ausreichend bemessen, festgelegt und freigegeben wurden. Bereiche, die für Stapler gesperrt sind, müssen durch entsprechende Verbotsschilder eindeutig gekennzeichnet sein – ein solches Schild ist immer verbindlich zu beachten.',
  48:'Bei Einbahnverkehr richtet sich die Mindestbreite eines Verkehrsweges nach der Breite des Flurförderzeugs bzw. der Ladung, zuzüglich eines Randzuschlags von 0,5 m auf beiden Seiten. Dieser Randzuschlag ist nötig, damit auch bei kleinen Lenkungenauigkeiten kein Kontakt mit Wänden, Regalen oder anderen Hindernissen entsteht.',
  49:'Begegnen sich zwei Flurförderzeuge auf demselben Weg (Gegenverkehr), kommt zum beidseitigen Randzuschlag von 0,5 m zusätzlich ein Begegnungszuschlag von 0,4 m zwischen den beiden Fahrzeugen bzw. Lasten hinzu. Der Verkehrsweg muss also insgesamt entsprechend breiter ausgelegt sein als bei reinem Einbahnverkehr.',
  50:'Wird derselbe Verkehrsweg gleichzeitig auch von Fußgängern genutzt (Gehverkehr), erhöht sich der Randzuschlag beidseitig von 0,5 m auf 0,75 m – denn Fußgänger brauchen mehr Sicherheitsabstand zum Fahrzeug als es rein technisch für die Fahrzeugbreite nötig wäre. Der Begegnungszuschlag von 0,4 m zwischen den Fahrzeugen bleibt dabei gleich.',
  51:'An Verkehrswege werden mehrere Anforderungen gestellt: Der Boden muss mindestens 1700 kg/m² tragen können, vor Türen, Toren und Durchgängen ist ein Sicherheitsabstand von mindestens 1 m einzuhalten, Bodenunebenheiten und Hindernisse müssen gemeldet und beseitigt werden, an Kreuzungen müssen eindeutige Vorfahrtsregeln gelten (z.B. rechts vor links), und es muss ausreichende Beleuchtung vorhanden sein.',
  52:'Bei Pendeltoren darf nur eingefahren werden, wenn ausreichende Durchsicht gewährleistet ist – im Zweifel die Durchfahrt vorher durch Hupen ankündigen. Ladebrücken müssen ausreichend breit (Flurförderzeugbreite plus 0,70 m) und tragfähig sein. Und ganz grundsätzlich: Verkehrswege müssen freigehalten werden und dürfen nicht mit abgestellten Waren zugestellt werden.',
  53:'In Schmalgängen (Regalgängen, in denen kaum Platz neben dem Stapler ist) braucht es besonderen Personenschutz: bauliche Maßnahmen wie Zäune oder Mauern, die Fußgängern den Zugang verwehren, Warnanlagen wie Lichtschranken, die bei Betreten Alarm auslösen, Sensoren bzw. Laserscanner am Stapler selbst, die den Fahrbereich überwachen, und die Verhaltensregel, nur einzufahren, wenn erkennbar keine Fußgänger im Gang sind.',
  54:'Auf öffentlichen Verkehrswegen gelten für Flurförderzeuge zusätzlich zur Unfallverhütungsvorschrift „Flurförderzeuge" die allgemeinen Straßenverkehrsgesetze: das Straßenverkehrsgesetz (StVG), die Straßenverkehrs-Ordnung (StVO), die Straßenverkehrs-Zulassungs-Ordnung (StVZO) und die Fahrerlaubnisverordnung (FeV).',
  55:'Um auf öffentlichen Straßen fahren zu dürfen, brauchen Sie zusätzlich zur Staplerfahrerausbildung einen Fahrauftrag und die passende Fahrerlaubnis. Seit dem 1.1.1999 gilt: Klasse L reicht für Fahrzeuge unter 25 km/h (unabhängig vom zulässigen Gesamtgewicht) – das betrifft die meisten Stapler im Werksverkehr. Schnellere Fahrzeuge benötigen je nach zulässigem Gesamtgewicht Klasse B (unter 3,5 t) oder Klasse C (über 3,5 t).',
  58:'In diesem Kapitel geht es um die Physik hinter der Standsicherheit: die Bauweise des Staplers, Schwerpunkt und seine Bedeutung, das Hebelgesetz und die Kippachse, Traglastdiagramme mit Übungsbeispielen, das sogenannte Kippkantendreieck, und zum Schluss eine Zusammenfassung der wichtigsten Verhaltensweisen.',
  59:'Beim Stapler befinden sich Lastaufnahmemittel und Last vor der Vorderachse. Damit das Fahrzeug nicht nach vorne kippt, bildet das Eigengewicht des Staplers – vor allem das Gegengewicht am Heck – das Gegengewicht zur Last auf der Gabel. Staplergewicht und Lastgewicht müssen dabei im Gleichgewicht stehen: Ist die Last zu schwer oder zu weit vorne, kippt der Stapler.',
  60:'Der Staplerschwerpunkt liegt etwa auf Höhe des Fahrersitzes und – beim unbeladenen Stapler – nahe an den seitlichen Kippkanten, was ihn anfälliger für Kippen macht als man vermuten würde. Der Lastschwerpunkt ist der gedachte Punkt, in dem sich die Masse der Last vereinigt; er wandert beim Anheben der Last nach oben. Last- und Staplerschwerpunkt zusammen ergeben den Gesamtschwerpunkt, der über die Standsicherheit entscheidet.',
  61:'Die Vorderachse des Staplers ist die Kippachse. Es gilt das Prinzip einer Wippe: Kraft mal Kraftarm muss gleich Last mal Lastarm sein. Damit der Stapler beim Betrieb stabil bleibt, muss das Produkt auf der Staplerseite (Eigengewicht × Hebelarm) immer größer sein als auf der Lastseite. Deshalb gilt: Last möglichst nah am Gabelrücken aufnehmen, um den Lastarm – und damit das kippende Moment – klein zu halten.',
  62:'Wandert der Gesamtschwerpunkt über die Vorderachse (Kippachse) hinaus, kippt der Stapler nach vorne. Um das zu verhindern: Last bis zum Gabelrücken aufnehmen, den Gesamtschwerpunkt möglichst niedrig halten (Last nicht unnötig hoch anheben) und die Geschwindigkeit in Kurven anpassen. Auch hier gilt wieder: über 80% der tödlichen Kippunfälle passierten mit unbeladenem Stapler – Vorsicht gilt also immer, nicht nur bei schweren Lasten.',
  63:'Jeder Stapler ist für eine bestimmte Nenntragfähigkeit gebaut, die der Hersteller auf dem Fabrikschild angibt. Diese Angabe gilt aber nur für eine genormte Hubhöhe und einen festgelegten Lastschwerpunktabstand. Die tatsächliche Tragfähigkeit in einer konkreten Situation hängt zusätzlich vom tatsächlichen Lastschwerpunktabstand und der tatsächlichen Hubhöhe ab und muss dem Traglastdiagramm entnommen werden.',
  64:'Das Traglastdiagramm zeigt auf der X-Achse den Lastschwerpunktabstand in mm und auf der Y-Achse die zulässige Last in kg; jede Linie im Diagramm steht für eine andere Hubhöhe. Je weiter die Last vom Gabelrücken entfernt ist und je höher gehoben wird, desto geringer ist die zulässige Last. Im E-Learning können Sie das Diagramm später interaktiv mit Reglern selbst ausprobieren.',
  65:'Beim Kurvenfahren wirkt seitlich die Fliehkraft auf den Stapler – und diese Kraft steigt nicht linear, sondern quadratisch mit der Geschwindigkeit: Eine Verdoppelung der Geschwindigkeit vervierfacht die Fliehkraft. Besonders gefährlich sind Kurvenfahrten mit dem unbeladenen Stapler, weil dessen Schwerpunkt nahe an den seitlichen Kippkanten liegt. Deshalb gilt: Kurven immer mit angepasster, niedriger Geschwindigkeit und möglichst großem Radius durchfahren.',
  66:'Anders als ein PKW, der auf vier Rädern ein Standviereck bildet, steht ein Dreiradstapler nur auf einem Standdreieck – die Kippkanten verlaufen von den Vorderrädern zu einem Punkt an der Hinterachse. Beim unbeladenen Stapler liegt der Schwerpunkt nahe an den seitlichen Kippkanten dieses Dreiecks, was die Kippgefahr erhöht. Eine bodennah aufgenommene Last erhöht die Standsicherheit, eine angehobene Last verringert sie wieder.',
  67:'Auch ein Vierradstapler bildet trotz seiner vier Räder rechnerisch ein Standdreieck, weil die Hinter- bzw. Lenkachse pendelnd nur an einem einzigen Punkt am Fahrgestell befestigt ist (Pendelachse). Die Mitte dieser pendelnden Achse bildet die Spitze des Standdreiecks. Ergebnis: Ein Vierradstapler hat grundsätzlich dieselbe Kippgefahr wie ein Dreiradstapler – der vierte Radkontakt bringt keine zusätzliche Stabilität gegen seitliches Kippen.',
  68:'Als Zusammenfassung die wichtigsten Verhaltensweisen für die Standsicherheit: Stapler nicht überlasten, Lasten bis zum Gabelrücken aufnehmen, die Höhe des Gesamtschwerpunktes klein halten, Kurven mit angepasster Geschwindigkeit und möglichst großem Radius durchfahren, und starkes Beschleunigen sowie Bremsen vermeiden.'
};

function openOv(){
  var totalAbg=Object.keys(kapitelAbgeschlossen).length;
  var totalQ=0,richtigQ=0;
  KAPITEL.forEach(function(k){var sc=quizScoreForKapitel(k.nr);totalQ+=sc.gesamt;richtigQ+=sc.richtig;});
  var pct=totalQ>0?Math.round(richtigQ/totalQ*100):0;
  var pbarPct=Math.round(totalAbg/KAPITEL.length*100);
  document.getElementById('ovSummaryText').innerHTML=
    '<b>'+totalAbg+' / '+KAPITEL.length+'</b> '+T.kapitelAbgeschlossen+(totalQ>0?' &middot; Ø '+pct+' % Quiz':'');
  document.getElementById('ovPbar').style.width=pbarPct+'%';
  var html='';
  KAPITEL.forEach(function(k){
    var sc=quizScoreForKapitel(k.nr);
    var done=!!kapitelAbgeschlossen[k.nr];
    var inProg=!done&&sc.richtig>0;
    var icon=done?'&#10003;':(inProg?'&#9711;':'&#9675;');
    var cls=done?'ok':(inProg?'prog':'');
    var scoreText=sc.gesamt>0?sc.richtig+'/'+sc.gesamt+T.ovQuizFragen+' '+(done?'&#10003;':''):T.ovNochNicht;

function closeOv(){
  document.getElementById('ovOverlay').classList.remove('active');

function jumpTo(nr){

function weiterLernen(){
  closeOv();

    if(!kapitelAbgeschlossen[KAPITEL[i].nr]){cur=kapitelStart[KAPITEL[i].nr]||0;render();return;}

}

/* ---- DIAGRAM DRAWING ---- */
var NS='http://www.w3.org/2000/svg';
var _ds={};
function mkEl(t,a){var e=document.createElementNS(NS,t);Object.keys(a).forEach(function(k){e.setAttribute(k,a[k]);});return e;}

function drawDiag(svgId,type,hl,arrows){
  hl=hl||[];arrows=arrows||[];
  var svg=document.getElementById(svgId);if(!svg)return;
  svg.innerHTML='';
  var iS=type==='single';
  var ox=58,w=370,oy=iS?200:185,h=iS?160:150,yMin=500,yMax=iS?3200:1200;
  var sx=function(v){return ox+(v-500)/500*w;};
  var sy=function(v){return oy-(v-yMin)/(yMax-yMin)*h;};
  _ds[svgId]={sx:sx,sy:sy,oy:oy};
  [500,600,700,800,900,1000].forEach(function(g){
    svg.appendChild(mkEl('line',{x1:sx(g),y1:oy,x2:sx(g),y2:oy-h,stroke:'var(--line)'}));
    var t=mkEl('text',{x:sx(g),y:oy+14,'font-size':10,'text-anchor':'middle',fill:'var(--muted)'});t.textContent=g;svg.appendChild(t);
  });
  (iS?[500,1000,1500,2000,2500,3000]:[500,600,700,800,900,1000,1100,1200]).forEach(function(g){
    svg.appendChild(mkEl('line',{x1:ox,y1:sy(g),x2:ox+w,y2:sy(g),stroke:'var(--line)'}));
    var t=mkEl('text',{x:ox-5,y:sy(g)+4,'font-size':10,'text-anchor':'end',fill:'var(--muted)'});t.textContent=g;svg.appendChild(t);
  });
  svg.appendChild(mkEl('line',{x1:ox,y1:oy,x2:ox+w,y2:oy,stroke:'var(--ink)','stroke-width':2}));
  svg.appendChild(mkEl('line',{x1:ox,y1:oy,x2:ox,y2:oy-h,stroke:'var(--ink)','stroke-width':2}));
  if(iS){
    svg.appendChild(mkEl('polygon',{points:sx(500)+','+sy(3000)+' '+sx(1000)+','+sy(500)+' '+sx(1000)+','+oy+' '+sx(500)+','+oy,fill:'rgba(29,158,117,.12)',stroke:'none'}));
    svg.appendChild(mkEl('line',{x1:sx(500),y1:sy(3000),x2:sx(1000),y2:sy(500),stroke:'var(--ink)','stroke-width':3}));
    var gt=mkEl('text',{x:sx(560),y:sy(1800),'font-size':11,fill:'var(--muted)'});gt.textContent=T.gabelruecken;svg.appendChild(gt);
  }else{
    MULTI_LINES.forEach(function(L){
      var dim=hl.length>0&&hl.indexOf(L.hub)<0;
      svg.appendChild(mkEl('line',{x1:sx(L.a[0]),y1:sy(L.a[1]),x2:sx(L.b[0]),y2:sy(L.b[1]),stroke:L.color,'stroke-width':hl.indexOf(L.hub)>=0?L.w+1.5:L.w,opacity:dim?.2:1}));
      var lt=mkEl('text',{x:sx(L.b[0])+6,y:sy(L.b[1])+4,'font-size':10,'font-weight':'bold',fill:L.color,opacity:dim?.3:1});lt.textContent=L.hub;svg.appendChild(lt);
    });
    var ht=mkEl('text',{x:sx(1000)+6,y:oy-h+2,'font-size':9,fill:'var(--muted)'});ht.textContent=T.hubLabel;svg.appendChild(ht);
  }
  var xl=mkEl('text',{x:ox+w/2,y:oy+26,'font-size':10,'text-anchor':'middle',fill:'var(--muted)'});xl.textContent=T.lsaLabel;svg.appendChild(xl);
  var yl=mkEl('text',{x:13,y:oy-h/2,'font-size':10,'text-anchor':'middle',fill:'var(--muted)',transform:'rotate(-90,13,'+(oy-h/2)+')'});yl.textContent=T.lastLabel;svg.appendChild(yl);
  arrows.forEach(function(arr){
    var ax=arr[0],ayv=arr[1],ds=_ds[svgId],col='#D85A30';
    svg.appendChild(mkEl('line',{x1:ds.sx(500),y1:ds.sy(ayv),x2:ds.sx(ax),y2:ds.sy(ayv),stroke:col,'stroke-width':2.5,'stroke-dasharray':'5,3'}));
    svg.appendChild(mkEl('line',{x1:ds.sx(ax),y1:ds.sy(ayv),x2:ds.sx(ax),y2:ds.oy,stroke:col,'stroke-width':2.5}));
    svg.appendChild(mkEl('circle',{cx:ds.sx(ax),cy:ds.sy(ayv),r:4,fill:col}));
    var p=document.createElementNS(NS,'polygon');p.setAttribute('points',(ds.sx(ax)-5)+','+(ds.oy-8)+' '+(ds.sx(ax)+5)+','+(ds.oy-8)+' '+ds.sx(ax)+','+(ds.oy-1));p.setAttribute('fill',col);svg.appendChild(p);
  });
}

        '<button class="dqbtn info" onclick="chkDI('+di+','+qi+')">'+T.pruefen+'</button>'+
        '<button class="dqbtn" onclick="hintDI('+di+','+qi+')">'+T.loesung+'</button>'+
        '</div><div class="dq-fb" id="dfb'+di+''+qi+'"></div></div>';
    }else if(q.type==='yn'){
      qHtml+='<div class="dq"><div class="dq-text">'+q.q+'</div>'+
        '<div class="dq-row">'+
        '<button class="dqbtn info" onclick="ynDI('+di+','+qi+',\'ja\')">'+T.ja+'</button>'+
        '<button class="dqbtn info" onclick="ynDI('+di+','+qi+',\'nein\')">'+T.nein+'</button>'+
        '</div><div class="dq-fb" id="dfb'+di+''+qi+'"></div></div>';
    }else if(q.type==='hub'){
      qHtml+='<div class="dq"><div class="dq-text">'+q.q+'</div>'+
        '<div class="dq-row">'+
        '<button class="dqhbtn" style="color:#1a1a2e;border-color:#1a1a2e" onclick="hubDI('+di+','+qi+',4250)">4250 mm</button>'+
        '<button class="dqhbtn" style="color:#0a7a5a;border-color:#0a7a5a" onclick="hubDI('+di+','+qi+',5250)">5250 mm</button>'+
        '<button class="dqhbtn" style="color:#1a5fa8;border-color:#1a5fa8" onclick="hubDI('+di+','+qi+',6150)">6150 mm</button>'+
        '</div><div class="dq-fb" id="dfb'+di+''+qi+'"></div></div>';

    info+qHtml+'</div>';
  drawDiag('dsvg',dp.svg,[],[]);
}

function dFb(di,qi,ok,msg){var d=document.getElementById('dfb'+di+''+qi);if(!d)return;d.className='dq-fb '+(ok?'ok':'no');d.textContent=msg;}
function chkDI(di,qi){var dp=DIAG_PAGES[di],q=dp.qs[qi],v=parseFloat(document.getElementById('di'+di+'q'+qi).value);if(isNaN(v)){dFb(di,qi,false,T.bitteWert);return;}var ok=q.check(v);drawDiag('dsvg',dp.svg,q.highlight?[q.highlight]:[],[q.arrow()]);dFb(di,qi,ok,ok?'✓ '+q.ans():'✗ '+q.ans());}
function hintDI(di,qi){var dp=DIAG_PAGES[di],q=dp.qs[qi];drawDiag('dsvg',dp.svg,q.highlight?[q.highlight]:[],[q.arrow()]);dFb(di,qi,true,'✓ '+q.ans());}
function ynDI(di,qi,ans){var dp=DIAG_PAGES[di],q=dp.qs[qi],ok=ans===q.correct;drawDiag('dsvg',dp.svg,q.highlight?[q.highlight]:[],[q.arrow()]);dFb(di,qi,ok,ok?T.richtigDiag+q.explain():T.falschDiag+q.explain());}
function hubDI(di,qi,sel){var dp=DIAG_PAGES[di],q=dp.qs[qi],ok=sel===q.correct;drawDiag('dsvg',dp.svg,[q.highlight||q.correct],[]);dFb(di,qi,ok,ok?T.kennlinieRichtig+sel+' mm.':T.korrekt+q.correct+' mm.');}

function quizScoreForKapitel(knr){
  var richtig=0,gesamt=0;
  STEPS.forEach(function(s){if(s.type==='quiz'&&s.kapitel_nr===knr){gesamt++;if(answered[knr+'-'+s.qi]===true)richtig++;}});
  return{richtig:richtig,gesamt:gesamt};
}

function updateKontaktLinks(){
  var s=STEPS[cur];
  var ctx='';
  if(s.type==='welcome') ctx=T.willkommen;
  else if(s.type==='kapitel') ctx=T.kapitel+' '+s.nr+': '+s.titel;
  else if(s.type==='folie') ctx=T.kapitel+' '+s.kapitel_nr+' | '+T.folie+' '+s.fn+' / '+TOTAL_FOLIEN;
  else if(s.type==='video') ctx=T.kapitel+' '+s.kapitel_nr+' | '+s.titel;
  else if(s.type==='quiz') ctx=T.kapitel+' '+s.kapitel_nr+' | '+T.wissensfrage+' '+(s.qi+1);
  else if(s.type==='abschluss') ctx=T.kapitel+' '+s.kapitel_nr+': '+s.kapitel_titel;
  else if(s.type==='diag') ctx=T.diagramm+' '+(s.di+1)+' '+T.kap8;
  else if(s.type==='ergebnis') ctx=T.abschluss;
  var waMsg=T.waMsg.replace('{ctx}',ctx);
  var mailSubj=T.mailSubj.replace('{ctx}',ctx);
  var mailBody=T.mailBody.replace('{ctx}',ctx);
  var wa=document.getElementById('waBtn');
  var ml=document.getElementById('mailBtn');
  if(wa) wa.href='https://wa.me/'+WA_NR+'?text='+encodeURIComponent(waMsg);
  if(ml) ml.href='mailto:'+MAIL+'?subject='+encodeURIComponent(mailSubj)+'&body='+encodeURIComponent(mailBody);
}

function answer(key,chosen,richtig){
  if(key in answered)return;
  document.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});
  document.getElementById('opt-'+richtig).classList.add('correct');
  var fb=document.getElementById('fb');
  var s=STEPS[cur];
  if(chosen===richtig){
    if(!(key in answered))score++;
    fb.className='quiz-fb ok';fb.textContent=T.richtig;
  }else{
    document.getElementById('opt-'+chosen).classList.add('wrong');
    fb.className='quiz-fb no';fb.textContent=T.falsch+s.o[richtig];
  }
  answered[key]=(chosen===richtig);
  nextBtn.disabled=false;
  if(quizTimer)clearTimeout(quizTimer);
  quizTimer=setTimeout(function(){quizTimer=null;next();},1400);
}

function showAnswerState(key,richtig,opts){
  document.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});
  document.getElementById('opt-'+richtig).classList.add('correct');
  var fb=document.getElementById('fb');
  if(answered[key]){fb.className='quiz-fb ok';fb.textContent=T.richtig;}
  else{fb.className='quiz-fb no';fb.textContent='✓ Richtige Antwort markiert';}
}

function kapitelAbschliessen(knr,kname){
  var btn=document.getElementById('aBtn');
  var stat=document.getElementById('aStat');
  if(!btn||!stat)return;
  btn.disabled=true;btn.textContent=T.wirdGespeichert;
  var sc=quizScoreForKapitel(knr);
  var payload={
    regnr:regnr,kapitel_nr:knr,kapitel_name:kname,
    datum_uhrzeit:new Date().toISOString(),
    quiz_richtig:sc.richtig,quiz_gesamt:sc.gesamt,
    quiz_prozent:sc.gesamt>0?Math.round(sc.richtig/sc.gesamt*100):0,
    bestanden:sc.gesamt>0?(sc.richtig/sc.gesamt>=0.8):true,
    lernzeit_sekunden:Math.round((Date.now()-kapitelStartZeit)/1000),
    gesamt_kapitel_abgeschlossen:Object.keys(kapitelAbgeschlossen).length+1
  };
  function onOK(){
    kapitelAbgeschlossen[knr]=true;kapitelStartZeit=Date.now();
    btn.textContent=T.abschlussAbgeschlossen;btn.style.background='var(--ok)';
    stat.textContent=T.kapitel+' '+knr+' '+T.gespeichert;
    nextBtn.disabled=false;
    saveProgress();
  }
  if(FLOW_URL==='DEIN_FLOW_URL_HIER'){onOK();return;}
  fetch(FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(onOK)
    .catch(function(){btn.disabled=false;btn.textContent=T.abschlussBtnTxt;stat.textContent=T.fehler;stat.style.color='var(--no)';});
}

var quizTimer=null;
function next(){if(quizTimer){clearTimeout(quizTimer);quizTimer=null;}if(cur<STEPS.length-1){cur++;render();saveProgress();}}
function prev(){if(quizTimer){clearTimeout(quizTimer);quizTimer=null;}if(cur>0){cur--;render();saveProgress();}}
function restart(){cur=0;answered={};score=0;kapitelAbgeschlossen={};render();}

document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'&&!nextBtn.disabled)next();
  if(e.key==='ArrowLeft'&&!prevBtn.disabled)prev();
});
var tx=0;
host.addEventListener('touchstart',function(e){tx=e.changedTouches[0].screenX;},{passive:true});
host.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].screenX-tx;
  if(dx<-50&&!nextBtn.disabled)next();
  if(dx>50)prev();
},{passive:true});

function goBack(){
  window.location.href=BASE+(regnr?'?regnr='+encodeURIComponent(regnr)+'&lang='+lang:'');
}

prevBtn.textContent=T.prevBtnTxt;
document.querySelector('.back-btn').textContent=T.backBtnTxt;
document.getElementById('appTitle').textContent=T.appTitel;
document.getElementById('appSubtitle').innerHTML=T.appSub;
document.getElementById('ovBtn').textContent=T.ovBtnTxt;
document.documentElement.lang=lang;
loadProgress();
updateProgBadge();
render();
</script>
