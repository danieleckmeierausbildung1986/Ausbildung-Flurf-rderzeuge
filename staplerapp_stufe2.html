<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ProDrive Akademie Niederbayern – Stufe 2</title>
<style>
:root{
  --bg:#0d1f12;--green:#1a7a4a;--green-l:#2ea865;--green-d:#0d4a24;
  --acc1:#1a3a6b;--acc2:#2e6cb0;
  --navy:#16243f;--muted:#68788f;--line:#e3e8f0;--ink:#1a2330;
  --shadow:0 8px 40px rgba(0,0,0,.25);
  --ok:#1a9e6e;--okbg:#e8f7f2;--no:#c0392b;--nobg:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,sans-serif;
  min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;padding:16px;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(26,122,74,.25) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 80%, rgba(13,74,36,.3) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}
.wrap{position:relative;z-index:1;width:100%;max-width:1280px;display:flex;flex-direction:column;flex:1}
/* TOPBAR */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.ti{width:46px;height:46px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--acc1),var(--acc2));
  display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 20px rgba(0,0,0,.3);}
.topbar h1{color:#fff;font-size:18px;font-weight:700;line-height:1.2}
.topbar p{color:rgba(255,255,255,.45);font-size:12px}
.prog-badge{font-size:11px;color:rgba(255,255,255,.55);margin-top:3px;min-height:14px;}
/* STAGE */
.stage{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden;
  display:flex;flex-direction:column;width:100%;}
.progress{height:5px;background:var(--line)}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--acc1),var(--acc2));transition:width .25s ease;width:0}
/* SCREENS */
.screen{display:none;}
.screen.active{display:block;}
/* WELCOME */
.welcome-box{padding:40px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:linear-gradient(135deg,var(--green-d),var(--green-l));}
.welcome-logo{font-size:60px;}
.welcome-titel{font-size:26px;font-weight:800;color:#fff;line-height:1.3;}
.welcome-sub{font-size:15px;color:rgba(255,255,255,.85);line-height:1.6;max-width:500px;}
.welcome-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:500px;}
.wg{background:rgba(255,255,255,.15);border-radius:12px;padding:12px;text-align:left;}
.wg-icon{font-size:20px;margin-bottom:4px;}
.wg-titel{font-size:12px;font-weight:700;color:#fff;margin-bottom:2px;}
.wg-text{font-size:11px;color:rgba(255,255,255,.75);}
.welcome-start{padding:14px 36px;border:none;border-radius:12px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;background:#fff;color:var(--green-d);margin-top:6px;}
/* FOLIENBOX */
.slidebox{position:relative;background:#0d1a2e;display:flex;align-items:center;justify-content:center;
  min-height:200px;}
.slidebox img{width:100%;height:auto;display:block;max-height:65vh;object-fit:contain;}
/* ERKLÄRUNGS-KASTEN (immer eingeblendet, unter der Folie) */
.erklaerung-box{background:#fff;border:1px solid var(--line);}
.erklaerung-label{display:flex;align-items:center;gap:8px;padding:12px 20px 0;font-size:14px;
  font-weight:700;color:var(--acc1)}
.erklaerung-content p{margin:0;padding:10px 20px 20px;font-size:17px;line-height:1.75;color:var(--ink)}
@media(max-width:600px){
  .erklaerung-label{font-size:13px;padding:10px 14px 0}
  .erklaerung-content p{font-size:15px;padding:8px 14px 16px}
}
.nav-zone{position:absolute;top:0;bottom:0;width:30%;cursor:pointer;z-index:2;
  display:flex;align-items:center;opacity:0;transition:opacity .15s}
.nav-zone:hover{opacity:1}
.nav-zone.prev{left:0;justify-content:flex-start;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}
.nav-zone.next{right:0;justify-content:flex-end;background:linear-gradient(270deg,rgba(0,0,0,.35),transparent)}
.nav-zone span{color:#fff;font-size:30px;padding:0 14px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.folie-label{font-size:12px;color:var(--muted);text-align:center;padding:6px 0 2px;}
/* QUIZ */
.quizbox{padding:28px;display:flex;flex-direction:column;}
.quiz-badge{font-size:12px;font-weight:700;color:var(--acc2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;}
.quiz-q{font-size:19px;font-weight:700;color:var(--navy);margin-bottom:20px;line-height:1.4;}
.quiz-opts{display:flex;flex-direction:column;gap:10px;}
.opt{text-align:left;padding:14px 18px;border:2px solid var(--line);border-radius:12px;
  background:#fff;font-size:15px;color:var(--ink);cursor:pointer;font-family:inherit;transition:all .12s;}
.opt:hover:not(:disabled){border-color:var(--acc2);background:#f0f7ff;}
.opt:disabled{cursor:default;}
.opt.correct{border-color:var(--ok)!important;background:var(--okbg)!important;color:var(--ok)!important;font-weight:700;}
.opt.wrong{border-color:var(--no)!important;background:var(--nobg)!important;color:var(--no)!important;}
.quiz-fb{margin-top:16px;font-size:15px;font-weight:700;min-height:24px;}
.quiz-fb.ok{color:var(--ok)}.quiz-fb.no{color:var(--no)}
.quiz-prog{font-size:12px;color:var(--muted);margin-bottom:6px;}
/* ABSCHLUSS */
.abschluss-box{padding:48px 28px;text-align:center;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;}
.abschluss-icon{font-size:50px;}
.abschluss-titel{font-size:22px;font-weight:800;color:var(--navy);}
.abschluss-sub{font-size:14px;color:var(--muted);max-width:400px;}
.abschluss-score{background:var(--okbg);border:1px solid var(--ok);border-radius:12px;
  padding:12px 20px;font-size:15px;color:#0d5c3a;font-weight:600;}
.abschluss-btn{padding:14px 32px;border:none;border-radius:12px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;background:linear-gradient(135deg,var(--acc1),var(--acc2));color:#fff;transition:all .15s;}
.abschluss-btn:hover{opacity:.9;}
/* CONTROLS */
.controls{display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:#fff;border-top:1px solid var(--line);gap:12px;}
.ctrl-btn{display:flex;align-items:center;gap:7px;padding:11px 20px;border:none;border-radius:11px;
  background:linear-gradient(135deg,var(--acc1),var(--acc2));
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:inherit;}
.ctrl-btn:hover{opacity:.9;}
.ctrl-btn:disabled{opacity:.35;cursor:not-allowed;}
.counter{font-size:13px;font-weight:700;color:var(--muted);text-align:center;line-height:1.4;}
/* KONTAKT */
.kontakt-bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.kontakt-btn{display:flex;align-items:center;gap:7px;padding:10px 18px;border:none;border-radius:10px;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;
  transition:all .15s;flex:1;justify-content:center;}
.kontakt-btn.wa{background:#25D366;color:#fff;}
.kontakt-btn.mail{background:#0072C6;color:#fff;}
.back-btn{display:block;width:100%;padding:12px;border:2px solid rgba(255,255,255,.2);
  border-radius:12px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);
  font-size:14px;font-weight:600;cursor:pointer;text-align:center;font-family:inherit;margin-top:8px;}
.back-btn:hover{border-color:var(--green-l);color:#fff;background:rgba(255,255,255,.12);}
/* RESPONSIVE */
@media(max-width:900px){
  .topbar h1{font-size:16px}
  .quiz-q{font-size:17px}
}
@media(max-width:600px){
  body{padding:6px 6px 10px}
  .topbar{gap:8px;margin-bottom:8px}
  .ti{width:36px;height:36px;font-size:17px;border-radius:9px}
  .topbar h1{font-size:14px}
  .topbar p{font-size:10px}
  .stage{border-radius:12px}
  .welcome-box{padding:22px 14px;gap:10px}
  .welcome-logo{font-size:42px}
  .welcome-titel{font-size:19px}
  .welcome-sub{font-size:13px}
  .welcome-grid{grid-template-columns:1fr}
  .quizbox{padding:16px 14px}
  .quiz-badge{font-size:11px}
  .quiz-q{font-size:15px;margin-bottom:14px}
  .opt{padding:11px 13px;font-size:14px}
  .abschluss-box{padding:22px 14px;gap:10px}
  .abschluss-icon{font-size:40px}
  .abschluss-titel{font-size:18px}
  .slidebox{min-height:180px}
  .slidebox img{max-height:52vh}
  .nav-zone{opacity:.35;width:22%}
  .controls{padding:9px 10px;gap:8px}
  .ctrl-btn{padding:10px 13px;font-size:13px}
  .counter{font-size:12px}
  .kontakt-bar{gap:6px;margin-top:8px}
  .kontakt-btn{padding:9px 12px;font-size:13px}
  .back-btn{padding:10px;font-size:13px;margin-top:6px}
}
@media(max-width:380px){
  .topbar p{display:none}
  .topbar h1{font-size:13px}
  .quiz-q{font-size:14px}
  .opt{font-size:13px}
  .ctrl-btn{padding:9px 10px;font-size:12px}
}
</style>
</head>

schubmast:{
  2:'Die Stufe 1 (Allgemeine Ausbildung) deckt nur die Grundlagen ab. Für Spezialgeräte wie den Schubmaststapler ist eine gerätetyp-spezifische Zusatzausbildung gesetzlich vorgeschrieben, weil er ein völlig anderes Fahr- und Hubverhalten hat als ein normaler Frontstapler – mit Hubhöhen bis 13 m, bauartabhängiger Sitzposition und dem beweglichen Mast. Grundlage ist DGUV Vorschrift 68 §7. Ihr Arbeitgeber darf Ihnen den schriftlichen Fahrauftrag für den Schubmaststapler erst nach erfolgreichem Abschluss dieser Stufe 2 erteilen – Fahren ohne Auftrag ist verboten.',
  3:'Beim Schubmaststapler fährt der Mast zur Lastaufnahme nach vorne aus ("Schubmast") und wird für die Fahrt vollständig zurückgezogen – das ermöglicht das Lagern innerhalb der Radbasis und macht den Stapler extrem kompakt mit sehr kurzem Radstand, ideal für schmale Arbeitsgänge ab ca. 2,5 m Breite. Die Sitzposition des Fahrers ist bauartabhängig längs oder quer zur Fahrtrichtung – das schont den Nacken beim häufigen Vor-/Rückwärtsfahren, erfordert aber ein Umdenken beim Lenken, weil die toten Winkel anders liegen als beim klassischen Stapler.',
  4:'Beim Frontstapler hängt die Last vor der Vorderachse und wird über das Hebelgesetz durch das Gegengewicht ausgeglichen – der Lastschwerpunkt liegt außerhalb des Kippkantendreiecks. Beim Schubmaststapler dagegen wird die Last innerhalb der Radbasis transportiert; beim Ausfahren des Mastes wandert der Schwerpunkt aber extrem weit nach vorne, wodurch bei Überlastung Kippgefahr nach vorne entsteht. Die goldene Regel deshalb: Niemals mit ausgefahrenem Mast fahren oder lenken – der Mast darf nur im absoluten Stillstand bewegt werden.',
  5:'Je nach Gerät lenkt der Schubmaststapler mit 360°- oder 180°-Lenkung, wobei das Heck extrem schnell und weit ausschwenkt – Sicherheitsabstand zu Regalen und Personen ist daher besonders wichtig, im Regalgang sind nur minimale Lenkbewegungen erlaubt. Auch das Bremsverhalten unterscheidet sich: Lastradbremsen greifen anders als beim Frontstapler, oft sind auch Räder unter den Radarmen aktiv, und Nässe oder Glätte verändern den Bremsweg deutlich. Bei hochgehobener Last hilft ein Kameramonitor, ersetzt aber niemals den eigenen Blick.',
  6:'Bei Arbeiten in großen Höhen bis 13 m biegt und schwingt sich der Mast physikalisch – Geduld beim Abwarten des Schwingens ist Pflicht, niemals in schwingendem Zustand ein- oder auslagern. Die maximale Tragfähigkeit nimmt mit steigender Hubhöhe drastisch ab, deshalb muss vor jedem Einsatz das Traglastdiagramm am Gerät geprüft und der Lastschwerpunktabstand beachtet werden. Sicherheitssysteme wie das Kamera-System an den Gabelzinken, eine korrekt programmierte Hubhöhenvorwahl und die Resttragfähigkeitsanzeige unterstützen dabei, ersetzen aber nicht die eigene Aufmerksamkeit.',
  7:'Im Hochregallager drohen drei typische Gefahren: Quetschgefahr im Regalgang durch Hindernisse am Boden wie Palettenteile oder Verpackungsreste (Boden vor Einfahrt prüfen!), das Herabfallen von Lasten aus großer Höhe bei Fehlbedienung (deshalb ist Schutzhelm Pflicht und die Regalfachbelastung darf nie überschritten werden), und besondere Anforderungen an die Bodenbeschaffenheit – Schubmaststapler brauchen extrem ebene, saubere Böden, weil kleinste Unebenheiten in 10 m Höhe zu gefährlichen Schwankungen von Mast und Last führen.',
  8:'Vor jedem Fahrtantritt ist eine tägliche Einsatzprüfung Pflicht: Bei der Sichtprüfung werden Hydraulik, Beleuchtung, Gabelzinken samt Aufhängung, Bereifung, Hubketten und mögliche Risse an tragenden Teilen (z.B. Mast) sowie der Ausschubmechanismus kontrolliert. Bei der Funktionsprüfung werden Lenkung, Warneinrichtung/Hupe, Personenschutzeinrichtung (Bluespot), Hubeinrichtungen samt Gabelzinkenausschub, Feststell- und Betriebsbremse sowie das Kamerasystem (falls vorhanden) getestet.',
  9:'Als Zusammenfassung die acht wichtigsten Regeln: Mast nur im Stillstand aus- oder einfahren, Last immer bodennah und mit eingezogenem Mast transportieren, Traglastdiagramm vor jedem Einsatz prüfen, beim Einlagern das Mast-Schwingen abwarten, den Boden im Regalgang vor Einfahrt auf Hindernisse prüfen, das Kamerasystem nutzen aber zusätzlich immer mit den Augen kontrollieren, im Hochregallagerbereich Schutzhelm tragen, und Schäden am Regal sofort melden und den Bereich sperren.'
},
kommissionier:{
  2:'Die Stufe 1 ist nur die Grundlage. Für Kommissionierer ist eine gerätespezifische Zusatzausbildung gesetzlich vorgeschrieben – besonders wenn der Fahrer mit der Kabine mitfährt: Bei Vertikal-Kommissionierern verlässt der Fahrer den sicheren Boden und fährt mit der Plattform in die Höhe, das erzeugt völlig andere Gefährdungen als normale Flurförderzeuge. Grundlage ist DGUV Vorschrift 68 §7. Den schriftlichen Fahrauftrag für den Kommissionierstapler darf Ihr Arbeitgeber erst nach erfolgreicher Absolvierung dieser Stufe 2 erteilen – Fahren ohne Auftrag ist verboten.',
  3:'Es gibt zwei Bauarten: Der Horizontal-Kommissionierer arbeitet auf Bodenebene oder der 1. Regalebene, der Fahrer bleibt dabei auf dem Boden (oft Mitgänger- oder Fahrerstand-Betrieb) – gut geeignet für niedrige Regale, mit geringerer Absturzgefahr, aber weiterhin Quetschgefahr beim Wenden. Der Vertikal-Kommissionierer dagegen fährt mit der Plattform bis zum Mittel- oder Hochhub hoch, der Fahrer "greift" die Ware direkt aus dem Regal – das ermöglicht höhere Produktivität beim Picken, erfordert aber PSA gegen Absturz, sobald die Umwehrung geöffnet wird, und bedeutet eine deutlich erhöhte Gefährdungslage.',
  4:'Bei geschlossener Umwehrung (Türen/Schranken zu) ist der Fahrer geschützt wie hinter einem Geländer – akute Absturzgefahr entsteht erst, wenn die Umwehrung in der Höhe geöffnet wird, z.B. zum Greifen ins Regal. Grundsatz: Die geschlossene Umwehrung schützt bereits, dann ist PSA nicht zwingend – sobald sie aber geöffnet wird oder Hersteller bzw. Gefährdungsbeurteilung es fordern, wird die PSA gegen Absturz Pflicht. Sie muss vor jedem Arbeitsbeginn auf Beschädigungen geprüft werden; eine beschädigte oder abgelaufene PSA darf nicht verwendet werden. Goldene Regel: Muss die Umwehrung in der Höhe geöffnet werden, immer zuerst die PSA anlegen – nie ungesichert hinauslehnen!',
  5:'Die Sicht nach vorne ist oft durch vollgepackte Paletten versperrt – Spiegel und Kamera helfen, dürfen aber nie allein die Entscheidung ersetzen; bei vollgepickter Palette lieber rückwärts fahren für bessere Sicht, und die Geschwindigkeit den Sichtverhältnissen anpassen. Besondere Quetschgefahr besteht beim Einklemmen zwischen Kabine und Regalkonstruktion, vor allem bei Rückwärtsfahrt oder in Kurven – Hände und Füße müssen deshalb immer innerhalb der Kabinenkontur bleiben, niemals aus der Kabine lehnen während der Fahrt. Personenschutzeinrichtungen (Taster, Schranken) dürfen niemals überbrückt werden.',
  6:'Vor jedem Fahrtantritt ist eine tägliche Einsatzprüfung Pflicht: Bei der Sichtprüfung werden Hydraulik, Beleuchtung, Gabelzinken samt Aufhängung, Bereifung, Hubketten, die PSA gegen Absturz (Gurt, Anschlagmittel) sowie die Kabinenkontur (keine Schäden, Türen schließen) kontrolliert. Bei der Funktionsprüfung werden Lenkung, Warneinrichtung/Hupe, Hub- und Senkfunktion, Initialhub (falls vorhanden), Feststell- und Betriebsbremse, Personenschutzeinrichtungen (Schranken, Taster) sowie – ganz wichtig – Notablass und Abseilvorrichtung auf Bekanntheit geprüft.',
  7:'Sechs typische Gefahren beim Kommissionierstapler: Absturz aus der Plattform durch Öffnen der Kabinentür oder Herauslehnen (PSA gegen Absturz ist der einzige Schutz), Quetschen und Scheren beim Heranfahren an Regalkonstruktionen (Kabinenkontur immer einhalten), Stromausfall in der Höhe (deshalb beide Rettungswege – Notablass von unten und Abseilen – kennen und üben), zu geringe Batteriereichweite (niemals mit fast leerer Batterie losfahren), Überladung der Palette (regelmäßige Gewichtskontrolle beim Picken), und Fußgänger im Mischbereich (Blickkontakt aufnehmen, hupen, Fußgängern Priorität geben).',
  8:'Als Zusammenfassung die acht wichtigsten Regeln: PSA gegen Absturz anlegen, bevor die Umwehrung in der Höhe geöffnet wird; Hände und Füße immer innerhalb der Kabinenkontur halten; Traglastdiagramm vor jedem Einsatz prüfen; Geschwindigkeit dem Sichtfeld anpassen – bei vollen Paletten rückwärts fahren; beide Rettungswege kennen (Notablass von unten und Abseilen zur Selbstrettung); Batterie vor Schichtbeginn vollständig laden; Personenschutzeinrichtungen niemals überbrücken oder deaktivieren; und Schäden oder Defekte sofort melden statt weiterzuarbeiten.',
  9:'Diese drei Beispielfragen zeigen den Prüfungsstil: Wann muss die PSA gegen Absturz angelegt werden? Sobald die Umwehrung in der Höhe geöffnet werden muss – angelegt wird sie am Anschlagpunkt in der Kabine, bevor geöffnet wird. Welche Gefahr besteht für Gliedmaßen in der Höhe? Quetschgefahr zwischen Fahrkorb und Regal – Hände und Füße müssen immer innerhalb der Kabinenkontur bleiben. Und: Was tun bei einem Defekt in der Höhe? Ruhe bewahren, Kollegen alarmieren – meist kann eine zweite Person die Plattform über den Notablass von unten absenken; nur wenn das nicht funktioniert, seilt sich der Fahrer selbst ab.'
},
schmalgang:{
  2:'Im Schmalgang ist der Gang kaum breiter als das Gerät selbst – oft nur wenige Zentimeter Spielraum zu beiden Seiten, ein Wenden im Gang ist physikalisch unmöglich, Ein- und Ausfahrt sind nur an den Gangenden möglich. Das Gerät steuert deshalb im Gang nicht selbst, sondern wird zwangsgeführt – entweder mechanisch durch Führungsrollen an Schienen oder induktiv über einen Suchdraht im Boden. Während dieser Zwangsführung ist die Lenkung gesperrt! Ohne aktive Zwangsführung darf niemals in den Schmalgang eingefahren werden. Zusätzlich gibt es zwei Bauarten: Man-Down (Fahrer bleibt unten, nur die Gabel fährt hoch) und Man-Up (Fahrer fährt mit der Kabine zur Last hoch).',
  3:'Die Einfahrt in den Schmalgang läuft in vier Schritten: Erst langsame Annäherung mit Schrittgeschwindigkeit und Sicherstellen, dass der Gang frei ist (Personenschutz aktiv). Dann exaktes Ausrichten parallel zur Ganglängsachse – schon kleine Winkelabweichungen können zur Kollision mit Regalstützen führen. Danach die Zwangsführung einkoppeln und die Display-Anzeige "Führung aktiv" abwarten, erst dann weiterfahren (die Lenkung ist jetzt gesperrt). Und durchgehend gilt: Automatische Laserscanner stoppen das Gerät sofort bei Personenerkennung im Gang – den Gang darf man niemals betreten, während ein Schmalgangstapler darin arbeitet.',
  4:'Hubhöhen von 12 bis 18 Metern sind im Schmalgang keine Seltenheit – in dieser Höhe hat jede Bewegung drastische Auswirkungen auf die Standsicherheit des Gesamtsystems. Schwingungen des Mastes an der Spitze können mehrere Zentimeter betragen – das Beruhigen abwarten ist Pflicht, niemals in schwingendem Zustand einlagern. Besonders tückisch: Minimale Bodenunebenheiten im Millimeterbereich führen in 15 m Höhe zu gefährlichen Neigungen im Zentimeterbereich gegen das Regal – deshalb muss der Boden extrem eben sein, und das Traglastdiagramm am Gerät ist vor jedem Einsatz zu prüfen.',
  5:'Wird das Gerät in 12–18 m Höhe stromlos (durch Batterieausfall, Sicherungsauslösung oder mechanischen Defekt), sitzt der Fahrer fest – Vorbereitung darauf ist Pflicht. Der erste Rettungsweg ist der Notablass: Er befindet sich unten am Gerät und wird von einer zweiten Person bedient – ABER steckt die Last noch im Regalfach, ist der Notablass blockiert, denn ein Absenken würde Last oder Regal beschädigen; der Fahrer oben kann ihn nicht selbst auslösen. Geht der Notablass nicht, ist der zweite Rettungsweg das Abseilen zur Selbstrettung – das Seil wird vom Dach nach vorne über die Last hinweg geführt, nie über scharfe Kanten. Beide Rettungswege regelmäßig üben – die Abseilübung ist mindestens jährlich Pflicht (DGUV Regel 112-199).',
  6:'Sind bei einem Man-Up-Gerät alle Türen und Schranken der Kabinenumwehrung geschlossen, verhindert diese den Absturz bereits wie ein festes Geländer – in diesem Zustand ist die PSA gegen Absturz nicht zwingend erforderlich (kollektiver Schutz durch die Umwehrung geht laut ArbSchG §4 vor persönlicher Schutzausrüstung). Muss die Umwehrung in der Höhe geöffnet werden, z.B. zum Greifen ins Regal, entfällt der kollektive Schutz – dann ist die PSA gegen Absturz Pflicht, ebenso wenn Hersteller oder Gefährdungsbeurteilung es fordern. Goldene Regel: PSA anlegen, BEVOR die Umwehrung in der Höhe geöffnet wird – nie ungesichert hinauslehnen!',
  7:'Vor jedem Fahrtantritt ist eine tägliche Einsatzprüfung Pflicht: Bei der Sichtprüfung werden Hydraulik, Führungsrollen, Gabelzinken samt Aufhängung, Bereifung, die Kabine bzw. Personenschutzeinrichtung, das Kamerasystem (falls vorhanden) und die Zugänglichkeit sowie Bekanntheit des Notablass-Ventils kontrolliert. Bei der Funktionsprüfung werden Lenkung (vor dem Gang), die Zwangsführung (Einkoppeln testen), Warneinrichtung/Hupe, Hub- und Senkfunktion, Feststell- und Betriebsbremse, der Personenschutz-Scanner sowie die Display-Anzeigen auf Fehlermeldungen geprüft.',
  8:'Sechs typische Gefahren im Schmalganglager: Quetschgefahr im Regalgang, wenn Führungsrollen oder Radarme an Regalstützen hängenbleiben (Boden vor Einfahrt auf Hindernisse prüfen), das Herabfallen von Lasten aus großer Höhe bei Fehlbedienung (Schutzhelm ist Pflicht, Regalfachbelastung nie überschreiten), unbefugte Personen im Gang (absolute Sperrung während des Betriebs – den Personenschutz-Scanner zu deaktivieren ist lebensgefährlich und strafbar), Stromausfall in der Höhe (beide Rettungswege kennen und regelmäßig üben, nicht erst im Notfall lernen), extrem hohe Anforderungen an die Bodenbeschaffenheit, und Mastschwingungen nach dem Anhalten (vollständige Beruhigung abwarten, niemals in schwingendem Zustand einlagern).',
  9:'Als Zusammenfassung die acht wichtigsten Regeln: Ohne aktive Zwangsführung niemals in den Schmalgang einfahren; die Display-Anzeige "Führung aktiv" vor der Einfahrt abwarten; das Traglastdiagramm vor jedem Einsatz prüfen und die Hubhöhe beachten; Mastschwingungen vor dem Einlagern vollständig abwarten; den Boden im Regalgang vor Einfahrt auf Hindernisse prüfen; beide Rettungswege kennen (Notablass von unten und Abseilen zur Selbstrettung); im Hochregallagerbereich Schutzhelm tragen; und Schäden am Regal sofort melden und den Bereich sperren.',
  10:'Diese drei Beispielfragen zeigen den Prüfungsstil: Was muss der Fahrer beim Einfahren (Einschleusen) in den Schmalgang beachten? Das Fahrzeug gerade ausrichten, langsam einfahren und im Display prüfen, ob die Zwangsführung eingekoppelt hat – erst nach Bestätigung der Führung weiterfahren. Warum sind Bodenunebenheiten im Schmalganglager so gefährlich? Weil sich kleinste Neigungen durch die extreme Hubhöhe so stark verstärken, dass Gerät oder Last das Regal rammen können – in 15 m Höhe werden Millimeter zu Zentimetern. Und: Was tun, wenn der Schmalgangstapler in der Höhe stromlos wird? Ruhe bewahren, Kollegen alarmieren – erster Weg ist das Absenken durch eine zweite Person über den Notablass von unten, sofern die Last nicht im Regal verklemmt ist; ist der Notablass blockiert, seilt sich der Fahrer selbst ab.'
}
};

var ERKLAERUNG_PL={
schubmast:{
  2:'Stopień 1 (szkolenie ogólne) obejmuje tylko podstawy. Dla urządzeń specjalnych, takich jak wózek z wysuwanym masztem, prawnie wymagane jest szkolenie dodatkowe specyficzne dla danego typu urządzenia, ponieważ ma on całkowicie inne zachowanie podczas jazdy i podnoszenia niż zwykły wózek czołowy – z wysokościami podnoszenia do 13 m, zależną od konstrukcji pozycją siedzenia i ruchomym masztem. Podstawą jest DGUV Vorschrift 68 §7. Pracodawca może udzielić Panu/Pani pisemnego zlecenia jazdy wózkiem z wysuwanym masztem dopiero po pomyślnym ukończeniu tego Stopnia 2 – jazda bez zlecenia jest zabroniona.',
  3:'W wózku z wysuwanym masztem maszt wysuwa się do przodu w celu podjęcia ładunku ("Schubmast") i jest całkowicie wciągany na czas jazdy – umożliwia to składowanie w obrębie rozstawu kół i czyni wózek bardzo kompaktowym o krótkim rozstawie osi, idealnym do wąskich korytarzy roboczych od ok. 2,5 m szerokości. Pozycja siedzenia kierowcy jest zależna od konstrukcji – wzdłużna lub poprzeczna do kierunku jazdy – co oszczędza kark przy częstej jeździe w przód/w tył, ale wymaga innego podejścia do kierowania, ponieważ martwe pola widzenia leżą inaczej niż w klasycznym wózku.',
  4:'W wózku czołowym ładunek zwisa przed osią przednią i jest równoważony przez przeciwwagę zgodnie z prawem dźwigni – środek ciężkości ładunku leży poza trójkątem krawędzi przewrócenia. W wózku z wysuwanym masztem natomiast ładunek jest transportowany w obrębie rozstawu kół; przy wysuwaniu masztu środek ciężkości przesuwa się jednak bardzo daleko do przodu, przez co przy przeciążeniu powstaje niebezpieczeństwo przewrócenia do przodu. Złota zasada: nigdy nie jeździć ani nie kierować z wysuniętym masztem – maszt wolno poruszać tylko w całkowitym bezruchu.',
  5:'W zależności od urządzenia wózek z wysuwanym masztem skręca za pomocą kierowania 360° lub 180°, przy czym tył wychyla się bardzo szybko i daleko – dlatego szczególnie ważny jest odstęp bezpieczeństwa od regałów i osób, w korytarzu regałowym dozwolone są tylko minimalne ruchy kierownicy. Różni się także zachowanie hamowania: hamulce kół ładunkowych działają inaczej niż w wózku czołowym, często aktywne są też koła pod ramionami kół, a wilgoć lub śliskość znacząco zmieniają drogę hamowania. Przy wysoko podniesionym ładunku pomaga monitor kamery, ale nigdy nie zastępuje własnego spojrzenia.',
  6:'Przy pracach na dużych wysokościach do 13 m maszt fizycznie ugina się i drga – cierpliwe odczekanie na wygaśnięcie drgań jest obowiązkowe, nigdy nie składować ani nie wyjmować w stanie drgającym. Maksymalna nośność drastycznie maleje wraz ze wzrostem wysokości podnoszenia, dlatego przed każdym użyciem należy sprawdzić diagram nośności na urządzeniu i uwzględnić odstęp środka ciężkości ładunku. Systemy bezpieczeństwa, takie jak system kamer na widłach, prawidłowo zaprogramowany wybór wysokości podnoszenia i wskaźnik pozostałej nośności wspierają w tym, ale nie zastępują własnej uwagi.',
  7:'W magazynie wysokiego składowania grożą trzy typowe niebezpieczeństwa: niebezpieczeństwo zmiażdżenia w korytarzu regałowym przez przeszkody na podłodze, takie jak części palet lub resztki opakowań (sprawdzić podłoże przed wjazdem!), spadanie ładunków z dużej wysokości przy błędnej obsłudze (dlatego kask ochronny jest obowiązkowy, a obciążenie półki regałowej nigdy nie może być przekroczone), oraz szczególne wymagania dotyczące stanu podłoża – wózki z wysuwanym masztem potrzebują wyjątkowo równych, czystych podłóg, ponieważ najmniejsze nierówności w wysokości 10 m prowadzą do niebezpiecznych wahań masztu i ładunku.',
  8:'Przed każdym rozpoczęciem jazdy obowiązkowa jest codzienna kontrola przed użyciem: przy kontroli wzrokowej sprawdzane są hydraulika, oświetlenie, widły wraz z zawieszeniem, ogumienie, łańcuchy podnoszące i ewentualne pęknięcia elementów nośnych (np. masztu) oraz mechanizm wysuwu. Przy kontroli funkcjonalnej testowane są: kierowanie, urządzenie ostrzegawcze/klakson, urządzenie ochrony osób (Bluespot), urządzenia podnoszące wraz z wysuwem wideł, hamulec postojowy i roboczy oraz system kamer (jeśli jest dostępny).',
  9:'Podsumowując, osiem najważniejszych zasad: maszt wysuwać lub wciągać tylko w bezruchu, ładunek zawsze transportować nisko przy podłodze i z wciągniętym masztem, sprawdzać diagram nośności przed każdym użyciem, przy składowaniu odczekać na wygaśnięcie drgań masztu, sprawdzić podłoże w korytarzu regałowym pod kątem przeszkód przed wjazdem, korzystać z systemu kamer, ale zawsze dodatkowo kontrolować wzrokiem, w obszarze magazynu wysokiego składowania nosić kask ochronny, oraz natychmiast zgłaszać uszkodzenia regału i blokować obszar.'
},
kommissionier:{
  2:'Stopień 1 to tylko podstawa. Dla wózków kompletacyjnych prawnie wymagane jest szkolenie dodatkowe specyficzne dla urządzenia – szczególnie gdy kierowca jedzie razem z kabiną: przy pionowych wózkach kompletacyjnych kierowca opuszcza bezpieczne podłoże i unosi się z platformą w górę, co stwarza całkowicie inne zagrożenia niż zwykłe wózki widłowe. Podstawą jest DGUV Vorschrift 68 §7. Pisemne zlecenie jazdy wózkiem kompletacyjnym pracodawca może udzielić dopiero po pomyślnym ukończeniu tego Stopnia 2 – jazda bez zlecenia jest zabroniona.',
  3:'Istnieją dwa typy konstrukcji: wózek kompletacyjny poziomy pracuje na poziomie podłogi lub 1. poziomie regału, kierowca pozostaje przy tym na podłodze (często w trybie towarzyszącym lub ze stanowiska kierowcy) – dobrze nadaje się do niskich regałów, z mniejszym niebezpieczeństwem upadku, ale nadal z niebezpieczeństwem zmiażdżenia przy zawracaniu. Wózek kompletacyjny pionowy natomiast unosi się z platformą aż do średniego lub wysokiego poziomu podnoszenia, kierowca "sięga" po towar bezpośrednio z regału – umożliwia to wyższą produktywność przy kompletacji, ale wymaga środków ochrony indywidualnej przed upadkiem z wysokości, gdy tylko otwarta zostanie osłona, i oznacza wyraźnie podwyższone ryzyko.',
  4:'Przy zamkniętej osłonie (drzwi/bariery zamknięte) kierowca jest chroniony jak za barierką – ostre niebezpieczeństwo upadku powstaje dopiero wtedy, gdy osłona zostaje otwarta na wysokości, np. w celu sięgnięcia do regału. Zasada: zamknięta osłona już chroni, wtedy środki ochrony indywidualnej nie są bezwzględnie konieczne – ale gdy tylko zostanie otwarta lub wymaga tego producent bądź ocena ryzyka, środki ochrony przed upadkiem stają się obowiązkowe. Muszą być sprawdzane pod kątem uszkodzeń przed każdym rozpoczęciem pracy; uszkodzone lub przeterminowane środki ochrony nie mogą być używane. Złota zasada: jeśli osłona musi zostać otwarta na wysokości, zawsze najpierw założyć środki ochrony – nigdy nie wychylać się bez zabezpieczenia!',
  5:'Widoczność do przodu jest często zasłonięta przez w pełni załadowane palety – lusterka i kamera pomagają, ale nigdy nie mogą zastąpić samodzielnej decyzji; przy w pełni skompletowanej palecie lepiej jechać do tyłu dla lepszej widoczności, i dostosować prędkość do warunków widoczności. Szczególne niebezpieczeństwo zmiażdżenia istnieje przy zakleszczeniu między kabiną a konstrukcją regału, zwłaszcza przy jeździe do tyłu lub na zakrętach – ręce i stopy muszą dlatego zawsze pozostawać w obrysie kabiny, nigdy nie wychylać się z kabiny podczas jazdy. Urządzeń ochrony osób (przyciski, bariery) nigdy nie wolno omijać.',
  6:'Przed każdym rozpoczęciem jazdy obowiązkowa jest codzienna kontrola przed użyciem: przy kontroli wzrokowej sprawdzane są hydraulika, oświetlenie, widły wraz z zawieszeniem, ogumienie, łańcuchy podnoszące, środki ochrony przed upadkiem (pas, środki mocujące) oraz obrys kabiny (brak uszkodzeń, zamykanie drzwi). Przy kontroli funkcjonalnej testowane są: kierowanie, urządzenie ostrzegawcze/klakson, funkcja podnoszenia i opuszczania, podnoszenie wstępne (jeśli dostępne), hamulec postojowy i roboczy, urządzenia ochrony osób (bariery, przyciski) oraz – co bardzo ważne – znajomość awaryjnego opuszczania i urządzenia do zjazdu na linie.',
  7:'Sześć typowych niebezpieczeństw przy wózku kompletacyjnym: upadek z platformy przez otwarcie drzwi kabiny lub wychylenie się (środki ochrony przed upadkiem są jedyną ochroną), zmiażdżenie i ścięcie przy podjeżdżaniu do konstrukcji regałów (zawsze przestrzegać obrysu kabiny), zanik zasilania na wysokości (dlatego znać i ćwiczyć obie drogi ratunkowe – awaryjne opuszczanie od dołu i zjazd na linie), zbyt mały zasięg baterii (nigdy nie wyruszać z prawie rozładowaną baterią), przeciążenie palety (regularna kontrola wagi podczas kompletacji), oraz piesi w strefie mieszanej (nawiązać kontakt wzrokowy, zatrąbić, dać pierwszeństwo pieszym).',
  8:'Podsumowując, osiem najważniejszych zasad: zakładać środki ochrony przed upadkiem, zanim osłona zostanie otwarta na wysokości; ręce i stopy zawsze utrzymywać w obrysie kabiny; sprawdzać diagram nośności przed każdym użyciem; dostosować prędkość do pola widzenia – przy pełnych paletach jechać do tyłu; znać obie drogi ratunkowe (awaryjne opuszczanie od dołu i zjazd na linie do samoratowania); w pełni naładować baterię przed rozpoczęciem zmiany; nigdy nie omijać ani nie dezaktywować urządzeń ochrony osób; oraz natychmiast zgłaszać uszkodzenia lub usterki zamiast kontynuować pracę.',
  9:'Te trzy przykładowe pytania pokazują styl egzaminu: Kiedy trzeba założyć środki ochrony przed upadkiem? Gdy tylko osłona musi zostać otwarta na wysokości – zakłada się je w punkcie mocowania w kabinie, przed otwarciem. Jakie niebezpieczeństwo istnieje dla kończyn na wysokości? Niebezpieczeństwo zmiażdżenia między koszem jezdnym a regałem – ręce i stopy muszą zawsze pozostawać w obrysie kabiny. I: co robić w przypadku usterki na wysokości? Zachować spokój, zaalarmować kolegów – zwykle druga osoba może opuścić platformę za pomocą awaryjnego opuszczania od dołu; tylko gdy to nie działa, kierowca zjeżdża na linie samodzielnie.'
},
schmalgang:{
  2:'W wąskim korytarzu przejście jest ledwo szersze niż samo urządzenie – często tylko kilka centymetrów luzu po obu stronach, zawracanie w korytarzu jest fizycznie niemożliwe, wjazd i wyjazd możliwe są tylko na końcach korytarza. Urządzenie nie steruje się więc samo w korytarzu, lecz jest prowadzone przymusowo – mechanicznie za pomocą rolek prowadzących na szynach lub indukcyjnie przez przewód prowadzący w podłodze. Podczas tego prowadzenia przymusowego kierowanie jest zablokowane! Bez aktywnego prowadzenia przymusowego nigdy nie wolno wjeżdżać do wąskiego korytarza. Dodatkowo istnieją dwa typy konstrukcji: Man-Down (kierowca pozostaje na dole, tylko widły jadą w górę) i Man-Up (kierowca jedzie z kabiną w górę do ładunku).',
  3:'Wjazd do wąskiego korytarza przebiega w czterech krokach: najpierw powolne zbliżanie z prędkością kroku i upewnienie się, że korytarz jest wolny (ochrona osób aktywna). Następnie dokładne ustawienie równolegle do osi podłużnej korytarza – już małe odchylenia kątowe mogą prowadzić do kolizji ze słupami regałów. Potem sprzęganie prowadzenia przymusowego i odczekanie na wskaźnik na wyświetlaczu "prowadzenie aktywne", dopiero wtedy jechać dalej (kierowanie jest teraz zablokowane). I przez cały czas obowiązuje: automatyczne skanery laserowe natychmiast zatrzymują urządzenie przy wykryciu osoby w korytarzu – nigdy nie wolno wchodzić do korytarza, gdy pracuje w nim wózek do wąskich korytarzy.',
  4:'Wysokości podnoszenia od 12 do 18 metrów nie są rzadkością w wąskim korytarzu – na tej wysokości każdy ruch ma drastyczny wpływ na stateczność całego systemu. Drgania masztu na końcówce mogą wynosić kilka centymetrów – odczekanie na uspokojenie jest obowiązkowe, nigdy nie składować w stanie drgającym. Szczególnie podstępne: minimalne nierówności podłoża w zakresie milimetrów prowadzą na wysokości 15 m do niebezpiecznych nachyleń w zakresie centymetrów w kierunku regału – dlatego podłoże musi być wyjątkowo równe, a diagram nośności na urządzeniu należy sprawdzać przed każdym użyciem.',
  5:'Jeśli urządzenie na wysokości 12–18 m traci zasilanie (przez awarię baterii, zadziałanie bezpiecznika lub usterkę mechaniczną), kierowca utyka – przygotowanie na to jest obowiązkowe. Pierwszą drogą ratunkową jest awaryjne opuszczanie: znajduje się ono na dole urządzenia i jest obsługiwane przez drugą osobę – ALE jeśli ładunek tkwi jeszcze w gnieździe regału, awaryjne opuszczanie jest zablokowane, ponieważ opuszczenie uszkodziłoby ładunek lub regał; kierowca na górze nie może go uruchomić samodzielnie. Jeśli awaryjne opuszczanie nie działa, drugą drogą ratunkową jest zjazd na linie do samoratowania – lina jest prowadzona z dachu do przodu ponad ładunkiem, nigdy przez ostre krawędzie. Regularnie ćwiczyć obie drogi ratunkowe – ćwiczenie zjazdu na linie jest obowiązkowe co najmniej raz w roku (DGUV Regel 112-199).',
  6:'Jeśli przy urządzeniu typu Man-Up wszystkie drzwi i bariery osłony kabiny są zamknięte, zapobiega to upadkowi już jak solidna barierka – w tym stanie środki ochrony przed upadkiem nie są bezwzględnie konieczne (ochrona zbiorowa przez osłonę ma zgodnie z ArbSchG §4 pierwszeństwo przed ochroną indywidualną). Jeśli osłona musi zostać otwarta na wysokości, np. w celu sięgnięcia do regału, ochrona zbiorowa odpada – wtedy środki ochrony przed upadkiem są obowiązkowe, podobnie gdy wymaga tego producent lub ocena ryzyka. Złota zasada: zakładać środki ochrony PRZED otwarciem osłony na wysokości – nigdy nie wychylać się bez zabezpieczenia!',
  7:'Przed każdym rozpoczęciem jazdy obowiązkowa jest codzienna kontrola przed użyciem: przy kontroli wzrokowej sprawdzane są hydraulika, rolki prowadzące, widły wraz z zawieszeniem, ogumienie, kabina wzgl. urządzenie ochrony osób, system kamer (jeśli dostępny) oraz dostępność i znajomość zaworu awaryjnego opuszczania. Przy kontroli funkcjonalnej sprawdzane są: kierowanie (przed korytarzem), prowadzenie przymusowe (test sprzęgania), urządzenie ostrzegawcze/klakson, funkcja podnoszenia i opuszczania, hamulec postojowy i roboczy, skaner ochrony osób oraz wskazania na wyświetlaczu pod kątem komunikatów o błędach.',
  8:'Sześć typowych niebezpieczeństw w magazynie z wąskimi korytarzami: niebezpieczeństwo zmiażdżenia w korytarzu regałowym, gdy rolki prowadzące lub ramiona kół zaczepiają o słupy regałów (sprawdzić podłoże przed wjazdem pod kątem przeszkód), spadanie ładunków z dużej wysokości przy błędnej obsłudze (kask ochronny jest obowiązkowy, nigdy nie przekraczać obciążenia półki regałowej), nieupoważnione osoby w korytarzu (całkowita blokada podczas pracy – dezaktywacja skanera ochrony osób jest śmiertelnie niebezpieczna i karalna), zanik zasilania na wysokości (znać i regularnie ćwiczyć obie drogi ratunkowe, nie uczyć się dopiero w sytuacji awaryjnej), wyjątkowo wysokie wymagania dotyczące stanu podłoża, oraz drgania masztu po zatrzymaniu (odczekać na całkowite uspokojenie, nigdy nie składować w stanie drgającym).',
  9:'Podsumowując, osiem najważniejszych zasad: bez aktywnego prowadzenia przymusowego nigdy nie wjeżdżać do wąskiego korytarza; odczekać na wskaźnik na wyświetlaczu "prowadzenie aktywne" przed wjazdem; sprawdzać diagram nośności przed każdym użyciem i uwzględniać wysokość podnoszenia; przed składowaniem całkowicie odczekać na wygaśnięcie drgań masztu; sprawdzić podłoże w korytarzu regałowym pod kątem przeszkód przed wjazdem; znać obie drogi ratunkowe (awaryjne opuszczanie od dołu i zjazd na linie do samoratowania); w obszarze magazynu wysokiego składowania nosić kask ochronny; oraz natychmiast zgłaszać uszkodzenia regału i blokować obszar.',
  10:'Te trzy przykładowe pytania pokazują styl egzaminu: Co musi uwzględnić kierowca przy wjeździe (śluzowaniu) do wąskiego korytarza? Ustawić pojazd prosto, wjeżdżać powoli i sprawdzić na wyświetlaczu, czy prowadzenie przymusowe się sprzęgło – jechać dalej dopiero po potwierdzeniu prowadzenia. Dlaczego nierówności podłoża są tak niebezpieczne w magazynie z wąskimi korytarzami? Ponieważ najmniejsze nachylenia wzmacniają się tak silnie przez ekstremalną wysokość podnoszenia, że urządzenie lub ładunek mogą uderzyć w regał – na wysokości 15 m milimetry stają się centymetrami. I: co robić, gdy wózek do wąskich korytarzy traci zasilanie na wysokości? Zachować spokój, zaalarmować kolegów – pierwszym sposobem jest opuszczenie przez drugą osobę za pomocą awaryjnego opuszczania od dołu, o ile ładunek nie jest zakleszczony w regale; jeśli awaryjne opuszczanie jest zablokowane, kierowca zjeżdża na linie samodzielnie.'
}
};

var ERKLAERUNG_RO={
schubmast:{
  2:'Nivelul 1 (formarea generală) acoperă doar bazele. Pentru echipamente speciale precum transpaletul cu catarg retractabil, o formare suplimentară specifică tipului de echipament este prevăzută legal, deoarece acesta are un comportament de conducere și ridicare complet diferit față de un stivuitor frontal normal – cu înălțimi de ridicare de până la 13 m, poziție a scaunului dependentă de construcție și catargul mobil. Baza este DGUV Vorschrift 68 §7. Angajatorul dumneavoastră vă poate acorda dispoziția scrisă de conducere pentru transpaletul cu catarg retractabil abia după absolvirea cu succes a acestui Nivel 2 – conducerea fără dispoziție este interzisă.',
  3:'La transpaletul cu catarg retractabil, catargul se extinde spre înainte pentru preluarea sarcinii ("Schubmast") și este complet retras pentru deplasare – aceasta permite depozitarea în interiorul ampatamentului și face stivuitorul extrem de compact, cu ampatament foarte scurt, ideal pentru culoare de lucru înguste de la aproximativ 2,5 m lățime. Poziția scaunului șoferului este, în funcție de construcție, longitudinală sau transversală față de direcția de deplasare – aceasta menajează gâtul la conducerea frecventă înainte/înapoi, dar necesită o regândire la direcție, deoarece unghiurile moarte sunt situate diferit față de stivuitorul clasic.',
  4:'La stivuitorul frontal, sarcina atârnă în fața axei față și este echilibrată prin contragreutate conform legii pârghiei – centrul de greutate al sarcinii se află în afara triunghiului muchiilor de răsturnare. La transpaletul cu catarg retractabil, în schimb, sarcina este transportată în interiorul ampatamentului; la extinderea catargului însă, centrul de greutate se deplasează extrem de mult spre înainte, ceea ce creează pericol de răsturnare spre înainte în caz de supraîncărcare. Regula de aur: nu conduceți și nu dirijați niciodată cu catargul extins – catargul poate fi mișcat doar în staționare absolută.',
  5:'În funcție de echipament, transpaletul cu catarg retractabil se dirijează cu direcție de 360° sau 180°, partea din spate oscilând extrem de rapid și de departe – de aceea distanța de siguranță față de rafturi și persoane este deosebit de importantă, în culoarul de raft sunt permise doar mișcări minime de direcție. Diferă și comportamentul de frânare: frânele roților de sarcină acționează diferit față de stivuitorul frontal, adesea sunt active și roți sub brațele roților, iar umezeala sau poleiul modifică semnificativ distanța de frânare. La sarcina ridicată sus, un monitor cu cameră ajută, dar nu înlocuiește niciodată propria privire.',
  6:'La lucrări la înălțimi mari de până la 13 m, catargul se îndoaie și oscilează fizic – răbdarea de a aștepta oscilația este obligatorie, nu depozitați și nu scoateți niciodată în stare oscilantă. Capacitatea maximă de încărcare scade drastic odată cu creșterea înălțimii de ridicare, de aceea diagrama de capacitate de încărcare de pe echipament trebuie verificată înainte de fiecare utilizare, iar distanța centrului de greutate al sarcinii trebuie respectată. Sistemele de siguranță precum sistemul de cameră de la furci, o preselecție corect programată a înălțimii de ridicare și afișajul capacității reziduale de încărcare ajută la aceasta, dar nu înlocuiesc propria atenție.',
  7:'În depozitul cu rafturi înalte există trei pericole tipice: pericol de strivire în culoarul de raft prin obstacole pe sol, precum părți de paleți sau resturi de ambalaj (verificați solul înainte de intrare!), căderea sarcinilor de la înălțime mare în caz de operare greșită (de aceea casca de protecție este obligatorie, iar sarcina compartimentului de raft nu trebuie niciodată depășită), și cerințe speciale privind calitatea solului – transpaletele cu catarg retractabil au nevoie de podele extrem de plane, curate, deoarece cele mai mici denivelări la 10 m înălțime duc la oscilații periculoase ale catargului și sarcinii.',
  8:'Înainte de fiecare începere a conducerii este obligatoriu un control zilnic înainte de utilizare: la controlul vizual se verifică hidraulica, iluminarea, furcile împreună cu suspensia, anvelopele, lanțurile de ridicare și eventuale fisuri la părțile portante (de ex. catargul), precum și mecanismul de extindere. La controlul funcțional se testează direcția, dispozitivul de avertizare/claxonul, dispozitivul de protecție a persoanelor (Bluespot), dispozitivele de ridicare împreună cu extinderea furcilor, frâna de parcare și de serviciu, precum și sistemul de cameră (dacă există).',
  9:'Ca rezumat, cele opt reguli cele mai importante: extindeți sau retrageți catargul doar în staționare, transportați sarcina întotdeauna aproape de sol și cu catargul retras, verificați diagrama de capacitate de încărcare înainte de fiecare utilizare, la depozitare așteptați oscilația catargului, verificați solul din culoarul de raft pentru obstacole înainte de intrare, folosiți sistemul de cameră dar controlați suplimentar întotdeauna cu ochii, purtați cască de protecție în zona depozitului cu rafturi înalte, și raportați imediat deteriorările la raft și blocați zona.'
},
kommissionier:{
  2:'Nivelul 1 este doar baza. Pentru stivuitoarele de comisionare este prevăzută legal o formare suplimentară specifică echipamentului – mai ales atunci când șoferul se deplasează împreună cu cabina: la stivuitoarele de comisionare verticale, șoferul părăsește solul sigur și se ridică cu platforma în înălțime, ceea ce generează pericole complet diferite față de mijloacele de transport intern normale. Baza este DGUV Vorschrift 68 §7. Dispoziția scrisă de conducere pentru stivuitorul de comisionare poate fi acordată de angajatorul dumneavoastră abia după absolvirea cu succes a acestui Nivel 2 – conducerea fără dispoziție este interzisă.',
  3:'Există două tipuri de construcție: stivuitorul de comisionare orizontal lucrează la nivelul solului sau la primul nivel de raft, șoferul rămânând pe sol (adesea în regim de însoțitor sau de post fix) – bine adecvat pentru rafturi joase, cu pericol de cădere mai redus, dar totuși cu pericol de strivire la întoarcere. Stivuitorul de comisionare vertical, în schimb, se ridică cu platforma până la înălțimea medie sau mare de ridicare, șoferul "prinde" marfa direct din raft – aceasta permite o productivitate mai mare la comisionare, dar necesită EIP împotriva căderii de îndată ce balustrada este deschisă, și înseamnă un nivel de risc semnificativ crescut.',
  4:'La balustrada închisă (uși/bariere închise), șoferul este protejat ca în spatele unei balustrade – pericolul acut de cădere apare abia atunci când balustrada este deschisă la înălțime, de ex. pentru a prinde din raft. Principiu: balustrada închisă protejează deja, atunci EIP nu este obligatoriu – dar de îndată ce este deschisă sau producătorul respectiv evaluarea riscului o cer, EIP împotriva căderii devine obligatoriu. Trebuie verificat pentru deteriorări înainte de fiecare început de lucru; un EIP deteriorat sau expirat nu are voie să fie folosit. Regula de aur: dacă balustrada trebuie deschisă la înălțime, întotdeauna mai întâi puneți EIP – nu vă aplecați niciodată neasigurat!',
  5:'Vizibilitatea spre înainte este adesea blocată de paleți încărcați complet – oglinzile și camera ajută, dar nu pot niciodată înlocui singure decizia; la o paletă complet comisionată, este mai bine să conduceți cu spatele pentru vizibilitate mai bună, și să adaptați viteza la condițiile de vizibilitate. Există un pericol special de strivire la prinderea între cabină și construcția raftului, mai ales la deplasarea cu spatele sau în curbe – mâinile și picioarele trebuie deci să rămână întotdeauna în interiorul conturului cabinei, nu vă aplecați niciodată din cabină în timpul deplasării. Dispozitivele de protecție a persoanelor (butoane, bariere) nu trebuie niciodată ocolite.',
  6:'Înainte de fiecare începere a conducerii este obligatoriu un control zilnic înainte de utilizare: la controlul vizual se verifică hidraulica, iluminarea, furcile împreună cu suspensia, anvelopele, lanțurile de ridicare, EIP împotriva căderii (centura, mijloacele de ancorare), precum și conturul cabinei (fără deteriorări, închiderea ușilor). La controlul funcțional se testează direcția, dispozitivul de avertizare/claxonul, funcția de ridicare și coborâre, ridicarea inițială (dacă există), frâna de parcare și de serviciu, dispozitivele de protecție a persoanelor (bariere, butoane), precum – foarte important – cunoașterea coborârii de urgență și a dispozitivului de coborâre pe frânghie.',
  7:'Șase pericole tipice la stivuitorul de comisionare: cădere de pe platformă prin deschiderea ușii cabinei sau aplecare (EIP împotriva căderii este singura protecție), strivire și forfecare la apropierea de construcțiile de raft (respectați întotdeauna conturul cabinei), întreruperea curentului la înălțime (de aceea cunoașteți și exersați ambele căi de salvare – coborârea de urgență de jos și coborârea pe frânghie), autonomie insuficientă a bateriei (nu porniți niciodată cu bateria aproape descărcată), supraîncărcarea paletei (control regulat al greutății la comisionare), și pietoni în zona mixtă (stabiliți contact vizual, claxonați, dați prioritate pietonilor).',
  8:'Ca rezumat, cele opt reguli cele mai importante: puneți EIP împotriva căderii înainte ca balustrada să fie deschisă la înălțime; țineți întotdeauna mâinile și picioarele în interiorul conturului cabinei; verificați diagrama de capacitate de încărcare înainte de fiecare utilizare; adaptați viteza la câmpul vizual – la paleți plini conduceți cu spatele; cunoașteți ambele căi de salvare (coborârea de urgență de jos și coborârea pe frânghie pentru autosalvare); încărcați complet bateria înainte de începerea schimbului; nu ocoliți sau dezactivați niciodată dispozitivele de protecție a persoanelor; și raportați imediat deteriorările sau defecțiunile în loc să continuați lucrul.',
  9:'Aceste trei întrebări exemplu arată stilul examenului: Când trebuie pus EIP împotriva căderii? De îndată ce balustrada trebuie deschisă la înălțime – se pune la punctul de ancorare din cabină, înainte de deschidere. Ce pericol există pentru membre la înălțime? Pericol de strivire între coșul de deplasare și raft – mâinile și picioarele trebuie să rămână întotdeauna în interiorul conturului cabinei. Și: ce trebuie făcut în caz de defecțiune la înălțime? Păstrați calmul, alertați colegii – de obicei o a doua persoană poate coborî platforma prin coborârea de urgență de jos; doar dacă aceasta nu funcționează, șoferul coboară singur pe frânghie.'
},
schmalgang:{
  2:'În culoarul îngust, culoarul este abia mai lat decât echipamentul însuși – adesea doar câțiva centimetri spațiu liber pe ambele părți, o întoarcere în culoar este fizic imposibilă, intrarea și ieșirea sunt posibile doar la capetele culoarului. Echipamentul nu se dirijează deci singur în culoar, ci este ghidat forțat – fie mecanic prin role de ghidare pe șine, fie inductiv printr-un fir de căutare în sol. În timpul acestei ghidări forțate, direcția este blocată! Fără ghidare forțată activă nu se intră niciodată în culoarul îngust. Suplimentar există două tipuri de construcție: Man-Down (șoferul rămâne jos, doar furca urcă) și Man-Up (șoferul se ridică cu cabina până la sarcină).',
  3:'Intrarea în culoarul îngust decurge în patru pași: mai întâi apropiere lentă cu viteza pasului și asigurarea că culoarul este liber (protecția persoanelor activă). Apoi alinierea exactă paralelă cu axa longitudinală a culoarului – deja mici abateri unghiulare pot duce la coliziune cu stâlpii de raft. Apoi cuplarea ghidării forțate și așteptarea indicației pe afișaj "ghidare activă", abia apoi continuați (direcția este acum blocată). Și, în permanență, se aplică: scanerele laser automate opresc imediat echipamentul la detectarea unei persoane în culoar – nu intrați niciodată în culoar în timp ce un stivuitor pentru culoare înguste lucrează în el.',
  4:'Înălțimile de ridicare de la 12 la 18 metri nu sunt rare în culoarul îngust – la această înălțime, fiecare mișcare are efecte drastice asupra stabilității întregului sistem. Oscilațiile catargului la vârf pot atinge mai mulți centimetri – așteptarea liniștirii este obligatorie, nu depozitați niciodată în stare oscilantă. Deosebit de insidios: denivelări minime ale solului în domeniul milimetrilor duc la 15 m înălțime la înclinări periculoase în domeniul centimetrilor spre raft – de aceea solul trebuie să fie extrem de plan, iar diagrama de capacitate de încărcare de pe echipament trebuie verificată înainte de fiecare utilizare.',
  5:'Dacă echipamentul rămâne fără curent la 12–18 m înălțime (prin defect de baterie, declanșarea siguranței sau defect mecanic), șoferul rămâne blocat – pregătirea pentru aceasta este obligatorie. Prima cale de salvare este coborârea de urgență: aceasta se află jos, la echipament, și este acționată de o a doua persoană – DAR dacă sarcina este încă în compartimentul de raft, coborârea de urgență este blocată, deoarece o coborâre ar deteriora sarcina sau raftul; șoferul de sus nu o poate declanșa singur. Dacă coborârea de urgență nu funcționează, a doua cale de salvare este coborârea pe frânghie pentru autosalvare – frânghia este ghidată de pe acoperiș spre înainte peste sarcină, niciodată peste muchii ascuțite. Exersați regulat ambele căi de salvare – exercițiul de coborâre pe frânghie este obligatoriu cel puțin anual (DGUV Regel 112-199).',
  6:'Dacă la un echipament Man-Up toate ușile și barierele balustradei cabinei sunt închise, aceasta previne deja căderea ca o balustradă solidă – în această stare, EIP împotriva căderii nu este obligatoriu (protecția colectivă prin balustradă are, conform ArbSchG §4, prioritate față de echipamentul de protecție individuală). Dacă balustrada trebuie deschisă la înălțime, de ex. pentru a prinde din raft, protecția colectivă dispare – atunci EIP împotriva căderii este obligatoriu, la fel dacă producătorul sau evaluarea riscului o cer. Regula de aur: puneți EIP ÎNAINTE ca balustrada să fie deschisă la înălțime – nu vă aplecați niciodată neasigurat!',
  7:'Înainte de fiecare începere a conducerii este obligatoriu un control zilnic înainte de utilizare: la controlul vizual se verifică hidraulica, rolele de ghidare, furcile împreună cu suspensia, anvelopele, cabina respectiv dispozitivul de protecție a persoanelor, sistemul de cameră (dacă există) și accesibilitatea, precum și cunoașterea supapei de coborâre de urgență. La controlul funcțional se verifică direcția (înainte de culoar), ghidarea forțată (testarea cuplării), dispozitivul de avertizare/claxonul, funcția de ridicare și coborâre, frâna de parcare și de serviciu, scanerul de protecție a persoanelor, precum și indicațiile de pe afișaj pentru mesaje de eroare.',
  8:'Șase pericole tipice în depozitul cu culoare înguste: pericol de strivire în culoarul de raft, când rolele de ghidare sau brațele roților se agață de stâlpii de raft (verificați solul pentru obstacole înainte de intrare), căderea sarcinilor de la înălțime mare în caz de operare greșită (casca de protecție este obligatorie, nu depășiți niciodată sarcina compartimentului de raft), persoane neautorizate în culoar (blocare absolută în timpul funcționării – dezactivarea scanerului de protecție a persoanelor este mortal de periculoasă și pedepsibilă), întreruperea curentului la înălțime (cunoașteți și exersați regulat ambele căi de salvare, nu învățați abia în situație de urgență), cerințe extrem de ridicate privind calitatea solului, și oscilații ale catargului după oprire (așteptați liniștirea completă, nu depozitați niciodată în stare oscilantă).',
  9:'Ca rezumat, cele opt reguli cele mai importante: fără ghidare forțată activă, nu intrați niciodată în culoarul îngust; așteptați indicația pe afișaj "ghidare activă" înainte de intrare; verificați diagrama de capacitate de încărcare înainte de fiecare utilizare și respectați înălțimea de ridicare; așteptați complet oscilațiile catargului înainte de depozitare; verificați solul din culoarul de raft pentru obstacole înainte de intrare; cunoașteți ambele căi de salvare (coborârea de urgență de jos și coborârea pe frânghie pentru autosalvare); purtați cască de protecție în zona depozitului cu rafturi înalte; și raportați imediat deteriorările la raft și blocați zona.',
  10:'Aceste trei întrebări exemplu arată stilul examenului: Ce trebuie să respecte șoferul la intrarea (ecluzarea) în culoarul îngust? Aliniați vehiculul drept, intrați încet și verificați pe afișaj dacă ghidarea forțată s-a cuplat – continuați abia după confirmarea ghidării. De ce sunt denivelările solului atât de periculoase în depozitul cu culoare înguste? Deoarece cele mai mici înclinări se amplifică atât de puternic prin înălțimea extremă de ridicare, încât echipamentul sau sarcina pot lovi raftul – la 15 m înălțime, milimetrii devin centimetri. Și: ce trebuie făcut dacă stivuitorul pentru culoare înguste rămâne fără curent la înălțime? Păstrați calmul, alertați colegii – prima cale este coborârea printr-o a doua persoană prin coborârea de urgență de jos, atât timp cât sarcina nu este blocată în raft; dacă coborârea de urgență este blocată, șoferul coboară singur pe frânghie.'
}
};

var ERKLAERUNG_SQ={
schubmast:{
  2:'Niveli 1 (trajnimi i përgjithshëm) mbulon vetëm bazat. Për pajisje speciale si stivuese me katarge tërhequr, kërkohet ligjërisht një trajnim shtesë specifik për këtë lloj pajisjeje, sepse ka sjellje krejtësisht të ndryshme drejtimi dhe ngritjeje nga një stivuese e zakonshme ballore – me lartësi ngritjeje deri në 13 m, pozicion sedie sipas konstruksionit dhe katarg të lëvizshëm. Baza është DGUV Vorschrift 68 §7. Punëdhënësi juaj mund t\'ju japë urdhrin me shkrim të drejtimit për stivuesen me katarge tërhequr vetëm pas përfundimit me sukses të këtij Niveli 2 – drejtimi pa urdhër është i ndaluar.',
  3:'Te stivuesja me katarge tërhequr, katargu shtyhet përpara për marrjen e ngarkesës ("Schubmast") dhe tërhiqet plotësisht për lëvizje – kjo mundëson magazinimin brenda gjatësisë së boshtit dhe e bën stivuesen jashtëzakonisht kompakte me bazë të shkurtër rrotash, ideale për korridore pune të ngushta nga rreth 2,5 m gjerësi. Pozicioni i sedies së shoferit është, sipas konstruksionit, gjatësor ose tërthor ndaj drejtimit të lëvizjes – kjo kursen qafën gjatë lëvizjes së shpeshtë përpara/prapa, por kërkon një rimendim gjatë drejtimit, sepse zonat e verbra ndodhen ndryshe nga stivuesja klasike.',
  4:'Te stivuesja ballore, ngarkesa varet përpara boshtit të përparmë dhe balancohet nga kundërpesha sipas ligjit të levës – qendra e rëndesës së ngarkesës ndodhet jashtë trekëndëshit të skajeve të përmbysjes. Te stivuesja me katarge tërhequr, në të kundërt, ngarkesa transportohet brenda gjatësisë së boshtit; kur katargu shtyhet, qendra e rëndesës lëviz shumë larg përpara, duke krijuar rrezik përmbysjeje përpara në rast mbingarkese. Rregulli i artë: mos drejtoni dhe mos kthehuni kurrë me katargun të shtyrë – katargu mund të lëvizet vetëm në ndalim absolut.',
  5:'Sipas pajisjes, stivuesja me katarge tërhequr kthehet me drejtim 360° ose 180°, ku pjesa e pasme lëviz jashtëzakonisht shpejt dhe larg – prandaj distanca e sigurisë nga raftet dhe personat është veçanërisht e rëndësishme, në korridorin e rafteve lejohen vetëm lëvizje minimale të timonit. Ndryshon edhe sjellja e frenimit: frenat e rrotave të ngarkesës veprojnë ndryshe nga stivuesja ballore, shpesh janë aktive edhe rrota nën krahët e rrotave, dhe lagështia ose rrëshqitshmëria ndryshojnë ndjeshëm distancën e frenimit. Te ngarkesa e ngritur lart, një monitor kamere ndihmon, por nuk zëvendëson kurrë shikimin tuaj.',
  6:'Gjatë punës në lartësi të mëdha deri në 13 m, katargu përkulet dhe lëkundet fizikisht – durimi për të pritur lëkundjen është i detyrueshëm, mos magazinoni dhe mos nxirrni kurrë në gjendje lëkundjeje. Kapaciteti maksimal mbajtës zvogëlohet drastikisht me rritjen e lartësisë së ngritjes, prandaj diagrami i kapacitetit mbajtës në pajisje duhet kontrolluar para çdo përdorimi dhe duhet respektuar distanca e qendrës së rëndesës së ngarkesës. Sistemet e sigurisë si sistemi i kamerës te dhëmbët, një parazgjedhje e programuar saktë e lartësisë së ngritjes dhe treguesi i kapacitetit mbajtës të mbetur ndihmojnë në këtë, por nuk zëvendësojnë vëmendjen tuaj.',
  7:'Në magazinën me rafte të larta ekzistojnë tri rreziqe tipike: rrezik shtypjeje në korridorin e rafteve nga pengesa në dysheme si pjesë paletash ose mbetje ambalazhi (kontrolloni dyshemenë para hyrjes!), rënia e ngarkesave nga lartësi e madhe në rast keqpërdorimi (prandaj kaska mbrojtëse është e detyrueshme dhe ngarkesa e sektorit të raftit nuk duhet tejkaluar kurrë), dhe kërkesa të veçanta për gjendjen e dyshemesë – stivueset me katarge tërhequr kanë nevojë për dysheme jashtëzakonisht të rrafshta dhe të pastra, sepse pabarazitë më të vogla në lartësinë 10 m çojnë në lëkundje të rrezikshme të katargut dhe ngarkesës.',
  8:'Para çdo nisjeje është i detyrueshëm një kontroll ditor para përdorimit: në kontrollin vizual kontrollohen hidraulika, ndriçimi, dhëmbët me varësit e tyre, gomat, zinxhirët e ngritjes dhe çarje të mundshme në pjesët mbajtëse (p.sh. katargu) si dhe mekanizmi i shtyrjes. Në kontrollin funksional testohen timoni, pajisja paralajmëruese/boria, pajisja mbrojtëse e personave (Bluespot), pajisjet ngritëse me shtyrjen e dhëmbëve, frena e parkimit dhe e punës, si dhe sistemi i kamerës (nëse ekziston).',
  9:'Si përmbledhje, tetë rregullat më të rëndësishme: shtyni ose tërhiqni katargun vetëm në ndalim, transportoni ngarkesën gjithmonë afër tokës dhe me katargun të tërhequr, kontrolloni diagramin e kapacitetit mbajtës para çdo përdorimi, gjatë magazinimit prisni lëkundjen e katargut, kontrolloni dyshemenë në korridorin e rafteve për pengesa para hyrjes, përdorni sistemin e kamerës por gjithmonë kontrolloni shtesë me sy, mbani kaskë mbrojtëse në zonën e magazinës me rafte të larta, dhe raportoni menjëherë dëmtimet në raft dhe bllokoni zonën.'
},
kommissionier:{
  2:'Niveli 1 është vetëm baza. Për stivueset e komisionit kërkohet ligjërisht një trajnim shtesë specifik për pajisjen – sidomos kur shoferi lëviz bashkë me kabinën: te stivueset e komisionit vertikale, shoferi largohet nga toka e sigurt dhe ngrihet me platformën në lartësi, gjë që krijon rreziqe krejtësisht të ndryshme nga stivueset normale. Baza është DGUV Vorschrift 68 §7. Urdhrin me shkrim të drejtimit për stivuesen e komisionit mund ta japë punëdhënësi juaj vetëm pas përfundimit me sukses të këtij Niveli 2 – drejtimi pa urdhër është i ndaluar.',
  3:'Ka dy tipe konstruksioni: stivuesja e komisionit horizontale punon në nivelin e dyshemesë ose nivelin e parë të raftit, shoferi mbetet në dysheme (shpesh në regjim shoqërues ose me vend fiks) – e përshtatshme për rafte të ulëta, me rrezik më të vogël rënieje, por ende me rrezik shtypjeje gjatë kthimit. Stivuesja e komisionit vertikale, në të kundërt, ngrihet me platformën deri në lartësi mesatare ose të lartë, shoferi "kap" mallin drejtpërdrejt nga rafti – kjo mundëson produktivitet më të lartë në komisionim, por kërkon PMV kundër rënies sapo hapet rrethimi, dhe nënkupton një nivel dukshëm më të lartë rreziku.',
  4:'Me rrethim të mbyllur (dyer/pengesa të mbyllura), shoferi është i mbrojtur si pas një parmaku – rreziku akut i rënies lind vetëm kur rrethimi hapet në lartësi, p.sh. për të kapur nga rafti. Parimi: rrethimi i mbyllur mbron tashmë, atëherë PMV nuk është i detyrueshëm – por sapo hapet ose e kërkon prodhuesi apo vlerësimi i rrezikut, PMV kundër rënies bëhet i detyrueshëm. Duhet kontrolluar për dëmtime para fillimit të çdo pune; një PMV i dëmtuar ose i skaduar nuk duhet përdorur. Rregulli i artë: nëse rrethimi duhet hapur në lartësi, gjithmonë vishni së pari PMV-në – mos u përkulni kurrë i pasiguruar!',
  5:'Shikueshmëria përpara shpesh bllokohet nga paleta të mbushura plot – pasqyrat dhe kamera ndihmojnë, por nuk mund të zëvendësojnë kurrë vetëm vendimin; te paleta e komisionuar plotësisht, më mirë lëvizni prapa për shikueshmëri më të mirë, dhe përshtatni shpejtësinë me kushtet e shikueshmërisë. Rrezik i veçantë shtypjeje ekziston kur ngeceni mes kabinës dhe konstruksionit të raftit, sidomos gjatë lëvizjes prapa ose në kthesa – duart dhe këmbët duhet prandaj të mbeten gjithmonë brenda konturit të kabinës, mos u përkulni kurrë jashtë kabinës gjatë lëvizjes. Pajisjet mbrojtëse të personave (butona, pengesa) nuk duhet kurrë të anashkalohen.',
  6:'Para çdo nisjeje është i detyrueshëm një kontroll ditor para përdorimit: në kontrollin vizual kontrollohen hidraulika, ndriçimi, dhëmbët me varësit e tyre, gomat, zinxhirët e ngritjes, PMV kundër rënies (rripi, mjetet e ankorimit) si dhe konturi i kabinës (pa dëmtime, mbyllja e dyerve). Në kontrollin funksional testohen timoni, pajisja paralajmëruese/boria, funksioni i ngritjes dhe uljes, ngritja fillestare (nëse ekziston), frena e parkimit dhe e punës, pajisjet mbrojtëse të personave (pengesa, butona), si dhe – shumë e rëndësishme – njohja e uljes së emergjencës dhe pajisjes së zbritjes me litar.',
  7:'Gjashtë rreziqe tipike te stivuesja e komisionit: rënie nga platforma përmes hapjes së derës së kabinës ose përkuljes jashtë (PMV kundër rënies është mbrojtja e vetme), shtypje dhe prerje gjatë afrimit te konstruksionet e rafteve (respektoni gjithmonë konturin e kabinës), ndërprerje rryme në lartësi (prandaj njihni dhe ushtroni të dyja rrugët e shpëtimit – uljen e emergjencës nga poshtë dhe zbritjen me litar), autonomi e pamjaftueshme baterie (mos u nisni kurrë me baterinë pothuajse bosh), mbingarkesa e paletës (kontroll i rregullt i peshës gjatë komisionimit), dhe këmbësorë në zonën e përzier (vendosni kontakt vizual, bini bori, jepni përparësi këmbësorëve).',
  8:'Si përmbledhje, tetë rregullat më të rëndësishme: vishni PMV kundër rënies para se rrethimi të hapet në lartësi; mbani gjithmonë duart dhe këmbët brenda konturit të kabinës; kontrolloni diagramin e kapacitetit mbajtës para çdo përdorimi; përshtatni shpejtësinë me fushëpamjen – te paletat plot lëvizni prapa; njihni të dyja rrugët e shpëtimit (uljen e emergjencës nga poshtë dhe zbritjen me litar për vetëshpëtim); ngarkoni plotësisht baterinë para fillimit të turnit; mos anashkaloni ose çaktivizoni kurrë pajisjet mbrojtëse të personave; dhe raportoni menjëherë dëmtimet ose defektet në vend që të vazhdoni punën.',
  9:'Këto tri pyetje shembull tregojnë stilin e provimit: Kur duhet vënë PMV kundër rënies? Sapo rrethimi duhet hapur në lartësi – vihet në pikën e ankorimit në kabinë, para hapjes. Çfarë rreziku ekziston për gjymtyrët në lartësi? Rrezik shtypjeje mes shportës lëvizëse dhe raftit – duart dhe këmbët duhet të mbeten gjithmonë brenda konturit të kabinës. Dhe: çfarë duhet bërë në rast defekti në lartësi? Ruani qetësinë, njoftoni kolegët – zakonisht një person i dytë mund ta ulë platformën përmes uljes së emergjencës nga poshtë; vetëm nëse kjo nuk funksionon, shoferi zbret vetë me litar.'
},
schmalgang:{
  2:'Në korridorin e ngushtë, kalimi është mezi më i gjerë se vetë pajisja – shpesh vetëm disa centimetra hapësirë në të dyja anët, kthimi në korridor është fizikisht i pamundur, hyrja dhe dalja janë të mundshme vetëm në skajet e korridorit. Pajisja pra nuk drejtohet vetë në korridor, por udhëhiqet me detyrim – ose mekanikisht përmes rulave udhëzues në shina, ose me induksion përmes një teli kërkimi në dysheme. Gjatë kësaj udhëheqjeje me detyrim, timoni është i bllokuar! Pa udhëheqje aktive me detyrim, nuk duhet hyrë kurrë në korridorin e ngushtë. Përveç kësaj ka dy tipe konstruksioni: Man-Down (shoferi mbetet poshtë, vetëm dhëmbët ngrihen) dhe Man-Up (shoferi ngrihet me kabinën deri te ngarkesa).',
  3:'Hyrja në korridorin e ngushtë kryhet në katër hapa: fillimisht afrim i ngadaltë me shpejtësi ecjeje dhe sigurimi që korridori është i lirë (mbrojtja e personave aktive). Pastaj drejtimi i saktë paralel me boshtin gjatësor të korridorit – edhe devijimet e vogla këndore mund të çojnë në përplasje me shtyllat e rafteve. Pastaj kaplimi i udhëheqjes me detyrim dhe pritja e treguesit në ekran "udhëheqje aktive", vetëm atëherë vazhdoni (timoni tani është i bllokuar). Dhe vazhdimisht vlen: skanerët automatikë me lazer ndalojnë menjëherë pajisjen kur zbulojnë një person në korridor – mos hyni kurrë në korridor ndërsa një stivuese korridori të ngushtë punon aty.',
  4:'Lartësitë e ngritjes nga 12 deri në 18 metra nuk janë të rralla në korridorin e ngushtë – në këtë lartësi çdo lëvizje ka pasoja drastike për qëndrueshmërinë e të gjithë sistemit. Lëkundjet e katargut në majë mund të arrijnë disa centimetra – pritja e qetësimit është e detyrueshme, mos magazinoni kurrë në gjendje lëkundjeje. Veçanërisht e rrezikshme: pabarazi minimale të dyshemesë në rendin e milimetrave çojnë në lartësinë 15 m në pjerrësi të rrezikshme në rendin e centimetrave drejt raftit – prandaj dyshemeja duhet të jetë jashtëzakonisht e rrafshtë, dhe diagrami i kapacitetit mbajtës në pajisje duhet kontrolluar para çdo përdorimi.',
  5:'Nëse pajisja mbetet pa rrymë në lartësinë 12–18 m (nga defekt baterie, aktivizim siguresash ose defekt mekanik), shoferi mbetet i bllokuar – përgatitja për këtë është e detyrueshme. Rruga e parë e shpëtimit është ulja e emergjencës: kjo ndodhet poshtë te pajisja dhe operohet nga një person i dytë – POR nëse ngarkesa është ende në sektorin e raftit, ulja e emergjencës është e bllokuar, sepse një ulje do të dëmtonte ngarkesën ose raftin; shoferi lart nuk mund ta aktivizojë vetë. Nëse ulja e emergjencës nuk funksionon, rruga e dytë e shpëtimit është zbritja me litar për vetëshpëtim – litari udhëhiqet nga çatia përpara mbi ngarkesën, kurrë mbi skaje të mprehta. Ushtroni rregullisht të dyja rrugët e shpëtimit – ushtrimi i zbritjes me litar është i detyrueshëm të paktën një herë në vit (DGUV Regel 112-199).',
  6:'Nëse te një pajisje Man-Up të gjitha dyert dhe pengesat e rrethimit të kabinës janë të mbyllura, kjo parandalon rënien tashmë si një parmak solid – në këtë gjendje, PMV kundër rënies nuk është i detyrueshëm (mbrojtja kolektive përmes rrethimit ka, sipas ArbSchG §4, përparësi ndaj pajisjes mbrojtëse individuale). Nëse rrethimi duhet hapur në lartësi, p.sh. për të kapur nga rafti, mbrojtja kolektive bie – atëherë PMV kundër rënies është i detyrueshëm, po ashtu nëse prodhuesi ose vlerësimi i rrezikut e kërkojnë. Rregulli i artë: vishni PMV PARA se rrethimi të hapet në lartësi – mos u përkulni kurrë të pasiguruar!',
  7:'Para çdo nisjeje është i detyrueshëm një kontroll ditor para përdorimit: në kontrollin vizual kontrollohen hidraulika, rulat udhëzues, dhëmbët me varësit e tyre, gomat, kabina përkatësisht pajisja mbrojtëse e personave, sistemi i kamerës (nëse ekziston) dhe qasshmëria si dhe njohja e valvulës së uljes së emergjencës. Në kontrollin funksional kontrollohen timoni (para korridorit), udhëheqja me detyrim (test kaplimi), pajisja paralajmëruese/boria, funksioni i ngritjes dhe uljes, frena e parkimit dhe e punës, skaneri mbrojtës i personave, si dhe treguesit në ekran për mesazhe gabimi.',
  8:'Gjashtë rreziqe tipike në magazinën me korridore të ngushta: rrezik shtypjeje në korridorin e rafteve, kur rulat udhëzues ose krahët e rrotave ngecin te shtyllat e rafteve (kontrolloni dyshemenë para hyrjes për pengesa), rënia e ngarkesave nga lartësi e madhe në rast keqpërdorimi (kaska mbrojtëse është e detyrueshme, mos tejkaloni kurrë ngarkesën e sektorit të raftit), persona të paautorizuar në korridor (bllokim absolut gjatë punës – çaktivizimi i skanerit mbrojtës të personave është vdekjeprurës dhe i dënueshëm), ndërprerje rryme në lartësi (njihni dhe ushtroni rregullisht të dyja rrugët e shpëtimit, mos i mësoni vetëm në emergjencë), kërkesa jashtëzakonisht të larta për gjendjen e dyshemesë, dhe lëkundje të katargut pas ndalimit (prisni qetësimin e plotë, mos magazinoni kurrë në gjendje lëkundjeje).',
  9:'Si përmbledhje, tetë rregullat më të rëndësishme: pa udhëheqje aktive me detyrim, mos hyni kurrë në korridorin e ngushtë; prisni treguesin në ekran "udhëheqje aktive" para hyrjes; kontrolloni diagramin e kapacitetit mbajtës para çdo përdorimi dhe respektoni lartësinë e ngritjes; prisni plotësisht lëkundjet e katargut para magazinimit; kontrolloni dyshemenë në korridorin e rafteve për pengesa para hyrjes; njihni të dyja rrugët e shpëtimit (uljen e emergjencës nga poshtë dhe zbritjen me litar për vetëshpëtim); mbani kaskë mbrojtëse në zonën e magazinës me rafte të larta; dhe raportoni menjëherë dëmtimet në raft dhe bllokoni zonën.',
  10:'Këto tri pyetje shembull tregojnë stilin e provimit: Çfarë duhet të respektojë shoferi gjatë hyrjes (kalimit) në korridorin e ngushtë? Drejtoni automjetin drejt, hyni ngadalë dhe kontrolloni në ekran nëse udhëheqja me detyrim është kaplur – vazhdoni vetëm pas konfirmimit të udhëheqjes. Përse pabarazitë e dyshemesë janë kaq të rrezikshme në magazinën me korridore të ngushta? Sepse pjerrësitë më të vogla përforcohen aq fort nga lartësia ekstreme e ngritjes, sa pajisja ose ngarkesa mund të përplasen me raftin – në lartësinë 15 m milimetrat bëhen centimetra. Dhe: çfarë duhet bërë nëse stivuesja e korridorit të ngushtë mbetet pa rrymë në lartësi? Ruani qetësinë, njoftoni kolegët – rruga e parë është ulja nga një person i dytë përmes uljes së emergjencës nga poshtë, për sa kohë ngarkesa nuk është e ngecur në raft; nëse ulja e emergjencës është e bllokuar, shoferi zbret vetë me litar.'
}

function updateProg(){
  var total=totalSteps();
  var p=total>1?Math.round((idx/(total-1))*100):0;
  document.getElementById('pbar').style.width=p+'%';
  document.getElementById('progBadge').textContent=(idx+1)+' '+T.von+' '+total;
  document.getElementById('counter').textContent=(idx+1)+' '+T.von+' '+total;
}

function updateContact(){
  var waMsg=T.waMsg.replace('{gerat}',geratName);
  var mSubj=T.mailSubj.replace('{gerat}',geratName);
  var mBody=T.mailBody.replace('{gerat}',geratName);
  document.getElementById('waBtn').href='https://wa.me/'+WA_NR+'?text='+encodeURIComponent(waMsg);
  document.getElementById('mailBtn').href='mailto:'+MAIL+'?subject='+encodeURIComponent(mSubj)+'&body='+encodeURIComponent(mBody);
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  var onWelcome=(id==='screenWelcome');
  var onAbschluss=(id==='screenAbschluss');
  document.getElementById('controls').style.display=(onWelcome||onAbschluss)?'none':'flex';
}

function render(){
  updateProg();
  if(idx<TOTAL){
    showScreen('screenFolie');
    document.getElementById('slideImg').src=ORDNER+'/Folie'+(idx+1)+'.PNG';
    document.getElementById('folieLabel').textContent=T.folie+' '+(idx+1)+' '+T.von+' '+TOTAL;
    var erkl=(ERKL&&ERKL[gerat])?ERKL[gerat][idx+1]:null;
    document.getElementById('erklaerungBox').innerHTML=erkl?(
      '<div class="erklaerung-box">'+
        '<div class="erklaerung-label">💡 Erklärung</div>'+
        '<div class="erklaerung-content"><p>'+erkl+'</p></div>'+
      '</div>'
    ):'';
    document.getElementById('prevBtnEl').disabled=(idx===0);
    document.getElementById('prevTxt').textContent=T.zurueck;
    document.getElementById('nextTxt').textContent=T.weiter;
    document.getElementById('nextBtnEl').disabled=false;
  } else {
    var qi=idx-TOTAL;
    if(qi>=QUIZ.length){showAbschluss();return;}
    showScreen('screenQuiz');
    renderQuiz(qi);
  }
}

function renderQuiz(qi){
  var q=QUIZ[qi];
  document.getElementById('quizBadge').textContent=T.frage+' '+(qi+1)+' '+T.von+' '+QUIZ.length;
  document.getElementById('quizProg').textContent='';
  document.getElementById('quizQ').textContent=q.q;
  var fb=document.getElementById('quizFb');
  fb.className='quiz-fb';
  fb.textContent='';
  document.getElementById('prevBtnEl').disabled=(idx===0);
  document.getElementById('prevTxt').textContent=T.zurueck;
  document.getElementById('nextBtnEl').disabled=(quizAnswered[qi]===undefined);
  document.getElementById('nextTxt').textContent=T.weiter;
  var optsEl=document.getElementById('quizOpts');
  optsEl.innerHTML='';
  q.o.forEach(function(opt,i){
    var btn=document.createElement('button');
    btn.className='opt';
    btn.textContent=opt;
    if(quizAnswered[qi]!==undefined){
      btn.disabled=true;
      if(i===q.c)btn.classList.add('correct');
      if(quizAnswered[qi]===i&&i!==q.c)btn.classList.add('wrong');
      var answered=quizAnswered[qi];
      fb.className='quiz-fb '+(answered===q.c?'ok':'no');
      fb.textContent=answered===q.c?T.richtig:T.falsch+q.o[q.c];
    } else {
      btn.onclick=function(){answerQuiz(qi,i);};
    }
    optsEl.appendChild(btn);
  });
}

function answerQuiz(qi,chosen){
  if(quizAnswered[qi]!==undefined)return;
  var q=QUIZ[qi];
  quizAnswered[qi]=chosen;
  if(chosen===q.c)quizCorrect++;
  renderQuiz(qi);
  if(quizTimer)clearTimeout(quizTimer);
  quizTimer=setTimeout(function(){quizTimer=null;next();},1400);
}

function next(){
  if(quizTimer){clearTimeout(quizTimer);quizTimer=null;}
  if(idx<totalSteps()-1){idx++;render();}
  else showAbschluss();
}
function prev(){
  if(quizTimer){clearTimeout(quizTimer);quizTimer=null;}
  if(idx>0){idx--;render();}
}

function startApp(){idx=0;render();}
function restart(){idx=0;quizAnswered=[];quizCorrect=0;render();}

function showAbschluss(){
  showScreen('screenAbschluss');
  var pct=Math.round((quizCorrect/QUIZ.length)*100);
  var pass=pct>=80;
  document.getElementById('abschlussIcon').textContent=pass?'🎉':'📋';
  document.getElementById('abschlussTitel').textContent=pass?T.abschlussPass:T.abschlussFail;
  document.getElementById('abschlussSub').textContent=T.abschlussSub;
  document.getElementById('abschlussScore').textContent=T.ergebnis+quizCorrect+' / '+QUIZ.length+' ('+pct+'%)';
  document.getElementById('restartBtnEl').textContent=T.wiederholen;
  document.getElementById('pbar').style.width='100%';
  document.getElementById('progBadge').textContent=totalSteps()+' '+T.von+' '+totalSteps();
  var lfBtn=document.getElementById('lfBtn');
  var lfStat=document.getElementById('lfStat');
  if(pass){
    lfBtn.style.display='';
    lfBtn.disabled=geraetAbgeschlossen;
    lfBtn.style.background=geraetAbgeschlossen?'var(--ok)':'';
    lfBtn.textContent=geraetAbgeschlossen?'✓ Abgeschlossen':'Thema abschließen & speichern';
    lfStat.textContent=geraetAbgeschlossen?'Gespeichert.':'';
  } else {
    lfBtn.style.display='none';
    lfStat.textContent='';
  }
}

function modulAbschliessen(){
  var lfBtn=document.getElementById('lfBtn');
  var lfStat=document.getElementById('lfStat');
  lfBtn.disabled=true;lfBtn.textContent='Wird gespeichert…';
  var pct=Math.round((quizCorrect/QUIZ.length)*100);
  var payload={
    regnr:regnr,
    geraet:gerat==='kommissionier'?'kommissionierer':gerat,
    geraet_name:geratName,
    datum_uhrzeit:new Date().toISOString(),
    quiz_richtig:quizCorrect,
    quiz_gesamt:QUIZ.length,
    quiz_prozent:pct,
    bestanden:true,
    lernzeit_sekunden:Math.round((Date.now()-appStartZeit)/1000),
    gesamt_geraete_abgeschlossen:1
  };
  function onOK(){
    geraetAbgeschlossen=true;
    lfBtn.textContent='✓ Abgeschlossen';lfBtn.style.background='var(--ok)';
    lfStat.textContent='Gespeichert.';
  }
  fetch(LERNFORTSCHRITT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(onOK)
    .catch(function(){lfBtn.disabled=false;lfBtn.textContent='Thema abschließen & speichern';lfStat.textContent='Fehler beim Speichern. Bitte erneut versuchen.';lfStat.style.color='var(--no)';});
}
