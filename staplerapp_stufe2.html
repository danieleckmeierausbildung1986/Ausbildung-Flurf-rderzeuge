body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;min-height:100vh;}

.top-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
.top-right{display:flex;gap:8px;flex-shrink:0;}
.contact-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 12px;font-size:.8rem;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .2s;}
.contact-btn:hover{background:rgba(255,255,255,.22);}
.prog-bar-wrap{width:100%;background:#e0e4ea;border-radius:4px;height:6px;margin:0 20px;}
.prog-bar{height:6px;background:linear-gradient(90deg,#e63946,#c1121f);border-radius:4px;transition:width .4s;}
.prog-label{font-size:.75rem;color:#555;white-space:nowrap;flex-shrink:0;}
.prog-row{display:flex;align-items:center;gap:10px;padding:8px 20px 6px;background:#fff;border-bottom:1px solid #dde1e8;}

.screen{display:none;min-height:calc(100vh - 56px);}
.screen.active{display:flex;flex-direction:column;}

/* Welcome */
.welcome-wrap{max-width:700px;margin:40px auto;padding:0 20px;width:100%;}
.welcome-card{background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);overflow:hidden;}
.welcome-header{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;padding:40px 32px;}
.welcome-header h2{font-size:1.6rem;margin-bottom:8px;}
.welcome-header p{opacity:.8;font-size:.95rem;line-height:1.5;}
.welcome-body{padding:28px 32px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
.info-card{background:#f8f9fb;border-radius:10px;padding:16px;border-left:4px solid #e63946;}
.info-card h3{font-size:.9rem;font-weight:700;margin-bottom:4px;color:#1a1a2e;}
.info-card p{font-size:.82rem;color:#666;}
.start-btn{display:block;width:100%;background:linear-gradient(135deg,#e63946,#c1121f);color:#fff;border:none;border-radius:10px;padding:16px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;}
.start-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(230,57,70,.4);}

/* Slide */
.slide-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px 20px 80px;}
.slide-img-box{width:100%;max-width:900px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1);overflow:hidden;margin-bottom:12px;}
.slide-img-box img{width:100%;height:auto;display:block;}
.slide-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dde1e8;padding:12px 20px;display:flex;gap:10px;justify-content:center;box-shadow:0 -2px 8px rgba(0,0,0,.08);}
.nav-btn{background:linear-gradient(135deg,#e63946,#c1121f);color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:.9rem;font-weight:600;cursor:pointer;transition:transform .15s;}
.nav-btn:hover{transform:translateY(-1px);}
.nav-btn.sec{background:#fff;color:#333;border:1px solid #ccc;}
.nav-btn.sec:hover{background:#f5f5f5;}
.contact-row{display:flex;gap:8px;position:fixed;bottom:56px;right:16px;}
.contact-row a{background:#25d366;color:#fff;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.contact-row a.mail{background:#0072c6;}

/* Quiz */
.quiz-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 20px 100px;}
.quiz-card{width:100%;max-width:700px;background:#fff;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.09);padding:28px;}
.quiz-label{font-size:.78rem;font-weight:700;color:#e63946;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.quiz-q{font-size:1.05rem;font-weight:700;color:#1a1a2e;line-height:1.4;margin-bottom:20px;}
.quiz-opts{display:flex;flex-direction:column;gap:10px;}
.quiz-opt{background:#f8f9fb;border:2px solid #e0e4ea;border-radius:10px;padding:12px 16px;cursor:pointer;font-size:.92rem;transition:all .15s;text-align:left;}
.quiz-opt:hover:not([disabled]){border-color:#e63946;background:#fff5f5;}
.quiz-opt.correct{border-color:#2dc653;background:#edfbf0;color:#166534;}
.quiz-opt.wrong{border-color:#e63946;background:#fff0f0;color:#9b1c1c;}
.quiz-feedback{margin-top:16px;padding:12px 16px;border-radius:8px;font-size:.9rem;font-weight:600;display:none;}
.quiz-feedback.show{display:block;}
.quiz-feedback.ok{background:#edfbf0;color:#166534;border:1px solid #bbf7d0;}
.quiz-feedback.nok{background:#fff0f0;color:#9b1c1c;border:1px solid #fecaca;}
.quiz-score{font-size:.85rem;color:#666;margin-top:12px;}

/* Abschluss */
.abschluss-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}

.abschluss-icon{font-size:3rem;margin-bottom:16px;}
.abschluss-card h2{font-size:1.5rem;font-weight:700;color:#1a1a2e;margin-bottom:8px;}
.abschluss-card p{color:#555;font-size:.95rem;margin-bottom:20px;}
.score-badge{display:inline-block;background:linear-gradient(135deg,#e63946,#c1121f);color:#fff;border-radius:50px;padding:8px 24px;font-size:1.1rem;font-weight:700;margin-bottom:24px;}
.restart-btn{background:#1a1a2e;color:#fff;border:none;border-radius:8px;padding:12px 28px;font-size:.9rem;font-weight:600;cursor:pointer;margin-top:8px;}

@media(max-width:600px){
.info-grid{grid-template-columns:1fr;}
.welcome-header{padding:28px 20px;}
.welcome-body{padding:20px;}
.quiz-card{padding:20px;}
}
</style>

/* ---- APP LOGIK ---- */
var T=TXT[lang]||TXT.ro;
var G=GERAET_DATA[gerat]||GERAET_DATA.schubmast;
var ORDNER=lang==='de'?G.ordner_de:G.ordner_ro;
var QUIZ=lang==='de'?G.quiz_de:G.quiz_ro;
var TOTAL=G.folien;
var geratName=lang==='de'?G.name_de:G.name_ro;

var idx=0; // 0=folie1..TOTAL-1, TOTAL..TOTAL+QUIZ.length-1=quiz
var quizAnswered=[];
var quizCorrect=0;
var quizTimer=null;

function totalSteps(){return TOTAL+QUIZ.length;}

function updateProg(){
  var p=Math.round((idx/(totalSteps()-1))*100);
  document.getElementById('progBar').style.width=p+'%';
  document.getElementById('progLabel').textContent=(idx+1)+' '+T.von+' '+totalSteps();
}

function updateContact(){
  var ctx=geratName+(idx<TOTAL?' · '+T.folie+' '+(idx+1):' · '+T.frage+' '+(idx-TOTAL+1));
  var waMsg=T.waMsg.replace('{gerat}',geratName);
  var mSubj=T.mailSubj.replace('{gerat}',geratName);
  var mBody=T.mailBody.replace('{gerat}',geratName);
  document.getElementById('waBtn').href='https://wa.me/'+WA_NR+'?text='+encodeURIComponent(waMsg);
  document.getElementById('mailBtn').href='mailto:'+MAIL+'?subject='+encodeURIComponent(mSubj)+'&body='+encodeURIComponent(mBody);
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  document.getElementById(id).classList.add('active');
}

function render(){
  updateProg();
  updateContact();
  if(idx<TOTAL){
    showScreen('screenFolie');
    document.getElementById('slideImg').src=ORDNER+'/Folie'+(idx+1)+'.PNG';
    document.getElementById('slideLabel').textContent=T.folie+' '+(idx+1)+' '+T.von+' '+TOTAL;
    document.getElementById('prevBtnEl').textContent=idx===0?'':T.zurueck;
    document.getElementById('prevBtnEl').style.visibility=idx===0?'hidden':'visible';
    document.getElementById('nextBtnEl').textContent=T.weiter;
  } else {
    var qi=idx-TOTAL;
    if(qi>=QUIZ.length){showAbschluss();return;}
    showScreen('screenQuiz');
    renderQuiz(qi);
  }
}

function renderQuiz(qi){
  var q=QUIZ[qi];
  document.getElementById('quizLabel').textContent=T.frage+' '+(qi+1)+' '+T.von+' '+QUIZ.length;
  document.getElementById('quizQ').textContent=q.q;
  var fb=document.getElementById('quizFeedback');
  fb.className='quiz-feedback';
  fb.textContent='';
  document.getElementById('quizScore').textContent='';
  document.getElementById('nextBtnQuiz').style.display='none';
  document.getElementById('prevBtnQuiz').textContent=T.zurueck;
  var optsEl=document.getElementById('quizOpts');
  optsEl.innerHTML='';
  q.o.forEach(function(opt,i){
    var btn=document.createElement('button');
    btn.className='quiz-opt';
    btn.textContent=opt;
    if(quizAnswered[qi]!==undefined){
      btn.disabled=true;
      if(i===q.c)btn.classList.add('correct');
      if(quizAnswered[qi]===i&&i!==q.c)btn.classList.add('wrong');
      document.getElementById('nextBtnQuiz').style.display='inline-block';
      var answered=quizAnswered[qi];
      fb.className='quiz-feedback show '+(answered===q.c?'ok':'nok');
      fb.textContent=answered===q.c?T.richtig:T.falsch+q.o[q.c];
    } else {
      btn.onclick=function(){answerQuiz(qi,i);};
    }
    optsEl.appendChild(btn);
  });
}

function answerQuiz(qi,chosen){
  if(quizAnswered[qi]!==undefined)return;
  var q=QUIZ[qi];
  quizAnswered[qi]=chosen;
  if(chosen===q.c)quizCorrect++;
  renderQuiz(qi);
  if(quizTimer)clearTimeout(quizTimer);
  quizTimer=setTimeout(function(){quizTimer=null;next();},1400);
}

function next(){
  if(quizTimer){clearTimeout(quizTimer);quizTimer=null;}
  if(idx<totalSteps()-1){idx++;render();}
  else showAbschluss();
}
function prev(){
  if(quizTimer){clearTimeout(quizTimer);quizTimer=null;}
  if(idx>0){idx--;render();}
}

function startApp(){idx=0;render();}
function restart(){idx=0;quizAnswered=[];quizCorrect=0;render();}

function showAbschluss(){
  showScreen('screenAbschluss');
  var pct=Math.round((quizCorrect/QUIZ.length)*100);
  var pass=pct>=80;
  document.getElementById('abschlussIcon').textContent=pass?'🎉':'📋';
  document.getElementById('abschlussTitle').textContent=pass?T.abschlussPass:T.abschlussFail;
  document.getElementById('abschlussSub').textContent=T.abschlussSub;
  document.getElementById('abschlussScore').textContent=T.ergebnis+quizCorrect+' / '+QUIZ.length+' ('+pct+'%)';
  document.getElementById('restartBtnEl').textContent=T.wiederholen;
  document.getElementById('progBar').style.width='100%';
  document.getElementById('progLabel').textContent=totalSteps()+' '+T.von+' '+totalSteps();
}

</script>
