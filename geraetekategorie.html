<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geräteeinweisung – ProDrive Akademie Niederbayern</title>
<style>
:root{
  --blue:#1a4fa8;--blue-l:#2e75cc;--blue-d:#0d2d80;--blue-xl:#e8f0fb;
  --navy:#16243f;--muted:#5a6a7a;--line:#e3e8f0;--ink:#1a2330;
  --shadow:0 8px 40px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,sans-serif;
  min-height:100vh;background:#0a1628;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(26,79,168,.28) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 80%, rgba(13,45,128,.32) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}
.container{position:relative;z-index:1;width:100%;max-width:640px}
.logo-area{text-align:center;margin-bottom:28px;animation:fadeDown .5s ease both}
.logo-icon{
  width:72px;height:72px;border-radius:18px;
  background:linear-gradient(135deg,var(--blue-d),var(--blue-l));
  display:flex;align-items:center;justify-content:center;font-size:32px;
  margin:0 auto 16px;box-shadow:0 8px 32px rgba(13,45,128,.4);
}
.logo-area h1{color:#fff;font-size:22px;font-weight:700;margin-bottom:4px}
.logo-area p{color:rgba(255,255,255,.6);font-size:13px}
.card{
  background:#fff;border-radius:20px;
  box-shadow:var(--shadow);overflow:hidden;
  animation:fadeUp .5s ease .1s both;
}
.card-body{padding:28px 30px 30px}
.card-intro{font-size:13px;color:var(--muted);text-align:center;margin-bottom:20px;line-height:1.5}
.lf{margin-bottom:16px}
.lf label{display:block;font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
.lf input{width:100%;padding:13px 16px;border:2px solid var(--line);border-radius:12px;font-size:16px;background:#fafbfc;transition:border-color .15s;color:var(--ink)}
.lf input:focus{outline:none;border-color:var(--blue);background:#fff}
.login-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s}
.login-btn:hover{opacity:.9}
.lerr{color:#c0392b;font-size:13px;margin-top:10px;text-align:center;min-height:18px}
.lhint{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
.spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}

.greeting{text-align:center;padding:24px 24px 16px;border-bottom:1px solid var(--line)}
.greeting-name{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px}
.greeting-sub{font-size:13px;color:var(--muted)}
.toc-grid{padding:20px 24px 8px;display:grid;grid-template-columns:1fr;gap:14px}
.toc-card{
  display:flex;align-items:center;gap:16px;padding:16px 18px;
  border:1.5px solid var(--line);border-radius:14px;text-decoration:none;
  transition:all .15s;
}
.toc-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.toc-icon{
  width:52px;height:52px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--blue-d),var(--blue-l));
  display:flex;align-items:center;justify-content:center;font-size:24px;
}
.toc-info{flex:1}
.toc-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:2px}
.toc-sub{font-size:12.5px;color:var(--muted)}
.toc-arrow{font-size:18px;color:var(--muted);flex-shrink:0}
.no-modules{text-align:center;padding:28px 20px;color:var(--muted);font-size:14px;line-height:1.6}
.footer-area{padding:20px 24px 24px}
.back-btn{
  display:block;width:100%;padding:11px;border:2px solid var(--line);
  border-radius:12px;background:#fff;color:var(--muted);
  font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center;text-decoration:none;
}
.back-btn:hover{border-color:var(--blue);color:var(--blue)}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <div class="logo-area">
    <div class="logo-icon" id="catIcon">🚜</div>
    <h1 id="catTitle">Geräteeinweisung</h1>
    <p id="catSub">Unterweisungsbibliothek · für registrierte Teilnehmer</p>
  </div>

  <div class="card" id="loginCard">
    <div class="card-body">
      <div class="card-intro">Bitte melden Sie sich mit Ihrer Registriernummer, Vor- und Nachnamen an.</div>
      <div class="lf">
        <label>Registriernummer</label>
        <input type="text" id="regnr" placeholder="2025-001" autocomplete="off"
          onkeydown="if(event.key==='Enter')document.getElementById('vorname').focus()">
      </div>
      <div class="lf">
        <label>Vorname</label>
        <input type="text" id="vorname" placeholder="Max" autocomplete="off"
          onkeydown="if(event.key==='Enter')document.getElementById('nachname').focus()">
      </div>
      <div class="lf">
        <label>Nachname</label>
        <input type="text" id="nachname" placeholder="Mustermann" autocomplete="off"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="login-btn" id="loginBtn" onclick="doLogin()">Anmelden →</button>
      <div class="lerr" id="lerr"></div>
      <div class="lhint">Format: 2025-001 – erhalten Sie von Ihrem Ausbilder</div>
    </div>
  </div>

  <div class="card" id="tocCard" style="display:none">
    <div class="greeting">
      <div class="greeting-name" id="greetName">Willkommen</div>
      <div class="greeting-sub" id="tocSub">Verfügbare Modelle</div>
    </div>
    <div class="toc-grid" id="tocGrid"></div>
    <div class="footer-area">
      <a class="back-btn" id="backLink" href="unterweisungsbibliothek.html">← Zurück zur Unterweisungsbibliothek</a>
    </div>
  </div>
</div>

<script>
const BASE = 'https://danieleckmeierausbildung1986.github.io/Ausbildung-Flurf-rderzeuge/';
const ZUGANGSPRUEFUNG_URL = 'https://default8af25f9034bc4ef4aba22ab6f641d5.01.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/7058b6c8090842748465472db6085773/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=nxepIsGToa5my_-oIW5ZR5c3CQLtufN5DwNvM-qG1G4';

// Inhaltsverzeichnis je Gerätekategorie — neue Modelle hier ergänzen,
// sobald Quellmaterial (Betriebsanleitung o. ä.) vorliegt.
const KATEGORIEN = {
  frontgabelstapler: {
    titel: 'Frontgabelstapler', icon: '🏗️', sub: 'Standardgerät Stufe 1',
    modelle: [
      { titel:'Linde E20', sub:'Elektro-Gegengewichtstapler · 2.000 kg', icon:'🚜', url:'geraeteeinweisung_linde_e20.html' }
    ]
  },
  schubmaststapler: {
    titel: 'Schubmaststapler', icon: '📦', sub: 'Sondergerät Stufe 2',
    modelle: []
  },
  kommissionierstapler: {
    titel: 'Kommissionierstapler', icon: '🧰', sub: 'Sondergerät Stufe 2',
    modelle: []
  },
  schmalgangstapler: {
    titel: 'Schmalgangstapler', icon: '🏬', sub: 'Sondergerät Stufe 2',
    modelle: []
  }
};

const params = new URLSearchParams(window.location.search);
const katKey = params.get('kategorie') || '';
const kat = KATEGORIEN[katKey] || { titel:'Unbekannte Kategorie', icon:'❓', sub:'', modelle:[] };
document.getElementById('catIcon').textContent = kat.icon;
document.getElementById('catTitle').textContent = kat.titel;
document.getElementById('catSub').textContent = kat.sub;

let currentRegnr = '', currentVorname = '', currentNachname = '', isTrainer = false;

async function doLogin(){
  const val      = document.getElementById('regnr').value.trim();
  const vorname  = document.getElementById('vorname').value.trim();
  const nachname = document.getElementById('nachname').value.trim();
  const errEl = document.getElementById('lerr');
  errEl.textContent = '';

  if(!val){ errEl.textContent = 'Bitte Registriernummer eingeben.'; return; }
  if(!/^\d{4}-\d{3,4}$/.test(val)){ errEl.textContent = 'Ungültig. Format: 2025-001'; return; }
  if(!vorname || !nachname){ errEl.textContent = 'Bitte Vor- und Nachnamen eingeben.'; return; }

  await pruefeUndZeige(val, vorname, nachname, false);
}

async function pruefeUndZeige(val, vorname, nachname, silent){
  const errEl = document.getElementById('lerr');
  const btn   = document.getElementById('loginBtn');
  btn.innerHTML = '<span class="spinner"></span>';
  btn.disabled  = true;

  try{
    const res  = await fetch(ZUGANGSPRUEFUNG_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ registrierungsnummer: val, vorname: vorname, nachname: nachname })
    });
    const data = await res.json();

    if(data && data.zugang === true){
      currentRegnr = val; currentVorname = vorname; currentNachname = nachname;
      sessionStorage.setItem('authRegnr', val);
      sessionStorage.setItem('authVorname', vorname);
      sessionStorage.setItem('authNachname', nachname);
      showToc();
    } else if(!silent){
      errEl.textContent = data.grund || 'Registriernummer, Vorname oder Nachname stimmen nicht überein.';
    }
  }catch(e){
    if(!silent) errEl.textContent = 'Verbindungsfehler. Bitte erneut versuchen.';
  }finally{
    btn.textContent = 'Anmelden →';
    btn.disabled = false;
  }
}

function showToc(){
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('tocCard').style.display = 'block';
  document.getElementById('greetName').textContent = isTrainer
    ? ('Hallo, ' + currentVorname + '!')
    : ('Hallo, ' + currentVorname + ' ' + currentNachname + '!');
  document.getElementById('tocSub').textContent = kat.titel + ' — Modell wählen';
  document.getElementById('backLink').href = isTrainer
    ? (BASE + 'unterweisungsbibliothek.html')
    : (BASE + 'unterweisungsbibliothek.html?regnr=' + encodeURIComponent(currentRegnr));

  const grid = document.getElementById('tocGrid');
  if(!kat.modelle || kat.modelle.length === 0){
    grid.innerHTML = '<div class="no-modules">Für diese Gerätekategorie sind noch keine Modelle hinterlegt. Bitte wenden Sie sich an Ihren Ausbilder.</div>';
    return;
  }
  grid.innerHTML = kat.modelle.map(m => {
    const sep = m.url.indexOf('?') >= 0 ? '&' : '?';
    const param = isTrainer ? 'trainer=1' : ('regnr=' + encodeURIComponent(currentRegnr));
    return `
    <a class="toc-card" href="${BASE}${m.url}${sep}${param}">
      <div class="toc-icon">${m.icon}</div>
      <div class="toc-info">
        <div class="toc-title">${m.titel}</div>
        <div class="toc-sub">${m.sub}</div>
      </div>
      <div class="toc-arrow">→</div>
    </a>`;
  }).join('');
}

// Auto-Login: nur wenn diese Registriernummer bereits in dieser Sitzung
// erfolgreich angemeldet wurde.
(function(){
  // Trainer: als Trainer eingeloggt (oder ?trainer=1) → keine
  // Teilnehmer-Zugangsprüfung, Modellauswahl direkt anzeigen.
  let trainerAuth = null;
  try { trainerAuth = JSON.parse(sessionStorage.getItem('trainerAuth') || 'null'); } catch(e){}
  if((trainerAuth && trainerAuth.name) || params.get('trainer') === '1'){
    isTrainer = true;
    currentVorname = (trainerAuth && trainerAuth.name) ? trainerAuth.name : 'Trainer';
    currentNachname = '';
    currentRegnr = '';
    showToc();
    return;
  }

  const nr = params.get('regnr');
  const authRegnr = sessionStorage.getItem('authRegnr');
  const authVorname = sessionStorage.getItem('authVorname');
  const authNachname = sessionStorage.getItem('authNachname');
  if(nr && /^\d{4}-\d{3,4}$/.test(nr)){
    document.getElementById('regnr').value = nr;
    if(authRegnr === nr && authVorname && authNachname){
      document.getElementById('vorname').value = authVorname;
      document.getElementById('nachname').value = authNachname;
      pruefeUndZeige(nr, authVorname, authNachname, true);
    }
  } else if(authRegnr && authVorname && authNachname){
    document.getElementById('regnr').value = authRegnr;
    document.getElementById('vorname').value = authVorname;
    document.getElementById('nachname').value = authNachname;
    pruefeUndZeige(authRegnr, authVorname, authNachname, true);
  }
})();
</script>
<script defer src="schriftgroesse.js"></script>
</body>
</html>
