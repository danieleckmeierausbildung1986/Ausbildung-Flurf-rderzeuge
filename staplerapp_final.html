ustellen bzw. Verst\u00f6\u00dfe dagegen zu ahnden.\nVoraussetzung f\u00fcr ein OWiG-Verfahren \nVersto\u00df (vors\u00e4tzlich oder fahrl\u00e4ssig) gegen einen \nbu\u00dfgeldbew\u00e4hrten Tatbestand, z.B. Versto\u00df gegen \neine bu\u00dfgeldbew\u00e4hrte Unfallverh\u00fctungsvorschrift\nFolge\nBu\u00dfgeld\nOrdnungswidrigkeitenrecht"},{"type":"folie","nr":13,"text":"Ermahnung\n Abmahnung\n Verwarnung/ Verweis\n K\u00fcndigung\nArbeitsrecht\nArbeitsrechtliche Konsequenzen bei Nichteinhaltung \narbeitsvertraglicher Pflichten hinsichtlich \nArbeitsschutzvorschriften k\u00f6nnen sein:"},{"type":"folie","nr":14,"text":"Das Schadenersatz-Prinzip nach dem BGB, n\u00e4mlich,\ndass jeder, der einen anderen schuldhaft sch\u00e4digt, z.B.\nbei einem Arbeitsunfall, zum Ersatz des Schadens ver-\npflichtet ist, gilt nur f\u00fcr vors\u00e4tzlich verursachte Unf\u00e4lle.\nBei allen anderen Arbeitsunf\u00e4llen tritt die\nBerufsgenossenschaft f\u00fcr die Entsch\u00e4digung der \nunfallbedingten K\u00f6rpersch\u00e4den und deren Folgen ein.\nRegressm\u00f6glichkeit\nDie Berufsgenossenschaft kann z.B. bei grob fahrl\u00e4ssig \nherbeigef\u00fchrten Unf\u00e4llen vom Unfallverursacher seine \nAufwendungen zur\u00fcckfordern!\nRegress"},{"type":"quiz","frage":"Was ist KEIN Rechtsfolgenbereich nach einem Arbeitsunfall?","optionen":["Strafrecht","Steuerrecht","Ordnungswidrigkeitenrecht","Arbeitsrecht"],"richtig":1,"qi":0},{"type":"quiz","frage":"Wie viele t\u00f6dliche Staplerunf\u00e4lle gibt es in Deutschland durchschnittlich pro Jahr?","optionen":["ca. 5","ca. 10","ca. 23","ca. 50"],"richtig":2,"qi":1},{"type":"kapitel_abschluss","kapitel_nr":1,"kapitel_name":"Arbeitsunfall & Rechtsfolgen"},{"type":"folie","nr":15,"text":"Ausbildung von Staplerfahrern\nThema:\nBerufsgenossenschaft und Regelwerk\nAusgabe Juni 2008"},{"type":"folie","nr":16,"text":"Berufsgenossenschaft und Regelwerk\n\n\u00dcbersicht\n\nDie Berufsgenossenschaft und ihre Aufgaben\nDas Regelwerk \u2013 allgemein\nDer berufsgenossenschaftliche Grundsatz BGG 925\nab 01.05.2014  DGUV Grundsatz 308-001"},{"type":"folie","nr":17,"text":"Die Berufsgenossenschaft\n\nTr\u00e4ger der gesetzlichen Unfallversicherung\n\nGewerbliche\nUnfallversicherung\n\nLandwirtschaftliche\nUnfallversicherung\n\nUnfallversicherung\nder \u00f6ffentlichen Hand\n\nGewerbliche\nBerufsgenossenschaften\n\nLandwirtschaftliche\nBerufsgenossenschaften\n\nUnfallversicherungstr\u00e4ger\nder \u00f6ffentlichen Hand"},{"type":"folie","nr":18,"text":"Die Berufsgenossenschaft hat als gesetzliche Unfallversicherung u.a. mit allen geeigneten Mitteln zu verh\u00fcten:\nArbeitsunf\u00e4lle\nBerufskrankheiten\narbeitsbedingte Gesundheitsgefahren\nz.B. durch Beratungen, Schulungen oder\nVer\u00f6ffentlichung des berufsgenossenschaftlichen Vorschriften- und Regelwerkes\nAufgaben der Berufsgenossenschaft"},{"type":"folie","nr":19,"text":"Berufsgenossenschaftliches Regelwerk\n Berufsgenossenschaftliche Vorschriften wie z.B.\n   Unfallverh\u00fctungsvorschrift f\u00fcr \u201eFlurf\u00f6rderzeuge\u201c\n Berufsgenossenschaftliche Regeln wie z.B.\n   Einsatz von Schutzkleidung  (z.B Schutzschuhe)\n Berufsgenossenschaftliche Informationen wie z.B.\n   Informationen f\u00fcr den \u201eGabelstaplerfahrer\u201c\n Berufsgenossenschaftliche Grunds\u00e4tze wie z.B.\n   \u201eAusbildung und Beauftragung der Fahrer von\n   Flurf\u00f6rderzeugen mit Fahrersitz und Fahrerstand\u201c"},{"type":"folie","nr":20,"text":"Berufsgenossenschaftliches Regelwerk\n\nBerufsgenossenschaftlicher Grundsatz \u201eBGG 925\u201c\nNeu !!!  \u201eDGUV Grundsatz 308-001\u201c\nAusbildung und Beauftragung der Fahrer von Flur-\nf\u00f6rderzeugen mit Fahrersitz und Fahrerstand\n\nDie Ausbildung gliedert sich im \nWesentlichen in die 3 Stufen\n\nAllgemeine Ausbildung\n\nZusatzausbildung\n\nBetriebliche Ausbildung\n\nStufe 1\n\nStufe 2\n\nStufe 3"},{"type":"folie","nr":21,"text":"theoretischer Teil:\nSicherheitsbestimmungen\n(z.B. Unfallverh\u00fctungsvor-\nschriften),\nBetriebsanleitungen,\nGer\u00e4tetechnik (z.B. Stand-\nsicherheit, Antriebsarten)\n\npraktischer Teil:\nAufnehmen, Transportieren,\nAbsetzen, und Stapeln von \nLasten, \nGebrauch von \u00fcblichen \nAnbauger\u00e4ten\n\nStufe 1:           Allgemeine Ausbildung\n\nAbschlusspr\u00fcfung\nAusstellung eines Zertifikates\n\nAusbildungsstufen"},{"type":"folie","nr":22,"text":"Ausbildung im Umgang mit speziellen Flurf\u00f6rder-\nzeugen, z.B. Containerstapler, Regalflurf\u00f6rderzeuge,\nQuergabelstapler, Teleskopstapler, \nAusbildung in der Handhabung besonderer \nAnbauger\u00e4te.\n\nStufe 2:              Zusatzausbildung\n\nAbschlusspr\u00fcfung\n Ausstellung eines Zertifikates\n\nAusbildungsstufen"},{"type":"folie","nr":23,"text":"ger\u00e4tebezogener Teil:\nBetrifft die im Betrieb \nvorhandenen Flurf\u00f6rder-\nzeuge und Anbauger\u00e4te \nund die betrieblichen \nGegebenheiten\n\nverhaltensbezogener Teil:\nBetrifft im Wesentlichen\ndie in der Betriebs-\nanweisung f\u00fcr Flurf\u00f6rder-\nzeuge aufzulistenden \nVerhaltensweisen, die vom \nFahrer zu beachten sind\n\nStufe 3:         Betriebliche Ausbildung\n\nDurchf\u00fchrung dokumentieren\n\nAusbildungsstufen"},{"type":"quiz","frage":"Wie hei\u00dft der aktuelle berufsgenossenschaftliche Grundsatz f\u00fcr die Staplerfahrerausbildung?","optionen":["BGG 925","DGUV Grundsatz 308-001","DGUV Vorschrift 68","StVZO \u00a732"],"richtig":1,"qi":2},{"type":"kapitel_abschluss","kapitel_nr":2,"kapitel_name":"Berufsgenossenschaft & Regelwerk"},{"type":"folie","nr":24,"text":"Ausbildung von Staplerfahrern\n\nThema:\nVoraussetzungen und Eignungskriterien\nAusgabe Juni 2008"},{"type":"folie","nr":25,"text":"\u00dcbersicht\n\nVoraussetzungen\nEignungskriterien\nBeauftragung\n\nVoraussetzungen und Eignungskriterien"},{"type":"folie","nr":26,"text":"Voraussetzungen\n\nVoraussetzungen zum selbst\u00e4ndigen F\u00fchren von\nFlurf\u00f6rderzeugen: mit Fahrersitz oder Fahrerstand\n\n Mindestalter 18 Jahre\n\n F\u00fcr die T\u00e4tigkeit geeignet und \n   ausgebildet\n\n Nachweis der Bef\u00e4higung erbracht\n\n Schriftlich vom Unternehmer beauftragt"},{"type":"folie","nr":27,"text":"K\u00f6rperliche Eignung:\n\nausreichende \nSehsch\u00e4rfe\n\nH\u00f6rverm\u00f6gen\n\nr\u00e4umliches Sehen\n\nseitliches \nGesichtsfeld\n\nBeweglichkeit der Gliedma\u00dfen\n\ngute Reaktionsf\u00e4higkeit\n\nDie Beurteilung der k\u00f6rperlichen Eignung wird z.B. durch eine arbeitsmedizinische Vorsorgeuntersuchung \nnach dem BG-Grundsatz \u201eG 25\u201c festgestellt. \n\nEignungskriterien"},{"type":"folie","nr":28,"text":"Geistige und charakterliche Eignung:\n\nVon den ausgew\u00e4hlten Personen werden \ninsbesondere folgende Voraussetzungen erwartet:\n\n das Verst\u00e4ndnis f\u00fcr technische und physikalische \n   Zusammenh\u00e4nge\n\n die F\u00e4higkeit Signale erkennen, umsetzen und \n   anwenden zu k\u00f6nnen\n\n die Eigenschaft verantwortungsbewusst, \n   zuverl\u00e4ssig und umsichtig zu handeln\n\nEignungskriterien"},{"type":"folie","nr":29,"text":"Beauftragung zum F\u00fchren von Flurf\u00f6rderzeugen:\n\n Nach erfolgreicher Ausbildung und Nachweis der\n   Bef\u00e4higung kann die Beauftragung erfolgen\n\n Die Beauftragung ist schriftlich zu erteilen\n\n Die Beauftragung ist vom Unternehmer zu erteilen\n\n Die Form der Beauftragung ist bislang nicht geregelt;\n   - kann z.B. durch Ausstellen eines innerbetrieblichen\n   Fahrausweises erfolgen\n\n Die Beauftragung kann nicht auf andere \n   Unternehmen \u00fcbertragen werden\n\nBeauftragung"},{"type":"quiz","frage":"Was ist das Mindestalter zum selbstst\u00e4ndigen F\u00fchren von Flurf\u00f6rderzeugen?","optionen":["16 Jahre","17 Jahre","18 Jahre","21 Jahre"],"richtig":2,"qi":3},{"type":"quiz","frage":"Wer darf die Beauftragung zum F\u00fchren von Flurf\u00f6rderzeugen erteilen?","optionen":["Der Ausbilder","Der Betriebsrat","Der Unternehmer","Die Berufsgenossenschaft"],"richtig":2,"qi":4},{"type":"kapitel_abschluss","kapitel_nr":3,"kapitel_name":"Voraussetzungen & Eignungskriterien"},{"type":"folie","nr":30,"text":"Ausbildung von Staplerfahrern\n\nThema:\nUnfallgeschehen\nAusgabe Juni 2008"},{"type":"folie","nr":31,"text":"Gliederung\n\nUnfallzahlen\nUnfallschwerpunkte"},{"type":"folie","nr":32,"text":"Unfallzahlen\n\nIn Deutschland ereignen sich j\u00e4hrlich mehr als 20 000\nUnf\u00e4lle beim Umgang mit Flurf\u00f6rderzeugen, \ndavon ca.:\n 200 schwere Staplerunf\u00e4lle durch Fallen und Kippen\n 23 Unf\u00e4lle mit t\u00f6dlichen Verletzungen\n\nIm Bereich Gro\u00dfhandel und Lagerei ereigneten sich in \nden letzten Jahren durchschnittlich 3 bis 5 t\u00f6dliche \nStaplerunf\u00e4lle pro Jahr"},{"type":"folie","nr":33,"text":"Unfallschwerpunkte\n\nMeldepfl. Unf\u00e4lle mit Fahrersitzger\u00e4ten \nGroLa BG, 2006, N = 459 \nQuelle: Unfalldatenbank; Arbeitsmittel = FFZ"},{"type":"folie","nr":34,"text":"Anfahrunf\u00e4lle:\n\nBeispiele (Zitate aus den Unfallberichten der \nUnternehmen):\n\n\u201eBeim R\u00fcckw\u00e4rtsfahren mit dem Stapler \u00fcbersah Herr S. den neben ihm stehenden Herrn K. und fuhr ihm \u00fcber den linken Fu\u00df.\u201c \n \u201eDer Verletzte ist zum Stapler gegangen, um den Fahrer etwas zu fragen. Da dieser ihn aber nicht bemerkte, fuhr er gerade los, als er neben ihm stand. Der Verletzte kam dadurch mit dem linken Fu\u00df unter den Reifen des Staplers.\u201c \n\nNachfolgend werden die Schwerpunkte \n\u201eAnfahrunf\u00e4lle\u201c und \u201eKippunf\u00e4lle\u201c n\u00e4her betrachtet"},{"type":"folie","nr":35,"text":"Anfahrunf\u00e4lle\n\nUnfallursachen:\n\n Unachtsamkeit seitens des Staplerfahrers, z.B. auf-\n   grund der hohen Arbeitsbelastung\n\n Sichteinschr\u00e4nkung des \n   Staplerfahrers auf die \n   Fahrbahn\n\n r\u00e4umliche Enge und nicht optimale Organisation\n   der Verkehrsabl\u00e4ufe im \n   Betrieb"},{"type":"folie","nr":36,"text":"Kippunf\u00e4lle\n\nH\u00e4ufige Unfallursachen:\n\nKippunf\u00e4lle sind im Vergleich zu den Anfahrunf\u00e4llen\nzahlenm\u00e4\u00dfig wesentlich geringer, aber:\n Kippunf\u00e4lle sind oft mit schwerwiegenden Folgen\n  verbunden (Schwere der Verletzungen)\n bei mehr als 50 % der t\u00f6dlichen Unf\u00e4lle handelt es \n  sich um Kippunf\u00e4lle\n\n Fahren mit angehobener Last\n\n Bodenunebenheiten\n\n zu schnelles Kurvenfahren"},{"type":"quiz","frage":"Bei welchem Anteil der t\u00f6dlichen Staplerunf\u00e4lle handelt es sich um Kippunf\u00e4lle?","optionen":["mehr als 20%","mehr als 30%","mehr als 50%","mehr als 80%"],"richtig":2,"qi":5},{"type":"kapitel_abschluss","kapitel_nr":4,"kapitel_name":"Unfallgeschehen"},{"type":"folie","nr":37,"text":"Ausbildung von Staplerfahrern\n\nThema:\nLagern und Stapeln\nAusgabe Juni 2008"},{"type":"folie","nr":38,"text":"Lagern und Stapeln\n\n\u00dcbersicht\n\nLagereinrichtungen und -ger\u00e4te\nAnforderungen beim Lagern und Stapeln\nSch\u00e4den an Lagereinrichtungen"},{"type":"folie","nr":39,"text":"Lagern und Stapeln"},{"type":"folie","nr":40,"text":"Lagern und Stapeln\n\nStapeln von Flachpaletten:\n\n Genormte Vierwege-Flachpaletten aus Holz (Euro-\n   Paletten) d\u00fcrfen mit h\u00f6chstens 1000 kg bis 1500 kg \n   belastet werden.\n\n Bei Blocklagerung sind die max. \n   zul\u00e4ssigen Auflasten strikt \n   einzuhalten\n\n Bei vollfl\u00e4chiger, ebener und \n   horizontaler Auflage darf die \n   unterste Palette im Stapel das \n   Vierfache der zul\u00e4ssigen \n   einzelnen Palettenlast aufnehmen"},{"type":"folie","nr":41,"text":"Lagern und Stapeln\n\n Genormte Gitterboxpaletten d\u00fcrfen bei gleichm\u00e4\u00dfig \n   verteilter Last mit einer Nutzlast von h\u00f6chstens \n   1000 kg belastet und einschlie\u00dflich der Grundpalette \n   max. f\u00fcnffach gestapelt werden. \n\nStapeln von Gitterboxpaletten:"},{"type":"folie","nr":42,"text":"Lagern und Stapeln\n\nBelastung von Regalen und Stapelhilfsmittel:\n\n Die zul\u00e4ssige Belastung von\n   Stapelhilfsmittel z.B. Paletten, \n   darf nicht \u00fcberschritten \n   werden\n\n Angaben \u00fcber zul\u00e4ssige\n   Fach- und Feldlasten an\n   Palettenregalen m\u00fcssen\n   eingehalten werden\n\nRegal51\nRegal52"},{"type":"folie","nr":43,"text":"Regal51\nRegal52\n\nLagern und Stapeln\n\nRegalfeld\n\nRegalfach"},{"type":"folie","nr":44,"text":"Lagern und Stapeln\n\n In den obersten Ablagen\n   von Palettenregalen \n   d\u00fcrfen Ladeeinheiten  nur \n   abgestellt werden, wenn \n   stirnseitig eine mindestens \n   0,5 m hohe Sicherungs-\n   einrichtung gegen Herab-\n   fallen der Ladeeinheiten \n   vorhanden ist\n\n Ladeeinheiten d\u00fcrfen nicht sto\u00dfartig in \n   Palettenregalen abgestellt werden\n\nLagerung in Regalen:"},{"type":"folie","nr":45,"text":"Zum Heben von Lasten h\u00f6her als 1,80 m \u00fcber Flur nur \nStapler verwenden , die mit einem Fahrerschutzdach \nausger\u00fcstet sind \n\nLagern und Stapeln\n\nAnforderungen an den Stapler:"},{"type":"folie","nr":46,"text":"Lagern und Stapeln\n\n Lasten d\u00fcrfen nur auf \n   ausreichend tragf\u00e4higem \n   Untergrund standsicher\n   abgesetzt werden\n\nLager- und Stapelbedingungen:\n\n Je nach Stapelgut sind bei der\n   Blocklagerung erforderlichen-\n   falls geeignete Zwischenlagen \n   zu verwenden"},{"type":"folie","nr":47,"text":"Lagern und Stapeln\n\n Bei Staplern mit Hubmast-Neigeeinrichtung darf der \n   Hubmast nur zum Aufnehmen und Absetzen der Last \n   nach vorne geneigt werden\n\n Nicht ordnungsgem\u00e4\u00df \n   gepackte Lasten, sowie \n   Ladeeinheiten mit \n   besch\u00e4digten Paletten oder \n   Stapelbeh\u00e4ltern d\u00fcrfen \n   nicht gestapelt oder auf \n   h\u00f6her gelegenen Stellen \n   abgesetzt werden\n\nVerhaltensweisen beim Ein- und Auslagern:"},{"type":"folie","nr":48,"text":"Lagern und Stapeln\n\nWeitere wichtige Verhaltensweisen:\n\n Lasten d\u00fcrfen nicht abgestellt werden\n\n Erforderliche Verkehrswegbreiten d\u00fcrfen nicht \n   durch abgestellte Lasten eingeschr\u00e4nkt werden\n\n- in Fluchtwegen\n   - vor Notausg\u00e4ngen\n   - vor Feuerl\u00f6scheinrichtungen\n   - vor Erste-Hilfe-Einrichtungen\n   - vor Betriebseinrichtungen, die\n      jederzeit zug\u00e4nglich sein m\u00fcssen,\n      z.B. Sicherungs- und Schalteinrichtungen"},{"type":"folie","nr":49,"text":"Lagern und Stapeln\n\nSch\u00e4den:\n\n Sch\u00e4den an Regalen (z.B.\n   verbogene Regalst\u00e4nder)\n   sind zu melden;\n   eine Nutzung der Regale\n   ist erst wieder nach deren\n   Instandsetzung zul\u00e4ssig\n\n Fehlende oder besch\u00e4digte Aushebe-\n   sicherungen an Regaltr\u00e4gern sind\n   zu melden und zu ersetzen"},{"type":"quiz","frage":"Wie hoch darf eine Gitterboxpalette max. gestapelt werden?","optionen":["Dreifach","Vierfach","F\u00fcnffach","Sechsfach"],"richtig":2,"qi":6},{"type":"quiz","frage":"Ab welcher Hubh\u00f6he ist ein Fahrerschutzdach am Stapler vorgeschrieben?","optionen":["1,20 m","1,50 m","1,80 m","2,00 m"],"richtig":2,"qi":7},{"type":"kapitel_abschluss","kapitel_nr":5,"kapitel_name":"Lagern & Stapeln"},{"type":"folie","nr":50,"text":"Ausbildung von Staplerfahrern\n\nThema:\nVerkehrswege\nAusgabe Juni 2008"},{"type":"folie","nr":51,"text":"Verkehrswege\n\n\u00dcbersicht\n\nAllgemeines\nErforderliche Abmessungen von Verkehrswegen \nAnforderungen an Verkehrswege\nVerkehrswege in Schmalg\u00e4ngen\n\u00d6ffentliche Verkehrswege"},{"type":"folie","nr":52,"text":"Verkehrswege\n\nGrunds\u00e4tzliches:\n\nEs d\u00fcrfen nur ausreichend \nbemessene, vom Unternehmer \nfestgelegte und freigegebene \nVerkehrswege befahren werden.\n\nF\u00fcr Gabelstapler gesperrte \nVerkehrswege m\u00fcssen durch \nentsprechende Verbotsschilder \ngekennzeichnet sein und d\u00fcrfen\nnicht befahren werden."},{"type":"folie","nr":53,"text":"Verkehrswege- innerbetrieblich\n\nAbmessungen:  Einbahnverkehr\n\nDie Mindestbreite richtet sich nach der Breite des \nFlurf\u00f6rderzeuges bzw. der Ladung zuz\u00fcglich eines\nRandzuschlages von 0,50 m auf beiden Seiten.\n\n0,5 m Randzuschlag\n\n0,5 m Randzuschlag"},{"type":"folie","nr":54,"text":"Abmessungen:  Begegnungsverkehr\n\nBreite der Flurf\u00f6rderzeuge bzw. der Last zuz\u00fcglich der\nRandzuschl\u00e4ge und Begegnungszuschlag von 0,4 m.\n\nVerkehrswege- innerbetrieblich\n\n0,5 m Randzuschlag\n0,5 m Randzuschlag\n0,4 m Begegnungszuschlag"},{"type":"folie","nr":55,"text":"Abmessungen:  Begegnungsverkehr und Gehverkehr\n\nWerden die Wege gleichzeitig als Gehverkehr genutzt,\nerh\u00f6ht sich der der Randzuschlag beidseitig auf 0,75 m.\n\nVerkehrswege- innerbetrieblich\n\n0,4 m Begegnungszuschlag\n\n0,75 m Randzuschlag\n\n0,75 m Randzuschlag"},{"type":"folie","nr":56,"text":"Verkehrswege- innerbetrieblich\n\nAbdeckungen im Verkehrsweg:\n\nAbdeckungen von \nKan\u00e4len, Bodenluken, \nGruben oder Sch\u00e4chten \nd\u00fcrfen nur befahren \nwerden, wenn sie \nausreichend tragf\u00e4hig \nund gegen Verrutschen \ngesichert sind"},{"type":"folie","nr":57,"text":"Verkehrswege- innerbetrieblich\n\nVerkehrswegbegrenzungen:\n\nVor T\u00fcren, Toren, Durchg\u00e4ngen, \nDurchfahrten und Treppenaus-\ntritten ist bei der Vorbeifahrt \nein Sicherheitsabstand einzu-\nhalten (mind. 1 m)\n\nVerkehrswege f\u00fcr Gabelstapler \nund Fu\u00dfg\u00e4nger sollten durch \nbauliche Einrichtungen oder \nfarbliche Kennzeichnung \ngetrennt sein"},{"type":"folie","nr":58,"text":"Verkehrswege- innerbetrieblich\n\nTragf\u00e4higkeit\ndes Bodens\n1700 kg/m2\n\nTragf\u00e4higkeit des Untergrundes:\n\nMa\u00dfgeblich ist: \n Gesamtgewicht des Staplers \n  (Eigengewicht und Lastgewicht)\n Punktbelastung \n   (Auflagefl\u00e4che der R\u00e4der)\n\nEs d\u00fcrfen nur ausreichend tragf\u00e4hige Verkehrswege \nbefahren werden."},{"type":"folie","nr":59,"text":"Verkehrswege- innerbetrieblich\n\nBodenunebenheiten und Hindernisse:\n\nK\u00f6nnen zum Herabfallen der Last \noder gar zum Umsturz des Staplers\nf\u00fchren;  darum:\n \n Bodenunebenheiten melden und \n Hindernisse beseitigen"},{"type":"folie","nr":60,"text":"Verkehrswege- innerbetrieblich\n\nKreuzungen innerhalb von Verkehrswegen:\n\n eindeutiger Vorfahrtsregeln \n   sind geboten, z.B. \n   \u201eRechts vor Links\u201c\n\n Hilfsmittel wie Spiegel, die \n   den Einblick in den \n   Querverkehr erm\u00f6glichen, \n   helfen Zusammenst\u00f6\u00dfe \n   zu vermeiden"},{"type":"folie","nr":61,"text":"Verkehrswege- innerbetrieblich\n\nBeleuchtung der Verkehrswege:\n\nEine ausreichende Beleuchtung \nist erforderlich, \n durch die der Fahrer nicht \n   geblendet wird\n die so angebracht und \n   beschaffen ist, dass sie durch\n   Bewegungen der Stapler\n   nicht besch\u00e4digt wird"},{"type":"folie","nr":62,"text":"Verkehrswege- innerbetrieblich\n\nTore innerhalb von Verkehrswegen:\n\n Bei Pendeltoren ist darauf zu \n   achten, dass sie nur befahren\n   werden, wenn eine ausreichende\n   Durchsicht gew\u00e4hrleistet ist\n\n Bew\u00e4hrt haben sich Blinkleuchten,\n   die die Tordurchfahrt des Staplers ank\u00fcndigen\n Bei ung\u00fcnstigen Verkehrsbedingungen ist es \n   angezeigt, die Tordurchfahrt durch Hupen \n   anzuk\u00fcndigen"},{"type":"folie","nr":63,"text":"Verkehrswege- innerbetrieblich\n\nLadebr\u00fccken:\n\nEs sind nur ausreichend \nbreite, tragf\u00e4hige, rutsch-\nhemmend und gegen \nVerrutschen gesicherte \nLadebr\u00fccken zu \nverwenden\n\n Ausreichende Breite bedeutet \n   Flurf\u00f6rderzeugbreite + 0,70 m"},{"type":"folie","nr":64,"text":"Verkehrswege- innerbetrieblich\n\nFreihalten der Verkehrswege:\n\nVerkehrswege d\u00fcrfen nicht \nverstellt werden (z.B. durch \nWare), damit sie jederzeit \ngefahrlos befahren und \nbegangen werden k\u00f6nnen\n\n So nicht!!"},{"type":"folie","nr":65,"text":"Verkehrswege- Schmalg\u00e4nge\n\n Regal- und Kommissionierstapler \u2013 Anforderungen:\n\nEinsatz wegen des fehlenden Sicherheitsabstandes \nnur zul\u00e4ssig,  wenn:\n bauliche Ma\u00dfnahmen (z.B. Z\u00e4une) oder \n Warnanlagen oder\n Sensoren am Stapler    \neiner Gef\u00e4hrdung von Personen entgegenwirken"},{"type":"folie","nr":66,"text":"Bauliche Ma\u00dfnahmen:\n\nVerkehrswege- Schmalg\u00e4nge\n\nZ\u00e4une oder Mauern verhindern \nden Zugang von Fu\u00dfg\u00e4ngern"},{"type":"folie","nr":67,"text":"Verkehrswege- Schmalg\u00e4nge\n\nWarnanlagen:\n\nEine Lichtschrankenanlage am \nZugang zum Schmalgang l\u00f6st \nAlarm aus, wenn z.B. ein \nFu\u00dfg\u00e4nger in den Gang eintritt, \nin dem sich ein Stapler befindet. \n\nLichtschranke"},{"type":"folie","nr":68,"text":"Verhaltensregeln beim Einsatz von Warnanlagen:\n\nVerkehrswege- Schmalg\u00e4nge\n\nBeauftragte Fu\u00dfg\u00e4nger d\u00fcrfen \nSchmalg\u00e4nge zu Lagerarbeiten \nerst betreten, wenn sich keine \nRegal- oder Kommissionierstapler \nin den Schmalg\u00e4ngen befinden.\n\nMit Regal- oder Kommissionier-\nstapler darf in Schmalg\u00e4nge erst\neingefahren werden, wenn sich\nerkennbar keine Fu\u00dfg\u00e4nger \ndarin aufhalten."},{"type":"folie","nr":69,"text":"Verkehrswege- Schmalg\u00e4nge\n\nSensoren am Stapler:\n\nLaserscanner\n\nPersonenschutz ist auch \ngew\u00e4hrleistet, wenn am Stapler\nSensoren zum Erkennen von\nPersonen angebracht sind.\nDer Fahrbereich des Staplers \nwird innerhalb eines ausreichen-\nden Fahrbereiches \u00fcberwacht\nDerzeit setzen sich \nLaserscanner\nimmer mehr durch"},{"type":"folie","nr":70,"text":"Verkehrswege- \u00f6ffentlich\n\nRechtsvorschriften:\n\nNeben der Unfallverh\u00fctungsvorschrift \n\u201eFlurf\u00f6rderzeuge\u201cgelten \nzus\u00e4tzlich die Vorschriften\n\n des Stra\u00dfenverkehrsgesetzes\n der Stra\u00dfenverkehrs-Ordnung\n der Stra\u00dfenverkehrs-Zulassungs-\n   Ordnung\n der Fahrerlaubnisverordnung"},{"type":"folie","nr":71,"text":"Verkehrswege- \u00f6ffentlich\n\nGrunds\u00e4tzliches zum Einsatz von Staplern auf \n\u00f6ffentlichen Verkehrswegen:\n\nBisher: \nDie Zulassung f\u00fcr \u00f6ffentliche Verkehrswege war nach\nder Stra\u00dfenverkehrs-Zulassungs-Ordnung  (StVZO)\nm\u00f6glich, wenn f\u00fcr den Stapler:\n\neine Betriebserlaubnis oder \nEG-Typgenehmigung vorlag  \nund\n\nein amtliches Kennzeichen \nzugeteilt war"},{"type":"folie","nr":72,"text":"Verkehrswege- \u00f6ffentlich\n\nEinsatz im \u00f6ffentlichen Stra\u00dfenverkehr:\n\nNeuregelung seit dem 01.11.2003 durch die \n36. \u00c4ndVO StVR:\n\nMit der Neuregelung vom 01.11.2003 wurden Stapler \nden selbstfahrenden Arbeitsmaschinen gleichgestellt! \n\nStapler bis 20 km/h sind \nnunmehr von den \nVorschriften \u00fcber das\nZulassungsverfahren \nausgenommen."},{"type":"folie","nr":73,"text":"Verkehrswege- \u00f6ffentlich\n\nEinsatz im \u00f6ffentlichen Stra\u00dfenverkehr:\n\nAnforderungen an den Stapler mit einer \nbauartbedingten H\u00f6chstgeschwindigkeit \nbis max. 20 km/h:\n\n Erteilung einer Betriebserlaubnis\n\n Kennzeichnung des \n   Staplers mit Name und \n   Anschrift des Halters \n   (Kennzeichnung auf der \n   linken Seite des Staplers)"},{"type":"folie","nr":74,"text":"Verkehrswege- \u00f6ffentlich\n\nZulassung f\u00fcr den \u00f6ffentlichen Stra\u00dfenverkehr:\n\nBefreiung von der Betriebserlaubnis ist m\u00f6glich:\n\n Bei Vorlage eines positiven Gutachtens eines amtlich\n   anerkannten Sachverst\u00e4ndigen f\u00fcr Kraftfahrzeugver-\n   kehr, worin der Stapler beschrieben ist, und\n\n Staplerverkehr nur in geringem Umfang vorliegt, und\n\n eine bauartbedingte H\u00f6chstgeschwindigkeit \n   bis 20 km/h vorliegt\n\nGrundlage f\u00fcr die erforderliche \nAusr\u00fcstung des Staplers ist das \n\u201eMerkblatt f\u00fcr Stapler\u201c z.B. Aus-\nr\u00fcstung mit Gabelzinkenschutz"},{"type":"folie","nr":75,"text":"Verkehrswege- \u00f6ffentlich\n\nFahrerlaubnis f\u00fcr Stapler:\n\nStaplerfahrerausbildung mit Fahrauftrag und\nFahrerlaubnis f\u00fcr den \u00f6ffentlichen Stra\u00dfenverkehr\n\n Fahrerlaubnisklassen bis 31.12.1998\n   Klasse 3 bis 7,5 t zul. Gesamtgewicht\n   Klasse 2 \u00fcber 7,5 t zul. Gesamtgewicht\n   Klasse 5 bis v < 25 km/h (Fahrerlaubnis erteilt\n                                               vor 01.01.1989)\n Fahrerlaubnisklassen ab 01.01.1999\n   Klasse L (v < 25 km/h, unabh\u00e4ngig\n   vom zul. Gesamtgewicht)\n   Klasse B (v > 25 km/h, zul. GG < 3,5 t)\n   Klasse C (v > 25 km/h, zul. GG > 3,5 t)"},{"type":"quiz","frage":"Wie gro\u00df ist der Randzuschlag bei Einbahnverkehr auf einer Seite?","optionen":["0,30 m","0,40 m","0,50 m","0,75 m"],"richtig":2,"qi":8},{"type":"quiz","frage":"Welche Mindest-Bodenbelastbarkeit muss ein Verkehrsweg haben?","optionen":["800 kg/m\u00b2","1200 kg/m\u00b2","1700 kg/m\u00b2","2000 kg/m\u00b2"],"richtig":2,"qi":9},{"type":"kapitel_abschluss","kapitel_nr":6,"kapitel_name":"Verkehrswege"},{"type":"folie","nr":76,"text":"Verkehrswege"},{"type":"video","titel":"Video: Verkehrswege","videotyp":"sharepoint","videosrc":"https://ausbildung1986.sharepoint.com/sites/AusbildungZentrale/_layouts/15/embed.aspx?UniqueId=8d5a491d-ccf2-41b9-be09-de15a170be4d&embed=%7B%22ust%22%3Atrue%2C%22hv%22%3A%22CopyEmbedCode%22%7D&referrer=StreamWebApp&referrerScenario=EmbedDialog.Create"},{"type":"folie","nr":77,"text":"Ausbildung von Staplerfahrern\n\nThema:\nTragf\u00e4higkeit und Standsicherheit\nAusgabe Juni 2008"},{"type":"folie","nr":78,"text":"Standsicherheit und Tragf\u00e4higkeit\n\n\u00dcbersicht\n\nAllgemeines\nSchwerpunkt und seine Bedeutung\nLastschwerpunktdiagramme\n\u00dcbungsbeispiele\nKippkantendreieck\nZusammenfassung"},{"type":"folie","nr":79,"text":"Standsicherheit und Tragf\u00e4higkeit\n\nBauweise des Staplers:\n\n Der Stapler ist dadurch \n   gekennzeichnet, dass sich \n   das Lastaufnahmemittel und \n   die Last vor der Vorderachse \n   befinden.\n\n Das Eigengewicht des \n   Stapler bildet das \n   Gegengewicht zur \n   Last  auf der Gabel.\n\nAllgemeines:\n\nStaplergewicht\nLastgewicht"},{"type":"folie","nr":80,"text":"Der Schwerpunkt eines K\u00f6rpers ist \nder Punkt, in dem man sich dessen\nMasse vereinigt denkt.\nBesteht ein K\u00f6rper aus einheitlichem\nMaterial, und ist dieses gleich \nverteilt , liegt sein Schwerpunkt \ngenau im Mittelpunkt.\n\nStandsicherheit und Tragf\u00e4higkeit\n\nBeim Thema Standsicherheit spielen\nder Schwerpunkt der Last und der\nSchwerpunkt des Staplers eine \nbesondere Rolle.\n\nDer Schwerpunkt"},{"type":"folie","nr":81,"text":"Standsicherheit und Tragf\u00e4higkeit\n\nBeide Schwerpunkte \n(Stapler + Last) ergeben \nden Gesamtschwerpunkt \ndes Staplers. \n\nDer Gesamtschwerpunkt:\n\nLastschwerpunkt\n\nStaplerschwerpunkt\n\nGesamtschwerpunkt"},{"type":"folie","nr":82,"text":"Standsicherheit und Tragf\u00e4higkeit\n\n Die Vorderachse des Staplers \n   stellt die Kippachse dar, \u00fcber die \n   der Stapler bei einer \u00dcberlastung \n   nach vorne kippen kann.\n\n Kippachse\n\n Die Lastverh\u00e4ltnisse am Stapler\n   k\u00f6nnen am Prinzip einer Wippe \n   dargestellt werden.\n Die Wippe befindet sich im Gleich-\n   gewicht, wenn die Last z.B. auf \n   beiden Seiten des Drehpunktes \n   gleich schwer und gleich weit \n   vom Drehpunkt entfernt ist."},{"type":"folie","nr":83,"text":"Standsicherheit und Tragf\u00e4higkeit\n\nHebelgesetz:\n\nDas Prinzip der Wippe kann auch mit dem Hebelgesetz\nerkl\u00e4rt werden.\n\nWenn jeweils das Produkt aus\nLast x Lastarm und Kraft x Kraftarm identisch ist, \nliegt ein Gleichgewichtszustand vor. \nAber: Auf den Stapler \u00fcbertragen, k\u00f6nnte die kleinste \nVer\u00e4nderung auf der Lastseite zur Kippgefahr f\u00fchren!  \n\nKraft\nLast\nLastarm\nLastseite\nKraftarm\nStaplerseite"},{"type":"folie","nr":84,"text":"Standsicherheit und Tragf\u00e4higkeit\n\nHebelgesetz:\n\nBeim Betrieb des Staplers ist deshalb wichtig,\ndass das Produkt auf der Staplerseite immer gr\u00f6\u00dfer\nist, als das Produkt auf der Lastseite, z.B. durch einen\nkleinen Lastarm oder ein gr\u00f6\u00dferes Staplergewicht. \n\nKraft\nLast\nLastseite\nStaplerseite\nLastarm\nKraftarm"},{"type":"folie","nr":85,"text":"Standsicherheit und Tragf\u00e4higkeit\n\n Um den Lastarm m\u00f6glichst klein zu halten, ist die \n   Last an der Lastanlagefl\u00e4che der Gabelzinken und \n   damit nahe an der Vorderachse aufzunehmen!"},{"type":"folie","nr":86,"text":"Standsicherheit und Tragf\u00e4higkeit\n\nunbeladener Gabelstapler:\n\nbeladener Gabelstapler: \n\n\u00c4nderung des Gesamtschwerpunktes:\n\nGesamtschwerpunkt ver\u00e4ndert sich in \nRichtung der Vorderachse bzw. der \nKippachse\n\nGesamtschwerpunkt = Staplerschwerpunkt\nLage: etwa auf H\u00f6he des Fahrersitzes"},{"type":"folie","nr":87,"text":"Wenn der Gesamtschwerpunkt\n   \u00fcber die Vorderachse bzw. die\n   Kippachse wandert, kippt der\n   Stapler nach vorne.\n\nStandsicherheit und Tragf\u00e4higkeit"},{"type":"folie","nr":88,"text":"Standsicherheit und Tragf\u00e4higkeit\n\nTragf\u00e4higkeit:\n\n Jeder Stapler ist f\u00fcr eine bestimmte Tragf\u00e4higkeit\n   gebaut. Sie wird vom Staplerhersteller auf dem \n   Fabrikschild als Nenntragf\u00e4higkeit angegeben.\n Die                                    bezieht sich auf eine \n   genormte Hubh\u00f6he und einen festgelegten \n   Lastschwerpunktabstand.\n Die tats\u00e4chliche Tragf\u00e4higkeit ist abh\u00e4ngig vom \n   Lastschwerpunktabstand und der Hubh\u00f6he. \n   Sie ist dem Traglastdiagramm zu entnehmen.\n\nNenntragf\u00e4higkeit"},{"type":"folie","nr":89,"text":"Standsicherheit und Tragf\u00e4higkeit\n\nFabrikschild\n\nZur\u00fcck"},{"type":"folie","nr":90,"text":"Traglastdiagramm\n\nTraglastdiagramm zur Bestimmung der zul\u00e4ssigen \nTraglasten"},{"type":"folie","nr":91,"text":"Traglastdiagramm\n\nGabelr\u00fccken\n\nTraglastdiagramm zur Bestimmung der zul\u00e4ssigen \nTraglasten"},{"type":"folie","nr":92,"text":"\u00dcbungsbeispiele\n\nFragen:\n\n1. Wie hoch darf das max. Gewicht bei einem Last-\n    schwerpunktabstand von 700 mm sein?\n\n1800 kg\n\n 2. Darf eine Last mit 1600 kg und einem Lastschwer-\n     punktabstand von 900 mm gehoben werden? \n\nNein\n\n1000\n1200\n1400\n1600\n1800\n2000\n2200\nLastschwerpunkt-\nabstand in mm\n500\n600\n700\n800\n900\n1000\nLast in kg\n800"},{"type":"folie","nr":93,"text":"Diagramm mit Hubh\u00f6hen-Kennlinien\n\nTraglastdiagramm\n\n500\n600\n700\n800\n900\n1000\nLastschwerpunktabstand in mm\nHub\nin mm\n 4250\n 5250\n 6150\n500\n600\n800\n1000\n1200\nLast in\nkg\n900"},{"type":"folie","nr":94,"text":"\u00dcbungsbeispiele\n\n1.\n\n2.\n\nWelche Hubh\u00f6hen-\nkennlinie ist zu verwenden, wenn bis zu einer H\u00f6he \nvon 4,20 m eingelagert werden soll?\n\nWelche Hubh\u00f6henkennlinie ist zu verwenden, wenn \nin einer H\u00f6he von 5,90 m eingelagert werden soll?\n\n3.\n\nWelche Hubh\u00f6hen-\nkennlinie ist zu \nverwenden, wenn \nin einer H\u00f6he \nvon 5,20 m \neingelagert\nwerden soll?"},{"type":"folie","nr":95,"text":"\u00dcbungsbeispiele\n\n4.\n\n600 mm\n\n5.\n\nEine Last wiegt 800 kg. Darf sie bei einem Lastschwer-\npunktabstand von 700 mm in eine H\u00f6he von 6 m \neingelagert werden?\n\nNein\n\nWie gro\u00df darf der\nLastschwerpunkt-\nabstand max. sein,\nwenn eine Last \nmit 1000 kg in \neiner H\u00f6he von \n4,20 m eingelagert \nwerden soll?"},{"type":"folie","nr":96,"text":"\u00dcbungsbeispiele\n\n6.\n\n7.\n\nJa\n\nWie schwer darf eine Last max. sein, wenn diese \neinen Lastschwerpunktabstand von 700 mm besitzt \nund in einer H\u00f6he von ca. 4 m eingelagert werden \nsoll?\n\n900 kg\n\nBesitzt ein Stapler \nmit nebenstehen-\nden Diagramm aus-\nreichende Trag-\nf\u00e4higkeit f\u00fcr eine \nLast von 700 kg\n( Lastschwerpunkt-\nabstand 800 mm),\nwenn diese in 5,10 m eingelagert werden soll?"},{"type":"folie","nr":97,"text":"Traglastdiagramm\n\nKurvendiagramm mit Hubh\u00f6hen-Kennlinien"},{"type":"folie","nr":98,"text":"Zahlendiagramm mit Hubh\u00f6henangaben\n\nTraglastdiagramm\n\n750\n1200\n1400\n700\n900\n950        \n530\n650\n730\nLast in kg\n2500\n3600\n 4100\nHub\nin mm\n700\n600\n500\nLastschwerpunktabstand in mm"},{"type":"traglast"},{"type":"folie","nr":99,"text":"Bisher wurde betrachtet, welche Auswirkungen sich \n   ergeben, wenn sich der Gesamtschwerpunkt des \n   Staplers in Richtung der Vorderachse (Kippachse)  \n   bewegt. \n   Ist die Last zu schwer, kann der \n   Stapler wie bei einer Wippe nach \n   vorne kippen.\n\nStandsicherheit bei Kurvenfahrten\n\n Weitaus schlimmere Folgen f\u00fcr \n   den Fahrer entstehen jedoch \n   meist erst dann, wenn der \n   Stapler in der Kurvenfahrt \n   zur Seite kippt. \n   Lebensgef\u00e4hrliche Verletzungen \n   k\u00f6nnen die Folge sein."},{"type":"folie","nr":100,"text":"Standsicherheit und Fliehkraft\n\n Beim Kurvenfahren wirken \n   seitliche Kr\u00e4fte (Fliehkraft) auf \n   den Stapler ein.\n   Die H\u00f6he der Fliehkraft h\u00e4ngt  \n   ma\u00dfgeblich von der \n   Geschwindigkeit und dem \n   Kurvenradius ab.\n\n Die Fahrgeschwindigkeit wirkt \n   sich besonders stark auf die \n   Fliehkraft aus. So bedeutet \n   z.B. eine Verdoppelung der \n   Geschwindigkeit bei gleichem \n   Kurvenradius eine \n   Vervierfachung der Fliehkraft.\n\nFliehkraft\n\nFliehkraft"},{"type":"folie","nr":101,"text":"Kippkantendreieck\n\n Im Gegensatz zu einem PKW, \n   dessen Kippkanten seitlich am \n   Fahrzeug verlaufen und  dadurch \n   ein Standviereck bilden, verlaufen \n   beim Stapler die Kippkanten \n   von den Vorderr\u00e4dern zu nur \n   einem Auflagepunkt an der \n   Hinterachse.\n Beim Dreiradstapler bilden die \n   3 R\u00e4der am Boden das \n   Standdreieck."},{"type":"folie","nr":102,"text":"Pendelachse\n\n Auch beim Vierradstapler\n   ergibt sich ein Standdreieck.\n   Das liegt daran, dass die\n   Hinter- bzw. Lenkachse\n   pendelnd an nur einem Punkt\n   am Fahrgestell befestigt ist.\n\n Beim Vierradstapler bildet die \n   Mitte der pendelnd gelagerten \n   Achse die Spitze des \n   Standdreiecks."},{"type":"folie","nr":103,"text":"Kippkantendreieck\n\n Der seitliche Abstand des\n   Gesamtschwerpunktes zu den\n   Kippkanten ist f\u00fcr die Standsicherheit\n   des Staplers ma\u00dfgeblich.\n Beim unbeladenen Stapler befindet\n   sich der Schwerpunkt nahe an den \n   seitlichen Kippkanten.\n\nFolgerung daraus:\n\nBei Kurvenfahrten mit dem \nunbeladenen Stapler ist eine\nhohe Kippgefahr gegeben!"},{"type":"folie","nr":104,"text":"Bei mehr als 80 % der\n   t\u00f6dlichen Kippunf\u00e4lle \n   waren die Stapler unbeladen!\n\nStandsicherheit und Tragf\u00e4higkeit"},{"type":"folie","nr":105,"text":"Mit Last liegt der Gesamtschwer-\n   punkt n\u00e4her an der Vorderachse; \n   der Abstand zu den seitlichen\n   Kippkanten ist wesentlich gr\u00f6\u00dfer.\n\nKippkantendreieck\n\n Dadurch erh\u00f6ht sich bei \n   bodennah aufgenommener \n   Last die Standsicherheit \n   des Staplers."},{"type":"folie","nr":106,"text":"Standsicherheit und Tragf\u00e4higkeit\n\n Wird die Last allerdings angehoben, bewegt sich \n   nicht nur der Lastschwerpunkt, sondern auch der \n   Gesamtschwerpunkt nach oben.\n\n Mit dem h\u00f6heren Gesamtschwerpunkt nimmt die \n   Standsicherheit \n   des Staplers ab.\n\nGesamtschwerpunkt\nLastschwerpunkt"},{"type":"folie","nr":107,"text":"Standsicherheit und Tragf\u00e4higkeit\n\nGrunds\u00e4tzliche Verhaltensweisen:\n\n Den Stapler nicht \u00fcberlasten!\n\n Die Lasten bis zum Gabelr\u00fccken aufnehmen!\n\n Die H\u00f6he des Gesamtschwerpunktes klein halten! \n\n Kurven mit angepasster Geschwindigkeit \n   durchfahren!\n\n Kurven mit m\u00f6glichst gro\u00dfem Radius fahren!\n\n Starkes Beschleunigen und Bremsen vermeiden!"},{"type":"quiz","frage":"Was passiert wenn der Gesamtschwerpunkt \u00fcber die Vorderachse wandert?","optionen":["Der Stapler wird langsamer","Der Stapler kippt nach vorne","Der Stapler lenkt automatisch","Die Bremse greift"],"richtig":1,"qi":10},{"type":"quiz","frage":"Bei welchem Anteil t\u00f6dlicher Kippunf\u00e4lle waren die Stapler unbeladen?","optionen":["mehr als 30%","mehr als 50%","mehr als 80%","mehr als 90%"],"richtig":2,"qi":11},{"type":"quiz","frage":"Wo m\u00fcssen Lasten aufgenommen werden um den Lastarm m\u00f6glichst klein zu halten?","optionen":["An den Gabelspitzen","In der Mitte der Zinken","Am Gabelr\u00fccken","Ist egal"],"richtig":2,"qi":12},{"type":"kapitel_abschluss","kapitel_nr":7,"kapitel_name":"Tragf\u00e4higkeit & Standsicherheit"},{"type":"folie","nr":108,"text":"Ausbildung von Staplerfahrern\n\nThema:\nStaplerbetrieb  -Allgemeines\nAusgabe Juni 2008"},{"type":"folie","nr":109,"text":"Staplerbetrieb - Allgemeines\n\n\u00dcbersicht\n\nArten von Flurf\u00f6rderzeugen\nBetriebsanleitung und Betriebsanweisung\nT\u00e4gliche Einsatzpr\u00fcfung\nBestimmungsgem\u00e4\u00dfe Verwendung\nAufnehmen, Beladung und Absetzen von Lasten\nVerfahren von Lasten \nSichtverh\u00e4ltnisse"},{"type":"folie","nr":110,"text":"Staplerbetrieb - Allgemeines\n\n\u00dcbersicht\n\nBefahren von Aufz\u00fcgen\nVerhaltensweisen w\u00e4hrend des Betriebes\nBe- und Entladen von Fahrzeugen und Wechselauf-\nbauten\nFl\u00fcssiggasantrieb\nAbgase\nVerlassen des Staplers"},{"type":"folie","nr":111,"text":"Arten von Flurf\u00f6rderzeugen\n\nGabelhubwagen\n\nMitg\u00e4nger-\nflurf\u00f6rderzeug\n\nMitg\u00e4ngerflurf\u00f6rder-\nzeug mit Fahrer-\nstandplattform\n\nSchlepper"},{"type":"folie","nr":112,"text":"Arten von Flurf\u00f6rderzeugen\n\nGabelstapler\n\nContainerstapler\n\nKommissionier-\nstapler\n\nSchubmast-\nstapler"},{"type":"folie","nr":113,"text":"Antriebsarten\n\nElektromotor:\n\nVorteile:     ger\u00e4uscharm, kein Abgas\n\nNachteile:  Ladezeiten der Batterie,\n                   begrenzte Einsatzdauer\n\nVerbrennungsmotor:\n\nVorteile:     hohe Antriebsleistung\n\nNachteile:  in geschlossenen bzw. \n                   teilweise geschlossenen \n                   R\u00e4umen nur  bedingt \n                   einsetzbar z.B. mit\n                   speziellen Filtersystemen"},{"type":"folie","nr":114,"text":"Fahrerr\u00fcckhalteeinrichtungen\n\nGeschlossene Fahrerkabine\nFahrer ist \u201ebauartbedingt\u201c gesch\u00fctzt\nVoraussetzung: feste und w\u00e4hrend \ndes Betriebes geschlossene T\u00fcren!\n\nB\u00fcgelt\u00fcren\n\nM\u00f6glichkeiten, um die Risiken durch \neinen kippenden Stapler zu begrenzen:\n\nSeitliche B\u00fcgel verhindern ebenfalls\nein Herausschleudern des Fahrers"},{"type":"folie","nr":115,"text":"Fahrerr\u00fcckhalteeinrichtungen\n\nNetz mit Schwenkb\u00fcgel\nNetz wird zwischen schenkbarem B\u00fcgel und  Fahrerschutzdach aufgespannt\n\nSitzb\u00fcgel\n\nSeitliche B\u00fcgel verhindern ebenfalls\nein Herausschleudern des Fahrers"},{"type":"folie","nr":116,"text":"Fahrerr\u00fcckhalteeinrichtungen\n\nBeckengurt\n\nKosteng\u00fcnstigere L\u00f6sung,  aber:\n bei h\u00e4ufigem Auf- und Absteigen \n   nimmt die Bereitschaft ab, den \n   Gurt zu benutzen\n\nIn jedem Falle wichtig:\n\nErst gurten, dann starten!\n\nBeckengurt mit B\u00fcgel\n\nEine Weiterentwicklung des \nBeckengurtprinzips, die den \nAngurtvorgang erleichtert"},{"type":"folie","nr":117,"text":"Fahrerr\u00fcckhalteeinrichtungen"},{"type":"video","titel":"Video: Fahrerr\u00fcckhalteeinrichtungen","videotyp":"sharepoint","videosrc":"https://ausbildung1986.sharepoint.com/sites/AusbildungZentrale/_layouts/15/embed.aspx?UniqueId=9ab11b83-9a9b-46ee-b1c6-454154327092&embed=%7B%22ust%22%3Atrue%2C%22hv%22%3A%22CopyEmbedCode%22%7D&referrer=StreamWebApp&referrerScenario=EmbedDialog.Create"},{"type":"folie","nr":118,"text":"Staplerbetrieb - Allgemeines\n\nBetriebsanleitung und Betriebsanweisung\n\nBetriebsanleitung:\n\n Ist vom Staplerhersteller \n   mitzuliefern\n\n Beschreibt z.B. alle Funktionen, \n   Bedieneinrichtungen, Einsatzarten, \n   Betriebsstoffe, Pflege- und \n   Wartungsintervalle des \n   Staplers"},{"type":"folie","nr":119,"text":"Betriebsanweisung:\n\n ist vom Unternehmer in schriftlicher, \n   allgemein verst\u00e4ndlicher Form \n   festzulegen und an geeigneter Stelle\n   im Betrieb bekannt zu geben\n\nStaplerbetrieb - Allgemeines\n\n kann als Grundlage f\u00fcr die j\u00e4hrlich\n   durchzuf\u00fchrende Unterweisung verwendet werden\n\n ist von den Fahrern zu beachten\n\n hat die Betriebsanleitung des \n   Herstellers und die \u00f6rtlichen sowie  \n   betrieblichen Gegebenheiten zu \n   ber\u00fccksichtigen"},{"type":"folie","nr":120,"text":"Staplerbetrieb - Allgemeines\n\nT\u00e4gliche Einsatzpr\u00fcfung:\n\n Ist vom Fahrer vor Einsatzbeginn\n   nach den Vorgaben in der\n   Betriebsanleitung durchzuf\u00fchren\n\n Bei M\u00e4ngeln, die die Sicherheit \n   beeintr\u00e4chtigen (z.B. verbogene \n   Gabelzinke), Stapler nicht in Betrieb \n   setzen und M\u00e4ngel dem Unternehmer \n   oder Vorgesetzten melden\n\n M\u00e4ngel nur durch fachkundige \n   Personen, wie z.B. Monteure \n   der Hersteller, beseitigen lassen"},{"type":"folie","nr":121,"text":"M\u00e4ngel, die die Sicherheit beeintr\u00e4chtigen, sind z.B.:\n\n schadhafte Reifen bzw. fehlerhafter Luftdruck\n\n unwirksame Betriebs- und Feststellbremse\n\n ausgeschlagene und verformte Gabelzinken-\n   aufh\u00e4ngungen\n\n defekte Sicherungen der Gabelzinken gegen \n   Herausheben und Verschieben\n\nStaplerbetrieb - Allgemeines\n\n Risse an tragenden Teilen (z.B. Hubmast)"},{"type":"folie","nr":122,"text":"Leckagen im Bereich der Hydraulik (z.B. Schl\u00e4uche,\n   Hubzylinder, Neigezylinder, ....)\n\n nicht ausreichend und gleichm\u00e4\u00dfig gespannte \n   Hubketten\n\n Sch\u00e4den an den Gabelzinken (verbogen, Risse, \n   stark abgeschliffen) \n\n H\u00f6henunterschiede zwischen den zur Aufnahme\n   verwendeten Gabelzinken\n\nStaplerbetrieb - Allgemeines\n\nM\u00e4ngel"},{"type":"folie","nr":123,"text":"Bestimmungsgem\u00e4\u00dfe Verwendung:\n\nergibt sich grunds\u00e4tzlich aus der Betriebsanleitung \ndes Herstellers;  z.B. sind bei vorhandenen \nFahrerr\u00fcckhalteeinrichtungen\n\n bei einer Fahrerkabine die T\u00fcren\n   zu schlie\u00dfen\n\n die B\u00fcgelt\u00fcren zu schlie\u00dfen\n\n die Beckengurte anzulegen\n\nStaplerbetrieb - Allgemeines"},{"type":"folie","nr":124,"text":"Beladung:\n\n hat so zu erfolgen, dass der Stapler nicht \n   \u00fcberlastet  wird und die Last nicht \n   herabfallen und sich verschieben \n   kann\n\n f\u00fcr den Transport von Kleinteilen, \n   die auf den Fahrer herabfallen \n   k\u00f6nnen, sind Stapler zu verwenden, \n   die mit einem Lastschutzgitter \n   ausgestattet sind\n\nStaplerbetrieb - Allgemeines"},{"type":"folie","nr":125,"text":"Aufnehmen von Lasten:\n\n gerade vor die Last fahren\n\n Hubmast senkrecht stellen\n\n Last bodenfrei anheben\n\n Hubmast zur\u00fcckneigen\n\n vor R\u00fcckw\u00e4rtsfahrt beidseitig nach hinten schauen\n\n langsam r\u00fcckw\u00e4rts fahren\n\nStaplerbetrieb - Allgemeines\n\n Gabelzinken langsam einfahren\n   und Last bis Gabelr\u00fccken\n   aufnehmen"},{"type":"folie","nr":126,"text":"Absetzen von Lasten:\n\n an Regal heranfahren\n\n Hubmast senkrecht stellen\n\n Last anheben\n\n in Regal einfahren\n\n Last absetzen\n\n beidseitig nach hinten schauen \n   und vom Regal zur\u00fccksto\u00dfen\n\n Gabelzinken absenken\n\n Hubmast zur\u00fcckneigen und wegfahren\n\nStaplerbetrieb - Allgemeines"},{"type":"folie","nr":127,"text":"Staplerbetrieb - Allgemeines\n\nVerfahren von Lasten:\n\n mit zur\u00fcckgeneigtem Hubmast, \n   um unbeabsichtigtes Bewegen \n   der Last zu vermeiden\n\n mit bodenfrei angehobenem Lastaufnahmemittel, \n   d.h. max. 50 cm"},{"type":"folie","nr":128,"text":"Staplerbetrieb - Allgemeines\n\nVerfahren von Lasten \u2013 Ausnahme:\n\nMit speziellen Staplern (z.B.  \nContainerstapler) d\u00fcrfen die \nLasten in angehobener Stellung \nverfahren werden, falls \n\n dies vom Hersteller als \n   bestimmungsgem\u00e4\u00dfe \n   Verwendung vorgesehen ist\n   oder\n\n eine ausreichende Stand-\n   sicherheit durch ein \n   Sachverst\u00e4ndigengutachten \n   nachgewiesen ist"},{"type":"folie","nr":129,"text":"Steigungen/Gef\u00e4lle:\n\nBeim Befahren von Steigungen/\nGef\u00e4lle ist die Last immer \nbergseitig zu f\u00fchren, damit\n die Last nicht abrutschen kann\n die Standsicherheit erh\u00f6ht wird,\n   (der Lastarm, senkrecht auf\n   die Fahrbahn gelotet, verringert sich)\n\nDas Wenden auf Gef\u00e4llstrecken ist wegen der hohen\nKippgefahr nicht zul\u00e4ssig!\n\nStaplerbetrieb - Allgemeines"},{"type":"folie","nr":130,"text":"Sichtverh\u00e4ltnisse:\n\n Stapler d\u00fcrfen nur verfahren werden, wenn der\n   Fahrer ausreichende Sicht auf die Fahrbahn hat!\n\nStaplerbetrieb - Allgemeines\n\n Ist die Last zu gro\u00df und ein Absenken nicht m\u00f6glich, \n   muss eingewiesen bzw. r\u00fcckw\u00e4rts gefahren werden.\n\n Als Faustformel f\u00fcr die ausreichende Sicht gilt: \n   Mit der Last soweit runter, dass in Fahrtrichtung \n   nicht mehr als 10 Meter vom Boden \n   verdeckt sind.\n Abh\u00e4ngig von den betrieblichen Verh\u00e4ltnissen\n   k\u00f6nnen jedoch kleinere Abst\u00e4nde\n   erforderlich sein."},{"type":"folie","nr":131,"text":"Top \u2013 Sicht: Was der Staplerfahrer sieht"},{"type":"folie","nr":132,"text":"Fahrgeschwindigkeit:\n\n Die Geschwindigkeit ist den betrieblichen\n   Gegebenheiten, der Fahrbahnbeschaffenheit\n   und den Lasten anzupassen.\n Vor allem Kurven sind langsam zu durchfahren \n\n Ein Gro\u00dfteil der t\u00f6dlichen\n   Unf\u00e4lle ereignet sich durch zu\n   hohe Fahrgeschwindigkeiten\n   und angehobenen Gabelzinken,\n   insbesondere auch bei Fahrten\n   ohne Lasten.\n\nStaplerbetrieb - Allgemeines"},{"type":"folie","nr":133,"text":"Befahren von Aufz\u00fcgen:  \n\n Tragf\u00e4higkeit des Aufzuges \n   sowie die zul\u00e4ssige Boden-\n   belastbarkeit beachten\n\n Nur freigegebene Aufz\u00fcge \n   benutzen\n\n Im Aufzug nicht ruckartig bremsen\n   und beschleunigen\n\n Ausreichenden Abstand zu den Fahrschachtw\u00e4nden \n   einhalten (mind. 0,1 m) \n\nStaplerbetrieb - Allgemeines\n\nVerhaltensweisen:"},{"type":"folie","nr":134,"text":"Verhaltensweisen beim Befahren von Aufz\u00fcgen:\n\n Vom Stapler absteigen und \n   im Bereich der Steuerung \n   des Fahrkorbes aufhalten\n\n Stapler mittig im Aufzug \n   abstellen\n\n Darauf achten, dass sich \n   w\u00e4hrend der Einfahrt bzw. \n   Ausfahrt keine Personen \n   im Fahrkorb aufhalten\n\nStaplerbetrieb - Allgemeines\n\n Feststellbremse bet\u00e4tigen"},{"type":"folie","nr":135,"text":"Verhaltensweisen w\u00e4hrend des Betriebes:\n\n Bedienen des Staplers nur von den\n   bestimmungsgem\u00e4\u00df vorgesehenen Steuerpl\u00e4tzen\n\n Bei allen Aktionen darauf achten, dass Personen\n   nicht gef\u00e4hrdet werden\n\n Auf- und Absteigen nur bei stillstehendem Stapler\n\nNicht zul\u00e4ssig:\n\n auf der Last, unter der angehobenen Last bzw. unter \n   dem angehobenen Lastaufnahmemittel aufhalten\n\nStaplerbetrieb - Allgemeines\n\n das angehobene Lastaufnahmemittel betreten\n   (sofern es hierf\u00fcr nicht eingerichtet ist)\n\n auf dem Stapler mitfahren (ohne Beifahrersitz)"},{"type":"folie","nr":136,"text":"Be- und Entladen von Fahrzeugen:\n\n Fahrzeuge m\u00fcssen gegen Rollen, ggf. \n   auch gegen Kippen gesichert sein\n\nVor der Be- und Entladung ist sicherzustellen:\n\n Sicherung gegen Wegrollen ist              \n   erf\u00fcllt, wenn die Feststellbremse\n   angezogen ist und Unterlegkeile \n   vor die nicht gelenkten R\u00e4der \n   gelegt sind\n\n Bei abgesattelten Sattelanh\u00e4ngern sind \n   erforderlichenfalls zus\u00e4tzliche St\u00fctzeinrichtungen\n   zu unterbauen\n\nStaplerbetrieb - Allgemeines"},{"type":"folie","nr":137,"text":"Be- und Entladen von Fahrzeugen:\n\n Bei Anh\u00e4ngern mit Drehschemel-Lenkung ist die\n   Vorderachse gerade auszurichten, da sonst hohe\n   Kippgefahr besteht\n\n Staplerfahrer und Fahrer \n   des Fahrzeuges m\u00fcssen \n   sich vorher hinsichtlich des \n   Be- und Entladevorganges  \n   verst\u00e4ndigen, um Fahrzeug-\n   bewegungen w\u00e4hrend der \n   Ladevorg\u00e4nge zu verhindern\n\nStaplerbetrieb - Allgemeines"},{"type":"folie","nr":138,"text":""},{"type":"folie","nr":139,"text":"Be- und Entladen von Wechselaufbauten:\n\nAbgestellte Wechselaufbauten d\u00fcrfen nur befahren\nwerden, wenn\n\n sie f\u00fcr die auftretenden Belastungen ausgelegt sind\n\nStaplerbetrieb - Allgemeines\n\n die Aufstellfl\u00e4che ausreichend tragf\u00e4hig ist\n\n sie gegen Kippen gesichert sind"},{"type":"folie","nr":140,"text":"Fl\u00fcssiggasantrieb:\n\nBedingungen f\u00fcr Stapler mit Fl\u00fcssiggas:\n\n D\u00fcrfen nur in ausreichend\n   durchl\u00fcfteten R\u00e4umen abgestellt\n   werden (\u00fcber Erdgleiche)\n\n D\u00fcrfen nur in einem Abstand von\n   mindestens 3 m vor \u00d6ffnungen zu\n   Kellerr\u00e4umen, Kan\u00e4len, Gruben u.\u00e4.\n   abgestellt werden \n\n Regelm\u00e4\u00dfige \u00dcberpr\u00fcfung der Fl\u00fcssiggasanlage und \n   des Schadstoff-Gehaltes im Abgas ist erforderlich  \n\nStaplerbetrieb - Allgemeines"},{"type":"folie","nr":141,"text":"Abgase:\n\nBeim Einsatz von Dieselstaplern in \nganz oder teilweise geschlossenen \nR\u00e4umen ist zu beachten, dass: \n\nStaplerbetrieb - Allgemeines\n\n schwefelarmer Kraftstoff \n   verwendet wird\n\n das Wartungskonzept durchf\u00fchrt\n   ist,  und\n\n nur Ger\u00e4te verwendet werden, \n   die mit einer Abgasreinigung \n   (z.B. Dieselpartikelfilter) aus-\n   ger\u00fcstet sind"},{"type":"folie","nr":142,"text":"Staplerbetrieb - Allgemeines\n\nAbgase:\n\nBeim Einsatz von Gasstaplern \nin R\u00e4umen nur Stapler verwenden, \n\n bei denen der Schadstoff-\n   anteil im Abgas regelm\u00e4\u00dfig \n   \u00fcberpr\u00fcft wird\n\n die mit einem Katalysator \n   ausger\u00fcstet sind\n\nCO -Messung"},{"type":"folie","nr":143,"text":"Verlassen des Staplers:\n\nSicherstellen, dass der Stapler kein Hindernis auf\nVerkehrs- und Fluchtwegen darstellt und keine\nZug\u00e4nge zu Sicherheits- oder anderen wichtigen \nBetriebseinrichtungen versperrt.\n\nVor dem Verlassen des Staplers:\n die Feststellbremse bet\u00e4tigen\n die Gabelzinken in die tiefste \n   Stellung absenken und die \n   Spitzen nach unten neigen\n den Motor abstellen\n den Schl\u00fcssel abziehen und mitnehmen\n\nStaplerbetrieb - Allgemeines"},{"type":"quiz","frage":"In welcher Stellung muss der Hubmast beim Verfahren von Lasten sein?","optionen":["Senkrecht","Nach vorne geneigt","Zur\u00fcckgeneigt","Spielt keine Rolle"],"richtig":2,"qi":13},{"type":"quiz","frage":"Wie hoch darf die Last beim Verfahren max. bodenfrei angehoben sein?","optionen":["20 cm","30 cm","50 cm","80 cm"],"richtig":2,"qi":14},{"type":"quiz","frage":"Was ist beim Verlassen des Staplers ZUERST zu tun?","optionen":["Schl\u00fcssel abziehen","Gabelzinken absenken","Feststellbremse bet\u00e4tigen","Motor abstellen"],"richtig":2,"qi":15},{"type":"kapitel_abschluss","kapitel_nr":8,"kapitel_name":"Staplerbetrieb \u2014 Allgemeines"},{"type":"folie","nr":144,"text":"Ausbildung von Staplerfahrern\n\nThema:\nStaplerbetrieb  -Sondereins\u00e4tze\nAusgabe Juni 2008"},{"type":"folie","nr":145,"text":"Staplerbetrieb - Sondereins\u00e4tze\n\n\u00dcbersicht\n\nEinsatz von Anbauger\u00e4ten\nMitnahme von Personen\nVerfahren von Anh\u00e4ngern und Schienenfahrzeugen\nEinsatz von Arbeitsb\u00fchnen\nTransport h\u00e4ngender Lasten"},{"type":"folie","nr":146,"text":"Einsatz von Anbauger\u00e4ten:\n\nAnbauger\u00e4te d\u00fcrfen nur eingesetzt \nwerden, wenn Anbauger\u00e4te und Stapler\naufeinander abgestimmt sind  (z.B. Trag-\nf\u00e4higkeit, Befestigung, Energiezufuhr) \n\nEs ist darauf zu achten, dass\n Anbauger\u00e4te bestimmungsgem\u00e4\u00df\n   befestigt werden\n die Tragf\u00e4higkeit des Anbauger\u00e4tes und\n   des Staplers nicht \u00fcberschritten wird\n\nAnbauger\u00e4te sind regelm\u00e4\u00dfig zu pr\u00fcfen"},{"type":"folie","nr":147,"text":"Mitnahme von Personen:\n\nBedingungen:\n\n Mitfahrt ist durch die\n   Betriebsanweisung geregelt\n\n Sitz- oder Standpl\u00e4tze sowie\n   Haltegriffe sind vorhanden\n\n Zus\u00e4tzliche Fahrerr\u00fcckhalteeinrichtung ist \n   vorhanden"},{"type":"folie","nr":148,"text":"Verfahren von Anh\u00e4ngern:"},{"type":"folie","nr":149,"text":"Verfahren von Anh\u00e4ngern:\n\nAnh\u00e4nger d\u00fcrfen nur \nverfahren werden, wenn:\n\nDie zul\u00e4ssige Anh\u00e4ngelast mu\u00df \nbekannt sein und darf nicht \n\u00fcberschritten werden \n\n der Zug bei allen Bewegungen \n   gebremst werden kann\n\n Stapler und Anh\u00e4nger\n   hierf\u00fcr eingerichtet sind,\n   d.h. eine entsprechende Anh\u00e4nge-\n   vorrichtung vorhanden ist"},{"type":"folie","nr":150,"text":"Bewegen von Schienenfahrzeugen:\n\nMit einer besonderen Einrichtung, \nwie z.B. einer Slip-Kupplung, ist \ndas Verziehen mit Seilen zul\u00e4ssig,    \n wenn sich der Stapler au\u00dferhalb \n   des Fahrbereiches des Schienen-\n   fahrzeuges befindet\n wenn der Staplerfahrer den Gleis-\n   bereich beobachten kann oder\n   eingewiesen wird\n wenn eine Bremseinrichtung \n   vorhanden ist"},{"type":"folie","nr":151,"text":"Bewegen von Schienenfahrzeugen:\n\nDr\u00fccken ist zul\u00e4ssig,  wenn:\n der Stapler daf\u00fcr eingerichtet \n   ist, z.B. mit Druckbohle\n spezielle Rangierger\u00e4te \n   verwendet werden\n der Staplerfahrer eingewiesen \n   ist\n eine Bremseinrichtung \n   vorhanden ist\n\nVerwendung von losen Stempeln\noder Dr\u00fccken mit Teilen des \nStaplers ist nicht zul\u00e4ssig"},{"type":"folie","nr":152,"text":"Einsatz mit Arbeitsb\u00fchnen:\n\nGrunds\u00e4tzliches:\n\nDas Hochfahren von Personen mittels Stapler ist nur \nzul\u00e4ssig, wenn ein ausreichend tragf\u00e4higer Stapler \nund eine vorschriftsm\u00e4\u00dfige Arbeitsb\u00fchne verwendet \nwird!\n\nUnzul\u00e4ssig!"},{"type":"folie","nr":153,"text":"Bereitstellung eines Staplers mit ausreichender \nTragf\u00e4higkeit, die gew\u00e4hrleistet ist, wenn: \n\n der Hersteller diesen Einsatz als bestimmungs-\n   gem\u00e4\u00dfe Verwendung vorgesehen hat  \n   oder\n die Standsicherheit durch ein Sachverst\u00e4ndigen-\n   gutachten nachgewiesen ist\n\nEinsatz mit Arbeitsb\u00fchnen:\n\nAnforderungen an den Stapler:"},{"type":"folie","nr":154,"text":"Einsatz mit Arbeitsb\u00fchnen:\n\nBei Frontstaplern gilt die Tragf\u00e4higkeit auch als\nausreichend, wenn:\n\n die Bodenfl\u00e4che der Arbeitsb\u00fchne die Abmessungen\n   einer Euro-Palette nicht \u00fcberschreitet\n\n sich der Standplatz der mitfahrenden Person(en) in\n   H\u00f6he der Gabelzinken befindet\n\n die Tragf\u00e4higkeit des Staplers in der betreffenden\n   H\u00f6he mindestens das 5fache des Gewichtes betr\u00e4gt,\n   das sich aus dem Eigengewicht der Arbeitsb\u00fchne,\n   dem Gewicht der mitfahrenden Person(en) und der\n   Zuladung ergibt"},{"type":"folie","nr":155,"text":"Einsatz mit Arbeitsb\u00fchnen:\n\nAusf\u00fchrung einer Arbeitsb\u00fchne:\n\n Absturzsicherung, bestehend aus\n   Hand- Knie- und Fu\u00dfleiste\n\n Durchgriffsicherer R\u00fcckenschutz\n\n Einfahrtaschen an der Unterseite\n\n Sicherung gegen Verrutschen auf\n   den Gabelzinken\n\n \u00d6ffnen der Zugangst\u00fcr nur \n   nach innen"},{"type":"folie","nr":156,"text":"Einsatz mit Arbeitsb\u00fchnen:\n\nVerhaltensweisen:\n\n Zwischen dem Fahrer und den Personen in der \n   Arbeitsb\u00fchne muss eine einwandfreie \n   Verst\u00e4ndigung gew\u00e4hrleistet sein\n\n Der Fahrer darf seinen Platz auf dem Stapler bei \n   hochgefahrener Arbeitsb\u00fchne nicht verlassen\n\n Der Standplatz auf der Arbeitsb\u00fchne darf nicht \n   durch Hilfsmittel erh\u00f6ht werden\n\n Der Stapler darf bei besetzter und angehobener\n   Arbeitsb\u00fchne nur zur Feinpositionierung an der\n   Einsatzstelle verfahren werden"},{"type":"folie","nr":157,"text":"Einsatz mit Arbeitsb\u00fchnen:\n\nBei der Verwendung von Arbeitsb\u00fchnen zu Arbeiten\nan Regalen oder in Schmalgassen m\u00fcssen diese so\nausgef\u00fchrt sein, dass mitfahrende Personen gegen\nQuetsch- und Schergefahren zwischen Arbeitsb\u00fchne\nund Regal gesch\u00fctzt sind, z.B.\n Zustimmungsschaltung f\u00fcr jede \n   mitfahrende Person oder\n allseitig geschlossene, mindestens \n   1,8 m hohe und durchgriffsichere \n   Umz\u00e4unung"},{"type":"folie","nr":158,"text":"Transport h\u00e4ngender Lasten:\n\n Aufgrund der hohen Kippgefahr\n   nur mit geeigneten Staplern\n   (Standsicherheit) zul\u00e4ssig\n\n Personen, die h\u00e4ngende Lasten\n   w\u00e4hrend der Fahrbewegung mit\n   Halteseilen oder Haltestangen \n   f\u00fchren, d\u00fcrfen sich nicht in der \n   Fahrspur und nicht vor der Last \n   aufhalten\n\n Pendelbewegung der Last k\u00f6nnen\n   durch spezielle Anbauger\u00e4te\n   eingeschr\u00e4nkt werden"},{"type":"quiz","frage":"Was ist beim Einsatz von Arbeitsb\u00fchnen verboten?","optionen":["Verst\u00e4ndigung zwischen Fahrer und Personen","Standplatz durch Hilfsmittel erh\u00f6hen","Absturzsicherung verwenden","R\u00fcckenschutz montieren"],"richtig":1,"qi":16},{"type":"kapitel_abschluss","kapitel_nr":9,"kapitel_name":"Staplerbetrieb \u2014 Sondereins\u00e4tze"},{"type":"folie","nr":159,"text":"Arbeitsb\u00fchnen"},{"type":"video","titel":"Video: Arbeitsb\u00fchnen","videotyp":"sharepoint","videosrc":"https://ausbildung1986.sharepoint.com/sites/AusbildungZentrale/_layouts/15/embed.aspx?UniqueId=f90232fe-39b8-40db-a81a-88ef3e589e8c&embed=%7B%22ust%22%3Atrue%2C%22hv%22%3A%22CopyEmbedCode%22%7D&referrer=StreamWebApp&referrerScenario=EmbedDialog.Create"},{"type":"folie","nr":160,"text":"Ausbildung von Staplerfahrern\n\nThema:\nPr\u00fcfungen\nAusgabe Juni 2008"},{"type":"folie","nr":161,"text":"Pr\u00fcfungen\n\n\u00dcbersicht\n\nT\u00e4gliche Einsatzpr\u00fcfung\nRegelm\u00e4\u00dfige Pr\u00fcfungen durch \nbef\u00e4higte Personen\nPr\u00fcfnachweis\n\nPr\u00fcfungen"},{"type":"folie","nr":162,"text":"T\u00e4gliche Einsatzpr\u00fcfung:\n\n Ist vom Fahrer vor Einsatzbeginn\n   nach den Vorgaben in der\n   Betriebsanleitung durchzuf\u00fchren\n\n Bei M\u00e4ngeln, die die Sicherheit \n   beeintr\u00e4chtigen (z.B. verbogene \n   Gabelzinke), Stapler nicht in Betrieb \n   setzen und M\u00e4ngel dem Unternehmer \n   oder Vorgesetzten melden\n\n M\u00e4ngel nur durch fachkundige \n   Personen, wie z.B. Monteure \n   der Hersteller, beseitigen lassen\n\nPr\u00fcfungen"},{"type":"folie","nr":163,"text":"M\u00e4ngel, die die Sicherheit beeintr\u00e4chtigen, sind z.B.\n\n schadhafte Reifen bzw. fehlerhafter Luftdruck\n\n unwirksame Betriebs- und Feststellbremse\n\n ausgeschlagene und verformte Gabelzinken-\n   aufh\u00e4ngungen\n\n defekte Sicherungen der Gabelzinken gegen \n   Herausheben und Verschieben\n\n nicht ausreichend und gleichm\u00e4\u00dfig gespannte \n   Hubketten\n\nM\u00e4ngel, die die Sicherheit beeintr\u00e4chtigen, sind z.B.:\n\nT\u00e4gliche Einsatzpr\u00fcfung:"},{"type":"folie","nr":164,"text":"Leckagen im Bereich der Hydraulik  (z.B. Schl\u00e4uche\n   Hubzylinder, Neigezylinder, ...)\n\n Sch\u00e4den an den Gabelzinken (verbogen, Risse, \n   stark abgeschliffen) \n\n Risse an tragenden Teilen (z.B. Hubmast)\n\n H\u00f6henunterschiede zwischen den zur Aufnahme\n   verwendeten Gabelzinken\n\nT\u00e4gliche Einsatzpr\u00fcfung:"},{"type":"folie","nr":165,"text":"Pr\u00fcfungen\n\nRegelm\u00e4\u00dfige Pr\u00fcfungen:\n\n Stapler und Anbauger\u00e4te m\u00fcssen\n   in regelm\u00e4\u00dfigen Zeitabst\u00e4nden von\n   einer bef\u00e4higten Person \u00fcberpr\u00fcft\n   werden\n\n Zu den bef\u00e4higten Personen \n   z\u00e4hlen z.B. Werkstattmeister oder\n   Monteure der Hersteller\n\n Pr\u00fcffristen sind im Rahmen einer\n   Gef\u00e4hrdungsbeurteilung festzulegen  - bew\u00e4hrt \n   haben sich Pr\u00fcfungen in Abst\u00e4nden von l\u00e4ngstens \n   einem Jahr -"},{"type":"folie","nr":166,"text":"Pr\u00fcfungen\n\nPr\u00fcfnachweis:\n\n\u00dcber die wiederkehrenden Pr\u00fcfungen\nist ein Pr\u00fcfnachweis zu f\u00fchren, z.B. in\nForm eines Pr\u00fcfbuches\n\nIm Pr\u00fcfnachweis muss enthalten sein:\n Datum und Umfang der Pr\u00fcfung\n Ergebnis der Pr\u00fcfung mit Angabe der M\u00e4ngel\n Angabe \u00fcber notwendige Nachpr\u00fcfungen\n Beurteilung, ob dem Weiterbetrieb Bedenken \n   entgegenstehen\n Name und Anschrift des Pr\u00fcfers\n Vermerk \u00fcber die Beseitigung der M\u00e4ngel"},{"type":"folie","nr":167,"text":"Pr\u00fcfungen\n\nPr\u00fcfplakette:\n\n Am Stapler kann z.B. durch eine\n   Pr\u00fcfplakette auf die n\u00e4chste f\u00e4llige\n   Pr\u00fcfung hingewiesen werden\n\n Um Missverst\u00e4ndnisse zu vermeiden,\n   sollten Plaketten am Stapler erst angebracht\n   werden, wenn die eventuell bei der letzten Pr\u00fcfung\n   festgestellten sicherheitstechnischen M\u00e4ngel\n   behoben wurden"},{"type":"quiz","frage":"In welchem Abstand m\u00fcssen Stapler von einer bef\u00e4higten Person gepr\u00fcft werden?","optionen":["Alle 3 Monate","Alle 6 Monate","L\u00e4ngstens alle 12 Monate","Alle 2 Jahre"],"richtig":2,"qi":17},{"type":"kapitel_abschluss","kapitel_nr":10,"kapitel_name":"Pr\u00fcfungen & Wartung"},{"type":"video","titel":"Zusammenfassung: Der Gabelstapler","videotyp":"sharepoint","videosrc":"https://ausbildung1986.sharepoint.com/sites/AusbildungZentrale/_layouts/15/embed.aspx?UniqueId=9b79fd92-88cd-4227-af56-77ebad89a4f8&embed=%7B%22ust%22%3Atrue%2C%22hv%22%3A%22CopyEmbedCode%22%7D&referrer=StreamWebApp&referrerScenario=EmbedDialog.Create"},{"type":"ergebnis"}]</script>

<script>
var STEPS=JSON.parse(document.getElementById('stepsData').textContent);
var KQM=JSON.parse(document.getElementById('kqmData').textContent);

var FLOW_URL='DEIN_FLOW_URL_HIER';
var WA_NR='4916096877039';
var MAIL_ADDR='danieleckmeier@googlemail.com';

var cur=0,answered={},score=0,kapitelAbgeschlossen={},kapitelStartZeit=Date.now();
var params=new URLSearchParams(window.location.search);
var regnr=params.get('regnr')||'';
var lang=params.get('lang')||sessionStorage.getItem('lang')||'de';
var aktKapitelNr=null,aktKapitelName='';

var host=document.getElementById('host');
var pbar=document.getElementById('pbar');
var prevBtn=document.getElementById('prevBtn');
var nextBtn=document.getElementById('nextBtn');
var counter=document.getElementById('counter');
var waBtn=document.getElementById('waBtn');
var mailBtn=document.getElementById('mailBtn');

function updateKontakt(knr,kname){

  waBtn.href='https://wa.me/'+WA_NR+'?text='+encodeURIComponent('Hallo, Frage zu '+k+'. Reg.-Nr.: '+regnr);
  mailBtn.href='mailto:'+MAIL_ADDR+'?subject='+encodeURIComponent('Frage zu '+k)+'&body='+encodeURIComponent('Hallo,

Frage zu '+k+'.

Reg.-Nr.: '+regnr+'

');
}
updateKontakt(null,'');

function maxTL(lsa,hub){
  var b=2000,lf=Math.max(0,b-((lsa-500)/100)*200);
  return Math.round((hub>3000?Math.max(0,lf-((hub-3000)/500)*100):lf)/50)*50;
}
function esc(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function folieHTML(text){
  if(!text||!text.trim())return'<em style="color:#aaa">Bild / Grafik</em>';
  var lines=text.split('
').filter(function(l){return l.trim();});
  if(!lines.length)return'<em style="color:#aaa">Bild / Grafik</em>';
  var h='<div class="folie-titel">'+esc(lines[0])+'</div>';
  if(lines.length>1)h+='<div class="folie-inhalt">'+lines.slice(1).map(esc).join('
')+'</div>';
  return h;
}
function getQI(knr){
  var idx=KQM[String(knr)]||[];
  var r=0;for(var i=0;i<idx.length;i++){if(answered[idx[i]]===true)r++;}
  return{richtig:r,gesamt:idx.length};
}
function abschliessen(knr,kname){
  var btn=document.getElementById('aBtn'),stat=document.getElementById('aStat');
  if(!btn||!stat)return;
  btn.disabled=true;btn.textContent='Wird gespeichert...';
  var qi=getQI(knr);
  var payload={regnr:regnr,kapitel_nr:knr,kapitel_name:kname,datum_uhrzeit:new Date().toISOString(),
    quiz_richtig:qi.richtig,quiz_gesamt:qi.gesamt,
    quiz_prozent:qi.gesamt>0?Math.round(qi.richtig/qi.gesamt*100):0,
    bestanden:qi.gesamt>0?(qi.richtig/qi.gesamt>=0.8):true,
    lernzeit_sekunden:Math.round((Date.now()-kapitelStartZeit)/1000),
    gesamt_kapitel_abgeschlossen:Object.keys(kapitelAbgeschlossen).length+1};
  function ok(){kapitelAbgeschlossen[knr]=true;kapitelStartZeit=Date.now();btn.textContent='✓ Gespeichert';btn.style.background='var(--ok)';stat.textContent='Kapitel '+knr+' gespeichert.';nextBtn.disabled=false;}
  if(FLOW_URL==='DEIN_FLOW_URL_HIER'){ok();return;}
  fetch(FLOW_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(ok).catch(function(){btn.disabled=false;btn.textContent='Kapitel abschließen & speichern';stat.textContent='⚠️ Fehler. Bitte erneut versuchen.';stat.style.color='var(--no)';});
}
function render(){

  pbar.style.width=(cur/(STEPS.length-1)*100)+'%';
  prevBtn.disabled=(cur===0);nextBtn.textContent='Weiter ›';nextBtn.disabled=false;
  if(s.type==='kapitel'){
    aktKapitelNr=null;aktKapitelName=s.titel;kapitelStartZeit=Date.now();
    host.innerHTML='<div class="kapitel-box"><div class="kapitel-icon">'+s.icon+'</div><div class="kapitel-titel">'+esc(s.titel)+'</div></div>';
    counter.textContent='Start';updateKontakt(null,s.titel);
  }else if(s.type==='folie'){
    host.innerHTML='<div class="folie-box"><div class="folie-nr">Folie '+s.nr+' / 167</div>'+folieHTML(s.text)+'</div>';
    counter.textContent='Folie '+s.nr+' / 167';updateKontakt(aktKapitelNr,aktKapitelName);
  }else if(s.type==='video'){
    var iframe=s.videotyp==='youtube'?'<iframe src="https://www.youtube-nocookie.com/embed/'+s.videoid+'" allowfullscreen></iframe>':'<iframe src="'+s.videosrc+'" allowfullscreen></iframe>';
    host.innerHTML='<div class="video-box"><div class="video-titel">'+esc(s.titel)+'</div><div class="video-wrap">'+iframe+'</div></div>';
    counter.textContent='Video';updateKontakt(aktKapitelNr,aktKapitelName);
  }else if(s.type==='traglast'){
    host.innerHTML='<div class="traglast-box"><div class="traglast-titel">Interaktives Traglastdiagramm</div><div class="traglast-sub">Schiebe die Regler und prüfe die zulässige Traglast</div><div class="traglast-controls"><div class="tl-group"><label>Lastschwerpunktabstand</label><input type="range" id="lsa" min="400" max="1000" step="50" value="500" oninput="updTL()"><div class="tl-val" id="lsaV">500 mm</div></div><div class="tl-group"><label>Hubhöhe</label><input type="range" id="hub" min="2000" max="7000" step="250" value="3000" oninput="updTL()"><div class="tl-val" id="hubV">3.000 mm</div></div></div><div id="tlR"></div></div>';
    updTL();counter.textContent='Traglastdiagramm';updateKontakt(aktKapitelNr,aktKapitelName);
  }else if(s.type==='quiz'){
    var done=(s.qi in answered);
    host.innerHTML='<div class="quiz-box"><div class="quiz-badge">✏️ Wissensfrage '+(s.qi+1)+' / '+TOTAL_QUIZ+'</div><div class="quiz-q">'+esc(s.frage)+'</div><div class="quiz-opts" id="opts">'+s.optionen.map(function(o,i){return'<button class="opt" id="opt-'+i+'" onclick="ans('+s.qi+','+i+','+s.richtig+')">'+esc(o)+'</button>';}).join('')+'</div><div class="quiz-fb" id="fb"></div></div>';
    counter.textContent='Frage '+(s.qi+1)+' / '+TOTAL_QUIZ;
    if(done){showAns(s.qi,s.richtig);nextBtn.disabled=false;}else{nextBtn.disabled=true;}
    updateKontakt(aktKapitelNr,aktKapitelName);
  }else if(s.type==='kapitel_abschluss'){
    aktKapitelNr=s.kapitel_nr;aktKapitelName=s.kapitel_name;
    var qi=getQI(s.kapitel_nr),done=kapitelAbgeschlossen[s.kapitel_nr];
    var qH=qi.gesamt>0?'<div class="abschluss-quiz">Quiz: '+qi.richtig+' / '+qi.gesamt+' richtig ('+Math.round(qi.richtig/qi.gesamt*100)+' %)</div>':'';
    var kn=JSON.stringify(s.kapitel_name);
    host.innerHTML='<div class="abschluss-box"><div class="abschluss-icon">&#x1F4CB;</div><div class="abschluss-titel">Kapitel '+s.kapitel_nr+' abgeschlossen</div><div class="abschluss-sub">'+esc(s.kapitel_name)+'</div>'+qH+'<button class="abschluss-btn" id="aBtn" onclick="abschliessen('+s.kapitel_nr+','+kn+')" '+(done?'disabled style="background:var(--ok)"':'')+'>'+(done?'✓ Bereits gespeichert':'Kapitel abschlie&szlig;en &amp; speichern')+'</button><div class="abschluss-sent" id="aStat">'+(done?'Kapitel '+s.kapitel_nr+' wurde gespeichert.':'')+'</div></div>';
    counter.textContent='Kapitel '+s.kapitel_nr+' / 10';nextBtn.disabled=!done;updateKontakt(s.kapitel_nr,s.kapitel_name);
  }else if(s.type==='ergebnis'){
    var pct=Math.round(score/TOTAL_QUIZ*100),pass=pct>=80;
    host.innerHTML='<div class="ergebnis-box"><div class="ergebnis-ic '+(pass?'ok':'no')+'">'+(pass?'✓':'✗')+'</div><h2>'+score+' / '+TOTAL_QUIZ+' richtig ('+pct+' %)</h2><p class="sub">'+(pass?'Herzlichen Glückwunsch! Schulung erfolgreich abgeschlossen.':'Mindestpunktzahl 80% nicht erreicht. Bitte wiederholen.')+'</p><button class="ctrl-btn" onclick="'+(pass?'goBack()':'restart()')+'">'+( pass?'&larr; Zur Startseite':'Schulung wiederholen')+'</button></div>';
    counter.textContent='Abschluss';nextBtn.disabled=true;prevBtn.disabled=true;updateKontakt(null,'Abschluss');
  }
}
function updTL(){
  var lsa=parseInt(document.getElementById('lsa').value),hub=parseInt(document.getElementById('hub').value);
  document.getElementById('lsaV').textContent=lsa+' mm';document.getElementById('hubV').textContent=hub.toLocaleString('de')+' mm';
  var max=maxTL(lsa,hub),ok=max>0;
  document.getElementById('tlR').innerHTML='<div class="tl-erg '+(ok?'ok':'no')+'"><div style="font-size:36px;margin-bottom:8px">'+(ok?'&#x2705;':'&#x26D4;')+'</div><div style="font-size:22px;font-weight:800;margin-bottom:4px">'+(ok?'Max. '+max.toLocaleString('de')+' kg':'Nicht zulässig')+'</div><div style="font-size:14px;color:#555">bei '+lsa+' mm LSA und '+hub.toLocaleString('de')+' mm Hubhöhe</div></div>';
}
function ans(qi,chosen,richtig){
  if(qi in answered)return;
  document.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});
  document.getElementById('opt-'+richtig).classList.add('correct');
  var fb=document.getElementById('fb'),s=null;
  for(var i=0;i<STEPS.length;i++){if(STEPS[i].type==='quiz'&&STEPS[i].qi===qi){s=STEPS[i];break;}}
  if(chosen===richtig){score++;fb.className='quiz-fb ok';fb.textContent='✓ Richtig!';}
  else{document.getElementById('opt-'+chosen).classList.add('wrong');fb.className='quiz-fb no';fb.textContent='✗ Leider falsch. Richtig: '+esc(s.optionen[richtig]);}
  answered[qi]=(chosen===richtig);nextBtn.disabled=false;
}
function showAns(qi,richtig){
  document.querySelectorAll('.opt').forEach(function(b){b.disabled=true;});
  document.getElementById('opt-'+richtig).classList.add('correct');
  var fb=document.getElementById('fb');
  if(answered[qi]){fb.className='quiz-fb ok';fb.textContent='✓ Richtig!';}
  else{fb.className='quiz-fb no';fb.textContent='✓ Richtige Antwort markiert';}
}
function next(){if(cur<STEPS.length-1){cur++;render();}}
function prev(){if(cur>0){cur--;render();}}
function restart(){cur=0;answered={};score=0;kapitelAbgeschlossen={};render();}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'&&!nextBtn.disabled)next();if(e.key==='ArrowLeft'&&!prevBtn.disabled)prev();});
var tx=0;
host.addEventListener('touchstart',function(e){tx=e.changedTouches[0].screenX;},{passive:true});
host.addEventListener('touchend',function(e){var dx=e.changedTouches[0].screenX-tx;if(dx<-50&&!nextBtn.disabled)next();if(dx>50)prev();},{passive:true});
function goBack(){window.location.href='https://danieleckmeierausbildung1986.github.io/Ausbildung-Flurf-rderzeuge/'+(regnr?'?regnr='+encodeURIComponent(regnr)+'&lang='+lang:'');}
render();
</script>
</body>
</html>
