<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kommissionierer – Stufe 2</title>
<style>
:root{
  --bg:#0d1f12;--green:#1a7a4a;--green-l:#2ea865;--green-d:#0d4a24;
  --navy:#16243f;--muted:#68788f;--line:#e3e8f0;--ink:#1a2330;
  --shadow:0 8px 40px rgba(0,0,0,.25);
  --accent1:#2d1b6b;--accent2:#5b3db0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,sans-serif;
  min-height:100vh;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;
  padding:16px;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(26,122,74,.25) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 80%, rgba(13,74,36,.3) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}
.wrap{position:relative;z-index:1;width:100%;max-width:1000px;display:flex;flex-direction:column;flex:1}
.topbar{
  display:flex;align-items:center;gap:14px;margin-bottom:14px;
  animation:fadeDown .4s ease both;
}
.topbar .ti{
  width:46px;height:46px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.3);
}
.topbar .ti svg{width:24px;height:24px;fill:#fff}
.topbar h1{color:#fff;font-size:18px;font-weight:700;line-height:1.2}
.topbar p{color:rgba(255,255,255,.45);font-size:12px}
.stage{
  background:#fff;border-radius:18px;box-shadow:var(--shadow);
  overflow:hidden;animation:fadeUp .4s ease .1s both;
  display:flex;flex-direction:column;flex:1;
}
.slidebox{
  position:relative;background:#0d1f12;
  display:flex;align-items:center;justify-content:center;
  min-height:300px;flex:1;
}
.slidebox img{
  width:100%;height:auto;display:block;max-height:72vh;object-fit:contain;
}
.nav-zone{position:absolute;top:0;bottom:0;width:32%;cursor:pointer;z-index:2;
  display:flex;align-items:center;opacity:0;transition:opacity .15s}
.nav-zone:hover{opacity:1}
.nav-zone.prev{left:0;justify-content:flex-start;
  background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}
.nav-zone.next{right:0;justify-content:flex-end;
  background:linear-gradient(270deg,rgba(0,0,0,.35),transparent)}
.nav-zone span{color:#fff;font-size:30px;padding:0 14px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.controls{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:#fff;border-top:1px solid var(--line);gap:12px;
}
.ctrl-btn{
  display:flex;align-items:center;gap:7px;
  padding:11px 20px;border:none;border-radius:11px;
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;
  transition:opacity .15s;font-family:inherit;
}
.ctrl-btn:hover{opacity:.9}
.ctrl-btn:disabled{opacity:.35;cursor:not-allowed}
.counter{font-size:14px;font-weight:700;color:var(--navy)}
.progress{height:5px;background:var(--line);width:100%}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent1),var(--accent2));
  transition:width .25s ease;width:0}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
  padding:12px 18px;background:#fafbfc;border-top:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);border:none;
  cursor:pointer;transition:all .15s;padding:0}
.dot.active{background:var(--accent2);transform:scale(1.3)}
.dot:hover{background:var(--accent1)}
.bottom{margin-top:14px;animation:fadeUp .4s ease .2s both}
.back-btn{
  display:block;width:100%;padding:12px;border:2px solid rgba(255,255,255,.2);
  border-radius:12px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);
  font-size:14px;font-weight:600;cursor:pointer;text-align:center;
  font-family:inherit;transition:all .15s;
}
.back-btn:hover{border-color:var(--green-l);color:#fff;background:rgba(255,255,255,.12)}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:600px){
  .topbar h1{font-size:16px}.ctrl-btn{padding:10px 14px;font-size:13px}
  .nav-zone{opacity:.4}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="ti">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
    </div>
    <div>
      <h1>Kommissionierer</h1>
      <p>Zusatzqualifizierung Stufe 2 · DGUV 308-001</p>
    </div>
  </div>

  <div class="stage">
    <div class="progress"><div class="progress-bar" id="pbar"></div></div>
    <div class="slidebox">
      <div class="nav-zone prev" onclick="prev()"><span>‹</span></div>
      <img id="slideImg" src="KOMM_BILDER/Folie1.PNG" alt="Folie 1">
      <div class="nav-zone next" onclick="next()"><span>›</span></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="prevBtn" onclick="prev()">‹ Zurück</button>
      <div class="counter"><span id="cur">1</span> / 10</div>
      <button class="ctrl-btn" id="nextBtn" onclick="next()">Weiter ›</button>
    </div>
    <div class="dots" id="dots"></div>
  </div>

  <div class="bottom">
    <button class="back-btn" onclick="goBack()">← Zurück zur Geräteauswahl</button>
  </div>
</div>

<script>
const BASE = 'https://danieleckmeierausbildung1986.github.io/Ausbildung-Flurf-rderzeuge/';
const ORDNER = 'KOMM_BILDER';
const TOTAL = 10;
let idx = 1;

const img = document.getElementById('slideImg');
const cur = document.getElementById('cur');
const pbar = document.getElementById('pbar');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const dotsWrap = document.getElementById('dots');

// Dots aufbauen
for(let i=1;i<=TOTAL;i++){
  const d = document.createElement('button');
  d.className = 'dot' + (i===1?' active':'');
  d.onclick = ()=>goTo(i);
  dotsWrap.appendChild(d);
}
const dots = dotsWrap.querySelectorAll('.dot');

function render(){
  img.src = ORDNER + '/Folie' + idx + '.PNG';
  img.alt = 'Folie ' + idx;
  cur.textContent = idx;
  pbar.style.width = (idx/TOTAL*100) + '%';
  prevBtn.disabled = (idx===1);
  nextBtn.disabled = (idx===TOTAL);
  dots.forEach((d,i)=>d.classList.toggle('active', i===idx-1));
}
function next(){ if(idx<TOTAL){idx++;render();} }
function prev(){ if(idx>1){idx--;render();} }
function goTo(n){ idx=n; render(); }

// Tastatur
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') next();
  if(e.key==='ArrowLeft') prev();
});

// Touch / Wischen
let tx=0;
document.querySelector('.slidebox').addEventListener('touchstart', e=>{tx=e.changedTouches[0].screenX;}, {passive:true});
document.querySelector('.slidebox').addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].screenX - tx;
  if(dx < -50) next();
  if(dx > 50) prev();
}, {passive:true});

function goBack(){
  window.location.href = BASE + 'staplerapp_stufe2_auswahl.html';
}

render();
</script>
</body>
</html>
