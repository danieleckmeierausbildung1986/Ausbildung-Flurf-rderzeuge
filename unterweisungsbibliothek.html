<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unterweisungsbibliothek – ProDrive Akademie Niederbayern</title>
<style>
:root{
  --bg:#0a1628;--blue:#1a4fa8;--blue-l:#2e75cc;--blue-d:#0d2d80;--blue-xl:#e8f0fb;
  --navy:#16243f;--muted:#68788f;--line:#e3e8f0;--ink:#1a2330;
  --shadow:0 8px 40px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,sans-serif;
  min-height:100vh;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(26,79,168,.28) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 80%, rgba(13,45,128,.32) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}
.container{position:relative;z-index:1;width:100%;max-width:640px}
.logo-area{text-align:center;margin-bottom:28px;animation:fadeDown .5s ease both}
.logo-icon{
  width:72px;height:72px;border-radius:50%;overflow:hidden;
  margin:0 auto 16px;box-shadow:0 8px 32px rgba(13,45,128,.4);
}
.logo-icon img{width:100%;height:100%;object-fit:cover}
.logo-area h1{color:#fff;font-size:22px;font-weight:700;margin-bottom:4px}
.logo-area p{color:rgba(255,255,255,.6);font-size:13px;max-width:360px;margin:0 auto}
.card{
  background:#fff;border-radius:20px;
  box-shadow:var(--shadow);overflow:hidden;
  animation:fadeUp .5s ease .1s both;
}
.card-body{padding:28px 30px 30px}
.card-intro{font-size:13px;color:var(--muted);text-align:center;margin-bottom:20px;line-height:1.5}
.lf{margin-bottom:16px}
.lf label{display:block;font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.6px;margin-bottom:7px}
.lf input{width:100%;padding:13px 16px;border:2px solid var(--line);border-radius:12px;font-size:16px;background:#fafbfc;transition:border-color .15s;color:var(--ink)}
.lf input:focus{outline:none;border-color:var(--blue);background:#fff}
.login-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .15s;letter-spacing:.3px}
.login-btn:hover{opacity:.9}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.lerr{color:#c0392b;font-size:13px;margin-top:10px;text-align:center;min-height:18px}
.lhint{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
.spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}

.greeting{text-align:center;padding:24px 24px 16px;border-bottom:1px solid var(--line)}
.greeting-name{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px}
.greeting-sub{font-size:13px;color:var(--muted)}
.lib-grid{padding:20px 24px 8px;display:grid;grid-template-columns:1fr;gap:14px}
.lib-card{
  display:flex;align-items:center;gap:16px;padding:16px 18px;
  border:1.5px solid var(--line);border-radius:14px;text-decoration:none;
  transition:all .15s;
}
.lib-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.lib-icon{
  width:52px;height:52px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(135deg,var(--blue-d),var(--blue-l));
  display:flex;align-items:center;justify-content:center;font-size:24px;
}
.lib-info{flex:1}
.lib-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:2px}
.lib-sub{font-size:12.5px;color:var(--muted)}
.lib-arrow{font-size:18px;color:var(--muted);flex-shrink:0}
.no-modules{text-align:center;padding:28px 20px;color:var(--muted);font-size:14px;line-height:1.6}
.footer-area{padding:20px 24px 24px}
.back-btn{
  display:block;width:100%;padding:11px;border:2px solid var(--line);
  border-radius:12px;background:#fff;color:var(--muted);
  font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center;
}
.back-btn:hover{border-color:var(--blue);color:var(--blue)}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <div class="logo-area">
    <div class="logo-icon">
      <img src="logos/logo_bibliothek.png" alt="Unterweisungsbibliothek">
    </div>
    <h1>Unterweisungsbibliothek</h1>
    <p>Gerätespezifische Sicherheitsunterweisungen mit Wissenscheck und digitalem Nachweis — für registrierte Teilnehmer.</p>
  </div>

  <div class="card" id="loadingCard">
    <div class="card-body" style="text-align:center">
      <span class="spinner" style="border-color:var(--line);border-top-color:var(--blue)"></span>
      <div class="lhint" style="margin-top:14px">Lade Unterweisungsbibliothek…</div>
    </div>
  </div>

  <div class="card" id="libCard" style="display:none">
    <div class="greeting">
      <div class="greeting-name" id="greetName">Willkommen</div>
      <div class="greeting-sub">Wählen Sie eine Geräteeinweisung</div>
    </div>
    <div class="lib-grid" id="libGrid"></div>
    <div class="footer-area">
      <button class="back-btn" onclick="goBack()">← Zurück zur Startseite</button>
    </div>
  </div>
</div>

<script>
const BASE = 'https://danieleckmeierausbildung1986.github.io/Ausbildung-Flurf-rderzeuge/';
const ZUGANGSPRUEFUNG_URL = 'https://default8af25f9034bc4ef4aba22ab6f641d5.01.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/7058b6c8090842748465472db6085773/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=nxepIsGToa5my_-oIW5ZR5c3CQLtufN5DwNvM-qG1G4';

// Geräte-Kategorien — neue Kategorien einfach hier ergänzen.
// Die Modelle je Kategorie stehen zentral in geraetekategorie.html (KATEGORIEN-Objekt).
const GERAETE = [
  { key:'frontgabelstapler', titel:'Frontgabelstapler', sub:'Standardgerät Stufe 1', icon:'🏗️', url:'geraetekategorie.html?kategorie=frontgabelstapler' },
  { key:'schubmaststapler', titel:'Schubmaststapler', sub:'Sondergerät Stufe 2', icon:'📦', url:'geraetekategorie.html?kategorie=schubmaststapler' },
  { key:'kommissionierstapler', titel:'Kommissionierstapler', sub:'Sondergerät Stufe 2', icon:'🧰', url:'geraetekategorie.html?kategorie=kommissionierstapler' },
  { key:'schmalgangstapler', titel:'Schmalgangstapler', sub:'Sondergerät Stufe 2', icon:'🏬', url:'geraetekategorie.html?kategorie=schmalgangstapler' }
];

let currentRegnr = '', currentVorname = '', currentNachname = '', isTrainer = false;

function goBack(){
  window.location.href = BASE + 'index.html';
}

function zeigeFehler(text){
  document.getElementById('loadingCard').innerHTML =
    '<div class="card-body" style="text-align:center">' +
    '<div class="lerr" style="min-height:auto">' + text + '</div>' +
    '<button class="back-btn" style="margin-top:16px" onclick="goBack()">← Zurück zur Startseite</button>' +
    '</div>';
}

async function pruefeUndZeige(val, vorname, nachname){
  try{
    const res  = await fetch(ZUGANGSPRUEFUNG_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ registrierungsnummer: val, vorname: vorname, nachname: nachname })
    });
    const data = await res.json();

    if(data && data.zugang === true){
      currentRegnr = val; currentVorname = vorname; currentNachname = nachname;
      sessionStorage.setItem('authRegnr', val);
      sessionStorage.setItem('authVorname', vorname);
      sessionStorage.setItem('authNachname', nachname);
      showLibrary();
    } else {
      zeigeFehler(data.grund || 'Registriernummer, Vor- oder Nachname stimmen nicht überein. Bitte Ausbilder kontaktieren.');
    }
  }catch(e){
    zeigeFehler('Verbindungsfehler. Bitte erneut versuchen.');
  }
}

function showLibrary(){
  document.getElementById('loadingCard').style.display = 'none';
  document.getElementById('libCard').style.display = 'block';
  document.getElementById('greetName').textContent = isTrainer
    ? ('Hallo, ' + currentVorname + '!')
    : ('Hallo, ' + currentVorname + ' ' + currentNachname + '!');

  const grid = document.getElementById('libGrid');
  if(GERAETE.length === 0){
    grid.innerHTML = '<div class="no-modules">Aktuell sind noch keine Geräteeinweisungen verfügbar.</div>';
    return;
  }
  grid.innerHTML = GERAETE.map(g => {
    const sep = g.url.indexOf('?') >= 0 ? '&' : '?';
    // Trainer haben keine Registriernummer → als Trainer-Vorschau markieren.
    const param = isTrainer ? 'trainer=1' : ('regnr=' + encodeURIComponent(currentRegnr));
    return `
    <a class="lib-card" href="${BASE}${g.url}${sep}${param}">
      <div class="lib-icon">${g.icon}</div>
      <div class="lib-info">
        <div class="lib-title">${g.titel}</div>
        <div class="lib-sub">${g.sub}</div>
      </div>
      <div class="lib-arrow">→</div>
    </a>`;
  }).join('');
}

// Login passiert bereits auf einer vorherigen Seite (z.B. Teilnehmer-Login).
// Hier nur noch die dort hinterlegten Daten übernehmen — kein eigenes
// Login-Formular mehr. Fehlen die Daten, zurück zur Anmeldung.
(function(){
  // Trainer: als Trainer eingeloggt → keine Teilnehmer-Zugangsprüfung nötig,
  // Bibliothek direkt anzeigen.
  let trainerAuth = null;
  try { trainerAuth = JSON.parse(sessionStorage.getItem('trainerAuth') || 'null'); } catch(e){}
  if(trainerAuth && trainerAuth.name){
    isTrainer = true;
    currentVorname = trainerAuth.name;
    currentNachname = '';
    currentRegnr = '';
    showLibrary();
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const nr = params.get('regnr');
  const authRegnr = sessionStorage.getItem('authRegnr');
  const authVorname = sessionStorage.getItem('authVorname');
  const authNachname = sessionStorage.getItem('authNachname');

  const nrToUse = (nr && /^\d{4}-\d{3,4}$/.test(nr)) ? nr : authRegnr;

  if(nrToUse === authRegnr && authVorname && authNachname){
    pruefeUndZeige(authRegnr, authVorname, authNachname);
  } else {
    window.location.href = BASE + 'login.html' + (nrToUse ? '?regnr=' + encodeURIComponent(nrToUse) : '');
  }
})();
</script>
<script defer src="a11y-widget.js"></script>
</body>
</html>
