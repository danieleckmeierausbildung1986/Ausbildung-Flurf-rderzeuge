<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Praxisprüfung Stufe 2 – Geräteauswahl</title>
<style>
:root{
  --bg:#0d1f12;--green:#1a7a4a;--green-l:#2ea865;--green-d:#0d4a24;
  --navy:#16243f;--muted:#68788f;--line:#e3e8f0;--ink:#1a2330;
  --shadow:0 8px 40px rgba(0,0,0,.25);
  --purple-d:#2d1b6b;--purple-l:#5b3db0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,sans-serif;
  min-height:100vh;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(26,122,74,.25) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 80%, rgba(13,74,36,.3) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}
.container{position:relative;z-index:1;width:100%;max-width:620px;}
.logo-area{text-align:center;margin-bottom:38px}
.logo-icon{
  width:88px;height:88px;border-radius:20px;
  background:linear-gradient(135deg,var(--purple-d),var(--purple-l));
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 18px;box-shadow:0 8px 32px rgba(45,27,107,.4);
}
.logo-icon svg{width:46px;height:46px;fill:#fff}
.logo-area h1{color:#fff;font-size:27px;font-weight:700;margin-bottom:5px}
.logo-area p{color:rgba(255,255,255,.45);font-size:16px}
.card{background:#fff;border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.greeting{text-align:center;padding:30px 30px 20px;border-bottom:1px solid var(--line)}
.greeting-name{font-size:25px;font-weight:700;color:var(--navy);margin-bottom:6px}
.greeting-sub{font-size:16px;color:var(--muted)}
.devices{padding:26px 30px 10px;display:flex;flex-direction:column;gap:16px}
.device-btn{
  display:flex;align-items:center;gap:20px;
  padding:20px 24px;border-radius:16px;border:none;
  cursor:pointer;text-align:left;transition:all .15s;
  text-decoration:none;width:100%;color:#fff;position:relative;
}
.device-btn.schub{background:linear-gradient(135deg,#1a3a6b,#2e6cb0)}
.device-btn.komm{background:linear-gradient(135deg,#2d1b6b,#5b3db0)}
.device-btn.schmal{background:linear-gradient(135deg,#1a5a3a,#2ea865)}
.device-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.dev-icon{
  width:60px;height:60px;border-radius:14px;
  background:#fff;padding:6px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.dev-icon img{width:100%;height:100%;object-fit:contain}
.dev-info{flex:1}
.dev-title{font-size:19px;font-weight:700;margin-bottom:3px}
.dev-sub{font-size:14px;opacity:.7}
.dev-arrow{font-size:22px;opacity:.7;flex-shrink:0}
.badge{
  position:absolute;top:12px;right:12px;background:rgba(0,0,0,.25);color:#fff;
  font-size:12px;font-weight:700;padding:4px 11px;border-radius:20px;
}
.footer-area{padding:20px 30px 30px}
.back-btn{
  display:block;width:100%;padding:14px;border:2px solid var(--line);
  border-radius:14px;background:#fff;color:var(--muted);
  font-size:16px;font-weight:600;cursor:pointer;
  transition:all .15s;text-align:center;text-decoration:none;
}
.back-btn:hover{border-color:var(--green);color:var(--green)}
</style>
</head>
<body>
<div class="container">
  <div class="logo-area">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2 3 7v6c0 5 3.8 9.4 9 11 5.2-1.6 9-6 9-11V7l-9-5zm0 2.2 7 3.9v4.9c0 4-2.9 7.7-7 8.9-4.1-1.2-7-4.9-7-8.9V8.1l7-3.9z"/><path d="M11 16.4 7.3 12.7l1.4-1.4L11 13.6l4.3-4.3 1.4 1.4z"/></svg>
    </div>
    <h1>Praxisprüfung Stufe 2</h1>
    <p>DGUV Grundsatz 308-001</p>
  </div>

  <div class="card">
    <div class="greeting">
      <div class="greeting-name">Gerät auswählen</div>
      <div class="greeting-sub">Für welches Gerät soll die Praxisprüfung abgenommen werden?</div>
    </div>
    <div class="devices">
      <a class="device-btn schub" href="praxispruefung_stufe2.html?geraet=schubmast">
        <div class="dev-icon"><img src="logos/icon_geraet_schubmast.png" alt=""></div>
        <div class="dev-info">
          <div class="dev-title">Schubmaststapler</div>
          <div class="dev-sub">Praxisprüfung starten</div>
        </div>
        <div class="dev-arrow">→</div>
      </a>
      <a class="device-btn komm" href="praxispruefung_stufe2.html?geraet=kommissionierer">
        <div class="dev-icon"><img src="logos/icon_geraet_kommissionierer.png" alt=""></div>
        <div class="dev-info">
          <div class="dev-title">Kommissionierer</div>
          <div class="dev-sub">Praxisprüfung starten</div>
        </div>
        <div class="dev-arrow">→</div>
      </a>
      <a class="device-btn schmal" href="praxispruefung_stufe2.html?geraet=schmalgang">
        <div class="dev-icon"><img src="logos/icon_geraet_schmalgang.png" alt=""></div>
        <div class="dev-info">
          <div class="dev-title">Schmalgangstapler</div>
          <div class="dev-sub">Praxisprüfung starten</div>
        </div>
        <div class="dev-arrow">→</div>
      </a>
    </div>
    <div class="footer-area">
      <a class="back-btn" href="praxispruefung_start.html">← Zurück zur Praxisprüfung</a>
    </div>
  </div>
</div>
<script defer src="schriftgroesse.js"></script>
<script data-goatcounter="https://prodrive-akademie.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
