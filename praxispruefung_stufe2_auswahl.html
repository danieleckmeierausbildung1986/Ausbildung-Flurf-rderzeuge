<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Praxisprüfung Stufe 2 – Geräteauswahl</title>
<style>
:root{
  --bg:#0d1f12;--green:#1a7a4a;--green-l:#2ea865;--green-d:#0d4a24;
  --navy:#16243f;--muted:#68788f;--line:#e3e8f0;--ink:#1a2330;
  --shadow:0 8px 40px rgba(0,0,0,.25);
  --purple-d:#2d1b6b;--purple-l:#5b3db0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,sans-serif;
  min-height:100vh;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(26,122,74,.25) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 80%, rgba(13,74,36,.3) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}
.container{position:relative;z-index:1;width:100%;max-width:480px;}
.logo-area{text-align:center;margin-bottom:32px}
.logo-icon{
  width:72px;height:72px;border-radius:18px;
  background:linear-gradient(135deg,var(--purple-d),var(--purple-l));
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;box-shadow:0 8px 32px rgba(45,27,107,.4);
}
.logo-icon svg{width:38px;height:38px;fill:#fff}
.logo-area h1{color:#fff;font-size:22px;font-weight:700;margin-bottom:4px}
.logo-area p{color:rgba(255,255,255,.45);font-size:13px}
.card{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.greeting{text-align:center;padding:24px 24px 16px;border-bottom:1px solid var(--line)}
.greeting-name{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px}
.greeting-sub{font-size:13px;color:var(--muted)}
.devices{padding:20px 24px 8px;display:flex;flex-direction:column;gap:12px}
.device-btn{
  display:flex;align-items:center;gap:16px;
  padding:16px 18px;border-radius:14px;border:none;
  cursor:pointer;text-align:left;transition:all .15s;
  text-decoration:none;width:100%;color:#fff;position:relative;
}
.device-btn.schub{background:linear-gradient(135deg,#1a3a6b,#2e6cb0)}
.device-btn.komm{background:linear-gradient(135deg,#2d1b6b,#5b3db0)}
.device-btn.schmal{background:linear-gradient(135deg,#1a5a3a,#2ea865)}
.device-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.dev-icon{
  width:46px;height:46px;border-radius:12px;
  background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;
}
.dev-info{flex:1}
.dev-title{font-size:15px;font-weight:700;margin-bottom:2px}
.dev-sub{font-size:12px;opacity:.7}
.dev-arrow{font-size:18px;opacity:.7;flex-shrink:0}
.badge{
  position:absolute;top:10px;right:10px;background:rgba(0,0,0,.25);color:#fff;
  font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;
}
.footer-area{padding:16px 24px 24px}
.back-btn{
  display:block;width:100%;padding:11px;border:2px solid var(--line);
  border-radius:12px;background:#fff;color:var(--muted);
  font-size:14px;font-weight:600;cursor:pointer;
  transition:all .15s;text-align:center;text-decoration:none;
}
.back-btn:hover{border-color:var(--green);color:var(--green)}
</style>
</head>
<body>
<div class="container">
  <div class="logo-area">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
    </div>
    <h1>Praxisprüfung Stufe 2</h1>
    <p>DGUV Grundsatz 308-001</p>
  </div>

  <div class="card">
    <div class="greeting">
      <div class="greeting-name">Gerät auswählen</div>
      <div class="greeting-sub">Für welches Gerät soll die Praxisprüfung abgenommen werden?</div>
    </div>
    <div class="devices">
      <a class="device-btn schub" href="praxispruefung_stufe2.html?geraet=schubmast">
        <div class="dev-icon">🚜</div>
        <div class="dev-info">
          <div class="dev-title">Schubmaststapler</div>
          <div class="dev-sub">Praxisprüfung starten</div>
        </div>
        <div class="dev-arrow">→</div>
        <span class="badge">Beta</span>
      </a>
      <a class="device-btn komm" href="praxispruefung_stufe2.html?geraet=kommissionierer">
        <div class="dev-icon">📦</div>
        <div class="dev-info">
          <div class="dev-title">Kommissionierer</div>
          <div class="dev-sub">Praxisprüfung starten</div>
        </div>
        <div class="dev-arrow">→</div>
        <span class="badge">Beta</span>
      </a>
      <a class="device-btn schmal" href="praxispruefung_stufe2.html?geraet=schmalgang">
        <div class="dev-icon">🏗️</div>
        <div class="dev-info">
          <div class="dev-title">Schmalgangstapler</div>
          <div class="dev-sub">Praxisprüfung starten</div>
        </div>
        <div class="dev-arrow">→</div>
        <span class="badge">Beta</span>
      </a>
    </div>
    <div class="footer-area">
      <a class="back-btn" href="praxispruefung_start.html">← Zurück zur Praxisprüfung</a>
    </div>
  </div>
</div>
</body>
</html>
