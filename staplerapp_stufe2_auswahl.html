<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zusatzgeräte – Geräteauswahl</title>
<style>
:root{
  --bg:#0d1f12;--green:#1a7a4a;--green-l:#2ea865;--green-d:#0d4a24;
  --navy:#16243f;--muted:#68788f;--line:#e3e8f0;--ink:#1a2330;
  --shadow:0 8px 40px rgba(0,0,0,.25);
  --purple-d:#2d1b6b;--purple-l:#5b3db0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,sans-serif;
  min-height:100vh;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(26,122,74,.25) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 80%, rgba(13,74,36,.3) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}
.container{position:relative;z-index:1;width:100%;max-width:480px;}
.logo-area{text-align:center;margin-bottom:32px;animation:fadeDown .5s ease both}
.logo-icon{
  width:72px;height:72px;border-radius:18px;
  background:linear-gradient(135deg,var(--purple-d),var(--purple-l));
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;box-shadow:0 8px 32px rgba(45,27,107,.4);
}
.logo-icon svg{width:38px;height:38px;fill:#fff}
.logo-area h1{color:#fff;font-size:22px;font-weight:700;margin-bottom:4px}
.logo-area p{color:rgba(255,255,255,.45);font-size:13px}
.card{
  background:#fff;border-radius:20px;
  box-shadow:var(--shadow);overflow:hidden;
  animation:fadeUp .5s ease .1s both;
}
.greeting{text-align:center;padding:24px 24px 16px;border-bottom:1px solid var(--line);}
.greeting-name{font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px}
.greeting-sub{font-size:13px;color:var(--muted)}
.devices{padding:20px 24px 8px;display:flex;flex-direction:column;gap:12px}
.device-btn{
  display:flex;align-items:center;gap:16px;
  padding:16px 18px;border-radius:14px;border:none;
  cursor:pointer;text-align:left;transition:all .15s;
  text-decoration:none;width:100%;color:#fff;
}
.device-btn.schub{background:linear-gradient(135deg,#1a3a6b,#2e6cb0);}
.device-btn.komm{background:linear-gradient(135deg,#2d1b6b,#5b3db0);}
.device-btn.schmal{background:linear-gradient(135deg,#1a5a3a,#2ea865);}
.device-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.device-btn.disabled{
  background:linear-gradient(135deg,#aaa,#ccc);
  cursor:not-allowed;opacity:.5;
}
.device-btn.disabled:hover{transform:none;box-shadow:none}
.dev-icon{
  width:46px;height:46px;border-radius:12px;
  background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.dev-icon svg{width:24px;height:24px;fill:#fff}
.dev-info{flex:1}
.dev-title{font-size:15px;font-weight:700;margin-bottom:2px}
.dev-sub{font-size:12px;opacity:.7}
.dev-arrow{font-size:18px;opacity:.7;flex-shrink:0}
.device-tile{
  display:block;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);
  position:relative;transition:all .15s;text-decoration:none;width:100%;
}
.device-tile img{display:block;width:60%;max-width:220px;height:auto;margin:0 auto;padding:14px 0}
a.device-tile:hover{border-color:var(--green);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.device-tile.disabled{cursor:not-allowed}
.device-tile.disabled img{filter:grayscale(1) brightness(1.1)}
.device-tile-badge{
  position:absolute;top:10px;right:10px;background:rgba(22,36,63,.85);color:#fff;
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;
}
.no-devices{
  text-align:center;padding:28px 20px;color:var(--muted);font-size:14px;line-height:1.6
}
.back-btn{
  display:block;width:100%;padding:11px;border:2px solid var(--line);
  border-radius:12px;background:#fff;color:var(--muted);
  font-size:14px;font-weight:600;cursor:pointer;
  transition:all .15s;text-align:center;
}
.back-btn:hover{border-color:var(--green);color:var(--green)}
.footer-area{padding:12px 24px 24px;}
.not-booked-hint{
  font-size:11px;color:var(--muted);
  text-align:center;margin-top:14px;
}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="container">
  <div class="logo-area">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
    </div>
    <h1>Zusatzgeräte</h1>
    <p>DGUV Grundsatz 308-001</p>
  </div>

  <div class="card" id="mainCard">
    <div class="greeting">
      <div class="greeting-name" id="greetName">Willkommen</div>
      <div class="greeting-sub" id="greetSub">Bitte wählen Sie Ihr Gerät</div>
    </div>
    <div class="devices" id="deviceList"></div>
    <div class="footer-area">
      <div class="not-booked-hint" id="hintText" style="display:none"></div>
      <button class="back-btn" id="backBtn" onclick="goBack()" style="margin-top:12px">← Zurück zur Modulauswahl</button>
    </div>
  </div>
</div>

<script>
const BASE = 'https://danieleckmeierausbildung1986.github.io/Ausbildung-Flurf-rderzeuge/';
const FLOW_URL = 'https://default8af25f9034bc4ef4aba22ab6f641d5.01.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/7058b6c8090842748465472db6085773/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=nxepIsGToa5my_-oIW5ZR5c3CQLtufN5DwNvM-qG1G4';

const TXT = {
  de: {
    hallo: 'Hallo, ',
    greetSub: 'Bitte wählen Sie Ihr Gerät',
    backBtn: '← Zurück zur Modulauswahl',
    hint: 'Nicht gebuchte Geräte sind ausgegraut.<br>Bitte Ausbilder kontaktieren.',
    notBooked: 'Nicht gebucht'
  },
  ro: {
    hallo: 'Bună, ',
    greetSub: 'Vă rugăm să alegeți aparatul',
    backBtn: '← Înapoi la selecția modulelor',
    hint: 'Dispozitivele nerezervate sunt grizate.<br>Vă rugăm să contactați instructorul.',
    notBooked: 'Nerezervat'
  },
  pl: {
    hallo: 'Cześć, ',
    greetSub: 'Proszę wybrać urządzenie',
    backBtn: '← Wróć do wyboru modułów',
    hint: 'Niezarezerwowane urządzenia są wyszarzone.<br>Proszę skontaktować się z instruktorem.',
    notBooked: 'Niezarezerwowane'
  },
  sq: {
    hallo: 'Përshëndetje, ',
    greetSub: 'Ju lutem zgjidhni pajisjen tuaj',
    backBtn: '← Kthehu te zgjedhja e moduleve',
    hint: 'Pajisjet e parezervuara janë të çaktivizuara.<br>Ju lutem kontaktoni instruktorin.',
    notBooked: 'I parezervuar'
  }
};

const GERAETE = [
  {
    key: 'schubmast',
    cls: 'schub',
    gerat: 'schubmast',
    title: {
      de: 'Schubmaststapler',
      ro: 'Stivuitor cu catarg retractabil',
      pl: 'Wózek z wysuwanym masztem',
      sq: 'Stivuese me katarge tërhequr'
    },
    icon: `<svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>`
  },
  {
    key: 'kommissionierer',
    cls: 'komm',
    gerat: 'kommissionier',
    title: {
      de: 'Kommissionierer',
      ro: 'Cărucior de comandă',
      pl: 'Komisionierka',
      sq: 'Stivuese komisioni'
    },
    icon: `<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>`
  },
  {
    key: 'schmalgang',
    cls: 'schmal',
    gerat: 'schmalgang',
    title: {
      de: 'Schmalgang-Stapler',
      ro: 'Stivuitor pentru culoar îngust',
      pl: 'Wózek do wąskich korytarzy',
      sq: 'Stivuese koridor i ngushtë'
    },
    icon: `<svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>`
  }
];

function getRegnrFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const nr = params.get('regnr');
  return (nr && /^\d{4}-\d{3,4}$/.test(nr)) ? nr : null;
}

var currentLang = 'de';
var logoLangs = ['pl','ro','sq'];
function geraeteBild(key){
  const suffix = logoLangs.includes(currentLang) ? '_' + currentLang : '';
  return BASE + 'format_icons/kurs_stufe2_' + key + suffix + '.png';
}

function goBack(){
  const nr = getRegnrFromUrl();
  window.location.href = BASE + 'index.html' + (nr ? '?regnr=' + encodeURIComponent(nr) : '');
}

function isBooked(val){
  return val === true || val === 'Ja' || val === 'True';
}

function renderDevices(data, T){
  const list = document.getElementById('deviceList');
  list.innerHTML = '';
  let hasDisabled = false;

  GERAETE.forEach(g => {
    const booked = isBooked(data[g.key]);
    if(!booked) hasDisabled = true;

    const title = g.title[currentLang] || g.title.de;
    const url = BASE + 'staplerapp_stufe2.html?gerat=' + encodeURIComponent(g.gerat)
              + '&lang=' + encodeURIComponent(currentLang)
              + '&regnr=' + encodeURIComponent(data.regnr || '');

    if(booked){
      list.innerHTML += `
        <a class="device-tile" href="${url}">
          <img src="${geraeteBild(g.key)}" alt="${title}">
        </a>`;
    } else {
      list.innerHTML += `
        <div class="device-tile disabled">
          <img src="${geraeteBild(g.key)}" alt="${title}">
          <span class="device-tile-badge">${T.notBooked}</span>
        </div>`;
    }
  });

  if(hasDisabled){
    const hintEl = document.getElementById('hintText');
    hintEl.innerHTML = T.hint;
    hintEl.style.display = 'block';
  }
}

async function init(){
  const raw = sessionStorage.getItem('stufe2data');
  const nr = getRegnrFromUrl();
  const loginUrl = BASE + 'index.html' + (nr ? '?regnr=' + encodeURIComponent(nr) : '');

  if(!raw){ window.location.href = loginUrl; return; }

  let data;
  try{ data = JSON.parse(raw); } catch(e){ window.location.href = loginUrl; return; }

  const maxAge = 4*60*60*1000;
  if(!data._ts || (Date.now()-data._ts) > maxAge){
    sessionStorage.removeItem('stufe2data');
    window.location.href = loginUrl;
    return;
  }

  currentLang = data.lang || 'de';
  const T = TXT[currentLang] || TXT.de;

  const name = (data.vorname || '') + ' ' + (data.nachname || '');
  document.getElementById('greetName').textContent = T.hallo + name.trim() + '!';
  document.getElementById('greetSub').textContent = T.greetSub;
  document.getElementById('backBtn').textContent = T.backBtn;

  // Show loading while refreshing booking data from server
  document.getElementById('deviceList').innerHTML =
    '<div style="text-align:center;padding:24px;color:var(--muted);font-size:13px">&#x21BB; ' +
    (currentLang==='de'?'Buchungsstatus wird aktualisiert…':
     currentLang==='ro'?'Se actualizează statutul rezervării…':
     currentLang==='pl'?'Aktualizowanie statusu rezerwacji…':
     'Po përditëson statusin e rezervimit…') + '</div>';

  // Re-fetch fresh booking data every time the page loads
  const debugMode = new URLSearchParams(window.location.search).get('debug') === '1';
  let debugLines = ['Cached: schubmast='+data.schubmast+', komm='+data.kommissionierer+', schmal='+data.schmalgang];
  let fetchErr = null;

  if(data.regnr){
    try{
      const res = await fetch(FLOW_URL, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ registrierungsnummer: data.regnr })
      });
      const fresh = await res.json();
      debugLines.push('Flow zugang='+fresh.zugang);
      // Handle both lowercase and capitalized field names from SharePoint
      const sb = fresh.schubmast_gebucht       ?? fresh.Schubmast_gebucht;
      const kb = fresh.kommissionierer_gebucht  ?? fresh.Kommissionierer_gebucht;
      const sg = fresh.schmalgang_gebucht       ?? fresh.Schmalgang_gebucht;
      debugLines.push('Flow raw: schubmast='+JSON.stringify(sb)+', komm='+JSON.stringify(kb)+', schmal='+JSON.stringify(sg));
      if(fresh && fresh.zugang === true){
        data.schubmast       = isBooked(sb);
        data.kommissionierer = isBooked(kb);
        data.schmalgang      = isBooked(sg);
        data._ts = Date.now();
        sessionStorage.setItem('stufe2data', JSON.stringify(data));
        debugLines.push('Updated: schubmast='+data.schubmast+', komm='+data.kommissionierer+', schmal='+data.schmalgang);
      }
    }catch(e){ fetchErr = String(e); debugLines.push('Fetch error: '+fetchErr); }
  }

  renderDevices(data, T);

  if(debugMode){
    const dbg = document.createElement('div');
    dbg.style.cssText='margin:12px 24px;padding:12px;background:#fffbe6;border:1px solid #f0c040;border-radius:10px;font-size:11px;font-family:monospace;color:#333;word-break:break-all;';
    dbg.innerHTML = '<strong>DEBUG</strong><br>' + debugLines.join('<br>');
    document.getElementById('mainCard').appendChild(dbg);
  }
}

init();
</script>
</body>
</html>
