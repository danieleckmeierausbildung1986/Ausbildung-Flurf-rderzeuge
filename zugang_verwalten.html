<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zugang verwalten – ProDrive Akademie Niederbayern</title>
<style>
:root{
  --bg:#0a1628;--blue:#1a4fa8;--blue-l:#2e75cc;--blue-d:#0d2d80;--blue-xl:#e8f0fb;
  --navy:#16243f;--muted:#68788f;--line:#e3e8f0;--ink:#1a2330;--safety:#f07920;
  --shadow:0 8px 40px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,sans-serif;
  min-height:100vh;background:var(--bg);
  display:flex;align-items:center;justify-content:center;padding:20px;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 20%, rgba(26,79,168,.28) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 80% 80%, rgba(13,45,128,.32) 0%, transparent 60%);
  pointer-events:none;z-index:0;
}
.container{position:relative;z-index:1;width:100%;max-width:440px}
.logo-area{text-align:center;margin-bottom:22px}
.logo-area h1{color:#fff;font-size:21px;font-weight:700;margin-bottom:4px}
.logo-area p{color:rgba(255,255,255,.6);font-size:13px}
.card{background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden;padding:28px 26px 26px}

.such-wrap{display:flex;gap:10px;margin-bottom:4px}
.such-wrap input{
  flex:1;padding:14px 16px;border:2px solid var(--line);border-radius:12px;
  font-size:16px;background:#fafbfc;color:var(--ink);font-family:inherit;
}
.such-wrap input:focus{outline:none;border-color:var(--blue);background:#fff}
.such-btn{
  padding:0 20px;border:none;border-radius:12px;background:var(--blue);color:#fff;
  font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;
}
.such-btn:hover:not(:disabled){opacity:.9}
.such-btn:disabled{opacity:.5;cursor:not-allowed}

.status{margin-top:12px;font-size:13px;text-align:center;min-height:18px}
.status.error{color:#c0392b}
.status.success{color:#1a6b3c}

.ergebnis{display:none;margin-top:22px}
.ergebnis.show{display:block}
.teilnehmer-name{font-size:17px;font-weight:700;color:var(--navy);margin-bottom:14px;text-align:center}

.state-box{
  border-radius:14px;padding:16px 18px;margin-bottom:18px;text-align:center;
  border:1.5px solid var(--line);background:#fafbfc;
}
.state-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.state-value{font-size:16px;font-weight:700;color:var(--navy)}
.state-box.offen{border-color:#2e9e5b;background:#eafbf1}
.state-box.offen .state-value{color:#1a6b3c}
.state-box.gesperrt{border-color:#c0392b;background:#fdecec}
.state-box.gesperrt .state-value{color:#c0392b}

.aktion-btn{
  width:100%;padding:16px;border:none;border-radius:14px;
  font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.3px;
  transition:opacity .15s;margin-bottom:10px;
}
.aktion-btn.frei{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff}
.aktion-btn.entzieh{background:linear-gradient(135deg,#c0392b,#8e2a1f);color:#fff}
.aktion-btn:disabled{opacity:.5;cursor:not-allowed}
.aktion-btn:hover:not(:disabled){opacity:.9}

.spinner{
  width:18px;height:18px;border:3px solid rgba(255,255,255,.35);
  border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.footer-area{padding-top:16px}
.back-btn{
  display:block;width:100%;padding:11px;border:2px solid var(--line);
  border-radius:12px;background:#fff;color:var(--muted);
  font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center;text-decoration:none;
}
.back-btn:hover{border-color:var(--blue);color:var(--blue)}
</style>
</head>
<body>
<div class="container">
  <div class="logo-area">
    <h1>Zugang verwalten</h1>
    <p>ELearning-Zugang pro Teilnehmer frei- oder sperren</p>
  </div>
  <div class="card">
    <div class="such-wrap">
      <input type="text" id="regnr" placeholder="Registrierungsnummer, z.B. 2026-001" onkeydown="if(event.key==='Enter')suchen()">
      <button class="such-btn" id="btnSuchen" onclick="suchen()">Suchen</button>
    </div>
    <div class="status" id="status"></div>

    <div class="ergebnis" id="ergebnis">
      <div class="teilnehmer-name" id="teilnehmerName"></div>
      <div class="state-box" id="stateBox">
        <div class="state-label">ELearning-Zugang</div>
        <div class="state-value" id="stateValue">–</div>
      </div>
      <button class="aktion-btn frei" id="btnFreischalten" onclick="aktion('freischalten')">Freischalten</button>
      <button class="aktion-btn entzieh" id="btnEntziehen" onclick="aktion('entziehen')">Entziehen</button>
    </div>

    <div class="footer-area">
      <a class="back-btn" href="trainerbereich.html">← Zurück zum Trainerbereich</a>
    </div>
  </div>
</div>

<script>
// TODO: FLOW_URL muss noch mit der echten Power-Automate-URL befüllt werden
// (Flow "ELearning_Zugang_Verwalten")
var FLOW_URL = '';

var aktuelleRegnr = null;

function showStatus(type, message){
  var status = document.getElementById('status');
  status.style.display = '';
  if(!type){ status.className = 'status'; status.innerHTML = ''; return; }
  status.className = 'status ' + type;
  status.innerHTML = message;
}

function setZugangUI(offen){
  var box = document.getElementById('stateBox');
  var val = document.getElementById('stateValue');
  box.className = 'state-box ' + (offen ? 'offen' : 'gesperrt');
  val.textContent = offen ? 'Freigeschaltet' : 'Gesperrt';
  document.getElementById('btnFreischalten').style.display = offen ? 'none' : '';
  document.getElementById('btnEntziehen').style.display = offen ? '' : 'none';
}

async function suchen(){
  var regnr = document.getElementById('regnr').value.trim();
  if(!regnr){ showStatus('error', 'Bitte Registrierungsnummer eingeben.'); return; }
  if(!FLOW_URL){ showStatus('error', 'Tool ist technisch noch nicht fertig verbunden.'); return; }

  var btn = document.getElementById('btnSuchen');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Sucht…';
  showStatus('', '');
  document.getElementById('ergebnis').classList.remove('show');

  try{
    var resp = await fetch(FLOW_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ regnr: regnr, aktion: 'status' })
    });
    var d = await resp.json();
    if(d && d.success){
      aktuelleRegnr = regnr;
      document.getElementById('teilnehmerName').textContent = (d.vorname || '') + ' ' + (d.name || '') + ' (' + regnr + ')';
      setZugangUI(d.zugang === true || d.zugang === 'Ja');
      document.getElementById('ergebnis').classList.add('show');
    } else {
      showStatus('error', 'Keine Daten gefunden für: ' + regnr);
    }
  } catch(e){
    showStatus('error', 'Fehler beim Suchen.');
  }
  btn.disabled = false;
  btn.textContent = 'Suchen';
}

async function aktion(welche){
  if(!aktuelleRegnr) return;
  var btnFrei = document.getElementById('btnFreischalten');
  var btnEnt = document.getElementById('btnEntziehen');
  var btn = welche === 'freischalten' ? btnFrei : btnEnt;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Wird gespeichert…';
  showStatus('', '');

  try{
    var resp = await fetch(FLOW_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ regnr: aktuelleRegnr, aktion: welche })
    });
    var d = await resp.json();
    if(d && d.success){
      setZugangUI(welche === 'freischalten');
      showStatus('success', welche === 'freischalten' ? 'Zugang freigeschaltet.' : 'Zugang entzogen.');
    } else {
      showStatus('error', 'Fehler beim Speichern.');
    }
  } catch(e){
    showStatus('error', 'Fehler beim Speichern.');
  }
  btn.disabled = false;
  btn.innerHTML = welche === 'freischalten' ? 'Freischalten' : 'Entziehen';
}
</script>
</body>
</html>
